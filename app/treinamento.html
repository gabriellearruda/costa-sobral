<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D0D0D">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>C&S · Como usar o app</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#D4AF37;--gold-dark:#B8860B;--silver:#C0C0C0;--bg:#0D0D0D;--bg2:#1A1A1A;--bg3:#242424;--light:#F5F5F0;--green:#3fb950;--red:#f85149;
  --font:'Montserrat',sans-serif;--title:'Playfair Display',serif;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--light);font-family:var(--font);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;display:flex;flex-direction:column}
button{font-family:var(--font)}
.topo{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;padding-top:max(10px,var(--safe-t));border-bottom:1px solid var(--gold-dark);background:var(--bg2)}
.topo img{height:30px}
.topo .t{font-size:13px;font-weight:700;color:var(--gold);text-align:right}
.tela{display:none;flex:1;flex-direction:column;max-width:520px;width:100%;margin:0 auto;padding:16px;padding-bottom:calc(16px + var(--safe-b))}
.tela.on{display:flex}
/* INÍCIO */
h1{font-family:var(--title);color:var(--gold);font-size:28px;line-height:1.2;text-align:center;margin:10px 0 6px}
.lead{text-align:center;color:var(--silver);font-size:17px;line-height:1.5;margin-bottom:20px}
.funcoes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fun{background:var(--bg2);border:2px solid var(--bg3);border-radius:18px;padding:20px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--light);font-size:18px;font-weight:800;cursor:pointer}
.fun:active{transform:scale(.97)}
.fun .ic{font-size:44px;line-height:1}
.fun small{font-size:12px;font-weight:600;color:var(--silver)}
.fun.tudo{grid-column:1/-1;flex-direction:row;justify-content:center;padding:16px}
.fun.tudo .ic{font-size:30px}
.feito{display:inline-block;margin-top:2px;font-size:11px;color:var(--green)}
/* PASSO */
.barra{display:flex;gap:4px;margin-bottom:12px}
.barra i{flex:1;height:6px;border-radius:3px;background:var(--bg3)}
.barra i.on{background:var(--gold)}
.cont{font-size:13px;color:var(--silver);font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between}
.foto{position:relative;align-self:center;height:min(52vh,560px);aspect-ratio:390/844;border-radius:22px;overflow:hidden;border:3px solid #333;box-shadow:0 10px 40px rgba(0,0,0,.6);background:#000;flex-shrink:0}
.foto img{width:100%;height:100%;display:block}
.alvo{position:absolute;border:4px solid var(--gold);border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.35),0 0 18px var(--gold);animation:pisca 1.1s ease-in-out infinite;pointer-events:none}
.mao{position:absolute;font-size:40px;pointer-events:none;animation:toca 1.1s ease-in-out infinite;filter:drop-shadow(0 2px 4px #000)}
@keyframes pisca{50%{border-color:#fff;box-shadow:0 0 0 2000px rgba(0,0,0,.35),0 0 30px #fff}}
@keyframes toca{50%{transform:translate(4px,6px) scale(.92)}}
.sem-foto{height:min(36vh,320px);display:flex;align-items:center;justify-content:center;font-size:110px}
h2{font-size:24px;font-weight:800;line-height:1.25;margin:16px 0 8px;text-align:center}
h2 em{font-style:normal;color:var(--gold)}
.txt{font-size:19px;line-height:1.5;text-align:center;color:#e8e8e2}
.txt b{color:var(--gold)}
.botoes{margin-top:auto;padding-top:16px;display:grid;grid-template-columns:auto 1fr;gap:10px}
.b{border:none;border-radius:16px;padding:18px;font-size:18px;font-weight:800;cursor:pointer}
.b:active{transform:scale(.97)}
.b-ouro{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--bg)}
.b-cinza{background:var(--bg3);color:var(--light)}
.b-ouvir{grid-column:1/-1;background:transparent;border:2px solid var(--gold-dark);color:var(--gold);padding:12px;font-size:16px}
.b-ouvir.falando{background:rgba(212,175,55,.15)}
/* FIM */
.fim{text-align:center;margin:auto 0}
.fim .ic{font-size:90px}
.fim .b{width:100%;margin-top:12px}
</style>
</head>
<body>
<div class="topo"><img src="icons/logo.png" alt="C&S"><div class="t">Treinamento<br>do app do posto</div></div>

<!-- INÍCIO -->
<section class="tela on" id="inicio">
  <h1>Como usar o app</h1>
  <p class="lead">Escolha a sua função.<br>Vamos mostrar passo a passo, com foto da tela.<br>Toque em <b style="color:var(--gold)">🔊 Ouvir</b> para escutar.</p>
  <div class="funcoes">
    <button class="fun" onclick="comecar('portaria')"><span class="ic">🛡️</span>Portaria<small>Porteiro(a)</small><span class="feito" id="ok-portaria"></span></button>
    <button class="fun" onclick="comecar('limpeza')"><span class="ic">🧹</span>Limpeza<small>Auxiliar de limpeza</small><span class="feito" id="ok-limpeza"></span></button>
    <button class="fun" onclick="comecar('zeladoria')"><span class="ic">🔧</span>Zeladoria<small>Zelador(a)</small><span class="feito" id="ok-zeladoria"></span></button>
    <button class="fun" onclick="comecar('rapido')"><span class="ic">⚡</span>Só o básico<small>2 minutos</small><span class="feito" id="ok-rapido"></span></button>
    <button class="fun tudo" onclick="comecar('tudo')"><span class="ic">📖</span>Ver tudo<span class="feito" id="ok-tudo"></span></button>
  </div>
  <a href="./" style="display:block;text-align:center;color:var(--silver);margin-top:22px;font-size:14px">← Voltar para o app</a>
</section>

<!-- PASSO -->
<section class="tela" id="passo">
  <div class="barra" id="barra"></div>
  <div class="cont"><span id="contador"></span><a style="color:var(--silver)" onclick="sairTreino()">✕ Sair</a></div>
  <div id="midia"></div>
  <h2 id="titulo"></h2>
  <p class="txt" id="texto"></p>
  <div class="botoes">
    <button class="b b-ouvir" id="btnOuvir" onclick="ouvir()">🔊 Ouvir</button>
    <button class="b b-cinza" onclick="voltar()" aria-label="Voltar">◀</button>
    <button class="b b-ouro" id="btnProx" onclick="avancar()">PRÓXIMO ▶</button>
  </div>
</section>

<!-- FIM -->
<section class="tela" id="fim">
  <div class="fim">
    <div class="ic">🎉</div>
    <h1>Muito bem!</h1>
    <p class="lead">Você terminou o treinamento.<br>Qualquer dúvida, fale com a supervisão.</p>
    <button class="b b-ouro" onclick="location.href='./'">IR PARA O APP</button>
    <button class="b b-cinza" onclick="mostrar('inicio')">FAZER OUTRO TREINAMENTO</button>
  </div>
</section>

<script>
// ---------- PASSOS (imagem = tela real do app; alvo = onde tocar, em % da tela) ----------
const P = {
  intro:      { emoji: '📱', t: 'O <em>celular do posto</em>', x: 'Ele fica sempre na portaria, <b>carregando</b> e com o app <b>aberto</b>. Não feche o app e não use o celular para outras coisas.' },
  pres1:      { img: '01_presenca_nome', t: 'Chegou? <em>Confirme sua presença</em>', x: 'Na tela <b>Presença</b>, toque no <b>seu nome</b> na lista.' },
  pres2:      { img: '02_presenca_botao', t: 'Toque no <em>botão dourado</em>', x: 'Toque em <b>CONFIRMAR PRESENÇA</b>.' },
  pres3:      { img: '03_presenca_ok', t: '<em>Pronto!</em>', x: 'Apareceu o <b>sinal verde</b> ao lado do seu nome. Faça isso logo que chegar: até <b>15 minutos</b> depois do seu horário.' },
  cobertura:  { img: '04_cobertura', t: 'Veio <em>cobrir</em> alguém?', x: 'Toque em <b>Outros colaboradores / cobertura</b>, escolha <b>seu nome</b> e confirme do mesmo jeito.' },
  aviso:      { img: '05_aviso', t: 'Chegou um <em>aviso</em>', x: 'O celular <b>apita</b> e o aviso aparece na tela. <b>Leia</b>, escolha <b>seu nome</b> e toque em <b>CIENTE</b>.' },
  ocorrencia: { img: '06_ocorrencia', t: 'Algo deu <em>errado</em>?', x: 'Toque em <b>Ocorrência</b>. Escolha o tipo, escreva o que aconteceu, tire uma <b>foto</b> se puder e toque em <b>REGISTRAR</b>.' },
  panico:     { img: '20_panico', t: '<em>Emergência</em>', x: '<b>Segure</b> o botão <b>vermelho</b> por <b>2 segundos</b>. A supervisão é avisada na hora. Use <b>só em perigo de verdade</b>.' },
  mais:       { img: '21_menu_mais', t: 'Botão <em>Mais</em>', x: 'Em <b>Mais</b> ficam: Livro Ata, Materiais, Checklist, Cronograma, Denúncia e este treinamento (<b>Como usar</b>).' },
  internet:   { img: '23_sem_internet', t: 'Ficou <em>sem internet</em>?', x: 'Pode continuar usando <b>normal</b>. Aparece "SEM INTERNET" lá em cima. Tudo é <b>enviado sozinho</b> quando a internet voltar.' },
  denuncia:   { img: '22_denuncia', t: 'Canal de <em>Denúncia</em>', x: 'Para contar sobre <b>assédio</b> ou problemas no trabalho. É <b>sigiloso</b>: deixe marcado <b>Enviar anonimamente</b> e ninguém do posto fica sabendo.' },
  enc1:       { img: '07_encomenda_foto', t: 'Chegou <em>encomenda</em>', x: 'Abra <b>Encomendas</b>. Primeiro, toque aqui e <b>tire a foto da etiqueta</b>.' },
  enc2:       { img: '08_encomenda_registrar', t: 'Escreva a <em>unidade</em>', x: 'Escreva o <b>apartamento</b> (ex.: 45 ou 12B) e toque em <b>REGISTRAR CHEGADA</b>.' },
  enc3:       { img: '09_encomenda_entregar', t: 'O morador veio <em>buscar</em>', x: 'Ache a encomenda na lista e toque em <b>ENTREGAR</b>.' },
  enc4:       { img: '10_encomenda_retirada', t: 'Foto da <em>retirada</em>', x: 'Tire uma <b>foto do morador com a encomenda</b> na mão.' },
  enc5:       { img: '11_encomenda_entregue', t: 'Quem <em>retirou</em>?', x: 'Escreva o <b>nome</b> de quem retirou e toque em <b>ENTREGUE</b>. Data e hora ficam salvas sozinhas.' },
  plantao:    { img: '12_livro_plantao', t: 'Fim do turno: <em>passe o plantão</em>', x: 'Em <b>Mais → Livro Ata</b>, escreva o que o próximo precisa saber e toque em <b>PASSAR PLANTÃO</b>.' },
  check1:     { img: '13_checklist_ok', t: 'Começo do turno: <em>checklist</em>', x: 'Em <b>Mais → Checklist</b>, confira cada item. Está funcionando? Toque em <b>OK</b>.' },
  check2:     { img: '14_checklist_problema', t: 'Tem <em>problema</em>?', x: 'Toque no <b>X</b> e escreva o que está errado. No fim, toque em <b>ENVIAR CHECKLIST</b>. O problema vira ocorrência <b>sozinho</b>.' },
  crono1:     { img: '15_cronograma', t: 'O que fazer <em>hoje</em>', x: 'Em <b>Mais → Cronograma</b> aparecem as tarefas do dia. Terminou uma? Toque em <b>FEITO</b>.' },
  crono2:     { img: '16_cronograma_quem', t: 'Diga <em>quem fez</em>', x: 'Escolha <b>seu nome</b>, tire foto se quiser e toque em <b>CONFIRMAR</b>. Se a supervisão pedir para <b>refazer</b>, o celular avisa.' },
  mat1:       { img: '17_material_recebi', t: 'Chegou <em>material</em>?', x: 'Em <b>Mais → Materiais</b>, toque em <b>RECEBI</b>. O estoque é atualizado sozinho.' },
  mat2:       { img: '18_material_contar', t: '<em>Conte</em> o material', x: 'Use o <b>−</b> e o <b>+</b> para deixar a quantidade igual ao que tem no posto.' },
  mat3:       { img: '19_material_pedir', t: 'Está <em>faltando</em>?', x: 'Escolha o material, a quantidade e toque em <b>SOLICITAR REPOSIÇÃO</b>.' }
};
const BASE = ['intro', 'pres1', 'pres2', 'pres3', 'cobertura', 'aviso'];
const FINAL = ['ocorrencia', 'panico', 'mais', 'internet', 'denuncia'];
const TRILHAS = {
  rapido:    ['intro', 'pres1', 'pres2', 'pres3', 'aviso', 'ocorrencia', 'panico', 'internet'],
  portaria:  BASE.concat(['enc1', 'enc2', 'enc3', 'enc4', 'enc5', 'plantao', 'check1', 'check2'], FINAL),
  limpeza:   BASE.concat(['crono1', 'crono2', 'mat1', 'mat2', 'mat3', 'check1', 'check2'], FINAL),
  zeladoria: BASE.concat(['check1', 'check2', 'crono1', 'crono2', 'mat1', 'mat2', 'mat3', 'plantao'], FINAL),
  tudo:      BASE.concat(['enc1', 'enc2', 'enc3', 'enc4', 'enc5', 'plantao', 'check1', 'check2', 'crono1', 'crono2', 'mat1', 'mat2', 'mat3'], FINAL)
};
let ALVOS = {}, trilha = null, i = 0, vozAuto = false;
fetch('treino/alvos.json').then(r => r.json()).then(j => { ALVOS = j; if (trilha) desenhar(); }).catch(() => {});

function mostrar(id) { document.querySelectorAll('.tela').forEach(t => t.classList.toggle('on', t.id === id)); window.scrollTo(0, 0); if (id !== 'passo') parar(); marcarFeitos(); }
function comecar(t) { trilha = t; i = 0; vozAuto = true; mostrar('passo'); desenhar(); }
function sairTreino() { mostrar('inicio'); }
function desenhar() {
  const lista = TRILHAS[trilha], p = P[lista[i]];
  document.getElementById('barra').innerHTML = lista.map((_, k) => '<i class="' + (k <= i ? 'on' : '') + '"></i>').join('');
  document.getElementById('contador').textContent = 'Passo ' + (i + 1) + ' de ' + lista.length;
  let m;
  if (p.img) {
    const a = ALVOS[p.img];
    m = '<div class="foto"><img src="treino/' + p.img + '.jpg" alt="">' + (a ? '<div class="alvo" style="left:calc(' + a.x + '% - 6px);top:calc(' + a.y + '% - 6px);width:calc(' + a.w + '% + 12px);height:calc(' + a.h + '% + 12px)"></div><div class="mao" style="left:' + Math.min(a.x + a.w * .6, 82) + '%;top:' + Math.min(a.y + a.h * .55, 88) + '%">👆</div>' : '') + '</div>';
  } else m = '<div class="sem-foto">' + p.emoji + '</div>';
  document.getElementById('midia').innerHTML = m;
  document.getElementById('titulo').innerHTML = p.t;
  document.getElementById('texto').innerHTML = p.x;
  document.getElementById('btnProx').textContent = i === lista.length - 1 ? 'TERMINAR ✓' : 'PRÓXIMO ▶';
  const prox = lista[i + 1] && P[lista[i + 1]].img; if (prox) { const im = new Image(); im.src = 'treino/' + prox + '.jpg'; }
  if (vozAuto) ouvir(); else parar();
}
function avancar() {
  const lista = TRILHAS[trilha];
  if (i < lista.length - 1) { i++; desenhar(); }
  else { try { localStorage.setItem('cs_treino_' + trilha, new Date().toISOString()); } catch (e) {} mostrar('fim'); }
}
function voltar() { if (i > 0) { i--; desenhar(); } else mostrar('inicio'); }
function marcarFeitos() { Object.keys(TRILHAS).forEach(t => { let v = null; try { v = localStorage.getItem('cs_treino_' + t); } catch (e) {} const el = document.getElementById('ok-' + t); if (el) el.textContent = v ? '✓ já fez' : ''; }); }

// ---------- VOZ (lê o passo em voz alta) ----------
const temVoz = 'speechSynthesis' in window;
function textoFalado() {
  const d = document.createElement('div'); d.innerHTML = document.getElementById('titulo').innerHTML + '. ' + document.getElementById('texto').innerHTML;
  return d.textContent.replace(/−/g, 'menos').replace(/\+/g, 'mais').replace(/→/g, ', depois ').replace(/\bX\b/g, 'xis').replace(/12B/g, '12 bê');
}
function vozPt() { const vs = speechSynthesis.getVoices(); return vs.find(v => /pt[-_]BR/i.test(v.lang)) || vs.find(v => /^pt/i.test(v.lang)); }
function ouvir() {
  if (!temVoz) { document.getElementById('btnOuvir').style.display = 'none'; return; }
  parar();
  const u = new SpeechSynthesisUtterance(textoFalado()); u.lang = 'pt-BR'; u.rate = .95; const v = vozPt(); if (v) u.voice = v;
  const b = document.getElementById('btnOuvir'); b.classList.add('falando'); b.textContent = '🔊 Falando...';
  u.onend = u.onerror = () => { b.classList.remove('falando'); b.textContent = '🔊 Ouvir de novo'; };
  speechSynthesis.speak(u);
}
function parar() { if (temVoz) speechSynthesis.cancel(); const b = document.getElementById('btnOuvir'); if (b) { b.classList.remove('falando'); b.textContent = '🔊 Ouvir'; } }
if (temVoz) speechSynthesis.onvoiceschanged = () => {};

// arrastar para o lado também troca de passo
let x0 = null;
document.getElementById('passo').addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
document.getElementById('passo').addEventListener('touchend', e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 60) dx < 0 ? avancar() : voltar(); x0 = null; });
marcarFeitos();
</script>
</body>
</html>
