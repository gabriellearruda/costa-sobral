<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0D0D">
<title>Maquete 3D · C&amp;S</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Identidade C&S: preto, dourado, prata. Layout: topo com módulos | maquete 3D | painel do módulo */
  --ink:#0D0D0D;
  --panel:#151515;
  --panel-2:#1E1E1E;
  --line:rgba(212,175,55,.2);
  --line-2:rgba(255,255,255,.08);
  --gold:#D4AF37;
  --gold-2:#B8860B;
  --silver:#C0C0C0;
  --text:#F5F5F0;
  --muted:#9d9b93;
  --ok:#3fbf7f; --warn:#f0b43c; --bad:#e5484d; --idle:#7d828c; --info:#5b9cf0;
  --display:"Playfair Display", Georgia, serif;
  --body:"Montserrat", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--text);font:13.5px/1.45 var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- topo ---------- */
.top{height:64px;display:flex;align-items:center;gap:18px;padding:0 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#141414,#0D0D0D)}
.brand{display:flex;align-items:center;gap:10px}
.mono{width:40px;height:40px;border:1.5px solid var(--gold);transform:rotate(45deg);display:grid;place-items:center;border-radius:4px}
.mono b{transform:rotate(-45deg);font:700 14px var(--display);color:var(--gold)}
.brand .tx{display:flex;flex-direction:column;line-height:1.1}
.brand .tx b{font:600 17px var(--display);letter-spacing:.02em}
.brand .tx span{font:600 9px var(--body);letter-spacing:.28em;color:var(--silver);text-transform:uppercase}
.sep{width:1px;height:30px;background:var(--line)}
.cond{display:flex;flex-direction:column;line-height:1.15}
.cond b{font:600 16px var(--display)}
.cond span{font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:4px;margin-left:8px;flex:1;overflow-x:auto;scrollbar-width:none}
.tab{border:1px solid transparent;background:none;border-radius:9px;padding:8px 12px;font-weight:600;font-size:12.5px;color:var(--muted);white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:#111;background:linear-gradient(180deg,#e2c25b,#c9a032)}
.tab .bd{min-width:18px;height:18px;border-radius:99px;background:var(--bad);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 5px}
.tab[aria-selected="true"] .bd{background:#111;color:var(--gold)}
.clock{font-size:11.5px;color:var(--muted);text-align:right;white-space:nowrap;line-height:1.3}
.clock b{color:var(--text);font-size:13px}
.who{display:flex;align-items:center;gap:8px}
.who label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.who select{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-weight:600;font-size:12.5px}

/* ---------- grade ---------- */
.app{height:calc(100% - 64px);display:grid;grid-template-columns:minmax(0,1fr) 430px}
.stage{position:relative;overflow:hidden;background:#101418;isolation:isolate}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.side{background:var(--panel);overflow:auto;border-left:1px solid var(--line);scrollbar-width:thin;scrollbar-color:#333 transparent}
.blk{padding:16px 18px;border-bottom:1px solid var(--line-2);display:grid;gap:10px}
.eyebrow{font:700 10.5px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.ttl{font:600 22px/1.15 var(--display);margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:12px;margin:0}
.lbl{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lbl span{font-size:11.5px;color:var(--muted)}

/* ---------- sobreposições do palco ---------- */
.ov{position:absolute;inset:0;pointer-events:none;z-index:1}
.tl{position:absolute;left:0;top:0;pointer-events:auto;transform:translate(-50%,-100%);white-space:nowrap;background:none;border:0;padding:0;margin:0}
.pin{position:absolute;left:0;top:0;pointer-events:auto}
.tl.occ{opacity:.35}
.tlab{display:flex;align-items:center;gap:6px;padding:4px 9px 4px 5px;border-radius:99px;background:rgba(13,13,13,.86);border:1px solid rgba(212,175,55,.75);color:#f3ead1;font-size:11.5px;font-weight:700;border:none;box-shadow:0 0 0 1px rgba(212,175,55,.7),0 6px 16px rgba(0,0,0,.35)}
.tlab .lt{width:22px;height:22px;border-radius:50%;background:var(--gold);color:#111;display:grid;place-items:center;font:700 12px var(--display)}
.tlab .x{font-weight:600;color:var(--muted);font-size:10.5px}
.tlab .sd{width:8px;height:8px;border-radius:50%}
.chip{display:flex;align-items:center;gap:6px;padding:3px 9px 3px 7px;border-radius:99px;background:rgba(13,13,13,.82);border:1px solid var(--line-2);color:#e9e6dc;font-size:11px;font-weight:600}
.chip i{width:9px;height:9px;border-radius:50%;flex:none}
.chip:hover,.tlab:hover{background:#1c1606}
.pin{width:30px;height:30px;transform:translate(-50%,-100%);position:relative;border:0;background:none;padding:0}
.pin svg{width:30px;height:30px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
.pin.emg::before{content:"";position:absolute;left:50%;bottom:-6px;width:16px;height:16px;margin-left:-8px;border-radius:50%;border:2px solid var(--bad);animation:pulse 1.4s ease-out infinite}
@keyframes pulse{from{transform:scale(.6);opacity:1}to{transform:scale(2.6);opacity:0}}
.pin.sel svg{transform:scale(1.25);transform-origin:50% 100%}
.cp{width:24px;height:24px;border-radius:50%;border:2px solid #111;font:700 11px var(--body);display:grid;place-items:center;color:#111;transform:translate(-50%,-50%);box-shadow:0 0 0 2px rgba(255,255,255,.8)}
.banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;padding:9px 14px;border-radius:12px;font-size:12.5px;font-weight:600;z-index:4;max-width:calc(100% - 24px)}
.banner.emg{background:rgba(120,16,22,.92);border:1px solid #ff6b72;cursor:pointer}
.banner.pick{background:rgba(13,13,13,.92);border:1px solid var(--gold);color:#f6e7b6}
.banner button{border:1px solid rgba(255,255,255,.4);background:none;border-radius:8px;padding:4px 9px;font-size:11.5px}
.legend{position:absolute;z-index:3;left:12px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 230px)}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;background:rgba(13,13,13,.78);border:1px solid var(--line-2);padding:5px 10px;border-radius:99px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.ctrls{position:absolute;z-index:3;right:12px;bottom:12px;display:flex;gap:6px}
.ibtn{min-width:36px;height:36px;border-radius:10px;border:1px solid var(--line-2);background:rgba(13,13,13,.78);display:grid;place-items:center;padding:0 9px;font-size:12px;font-weight:600}
.ibtn:hover{border-color:var(--gold)}
.ibtn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.ibtn svg{width:17px;height:17px}
.layers{position:absolute;z-index:6;right:12px;bottom:58px;width:250px;background:rgba(15,15,15,.96);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:9px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.layers[hidden]{display:none}
.layers h3{margin:0;font:700 10.5px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.layers label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;cursor:pointer}
.layers input{accent-color:#D4AF37;width:16px;height:16px}
.layers .seg button{padding:5px 4px;font-size:11.5px}
.layers .pre{display:flex;gap:6px;flex-wrap:wrap}
.tlab.mini{padding:3px}
.nav{position:absolute;z-index:3;right:12px;bottom:58px;display:grid;grid-template-columns:repeat(3,34px);gap:4px}
.nav .ibtn{min-width:34px;height:34px;padding:0;font-size:12px;user-select:none;-webkit-user-select:none;touch-action:none}
.rail{position:absolute;z-index:3;left:12px;top:62px;bottom:58px;width:118px;pointer-events:none}
.rtrack{position:absolute;left:10px;top:8px;bottom:8px;width:4px;border-radius:4px;background:rgba(212,175,55,.35);pointer-events:auto;cursor:ns-resize;touch-action:none}
.rtrack::before{content:"";position:absolute;inset:0 -12px}
.rthumb{position:absolute;left:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--gold);border:3px solid #111;box-shadow:0 0 0 2px rgba(212,175,55,.5);pointer-events:none}
.rtick{position:absolute;left:0;transform:translateY(-50%);display:flex;align-items:center;gap:6px;pointer-events:auto;border:0;background:none;padding:2px 0;color:#e9e4d4;font:600 10.5px var(--body);white-space:nowrap}
.rtick i{width:24px;height:2px;background:rgba(212,175,55,.7);flex:none}
.rtick span{background:rgba(13,13,13,.78);border:1px solid var(--line-2);border-radius:99px;padding:2px 7px}
.rtick:hover span,.rtick.on span{border-color:var(--gold);color:var(--gold)}
.rtick.t span{padding:2px 6px;min-width:20px;text-align:center}
.tip{position:absolute;pointer-events:none;background:rgba(8,8,8,.94);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:12px;transform:translate(14px,14px);display:none;z-index:5;max-width:260px}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}

/* ---------- componentes do painel ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--panel-2);border:1px solid var(--line-2);border-radius:11px;padding:10px 12px;text-align:left;display:grid;gap:2px}
button.kpi:hover{border-color:var(--gold)}
.kpi small{color:var(--muted);font-size:11px}
.kpi b{font:600 22px/1.15 var(--display)}
.kpi em{font-style:normal;font-size:11px;color:var(--muted)}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:#2a2a2a}
.bar i{display:block;height:100%}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:99px;padding:3px 9px;white-space:nowrap}
.p-ok{background:rgba(63,191,127,.15);color:#7fe0ad}
.p-warn{background:rgba(240,180,60,.15);color:#f6cd77}
.p-bad{background:rgba(229,72,77,.17);color:#ff8f94}
.p-idle{background:rgba(125,130,140,.2);color:#c5c9d0}
.p-info{background:rgba(212,175,55,.16);color:#ecd384}
.list{display:grid;gap:6px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:9px 11px;text-align:left;width:100%}
button.row:hover{border-color:rgba(212,175,55,.55)}
.row .tm{font-weight:700;font-size:12px;color:var(--silver);min-width:44px}
.row b{font-weight:600;font-size:12.5px;display:block}
.row small{display:block;color:var(--muted);font-size:11.5px}
.row.stripe{border-left:3px solid var(--idle)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:7px;padding:7px 4px;font-size:12px;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:rgba(212,175,55,.18);color:#fff;box-shadow:inset 0 0 0 1px rgba(212,175,55,.6)}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:9px 13px;font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:linear-gradient(180deg,#e2c25b,#c49a2e);color:#141006;border-color:transparent}
.btn.red{background:#a92a31;border-color:transparent;color:#fff}
.btn.sm{padding:5px 9px;font-size:11.5px;border-radius:8px}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.back{border:0;background:none;color:var(--muted);font-size:12px;padding:0;justify-self:start}
.back:hover{color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:1px solid var(--line-2);background:var(--panel-2);border-radius:99px;padding:5px 10px;font-size:11.5px;font-weight:600;color:var(--muted)}
.fchip[aria-pressed="true"]{border-color:var(--gold);color:#fff;background:rgba(212,175,55,.14)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:0}
.facts div{border-bottom:1px solid var(--line-2);padding-bottom:6px}
.facts dt{font-size:11px;color:var(--muted)}
.facts dd{margin:0;font-weight:600;font-size:12.5px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line-2);border-radius:10px}
table.t{border-collapse:collapse;width:100%;font-size:11.5px;min-width:560px}
table.t th,table.t td{padding:7px 8px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:top}
table.t th{color:var(--gold);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;background:#191919;position:sticky;top:0}
table.t td.c{color:var(--muted)}
.post{background:var(--panel-2);border:1px solid var(--line-2);border-radius:11px;overflow:hidden}
.post h4{margin:0;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;border-bottom:1px solid var(--line-2)}
.post h4 span{font-weight:500;color:var(--muted);font-size:11.5px}
.blkrow{display:grid;grid-template-columns:84px 1fr auto;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line-2);font-size:12px}
.blkrow:last-child{border-bottom:0}
.blkrow .h{color:var(--silver);font-weight:700;font-variant-numeric:tabular-nums;font-size:11.5px}
.blkrow.lunch{color:var(--muted);font-style:italic}
.note{font-size:12px;border-radius:10px;padding:9px 11px;border:1px solid var(--line);background:rgba(212,175,55,.07);color:#e8dcb4}
.note.red{border-color:rgba(229,72,77,.45);background:rgba(229,72,77,.1);color:#ffc3c6}
.tline{display:grid;gap:0;border-left:2px solid var(--line);margin-left:6px}
.tline div{position:relative;padding:0 0 10px 14px;font-size:12px}
.tline div::before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--gold)}
.tline b{font-variant-numeric:tabular-nums;color:var(--silver);margin-right:6px}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.thumbs button{border:0;padding:0;border-radius:8px;overflow:hidden;aspect-ratio:4/3;background:#000}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.photo{width:100%;border-radius:10px;display:block}
.foot{padding:14px 18px;font-size:11px;color:var(--muted)}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.open{display:flex}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(620px,100%);max-height:calc(100% - 8px);overflow:auto}
.dlg.wide{width:min(980px,100%)}
.dlg-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-2);position:sticky;top:0;background:var(--panel);z-index:1}
.dlg-h h2{font:600 18px var(--display);margin:0;flex:1}
.xbtn{width:32px;height:32px;border-radius:9px;border:1px solid var(--line-2);background:none;font-size:18px}
.form{padding:16px 18px;display:grid;gap:12px}
.field{display:grid;gap:5px}
.field label{font-size:11.5px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{background:var(--panel-2);border:1px solid var(--line-2);border-radius:9px;padding:9px 10px;width:100%}
.field textarea{min-height:70px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.locbox{display:flex;gap:10px;align-items:center;background:rgba(212,175,55,.08);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px}
.gal img{width:100%;display:block;max-height:70vh;object-fit:contain;background:#000}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);opacity:0;background:#1b1b1b;border:1px solid var(--gold);color:#fff;padding:10px 16px;border-radius:12px;font-size:12.5px;transition:.25s;z-index:30;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1100px){
  .app{grid-template-columns:minmax(0,1fr) 380px}
  .cond span,.clock span{display:none}
}
@media (max-width:820px){
  body{overflow:auto} html,body{height:auto}
  .top{height:auto;flex-wrap:wrap;padding:10px 16px;gap:10px}
  .sep,.cond{display:none}
  .tabs{order:5;flex-basis:100%;margin:0}
  .app{display:block;height:auto}
  .stage{height:58vh;min-height:360px}
  .side{border-left:0;border-top:1px solid var(--line)}
  .legend{bottom:56px;max-width:calc(100% - 24px)}
  .layers{bottom:100px;right:8px;width:min(250px,calc(100% - 16px))}
  .nav{bottom:100px;grid-template-columns:repeat(3,30px)} .nav .ibtn{min-width:30px;height:30px}
  .rail{bottom:100px;top:70px;width:70px} .rtick.l span{display:none}
  .g2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- maquete no app C&S ---------- */
.brand img{height:34px;display:block}
.hbtn{border:1px solid var(--line-2);background:var(--panel-2);border-radius:9px;padding:7px 10px;font-weight:600;font-size:12px;white-space:nowrap}
.hbtn:hover{border-color:var(--gold)}
.hbtn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.hacts{display:flex;gap:6px;align-items:center}
#selPosto{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-weight:600;font-size:12.5px}
.caixa{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#1c1709,#0D0D0D 70%);padding:16px}
.caixa[hidden]{display:none}
.caixa .cx{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px 22px;display:grid;gap:12px;text-align:center}
.caixa img{height:56px;margin:0 auto}
.caixa h1{font:600 22px var(--display);margin:4px 0 0;color:var(--gold)}
.caixa p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.5}
.caixa input{background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:12px;width:100%;font-size:15px}
.caixa .btn{padding:12px;font-size:14px}
.caixa .err{color:#ff8f94;font-size:12.5px;min-height:16px}
@media (max-width:820px){ .hacts .hbtn.opc{display:none} .brand img{height:28px} }

</style>
</head>
<body>
<header class="top">
  <div class="brand" aria-label="C&amp;S Soluções em Serviços"><img src="icons/logo.png" alt="C&amp;S"></div>
  <div class="sep"></div>
  <div class="cond"><b id="condNome">Maquete 3D</b><span id="condSub">Consulta em tempo real</span></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Módulos"></nav>
  <div class="clock" id="clock"></div>
  <div class="hacts">
    <select id="selPosto" hidden aria-label="Condomínio"></select>
    <button class="hbtn" id="btnSom" aria-pressed="false" title="Aviso sonoro quando chega ocorrência nova">🔕 Som desligado</button>
    <button class="hbtn opc" id="btnLeve" title="Modo leve"></button>
    <button class="hbtn" id="btnSair">Sair</button>
  </div>
</header>

<main class="app">
  <section class="stage" id="stage" aria-label="Maquete 3D do condomínio">

{ const d=new THREE.Object3D(); d.rotation.x=-Math.PI/2; let i=0; for(let x=-700;x<700&&i<120;x+=12){d.position.set(x,.04,262);d.scale.set(5,.3,1);d.updateMatrix();dash.setMatrixAt(i++,d.matrix);} dash.count=i; scene.add(dash); }

{ const S = 4096, SR = LEVE ? 2048 : 4096, EXT = 2200, CX = 0, CZ = -20;

  const cv = (x,z) => [(x-CX+EXT/2)*S/EXT, (z-CZ+EXT/2)*S/EXT];
  const P = (mx,my) => cv(...mp(mx,my)), PX = S/EXT;
  const tex = canvasTex(SR, SR, (g) => { g.scale(SR / S, SR / S);

      const w=(8+RR()*18)*PX, h=(8+RR()*22)*PX; const [cx,cy]=cv(x,z); g.fillRect(cx,cy,w,h); }
    const poly = (pts, fill) => { g.beginPath(); pts.forEach((q,i)=>{ const [x,y]=P(...q); i?g.lineTo(x,y):g.moveTo(x,y); }); g.closePath(); g.fillStyle=fill; g.fill(); };
    const line = (pts, w, col, casing) => { g.lineJoin=g.lineCap='round';
      if (casing){ g.beginPath(); pts.forEach((q,i)=>{ const [x,y]=P(...q); i?g.lineTo(x,y):g.moveTo(x,y); }); g.strokeStyle=casing; g.lineWidth=(w+3)*PX; g.stroke(); }
      g.beginPath(); pts.forEach((q,i)=>{ const [x,y]=P(...q); i?g.lineTo(x,y):g.moveTo(x,y); }); g.strokeStyle=col; g.lineWidth=w*PX; g.stroke(); };
    // áreas
    poly([[900,295],[1000,290],[1035,330],[1005,445],[960,447],[885,350]], '#c6e4c2');     // Suzano Futebol Clube
    poly([[650,195],[835,250],[820,330],[640,290]], '#f2e9d2');                             // Supermercado Shibata
    g.fillStyle='#d4e8cf'; { const [x,y]=P(490,300); g.beginPath(); g.arc(x,y,80*PX,0,Math.PI*2); g.fill(); }   // Parque Florestinha
    // água

      [[420,420],[560,470],[700,540],[800,592],[1060,700],[1200,768],[1350,850]], // R. Konoi Endo

    <dl class="facts"><div><dt>Local</dt><dd>${esc(ocLocal(o) || 'Sem local marcado')}</dd></div><div><dt>Aberta</dt><dd>${quando(o.criadoEm)}</dd></div><div><dt>Registrada por</dt><dd>${esc(o.autor || '—')}</dd></div><div><dt>Responsável</dt><dd>${esc(o.responsavel || 'A definir')}</dd></div></dl>
    ${o.descricao && o.descricao !== o.titulo ? `<p style="margin:0;white-space:pre-wrap">${esc(o.descricao)}</p>` : ''}
    ${o.prioridade === 'emergencia' && o.status !== 'resolvida' ? `<div class="note red">Contatos de emergência: ${OC_TELEFONES.map(([n, t]) => n + ' ' + t).join(' · ')}</div>` : ''}
    ${o.fotoPath ? '<div id="ocFoto" class="sub">Carregando foto...</div>' : ''}
    ${posOc(o) ? '' : '<p class="sub">Esta ocorrência não tem local marcado, por isso não aparece na maquete.</p>'}
  </div>
  <div class="blk"><div class="eyebrow">Histórico</div><div class="tline">${DB.historico(id).map(h => `<div><b>${fmtHora(new Date(h.criadoEm))}</b>${esc(h.texto)}</div>`).join('') || '<div>Sem atualizações.</div>'}</div></div>${rodape()}`;
  if (o.fotoPath) Nuvem.urlFoto(o.fotoPath).then(u => { const el = $('#ocFoto'); if (el) el.innerHTML = u ? `<img class="photo" src="${u}" alt="Foto da ocorrência">` : 'A foto ainda não foi enviada pelo posto.'; });
}
/* ---------- TORRE e ÁREA ---------- */
function openTower(id) { state.view = { tower: id }; render(); buildOverlays(); const t = TW[id]; flyTo([t.x + 75, 60, t.z + 70], [t.x, 10, t.z]); }
function renderTower(id) {
  const e = equipeDaTorre(id), ts = e ? tarefasDaEquipe(e) : [], s = statusLista(ts);
  const ocs = OCS().filter(o => String(o.torre || '').toUpperCase() === id).sort(ordemOc);
  const ar = areaPorCodigo(id);
  panel.innerHTML = `
  <div class="blk">${back()}<div class="eyebrow">Torre ${id}${TW[id].pl ? ' · ' + TW[id].pl + ' na planta' : ''}</div><h2 class="ttl">Torre ${id} · térreo + ${ar && ar.andares != null ? ar.andares : FLOORS - 1} andares</h2>
    <dl class="facts"><div><dt>Limpeza hoje</dt><dd>${s ? `<span class="pill ${ST[s][1]}">${ST[s][0]}</span>` : '—'}</dd></div><div><dt>Equipe</dt><dd>${e ? esc(e.nome) + (e.operaria ? ' · ' + esc(e.operaria) : '') : '—'}</dd></div>
    <div><dt>Ocorrências em aberto</dt><dd>${ocs.filter(o => o.status !== 'resolvida').length}</dd></div><div><dt>Andares</dt><dd>Térreo ao ${FLOORS - 1}º</dd></div></dl></div>
  ${ts.length ? `<div class="blk"><div class="eyebrow">Limpeza de hoje · ${esc(e.nome)}</div><div class="post">${ts.map(tarRow).join('')}</div></div>` : ''}
  <div class="blk"><div class="eyebrow">Ocorrências</div><div class="list">${ocs.slice(0, 15).map(ocRow).join('') || '<p class="sub">Nenhuma ocorrência nesta torre.</p>'}</div></div>${rodape()}`;
}
function openArea(id) { state.view = { area: id }; render(); buildOverlays(); const a = AR[id]; if (a) flyTo([a.x + 45, 40, a.z + 55], [a.x, 0, a.z]); }
function renderArea(id) {
  const a = AR[id] || {}, db = areaPorCodigo(id), nome = nomeArea(id);
  const ocs = OCS().filter(o => { const ar = o.areaId && DB.area(o.areaId); return (ar && ar.codigo === id) || (o.localNome && o.localNome.indexOf(nome) === 0); }).sort(ordemOc);
  panel.innerHTML = `
  <div class="blk">${back()}<div class="eyebrow">${esc((db && db.grupo) || a.grupo || 'Área comum')}</div><h2 class="ttl">${esc(nome)}</h2>${a.sub ? `<p class="sub">${esc(a.sub)}</p>` : ''}</div>
  <div class="blk"><div class="eyebrow">Ocorrências</div><div class="list">${ocs.slice(0, 15).map(ocRow).join('') || '<p class="sub">Nenhuma ocorrência nesta área.</p>'}</div></div>${rodape()}`;
}

/* ---------- modal e toast ---------- */
let toastT; function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 4000); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.view) { state.view = null; render(); buildOverlays(); } });

/* ---------- controles ---------- */
const lyBox = $('#layers');
$('#btnLayers').onclick = e => { const open = lyBox.hidden; lyBox.hidden = !open; e.currentTarget.setAttribute('aria-expanded', open); e.currentTarget.setAttribute('aria-pressed', open); syncLayersUI(); };
document.addEventListener('pointerdown', e => { if (!lyBox.hidden && !e.target.closest('#layers,#btnLayers')) { lyBox.hidden = true; $('#btnLayers').setAttribute('aria-expanded', 'false'); $('#btnLayers').setAttribute('aria-pressed', 'false'); } });
function layersChanged() { syncLayersUI(); apply3DLayers(); buildOverlays(); }
$('#lyTorres').onclick = e => { const b = e.target.closest('button'); if (!b) return; LAYERS.torres = b.dataset.v; layersChanged(); };
lyBox.addEventListener('change', e => { const i = e.target.closest('[data-ly]'); if (i) { LAYERS[i.dataset.ly] = i.checked; layersChanged(); } });
lyBox.addEventListener('click', e => { const b = e.target.closest('[data-pre]'); if (!b) return; const v = b.dataset.pre;
  if (v === 'tudo') Object.assign(LAYERS, { torres: 'full', ocorr: true, areas: true, setores: true });
  if (v === 'ocorr') Object.assign(LAYERS, { torres: 'letra', ocorr: true, areas: false, setores: false });
  if (v === 'limpo') Object.assign(LAYERS, { torres: 'off', ocorr: false, areas: false, setores: false });
  layersChanged(); });
$('#btnLight').onclick = () => { state.light = state.light === 'day' ? 'night' : 'day'; state.luzManual = true; applyLight(); };
function pararGiro() { if (controls.autoRotate) { controls.autoRotate = false; $('#btnRotate').setAttribute('aria-pressed', 'false'); } }
$('#btnRotate').onclick = e => { controls.autoRotate = !controls.autoRotate; e.currentTarget.setAttribute('aria-pressed', controls.autoRotate); };
$('#btnHome').onclick = () => irInicio();
$('#btnTop').onclick = () => flyTo([TOP.pos.x, TOP.pos.y, TOP.pos.z], [TOP.tgt.x, TOP.tgt.y, TOP.tgt.z]);
$('#btnFull').onclick = async () => { try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); } catch (e) { toast('Tela cheia não é permitida neste navegador.'); } };
$('#btnLeve').textContent = LEVE ? 'Leve' : 'Completo';
$('#btnLeve').title = LEVE ? 'Modo leve (menos sombra e resolução). Toque para o modo completo.' : 'Modo completo. Toque para o modo leve (celular).';
$('#btnLeve').onclick = () => { Store.set('leve', !LEVE); location.reload(); };

// ---------- som de alerta (opcional) ----------
let somLigado = Store.get('som', false), audio = null;
function desenharSom() { const b = $('#btnSom'); b.textContent = somLigado ? '🔔 Som ligado' : '🔕 Som desligado'; b.setAttribute('aria-pressed', somLigado); }
function garantirAudio() { try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === 'suspended') audio.resume(); } catch (e) {} }
$('#btnSom').onclick = () => { somLigado = !somLigado; Store.set('som', somLigado); desenharSom(); if (somLigado) { garantirAudio(); bip(); } };
document.addEventListener('pointerdown', () => { if (somLigado) garantirAudio(); }, { once: true });
function bip(sirene) {
  if (!somLigado) return; garantirAudio(); if (!audio) return;
  const n = sirene ? 6 : 2;
  for (let i = 0; i < n; i++) { const o = audio.createOscillator(), g = audio.createGain(); o.type = 'square'; o.frequency.setValueAtTime(i % 2 ? 700 : 1000, audio.currentTime + i * .3); o.connect(g); g.connect(audio.destination); g.gain.value = .12; o.start(audio.currentTime + i * .3); o.stop(audio.currentTime + i * .3 + .26); }
}

// ---------- computador da portaria: volta sozinho para a visão geral ----------
let ultimoToque = Date.now();
['pointerdown', 'wheel', 'keydown'].forEach(ev => document.addEventListener(ev, () => { ultimoToque = Date.now(); }, { passive: true }));
setInterval(() => {
  const modoPortaria = A && A.papel === 'posto';
  if (!modoPortaria || Date.now() - ultimoToque < 3 * 60000) return;
  if (state.view || state.mod !== 'geral' || !controls.autoRotate) { state.view = null; setMod('geral'); controls.autoRotate = true; $('#btnRotate').setAttribute('aria-pressed', 'true'); }
}, 15000);
// dia e noite pela hora (até alguém trocar no botão)
setInterval(() => { renderClock(); if (!state.luzManual) { const h = new Date().getHours(), l = h >= 6 && h < 18 ? 'day' : 'night'; if (l !== state.light) { state.light = l; applyLight(); } } }, 30000);
// a cada minuto os horários da limpeza mudam de situação
setInterval(() => { if (PID) { refreshAll(); } }, 60000);
function renderClock() { const d = new Date(); $('#clock').innerHTML = `<span>${d.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'short' })}</span><br><b class="num">${agoraHm()}</b>`; }


/* =====================================================================
   ENTRADA, ESCOLHA DO CONDOMÍNIO E TEMPO REAL
   ===================================================================== */
const nomePosto = id => (DB.posto(id) || {}).nome || id || '—';
const quando = iso => { if (!iso) return ''; const d = new Date(iso); return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + ' ' + fmtHora(d); };
const temMaquete = pid => !!(DB.mapa(pid) || {}).tem_3d;
let carregado = false, pendRefresh = null;
function mostrarCaixa(id) { ['login', 'aviso'].forEach(x => $('#' + x).hidden = x !== id); }
function aviso(titulo, texto, comSair) { $('#avTit').textContent = titulo; $('#avTxt').innerHTML = texto; $('#avSair').hidden = !comSair; mostrarCaixa('aviso'); }
function escolherPosto() {
  const pedido = new URLSearchParams(location.search).get('posto');
  if (A.papel === 'posto' || A.papel === 'cond') return temMaquete(A.posto) ? A.posto : null;
  const com3d = DB.postos().filter(p => temMaquete(p.id));
  if (pedido && com3d.some(p => p.id === pedido)) return pedido;
  return com3d[0] ? com3d[0].id : null;
}
function abrir() {
  const pid = escolherPosto();
  if (!pid) {
    if (!carregado) { aviso('Carregando...', 'Buscando os dados do condomínio.', false); return; }
    aviso('Maquete não disponível', 'A maquete 3D existe só para condomínios que têm maquete cadastrada (Flex Suzano).<br>Este login não tem acesso a nenhum deles.', true); return;
  }
  const primeira = PID !== pid; PID = pid; MAPA = DB.mapa(pid);
  mostrarCaixa(null);
  $('#condNome').textContent = nomePosto(pid);
  $('#condSub').textContent = 'Maquete 3D · ' + (A.papel === 'posto' ? 'Portaria' : A.papel === 'cond' ? 'Síndico' : (A.nome || A.email));
  const com3d = DB.postos().filter(p => temMaquete(p.id));
  const sel = $('#selPosto'); sel.hidden = !(['adm', 'rh', 'sup'].includes(A.papel) && com3d.length > 1);
  sel.innerHTML = com3d.map(p => `<option value="${p.id}"${p.id === pid ? ' selected' : ''}>${esc(p.nome)}</option>`).join('');
  if (primeira) setMod('geral'); else refreshAll();
}
$('#selPosto').onchange = e => { const u = new URL(location.href); u.searchParams.set('posto', e.target.value); history.replaceState(null, '', u); PID = null; abrir(); };
async function entrar() {
  const msg = $('#lgMsg'), btn = $('#lgBtn'); msg.textContent = ''; btn.disabled = true; btn.textContent = 'ENTRANDO...';
  try { A = await Nuvem.entrar($('#lgEmail').value, $('#lgSenha').value); carregado = true; abrir(); }
  catch (e) { msg.textContent = e.message; }
  btn.disabled = false; btn.textContent = 'ENTRAR';
}
$('#lgBtn').onclick = entrar;
$('#lgSenha').addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });
async function sair() { await Nuvem.sair(); location.reload(); }
$('#btnSair').onclick = () => { if ($('#btnSair').dataset.conf) { sair(); return; } $('#btnSair').dataset.conf = '1'; $('#btnSair').textContent = 'Confirmar saída'; setTimeout(() => { delete $('#btnSair').dataset.conf; $('#btnSair').textContent = 'Sair'; }, 4000); };
$('#avSair').onclick = sair;
function aoMudarDados(tabela, p) {
  if (!A) return; // ainda entrando: abrir() roda quando o login termina
  if (tabela === '*') { carregado = true; if (!PID) { abrir(); return; } }
  if (!PID) return;
  if (tabela === 'ocorrencias' && p && p.eventType === 'INSERT' && p.new && p.new.posto_id === PID) {
    const o = paraTela(p.new);
    if (o.prioridade === 'emergencia') { bip(true); toast('🚨 Emergência: ' + ocTitulo(o) + (ocLocal(o) ? ' · ' + ocLocal(o) : '')); setTimeout(() => openOc(o.id), 300); }
    else { bip(false); toast('Nova ocorrência: ' + ocTitulo(o) + (ocLocal(o) ? ' · ' + ocLocal(o) : '')); }
  }
  if (tabela === 'condominio_mapa') MAPA = DB.mapa(PID);
  clearTimeout(pendRefresh); pendRefresh = setTimeout(refreshAll, 250);
}

/* =====================================================================
   LOOP
   ===================================================================== */
function resize() { const r = stage.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- navegação: setas, zoom e régua ---------- */
const RAIL = { zMin:-330, zMax:252, ticks:[
  ['Portaria',240,'l'], ...TOWERS.map(t => [t.id, t.z, 't']), ['Clube',-212,'l'], ['Esportes',-292,'l'] ] };
const rtrack = $('#rtrack'), rthumb = $('#rthumb'), rail = $('#rail');
for (const [lbl,z,k] of RAIL.ticks){ const b = document.createElement('button'); b.className = 'rtick '+k; b.type='button'; b.dataset.z = z; b.innerHTML = `<i></i><span>${lbl}</span>`; b.title = lbl==='Portaria'||lbl==='Clube'||lbl==='Esportes' ? lbl : 'Torre '+lbl;
  b.style.top = `calc(8px + (100% - 16px) * ${(z-RAIL.zMin)/(RAIL.zMax-RAIL.zMin)})`; b.onclick = () => goAlong(z, true); rail.appendChild(b); }
function railZFromY(clientY){ const r = rtrack.getBoundingClientRect(); const k = Math.min(1,Math.max(0,(clientY-r.top)/r.height)); return RAIL.zMin + k*(RAIL.zMax-RAIL.zMin); }
function goAlong(z, animate){
  const off = camera.position.clone().sub(controls.target); if (off.length() > 260) off.setLength(220);
  const tgt = new THREE.Vector3(controls.target.x*0.3, 0, z);
  if (animate){ const p = tgt.clone().add(off); flyTo([p.x,p.y,p.z],[tgt.x,tgt.y,tgt.z], 900); }
  else { fly = null; const d = tgt.clone().sub(controls.target); controls.target.add(d); camera.position.add(d); }
}
let railDrag = false;
rtrack.addEventListener('pointerdown', e => { railDrag = true; rtrack.setPointerCapture(e.pointerId); goAlong(railZFromY(e.clientY), false); });
rtrack.addEventListener('pointermove', e => { if (railDrag) goAlong(railZFromY(e.clientY), false); });
rtrack.addEventListener('pointerup', () => { railDrag = false; });
rtrack.addEventListener('pointercancel', () => { railDrag = false; });
function updateRail(){ const z = Math.min(RAIL.zMax, Math.max(RAIL.zMin, controls.target.z)); const k = (z-RAIL.zMin)/(RAIL.zMax-RAIL.zMin);
  rthumb.style.top = (k*100)+'%'; }

const pan = {up:0,down:0,left:0,right:0};
const nav = $('#nav');
nav.addEventListener('pointerdown', e => { const b = e.target.closest('button'); if (!b) return; e.preventDefault();
  if (b.dataset.zoom){ zoomBy(b.dataset.zoom==='in' ? .72 : 1.38); return; }
  if (b.dataset.pan==='center'){ flyTo([HOME.pos.x,HOME.pos.y,HOME.pos.z],[HOME.tgt.x,HOME.tgt.y,HOME.tgt.z]); return; }
  pan[b.dataset.pan] = 1; b.setPointerCapture(e.pointerId); if (controls.autoRotate){ controls.autoRotate=false; $('#btnRotate').setAttribute('aria-pressed','false'); } });
const stopPan = e => { const b = e.target.closest?.('button'); if (b?.dataset.pan) pan[b.dataset.pan] = 0; };
nav.addEventListener('pointerup', stopPan); nav.addEventListener('pointercancel', stopPan); nav.addEventListener('lostpointercapture', stopPan);
const KEYS = {ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
document.addEventListener('keydown', e => { if (e.target.closest('input,textarea,select') || !$('#login').hidden) return; const k = KEYS[e.key]; if (k){ pan[k]=1; e.preventDefault(); } });
document.addEventListener('keyup', e => { const k = KEYS[e.key]; if (k) pan[k]=0; });
window.addEventListener('blur', () => { for (const k in pan) pan[k]=0; });
function zoomBy(f){ fly = null; const off = camera.position.clone().sub(controls.target); const L = Math.min(controls.maxDistance, Math.max(controls.minDistance, off.length()*f)); off.setLength(L); flyTo([controls.target.x+off.x, controls.target.y+off.y, controls.target.z+off.z],[controls.target.x,controls.target.y,controls.target.z], 450); }
const fwd = new THREE.Vector3(), side = new THREE.Vector3(), mv = new THREE.Vector3(); let lastT = 0;
function applyPan(now){
  const dt = Math.min(.05, (now - lastT)/1000 || 0); lastT = now;
  const fx = pan.up - pan.down, sx = pan.right - pan.left; if (!fx && !sx) return;
  fly = null;
  fwd.copy(controls.target).sub(camera.position); fwd.y = 0; if (fwd.lengthSq() < 1e-4) fwd.set(0,0,-1); fwd.normalize();
  side.crossVectors(fwd, camera.up).normalize();
  const speed = Math.max(40, camera.position.distanceTo(controls.target) * .9);
  mv.copy(fwd).multiplyScalar(fx).addScaledVector(side, sx).normalize().multiplyScalar(speed*dt);
  controls.target.add(mv); camera.position.add(mv);
  controls.target.x = Math.max(-400, Math.min(400, controls.target.x)); controls.target.z = Math.max(-700, Math.min(600, controls.target.z));
}

function loop(now){
  applyPan(now); updateRail();
  if (fly){ let k = Math.min(1,(now-fly.s)/fly.dur); if (reduce) k=1; const e=ease(k); camera.position.lerpVectors(fly.p0,fly.p1,e); controls.target.lerpVectors(fly.t0,fly.t1,e); if (k>=1) fly=null; }
  controls.update(); processHover();
  renderer.render(scene, camera); updateOverlays(canvas.clientWidth, canvas.clientHeight);
  requestAnimationFrame(loop);
}
renderClock(); applyLight(); resize(); desenharSom();
requestAnimationFrame(loop);
(async () => {
  if (!Nuvem.configurado()) { aviso('Sistema não configurado', 'Preencha o arquivo config.js com a URL e a chave do Supabase.', false); return; }
  A = await Nuvem.iniciar({ aoMudar: aoMudarDados, aoStatus: () => {} });
  if (A) abrir(); else mostrarCaixa('login');
})();
</script>
