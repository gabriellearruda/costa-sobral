<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="C&S Painel">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0D0D0D">
<link rel="manifest" href="manifest-painel.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>C&S — Painel</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#D4AF37;--gold-dark:#B8860B;--gold-light:#F4DD9A;--silver:#C0C0C0;
  --bg:#0D0D0D;--bg2:#1A1A1A;--bg3:#242424;--bg4:#2E2E2E;--light:#F5F5F0;
  --green:#3fb950;--red:#f85149;--orange:#d29922;--blue:#58a6ff;
  --font:'Montserrat',sans-serif;--title:'Playfair Display',serif;--radius:12px;--sidebar-w:244px;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--light);min-height:100vh;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:var(--font)}
.pattern-bg{position:relative}
.pattern-bg::before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.02;background:repeating-linear-gradient(45deg,var(--gold) 0 1px,transparent 1px 22px),repeating-linear-gradient(-45deg,var(--gold) 0 1px,transparent 1px 22px)}
/* LOGIN */
.login{position:fixed;inset:0;z-index:600;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.login.hide{display:none}
.login .box{width:100%;max-width:420px}
.login img{height:64px;display:block;margin:0 auto 14px}
.login h1{font-family:var(--title);color:var(--gold);text-align:center;font-size:24px;margin-bottom:4px}
.login .sub{text-align:center;color:var(--silver);font-size:13px;margin-bottom:22px}
.perfil{background:var(--bg2);border:1px solid var(--bg3);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.perfil h3{font-size:15px;color:var(--gold);margin-bottom:4px}
.perfil p{font-size:12px;color:var(--silver);margin-bottom:12px}
/* SIDEBAR */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);background:var(--bg2);border-right:1px solid var(--bg3);display:flex;flex-direction:column;z-index:100;transition:transform .3s}
.sidebar .brand{padding:16px;border-bottom:1px solid var(--bg3);padding-top:max(16px,var(--safe-t))}
.sidebar .brand img{height:38px;display:block}
.sidebar .brand .who{margin-top:10px;font-size:12px;color:var(--gold);font-weight:600}
.sidebar .brand .who span{display:block;color:var(--silver);font-weight:400;font-size:11px;margin-top:2px}
.nav{flex:1;overflow:auto;padding:8px 0}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 18px;color:var(--silver);font-size:13.5px;cursor:pointer;border-left:3px solid transparent}
.nav-item:hover{background:rgba(212,175,55,.05)}
.nav-item.active{color:var(--gold);background:rgba(212,175,55,.08);border-left-color:var(--gold)}
.nav-item.disabled{opacity:.35;cursor:default}
.nav-item svg{width:19px;height:19px;fill:currentColor;flex-shrink:0}
.nav-item .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px}
.nav-sep{font-size:10px;color:#666;text-transform:uppercase;letter-spacing:1px;padding:14px 18px 6px}
.sidebar .foot{padding:12px 16px;border-top:1px solid var(--bg3);padding-bottom:calc(12px + var(--safe-b))}
.content{margin-left:var(--sidebar-w);min-height:100vh;min-width:0;overflow-x:hidden}
.topbar{background:var(--bg2);border-bottom:1px solid var(--bg3);padding:14px 24px;padding-top:max(14px,var(--safe-t));display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:50}
.topbar h1{font-family:var(--title);font-size:20px;color:var(--gold)}
.topbar .meta{font-size:12px;color:var(--silver);margin-top:2px}
.topbar .right{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--silver)}
.test-badge{background:var(--gold-dark);color:var(--bg);font-size:9px;font-weight:700;letter-spacing:1px;padding:3px 8px;border-radius:8px;white-space:nowrap}
.menu-btn{display:none;position:fixed;top:max(12px,var(--safe-t));left:12px;z-index:110;background:var(--bg3);border:1px solid var(--bg4);border-radius:8px;width:38px;height:38px;color:var(--gold);font-size:20px;cursor:pointer}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99}
.overlay.show{display:block}
.main{padding:22px 24px 60px}
.section{display:none}.section.active{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* COMPONENTES */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--bg2);border:1px solid var(--bg3);border-top:3px solid var(--gold);border-radius:var(--radius);padding:16px}
.stat .n{font-size:28px;font-weight:700}
.stat .l{font-size:12px;color:var(--silver);margin-top:4px}
.stat.green{border-top-color:var(--green)}.stat.orange{border-top-color:var(--orange)}.stat.red{border-top-color:var(--red)}.stat.blue{border-top-color:var(--blue)}
.h2{font-family:var(--title);color:var(--gold);font-size:17px;margin:6px 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card{background:var(--bg2);border:1px solid var(--bg3);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card h4{font-size:14px;color:var(--light);margin-bottom:4px}
.card p{font-size:13px;color:var(--silver);line-height:1.5}
.meta{font-size:11px;color:#777;margin-top:6px}
.empty{color:#666;font-size:13px;text-align:center;padding:18px}
.pill{display:inline-block;font-size:11px;padding:3px 9px;border-radius:10px;font-weight:700;white-space:nowrap}
.pill.green{background:rgba(63,185,80,.15);color:var(--green)}.pill.orange{background:rgba(210,153,34,.15);color:var(--orange)}
.pill.red{background:rgba(248,81,73,.15);color:var(--red)}.pill.silver{background:var(--bg3);color:var(--silver)}
.pill.gold{background:rgba(212,175,55,.15);color:var(--gold)}.pill.blue{background:rgba(88,166,255,.15);color:var(--blue)}
.tag{font-size:11px;padding:3px 8px;border-radius:8px;background:var(--bg3);color:var(--silver);white-space:nowrap}
.btn{padding:9px 14px;border:none;border-radius:9px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--bg)}
.btn-outline{background:transparent;border:1px solid var(--gold-dark);color:var(--gold)}
.btn-ghost{background:var(--bg3);color:var(--light)}
.btn-red{background:var(--red);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-full{width:100%;padding:13px;font-size:14px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filters select,.filters input,.form input,.form select,.form textarea{background:var(--bg3);color:var(--light);border:1px solid var(--bg4);padding:10px 12px;border-radius:9px;font-size:14px;outline:none}
.form label{display:block;font-size:12px;color:var(--silver);margin:10px 0 5px}
.form input,.form select,.form textarea{width:100%}
.form .row{display:flex;gap:10px}.form .row>*{flex:1;min-width:0}
.table-wrap{background:var(--bg2);border:1px solid var(--bg3);border-radius:var(--radius);overflow-x:auto;margin-bottom:18px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;color:var(--silver);text-transform:uppercase;letter-spacing:.5px;padding:11px 14px;background:var(--bg3);white-space:nowrap}
td{padding:11px 14px;font-size:13px;border-top:1px solid var(--bg3);vertical-align:middle}
td.small{font-size:12px;color:var(--silver)}
/* POSTO CARDS */
.postos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.pcard{background:var(--bg2);border:1px solid var(--bg3);border-radius:var(--radius);overflow:hidden}
.pcard.alert{border-color:rgba(248,81,73,.5)}
.pcard .ph{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--bg3)}
.pcard .ph b{font-family:var(--title);color:var(--gold);font-size:16px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--bg3);font-size:13px}
.prow:first-of-type{border-top:none}
.prow .nm{font-weight:600}
.prow .ds{font-size:11px;color:var(--silver);margin-top:2px}
.alert-card{background:rgba(248,81,73,.06);border:1px solid rgba(248,81,73,.3);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.alert-card.orange{background:rgba(210,153,34,.06);border-color:rgba(210,153,34,.3)}
.alert-card .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
/* KANBAN */
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kcol{background:var(--bg2);border:1px solid var(--bg3);border-radius:var(--radius);padding:12px;min-height:160px}
.kcol h4{font-size:12px;color:var(--silver);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--bg3)}
.kcard{background:var(--bg3);border-radius:9px;padding:10px;margin-bottom:8px;font-size:13px}
.kcard.urg{border-left:3px solid var(--red)}
.kcard .meta{margin-top:4px}
.kcard .btn{margin-top:8px;padding:6px 10px;font-size:11px}
/* TOGGLES */
.toggle{position:relative;width:44px;height:24px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle span{position:absolute;inset:0;background:var(--bg4);border-radius:24px;cursor:pointer;transition:.2s}
.toggle span::before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#888;border-radius:50%;transition:.2s}
.toggle input:checked+span{background:var(--gold-dark)}
.toggle input:checked+span::before{transform:translateX(20px);background:var(--light)}
.toggle input:disabled+span{opacity:.35;cursor:not-allowed}
.param-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--bg3);font-size:13.5px}
.param-row:first-child{border-top:none}
.param-row small{display:block;color:#777;font-size:11px;margin-top:2px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:9px 14px;border-radius:9px;border:1px solid var(--bg3);background:var(--bg2);color:var(--silver);font-size:13px;font-weight:600;cursor:pointer}
.tab.active{border-color:var(--gold);color:var(--gold)}
.disabled-module{text-align:center;padding:50px 20px;color:#666}
.disabled-module svg{width:48px;height:48px;fill:#444;margin-bottom:12px}
/* MODAL / TOAST */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:650;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.modal .sheet{background:var(--bg2);border:1px solid var(--gold-dark);border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:22px}
.modal h3{font-family:var(--title);color:var(--gold);font-size:20px;margin-bottom:6px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(24px + var(--safe-b));left:50%;transform:translateX(-50%) translateY(120px);background:var(--green);color:#fff;padding:12px 20px;border-radius:10px;font-weight:600;font-size:14px;z-index:700;transition:.3s;opacity:0;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%);opacity:1}
.toast.warn{background:var(--orange)}
.dias{display:flex;gap:6px;flex-wrap:wrap}
.dia{display:flex;flex-direction:column;gap:4px;background:var(--bg3);border-radius:8px;padding:8px;font-size:11px;color:var(--silver);width:calc(25% - 5px);min-width:110px}
.dia input[type=time]{padding:6px;font-size:13px}
.dia label{margin:0;display:flex;align-items:center;gap:6px;color:var(--light);font-weight:600}
.dia label input{width:auto}
/* RESPONSIVO */
@media(max-width:860px){
  .kanban{grid-template-columns:1fr 1fr}
}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none}
  .content{margin-left:0}
  .menu-btn{display:block}
  .topbar{padding:12px 14px;padding-left:60px;padding-top:max(12px,var(--safe-t))}
  .topbar h1{font-size:17px}
  .topbar .meta,.topbar .right .clock{display:none}
  .main{padding:16px 14px 60px}
  .stats{grid-template-columns:1fr 1fr}
  .stat .n{font-size:24px}
  .postos-grid{grid-template-columns:1fr}
  .alert-card{flex-direction:column;align-items:stretch}
  .alert-card .acts{justify-content:flex-start}
  .filters>*{flex:1;min-width:140px}
  .kanban{grid-template-columns:1fr}
  .kcol{min-height:0}
  .hide-m{display:none}
  .dia{width:calc(50% - 3px)}
  .filters .btn{white-space:normal}
  /* Tabelas viram cartões no celular */
  .table-wrap{overflow:visible;background:transparent;border:none}
  .table-wrap table,.table-wrap tbody,.table-wrap tr,.table-wrap td{display:block;width:100%}
  .table-wrap thead{display:none}
  .table-wrap tr{background:var(--bg2);border:1px solid var(--bg3);border-radius:var(--radius);padding:8px 0;margin-bottom:10px}
  .table-wrap td,.table-wrap td.hide-m{display:flex;justify-content:space-between;align-items:center;gap:12px;border:none;padding:6px 14px;text-align:right}
  .table-wrap td::before{content:attr(data-label);font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.4px;text-align:left;flex-shrink:0;margin-right:auto}
  .table-wrap td>.meta{margin:0}
  .table-wrap td:first-child{font-size:15px;border-bottom:1px solid var(--bg3);padding-bottom:10px;margin-bottom:4px;justify-content:flex-start;text-align:left}
  .table-wrap td:first-child::before{display:none}
  .table-wrap td:first-child>div{margin-left:auto}
  .table-wrap td[data-label=""]::before{display:none}
  .table-wrap td[data-label=""]{justify-content:flex-end}
}
</style>
<style>
/* ---- v3 ---- */
.net{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:9px;background:var(--bg3);color:var(--silver);white-space:nowrap}
.net::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--green)}
.net.off::before{background:var(--red)}.net.sync::before{background:var(--orange)}
.modo-card{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--bg3);border-radius:10px;margin-bottom:8px;cursor:pointer}
.modo-card.on{border-color:var(--gold);background:rgba(212,175,55,.06)}
.modo-card .l{width:30px;height:30px;border-radius:50%;background:var(--bg3);color:var(--gold);font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modo-card.on .l{background:var(--gold);color:var(--bg)}
.modo-card b{font-size:13.5px}.modo-card small{display:block;color:var(--silver);font-size:12px;margin-top:3px;line-height:1.4}
.foto-btn{background:var(--bg3);border:1px solid var(--bg4);color:var(--gold);border-radius:8px;padding:5px 9px;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.leitura{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.erro-cfg{max-width:460px;margin:80px auto;padding:20px;text-align:center}
.login .msg{color:var(--red);font-size:13px;text-align:center;margin-top:10px;min-height:18px}
.panico-ov{display:none;position:fixed;inset:0;z-index:800;background:rgba(160,20,20,.95);align-items:center;justify-content:center;text-align:center;padding:24px;flex-direction:column}
.panico-ov.show{display:flex}
.panico-ov h2{font-family:var(--title);font-size:30px;margin:10px 0}
</style>
<style>
.semana{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.sem-col{background:var(--bg2);border:1px solid var(--bg3);border-radius:12px;padding:8px;min-height:140px}
.sem-dia{font-size:12px;font-weight:700;color:var(--gold);letter-spacing:1px;text-align:center;padding:4px 0 8px;border-bottom:1px solid var(--bg3);margin-bottom:8px}
.tar-chip{background:var(--bg3);border-left:3px solid var(--gold-dark);border-radius:8px;padding:8px;margin-bottom:6px;font-size:12px;cursor:pointer;line-height:1.35}
.tar-chip b{display:block;font-size:12.5px;color:var(--light);margin-bottom:3px}
.tar-chip span{display:block;color:var(--silver);font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 12px;border-radius:16px;border:1px solid var(--bg4);background:var(--bg3);color:var(--silver);font-size:12.5px;font-weight:600;cursor:pointer}
.chip.on{background:var(--gold);color:var(--bg);border-color:var(--gold)}
@media(max-width:900px){.semana{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.semana{grid-template-columns:1fr}.sem-col{min-height:0}}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="login">
  <div class="box">
    <img src="icons/logo.png" alt="C&S">
    <h1>Sistema Operacional</h1>
    <div class="sub">Acesso da administração e dos condomínios</div>
    <div class="perfil form">
      <label>E-mail</label><input id="lgEmail" type="email" autocomplete="username">
      <label>Senha</label><input id="lgSenha" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')entrar()">
      <button class="btn btn-gold btn-full" style="margin-top:14px" id="lgBtn" onclick="entrar()">ENTRAR</button>
      <div class="msg" id="lgMsg"></div>
      <a href="#" onclick="event.preventDefault();esqueci()" style="display:block;text-align:center;color:var(--gold);font-size:13px;margin-top:6px">Esqueci minha senha</a>
    </div>
    <p class="meta" style="text-align:center">O acesso é liberado pela administração da C&S.</p>
  </div>
</div>

<!-- ALERTA DE PÂNICO (tela cheia) -->
<div class="panico-ov" id="panicoOv"><div style="font-size:60px">🚨</div><h2 id="panicoTit">PÂNICO</h2><p id="panicoTxt" style="font-size:17px;margin-bottom:22px"></p><button class="btn btn-ghost" style="font-size:15px;padding:14px 30px" onclick="cientePanico()">CIENTE</button></div>

<button class="menu-btn" onclick="toggleMenu()">☰</button>
<div class="overlay" id="overlay" onclick="toggleMenu(false)"></div>

<aside class="sidebar" id="sidebar">
  <div class="brand"><img src="icons/logo.png" alt="C&S"><div class="who" id="who"></div></div>
  <nav class="nav" id="nav"></nav>
  <div class="foot"><button class="btn btn-ghost" style="width:100%;margin-bottom:8px" onclick="modalSenha()">Alterar senha</button><button class="btn btn-ghost" style="width:100%" onclick="sair()">Sair</button></div>
</aside>

<div class="content">
  <div class="topbar">
    <div><h1 id="pgTitle">Visão Geral</h1><div class="meta" id="pgSub"></div></div>
    <div class="right"><span class="net" id="net">ONLINE</span><span class="clock" id="clock"></span></div>
  </div>
  <div class="main pattern-bg" id="main"></div>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)fecharModal()"><div class="sheet" id="modalBody"></div></div>
<div class="toast" id="toast"></div>

<script>window.CS_APP = 'painel';</script>
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="dados.js"></script>
<script>
let A = null; // acesso: {papel, posto, email, nome}
let secaoAtual = 'visao', filtroPosto = 'todos';

const IC = {
  visao: '<path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>',

// ===================== LOGIN =====================
async function entrar() {
  const msg = document.getElementById('lgMsg'), btn = document.getElementById('lgBtn');
  msg.textContent = ''; btn.disabled = true; btn.textContent = 'ENTRANDO...';
  try {
    const a = await Nuvem.entrar(document.getElementById('lgEmail').value, document.getElementById('lgSenha').value);
    if (a.papel === 'posto') { await Nuvem.sair(); throw new Error('Este é o login de um celular de posto. Use o app do posto.'); }
    A = a; abrirSistema();
  } catch (e) { msg.textContent = e.message; }
  btn.disabled = false; btn.textContent = 'ENTRAR';
}
async function sair() { await Nuvem.sair(); location.reload(); }

// ===================== SENHA =====================
function campoSenha(id, label) { return '<label>' + label + '</label><input id="' + id + '" type="password" autocomplete="' + (id === 'psAtual' ? 'current-password' : 'new-password') + '">'; }
function modalSenha(recuperacao) {
  toggleMenu(false);
  abrirModal('<h3>' + (recuperacao ? 'Criar nova senha' : 'Alterar senha') + '</h3><p class="meta">' + (recuperacao ? 'Escolha a nova senha da sua conta.' : 'Use pelo menos 8 caracteres, com letras e números.') + '</p><div class="form">' +
    (recuperacao ? '' : campoSenha('psAtual', 'Senha atual')) + campoSenha('psNova', 'Nova senha') + campoSenha('psConf', 'Repita a nova senha') +
    '<div class="msg" id="psMsg" style="color:var(--red);font-size:13px;margin-top:10px"></div></div><div class="acts">' + (recuperacao ? '' : '<button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button>') + '<button class="btn btn-gold" id="psBtn" onclick="salvarSenha(' + (recuperacao ? 'true' : 'false') + ')">Salvar senha</button></div>');
}
async function salvarSenha(recuperacao) {
  const msg = document.getElementById('psMsg'), btn = document.getElementById('psBtn');
  const atual = recuperacao ? null : document.getElementById('psAtual').value, nova = document.getElementById('psNova').value, conf = document.getElementById('psConf').value;
  msg.textContent = '';
  if (!recuperacao && !atual) return msg.textContent = 'Digite a senha atual';
  if (nova.length < 8 || !/[A-Za-z]/.test(nova) || !/\d/.test(nova)) return msg.textContent = 'A nova senha precisa ter pelo menos 8 caracteres, com letras e números';
  if (nova !== conf) return msg.textContent = 'As duas senhas novas não são iguais';
  btn.disabled = true; btn.textContent = 'Salvando...';
  try {
    await Nuvem.trocarSenha(atual, nova);
    fecharModal(); toast('✅ Senha alterada');
    if (recuperacao) { history.replaceState(null, '', location.pathname); if (!A) location.reload(); }
  } catch (e) { msg.textContent = e.message; btn.disabled = false; btn.textContent = 'Salvar senha'; }
}
function esqueci() {
  abrirModal('<h3>Esqueci minha senha</h3><p class="meta">Informe seu e-mail. Você vai receber um link para criar uma nova senha.</p><div class="form"><label>E-mail</label><input id="esEmail" type="email" value="' + esc(document.getElementById('lgEmail').value) + '"><div class="msg" id="esMsg" style="font-size:13px;margin-top:10px"></div></div><div class="acts"><button class="btn btn-ghost" onclick="fecharModal()">Fechar</button><button class="btn btn-gold" id="esBtn" onclick="enviarRecuperacao()">Enviar link</button></div>');
}
async function enviarRecuperacao() {
  const e = document.getElementById('esEmail').value.trim(), msg = document.getElementById('esMsg'), btn = document.getElementById('esBtn');
  if (!/\S+@\S+\.\S+/.test(e)) { msg.style.color = 'var(--red)'; msg.textContent = 'E-mail inválido'; return; }
  btn.disabled = true;
  try { await Nuvem.esqueciSenha(e, location.origin + location.pathname); msg.style.color = 'var(--green)'; msg.textContent = 'Se este e-mail tiver acesso, o link chega em alguns minutos. Confira também o spam.'; }
  catch (err) { msg.style.color = 'var(--red)'; msg.textContent = err.message; btn.disabled = false; }
}
let emRecuperacao = /type=recovery/.test(location.hash);
function aoAuth(ev) { if (ev === 'PASSWORD_RECOVERY') { emRecuperacao = true; setTimeout(() => modalSenha(true), 300); } }

function atualizarStatus() {
  const n = document.getElementById('net'); if (!n) return;
  const pend = Nuvem.pendentes();
  if (!navigator.onLine) { n.className = 'net off'; n.textContent = 'Sem internet'; }
  else if (pend) { n.className = 'net sync'; n.textContent = 'Enviando ' + pend; }
  else if (!Nuvem.conectado) { n.className = 'net sync'; n.textContent = 'Conectando'; }
  else { n.className = 'net'; n.textContent = 'Tempo real'; }
}

function setTitulo() { const s = SECOES.find(x => x.id === secaoAtual); document.getElementById('pgTitle').textContent = s.nome; document.getElementById('pgSub').textContent = s.sub || (isGestor() ? 'Todos os postos' : nomePosto(A.posto)); }

const M = () => document.getElementById('main');

function filtroPostoHtml() {

}

// ===================== VISÃO GERAL =====================
function alertasPresenca(ps) {
  const out = [], vistos = {};
  ps.forEach(p => situacoesPosto(p.id).forEach(x => {
    if (!x.sit.emTurno || (x.sit.status !== 'ausente' && x.sit.status !== 'verificar')) return;
    if (x.sit.grupoKey) { if (vistos[x.sit.grupoKey]) return; vistos[x.sit.grupoKey] = 1; }
    out.push({ p, x });
  }));
  return out;
}
function contarAlertas() { if (!A) return 0; const ps = postosVisiveis(); return alertasPresenca(ps).length + DB.list('alertas').filter(a => !a.visto && ps.some(p => p.id === a.posto)).length; }
function linhaPessoa(x) {
  const s = x.sit, info = STATUS_INFO[s.status], c = x.colab, h = s.turno && s.turno.ini ? s.turno.ini + '–' + s.turno.fim : '';
  return '<div class="prow"><div><div class="nm">' + esc(c.nome) + (s.cobertura ? ' <span class="pill blue">cobertura</span>' : '') + '</div><div class="ds">' + esc(c.funcao) + (h ? ' · ' + h : '') + (s.status === 'confirmado' ? ' · confirmou ' + s.horaConf : '') + '</div></div><span class="pill ' + info.cor + '">' + info.label + '</span></div>';
}
function rVisao() {
  const ps = postosVisiveis().filter(p => doFiltro(p.id));
  const tot = { esc: 0, conf: 0, pend: 0 };
  const dados = ps.map(p => { const l = situacoesPosto(p.id), turno = l.filter(x => x.sit.emTurno);
    turno.forEach(x => { tot.esc++; if (x.sit.status === 'confirmado') tot.conf++; else if (x.sit.status !== 'ausente' && x.sit.status !== 'verificar') tot.pend++; });
    return { p, turno }; });
  const alertas = alertasPresenca(ps);
  const ocAb = DB.list('ocorrencias').filter(o => o.status !== 'resolvida' && ps.some(p => p.id === o.posto)).length;
  const encAg = DB.list('encomendas').filter(e => e.status === 'aguardando' && ps.some(p => p.id === e.posto)).length;
  const panicos = DB.list('alertas').filter(a => !a.visto && ps.some(p => p.id === a.posto));
  let h = '<div class="filters">' + filtroPostoHtml() + '</div>';
  h += '<div class="stats"><div class="stat"><div class="n">' + tot.esc + '</div><div class="l">Escalados agora</div></div><div class="stat green"><div class="n">' + tot.conf + '</div><div class="l">Confirmados</div></div><div class="stat orange"><div class="n">' + tot.pend + '</div><div class="l">Pendentes / aguardando</div></div><div class="stat red"><div class="n">' + alertas.length + '</div><div class="l">Alertas de presença</div></div><div class="stat blue"><div class="n">' + ocAb + '</div><div class="l">Ocorrências abertas</div></div><div class="stat"><div class="n">' + encAg + '</div><div class="l">Encomendas aguardando</div></div></div>';
  if (panicos.length) h += '<div class="h2">🚨 Botão de pânico</div>' + panicos.map(a => '<div class="alert-card"><div><b>' + esc(nomePosto(a.posto)) + '</b> — alerta de pânico<div class="meta">' + quando(a.criadoEm) + '</div></div><div class="acts">' + (isGestor() ? '<button class="btn btn-red" onclick="DB.update(\'alertas\',\'' + a.id + '\',{visto:true});render();montarNav()">Ciente</button>' : '') + '</div></div>').join('');
  if (alertas.length) h += '<div class="h2">Alertas de presença</div>' + alertas.map(a => {
    const c = a.x.colab, s = a.x.sit;
    const quem = s.grupoNomes ? s.grupoNomes.map(esc).join(' ou ') : esc(c.nome);
    const det = s.grupoNomes ? 'Plantão 12x36 ' + (c.escala.periodo === 'noturno' ? 'noturno' : 'diurno') + ' sem confirmação — dia do plantão não cadastrado' : esc(s.texto || '');
    return '<div class="alert-card' + (s.status === 'verificar' ? ' orange' : '') + '"><div><b>' + quem + '</b> · ' + esc(c.funcao) + ' · ' + esc(a.p.nome) + '<div class="meta">' + (s.turno && s.turno.ini ? 'Entrada ' + s.turno.ini + ' · ' : '') + det + '</div></div><div class="acts">' +
      (isGestor() ? '<button class="btn btn-gold" onclick="acionarFreelance(\'' + c.id + '\')">Acionar freelance</button><button class="btn btn-outline" onclick="marcarCobertura(\'' + a.p.id + '\',\'' + c.id + '\')">Registrar cobertura</button>' : '<span class="pill ' + STATUS_INFO[s.status].cor + '">' + STATUS_INFO[s.status].label + '</span>') + '</div></div>';
  }).join('');
  h += '<div class="h2">Postos agora</div><div class="postos-grid">' + dados.map(d => {
    const conf = d.turno.filter(x => x.sit.status === 'confirmado').length, al = d.turno.some(x => x.sit.status === 'ausente' || x.sit.status === 'verificar');
    return '<div class="pcard' + (al ? ' alert' : '') + '"><div class="ph"><b>' + esc(d.p.nome) + '</b><span class="pill ' + (al ? 'red' : conf === d.turno.length && conf ? 'green' : 'orange') + '">' + conf + '/' + d.turno.length + ' confirmados</span></div>' + (d.turno.length ? d.turno.map(linhaPessoa).join('') : '<div class="empty">Ninguém escalado neste horário</div>') + '</div>';
  }).join('') + '</div>';
  M().innerHTML = h;
}
function marcarCobertura(pid, cid) {
  const c = DB.colaboradores().find(x => x.id === cid);
  abrirModal('<h3>Registrar cobertura</h3><p class="meta">' + esc(c.nome) + ' · ' + esc(nomePosto(pid)) + '</p><div class="form"><label>Quem está cobrindo</label><input id="cobNome" placeholder="Nome"><label>Observação</label><input id="cobObs" placeholder="Ex: freelance acionado às 07:20"></div><div class="acts"><button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button><button class="btn btn-gold" onclick="salvarCobertura(\'' + pid + '\',\'' + cid + '\')">Salvar</button></div>');
}
function salvarCobertura(pid, cid) {
  const n = document.getElementById('cobNome').value.trim(); if (!n) return toast('Informe quem cobre', true);
  const x = situacoesPosto(pid).find(y => y.colab.id === cid);

function htmlMoradores(comBase) {
  const ms = DB.list('moradores').filter(m => comBase.some(p => p.id === m.posto)).sort((a, b) => String(a.unidade).localeCompare(String(b.unidade), 'pt', { numeric: true }));

  let h = '<div class="card form"><h4>Cadastrar morador</h4><div class="row">' + sel + '<div><label>Unidade</label><input id="morUnid" placeholder="Ex: 12B"></div></div><div class="row"><div><label>Nome</label><input id="morNome"></div><div><label>WhatsApp</label><input id="morTel" inputmode="tel" placeholder="(11) 90000-0000"></div></div><button class="btn btn-gold" style="margin-top:12px" onclick="addMorador()">Adicionar</button></div>';
  h += '<div class="card form"><h4>Importar planilha da administradora (modo B)</h4><p>Salve a planilha como CSV com as colunas <b>unidade; nome; telefone</b> (uma linha por morador) e escolha o arquivo.</p><input type="file" accept=".csv,text/csv" style="margin-top:10px" onchange="importarCsv(this)"></div>';
  h += ms.length ? '<div class="table-wrap"><table><thead><tr><th>Unidade</th><th>Nome</th><th>Condomínio</th><th>WhatsApp</th><th>Origem</th><th></th></tr></thead><tbody>' + ms.map(m => '<tr><td><b>' + esc(m.unidade) + '</b></td><td>' + esc(m.nome) + '</td><td>' + esc(nomePosto(m.posto)) + '</td><td class="small">' + esc(m.telefone || '—') + '</td><td><span class="tag">' + esc(m.origem) + '</span></td><td><button class="btn btn-ghost" onclick="DB.remove(\'moradores\',\'' + m.id + '\');render()">Remover</button></td></tr>').join('') + '</tbody></table></div>' : '<div class="empty">Nenhum morador na base.</div>';
  return h;
}
function addMorador() {
  const u = document.getElementById('morUnid').value.trim().toUpperCase(), n = document.getElementById('morNome').value.trim(), t = document.getElementById('morTel').value.trim();
  if (!u || !n) return toast('Preencha unidade e nome', true);
  if (t && soDigitos(t).length < 10) return toast('WhatsApp com DDD', true);
  DB.push('moradores', { posto: document.getElementById('morPosto').value, unidade: u, nome: n, telefone: t, origem: 'manual' }); toast('Morador cadastrado'); render();
}
function importarCsv(inp) {
  const f = inp.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const pid = document.getElementById('morPosto').value;
    const linhasCsv = String(r.result).replace(/^﻿/, '').split(/\r?\n/).map(l => l.split(/[;,\t]/).map(x => x.trim().replace(/^"|"$/g, ''))).filter(c => c[0] && c[1]);
    if (linhasCsv.length && /unid/i.test(linhasCsv[0][0])) linhasCsv.shift();
    const existentes = new Set(DB.list('moradores').filter(m => m.posto === pid).map(m => (m.unidade + '|' + m.nome).toUpperCase()));
    let n = 0;
    linhasCsv.forEach(c => { const k = (c[0] + '|' + c[1]).toUpperCase(); if (existentes.has(k)) return; existentes.add(k); DB.push('moradores', { posto: pid, unidade: c[0].toUpperCase(), nome: c[1], telefone: c[2] || '', origem: 'importado' }); n++; });
    toast(n + ' moradores importados'); render();
  };
  r.readAsText(f, 'utf-8');
}

// ===================== CRONOGRAMA DE LIMPEZA =====================
let abaCron = 'execucao', semCron = null, cronEdit = null;
const semanaAtual = () => isoDia(inicioSemana(new Date()));
function statsSemana(pid, cron, segIso) {
  const hoje = isoDia(new Date()); let prev = 0, feitas = 0, valid = 0, atras = 0, refazer = 0;
  diasDaSemana(new Date(segIso + 'T12:00:00')).forEach(dia => {
    if (dia > hoje) return;
    DB.tarefasDoDia(cron.id, dia).forEach(t => {
      prev++; const e = DB.execucao(t.id, dia);
      if (e && e.validacao !== 'refazer') feitas++; if (e && e.validacao === 'ok') valid++; if (e && e.validacao === 'refazer') refazer++;
      if (!e && dia < hoje) atras++;
    });
  });
  return { prev, feitas, valid, atras, refazer };
}
function rCronograma() {
  const pid = isGestor() ? (filtroPosto === 'todos' ? null : filtroPosto) : A.posto;
  let h = '<div class="filters">' + filtroPostoHtml() + '</div>';
  if (!pid) { // visão geral de todos os condomínios
    h += '<p class="meta" style="margin:-4px 0 14px">Escolha um condomínio para montar o cronograma ou acompanhar a execução.</p><div class="postos-grid">' + postosVisiveis().filter(p => DB.params(p.id).cronograma).map(p => {
      const c = DB.cronograma(p.id);
      if (!c) return '<div class="pcard"><div class="ph"><b>' + esc(p.nome) + '</b><span class="pill silver">sem cronograma</span></div><div style="padding:12px 14px"><button class="btn btn-outline" onclick="filtroPosto=\'' + p.id + '\';abaCron=\'montar\';render()">' + (isAdmRh() ? 'Montar cronograma' : 'Ver') + '</button></div></div>';
      const s = statsSemana(p.id, c, semanaAtual()), pct = s.prev ? Math.round(s.feitas / s.prev * 100) : 0;
      return '<div class="pcard' + (s.atras || s.refazer ? ' alert' : '') + '"><div class="ph"><b>' + esc(p.nome) + '</b><span class="pill ' + (pct >= 90 ? 'green' : pct >= 60 ? 'orange' : 'red') + '">' + pct + '% feito na semana</span></div>' +
        '<div class="prow"><span>Feitas até hoje</span><b>' + s.feitas + '/' + s.prev + '</b></div><div class="prow"><span>Validadas pela supervisão</span><b>' + s.valid + '</b></div><div class="prow"><span>Atrasadas</span><b style="color:' + (s.atras ? 'var(--red)' : 'inherit') + '">' + s.atras + '</b></div>' + (s.refazer ? '<div class="prow"><span>Para refazer</span><b style="color:var(--orange)">' + s.refazer + '</b></div>' : '') +
        '<div style="padding:10px 14px"><button class="btn btn-gold" onclick="filtroPosto=\'' + p.id + '\';abaCron=\'execucao\';render()">Abrir</button></div></div>';
    }).join('') + '</div>';
    M().innerHTML = h; return;
  }
  const cron = DB.cronograma(pid), podeMontar = isAdmRh();
  h += '<div class="tabs"><button class="tab' + (abaCron === 'execucao' ? ' active' : '') + '" onclick="abaCron=\'execucao\';render()">Execução da semana</button><button class="tab' + (abaCron === 'montar' ? ' active' : '') + '" onclick="abaCron=\'montar\';render()">' + (podeMontar ? 'Montar cronograma' : 'Cronograma') + '</button></div>';
  if (!cron) {
    h += '<div class="card"><h4>' + esc(nomePosto(pid)) + ' ainda não tem cronograma</h4><p>' + (podeMontar ? 'Monte do zero ou copie o de outro condomínio e ajuste.' : 'A administração ainda não montou o cronograma deste condomínio.') + '</p>' +
      (podeMontar ? '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn btn-gold" onclick="criarCronograma(\'' + pid + '\')">Criar cronograma</button>' + (DB.postos().some(p => p.id !== pid && DB.cronograma(p.id)) ? '<button class="btn btn-outline" onclick="copiarCronograma(\'' + pid + '\')">Copiar de outro condomínio</button>' : '') + '</div>' : '') + '</div>';
    M().innerHTML = h; return;
  }
  h += abaCron === 'montar' ? htmlMontar(pid, cron, podeMontar) : htmlExecucaoCron(pid, cron);
  M().innerHTML = h;
}

// ---------- execução ----------
function htmlExecucaoCron(pid, cron) {
  const seg = semCron || semanaAtual(), dias = diasDaSemana(new Date(seg + 'T12:00:00')), hoje = isoDia(new Date());
  const s = statsSemana(pid, cron, seg);
  const mover = n => { const d = new Date(seg + 'T12:00:00'); d.setDate(d.getDate() + n * 7); return isoDia(d); };
  let h = '<div class="filters"><button class="btn btn-ghost" onclick="semCron=\'' + mover(-1) + '\';render()">◀</button><b style="font-size:14px">Semana de ' + fmtDiaMes(dias[0]) + ' a ' + fmtDiaMes(dias[6]) + '</b><button class="btn btn-ghost" onclick="semCron=\'' + mover(1) + '\';render()">▶</button>' + (seg !== semanaAtual() ? '<button class="btn btn-outline" onclick="semCron=null;render()">Esta semana</button>' : '') + '</div>';
  h += '<div class="stats"><div class="stat"><div class="n">' + s.prev + '</div><div class="l">Previstas até hoje</div></div><div class="stat green"><div class="n">' + s.feitas + '</div><div class="l">Feitas</div></div><div class="stat blue"><div class="n">' + s.valid + '</div><div class="l">Validadas</div></div><div class="stat red"><div class="n">' + s.atras + '</div><div class="l">Atrasadas</div></div>' + (s.refazer ? '<div class="stat orange"><div class="n">' + s.refazer + '</div><div class="l">Para refazer</div></div>' : '') + '</div>';
  dias.forEach(dia => {
    const wd = new Date(dia + 'T12:00:00').getDay(), ts = DB.tarefasDoDia(cron.id, dia);
    if (!ts.length) return;
    h += '<div class="h2" style="font-size:15px">' + DIAS_NOME[wd] + ' · ' + fmtDiaMes(dia) + (dia === hoje ? ' <span class="pill gold">hoje</span>' : '') + '</div><div class="table-wrap"><table><thead><tr><th>Tarefa</th><th>Feito (assinatura)</th><th>Supervisão</th></tr></thead><tbody>' + ts.map(t => {
      const e = DB.execucao(t.id, dia);
      let feito, sup = '';
      if (e) feito = '<span class="pill ' + (e.validacao === 'refazer' ? 'orange' : 'green') + '">' + (e.validacao === 'refazer' ? 'Devolvida' : 'Feito') + '</span><div class="meta">' + esc(e.feitoPor || '') + ' · ' + quando(e.feitoEm) + '</div>' + (e.obs ? '<div class="meta">“' + esc(e.obs) + '”</div>' : '') + (e.fotoPath ? '<div style="margin-top:4px">' + btnFoto(e.fotoPath, 'Foto ' + t.atividade) + '</div>' : '');
      else feito = dia > hoje ? '<span class="meta">—</span>' : dia < hoje ? '<span class="pill red">Não feito</span>' : '<span class="pill silver">Pendente</span>';
      if (e && e.validacao === 'ok') sup = '<span class="pill blue">✓ Validado</span><div class="meta">' + esc(e.validadoPor || '') + ' · ' + quando(e.validadoEm) + '</div>';
      else if (e && e.validacao === 'refazer') sup = '<span class="pill orange">↺ Refazer</span><div class="meta">' + esc(e.validacaoObs || '') + '</div>';
      if (isGestor()) {
        if (e && e.validacao !== 'ok' && e.validacao !== 'refazer') sup += '<button class="btn btn-gold" onclick="validarExec(\'' + e.id + '\')">Validar</button> <button class="btn btn-ghost" onclick="refazerExec(\'' + e.id + '\')">Refazer</button>';
        if (!e && dia <= hoje) sup += '<button class="btn btn-ghost" onclick="feitoPelaSupervisao(\'' + t.id + '\',\'' + dia + '\')">Conferido no local</button>';
      }
      return '<tr><td><b>' + esc(t.atividade) + '</b><div class="meta">' + descreverOnde(t) + ' · ' + esc(t.funcao) + '</div></td><td>' + feito + '</td><td>' + (sup || '<span class="meta">—</span>') + '</td></tr>';
    }).join('') + '</tbody></table></div>';
  });
  if (!DB.tarefas(cron.id).length) h += '<div class="empty">O cronograma ainda não tem atividades.</div>';
  return h;
}
const quemSou = () => A.nome || A.email;
function validarExec(id) { DB.update('cronograma_execucoes', id, { validacao: 'ok', validadoPor: quemSou(), validadoEm: new Date().toISOString(), validacaoObs: null }); toast('✓ Validado'); render(); }
function refazerExec(id) {
  abrirModal('<h3>Devolver para refazer</h3><p class="meta">O posto recebe o aviso no celular e marca de novo quando terminar.</p><div class="form"><label>O que precisa ser refeito?</label><input id="rfObs" placeholder="Ex: faltou a calçada do bloco 3"></div><div class="acts"><button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button><button class="btn btn-gold" onclick="confirmarRefazer(\'' + id + '\')">Devolver</button></div>');
}
function confirmarRefazer(id) {
  const o = document.getElementById('rfObs').value.trim(); if (!o) return toast('Escreva o que precisa ser refeito', true);
  DB.update('cronograma_execucoes', id, { validacao: 'refazer', validadoPor: quemSou(), validadoEm: new Date().toISOString(), validacaoObs: o }); fecharModal(); toast('Devolvido ao posto'); render();
}
function feitoPelaSupervisao(tid, dia) {
  const t = DB.list('cronograma_tarefas').find(x => x.id === tid);
  DB.push('cronograma_execucoes', { tarefaId: tid, posto: t.posto, data: dia, feitoPor: quemSou() + ' (supervisão)', feitoEm: new Date().toISOString(), validacao: 'ok', validadoPor: quemSou(), validadoEm: new Date().toISOString() });
  toast('Registrado e validado'); render();
}

// ---------- montar ----------
function htmlMontar(pid, cron, podeMontar) {
  const bl = cron.blocos || [], seq = bl.length && bl.every((b, i) => b === String(i + 1));
  let h = '';
  if (podeMontar) h += '<div class="card form"><h4>Dados do cronograma</h4><div class="row"><div><label>Nome</label><input id="crNome" value="' + esc(cron.nome) + '"></div><div><label>Quantidade de blocos / torres</label><input id="crQtd" type="number" min="0" max="200" value="' + (seq ? bl.length : '') + '" placeholder="Ex: 15"></div></div><label>Ou escreva os nomes (separados por vírgula)</label><input id="crNomes" value="' + (seq ? '' : esc(bl.join(', '))) + '" placeholder="Ex: Torre A, Torre B, Torre C"><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn btn-gold" onclick="salvarCronograma(\'' + cron.id + '\')">Salvar dados</button><button class="btn btn-outline" onclick="editarTarefa(\'' + cron.id + '\')">+ Adicionar atividade</button></div><p class="meta">Blocos atuais: ' + (bl.length ? esc(compactarBlocos(bl)) : 'nenhum (só área comum)') + '</p></div>';
  else h += '<p class="meta" style="margin-bottom:12px">' + esc(cron.nome) + ' · ' + (bl.length ? bl.length + ' blocos/torres' : 'sem blocos') + '. Alterações são feitas pela administração ou RH.</p>';
  h += '<div class="semana">' + DIAS_ORDEM.map(wd => {
    const ts = DB.tarefas(cron.id).filter(t => (t.dias || []).includes(wd));
    return '<div class="sem-col"><div class="sem-dia">' + DIAS_CURTO[wd] + '</div>' + (ts.map(t => '<div class="tar-chip"' + (podeMontar ? ' onclick="editarTarefa(\'' + cron.id + '\',\'' + t.id + '\')"' : '') + '><b>' + esc(t.atividade) + '</b><span>' + descreverOnde(t) + '</span><span>' + esc(t.funcao) + '</span></div>').join('') || '<div class="meta" style="text-align:center;padding:8px">—</div>') + '</div>';
  }).join('') + '</div>';
  return h;
}
function criarCronograma(pid) { DB.push('cronogramas', { posto: pid, nome: 'Cronograma de Limpeza e Conservação', blocos: [], ativo: true }); abaCron = 'montar'; toast('Cronograma criado. Agora informe os blocos e as atividades.'); render(); }
function copiarCronograma(pid) {
  const fontes = DB.postos().filter(p => p.id !== pid && DB.cronograma(p.id));
  abrirModal('<h3>Copiar cronograma</h3><p class="meta">Copia os blocos e todas as atividades. Depois é só ajustar.</p><div class="form"><label>Copiar de</label><select id="cpDe">' + fontes.map(p => '<option value="' + p.id + '">' + esc(p.nome) + ' (' + DB.tarefas(DB.cronograma(p.id).id).length + ' atividades)</option>').join('') + '</select></div><div class="acts"><button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button><button class="btn btn-gold" onclick="executarCopia(\'' + pid + '\')">Copiar</button></div>');
}
function executarCopia(pid) {
  const orig = DB.cronograma(document.getElementById('cpDe').value);
  const novo = DB.push('cronogramas', { posto: pid, nome: orig.nome, blocos: orig.blocos || [], ativo: true });
  DB.tarefas(orig.id).forEach(t => DB.push('cronograma_tarefas', { cronogramaId: novo.id, posto: pid, atividade: t.atividade, dias: t.dias, abrangencia: t.abrangencia, blocos: t.blocos || [], funcao: t.funcao, obs: t.obs, ordem: t.ordem, ativo: true }));
  fecharModal(); abaCron = 'montar'; toast('Cronograma copiado — revise os blocos e dias'); render();
}
function salvarCronograma(id) {
  const nomes = document.getElementById('crNomes').value.split(/[,;\n]/).map(x => x.trim()).filter(Boolean);
  const qtd = parseInt(document.getElementById('crQtd').value, 10);
  const blocos = nomes.length ? nomes : (qtd > 0 ? Array.from({ length: qtd }, (_, i) => String(i + 1)) : []);
  DB.update('cronogramas', id, { nome: document.getElementById('crNome').value.trim() || 'Cronograma', blocos, atualizadoEm: new Date().toISOString() });
  toast('Cronograma salvo'); render();
}
function editarTarefa(cronId, tid) {
  const cron = DB.list('cronogramas').find(c => c.id === cronId);
  const t = tid ? DB.list('cronograma_tarefas').find(x => x.id === tid) : { atividade: '', dias: [], abrangencia: 'comum', blocos: [], funcao: 'Aux. Limpeza', obs: '' };
  const usadas = [...new Set(DB.list('cronograma_tarefas').map(x => x.atividade))];
  const opcoes = [...new Set(ATIVIDADES_CATALOGO.concat(usadas))].sort((a, b) => a.localeCompare(b, 'pt'));
  const outra = t.atividade && !opcoes.includes(t.atividade);
  cronEdit = { cronId, tid, dias: new Set(t.dias || []), blocos: new Set(t.blocos || []), abr: t.abrangencia || 'comum' };
  abrirModal('<h3>' + (tid ? 'Editar atividade' : 'Nova atividade') + '</h3><div class="form">' +
    '<label>Atividade</label><select id="taSel" onchange="document.getElementById(\'taOutraBox\').style.display=this.value===\'__outra\'?\'\':\'none\'"><option value="">Escolha na lista...</option>' + opcoes.map(o => '<option' + (o === t.atividade ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '<option value="__outra"' + (outra ? ' selected' : '') + '>+ Outra atividade (escrever)</option></select>' +
    '<div id="taOutraBox" style="display:' + (outra ? '' : 'none') + '"><label>Qual atividade?</label><input id="taOutra" value="' + (outra ? esc(t.atividade) : '') + '" placeholder="Ex: Limpeza da casa de máquinas"></div>' +
    '<label>Dias da semana</label><div class="chips" id="taDias"></div><div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap"><button class="btn btn-ghost" onclick="diasRapido([1,2,3,4,5])">Seg a Sex</button><button class="btn btn-ghost" onclick="diasRapido([1,2,3,4,5,6])">Seg a Sáb</button><button class="btn btn-ghost" onclick="diasRapido([0,1,2,3,4,5,6])">Todos os dias</button><button class="btn btn-ghost" onclick="diasRapido([])">Limpar</button></div>' +
    '<label>Onde</label><div class="chips" id="taAbr"></div><div class="chips" id="taBlocos" style="margin-top:8px"></div>' +
    '<div class="row"><div><label>Quem faz</label><select id="taFun">' + FUNCOES.filter(f => f !== 'A definir').map(f => '<option' + (f === t.funcao ? ' selected' : '') + '>' + f + '</option>').join('') + '</select></div><div><label>Observação (opcional)</label><input id="taObs" value="' + esc(t.obs || '') + '"></div></div></div>' +
    '<div class="acts">' + (tid ? '<button class="btn btn-red" style="margin-right:auto" onclick="removerTarefa(\'' + tid + '\')">Excluir</button>' : '') + '<button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button><button class="btn btn-gold" onclick="salvarTarefa()">Salvar</button></div>');
  desenharChips(cron);
}
function desenharChips(cron) {
  cron = cron || DB.list('cronogramas').find(c => c.id === cronEdit.cronId);
  document.getElementById('taDias').innerHTML = DIAS_ORDEM.map(d => '<button class="chip' + (cronEdit.dias.has(d) ? ' on' : '') + '" onclick="cronEdit.dias.has(' + d + ')?cronEdit.dias.delete(' + d + '):cronEdit.dias.add(' + d + ');desenharChips()">' + DIAS_CURTO[d] + '</button>').join('');
  const temBlocos = (cron.blocos || []).length > 0;
  document.getElementById('taAbr').innerHTML = [['comum', 'Área comum'], ['todos', 'Todos os blocos'], ['alguns', 'Escolher blocos']].filter(o => temBlocos || o[0] === 'comum').map(o => '<button class="chip' + (cronEdit.abr === o[0] ? ' on' : '') + '" onclick="cronEdit.abr=\'' + o[0] + '\';desenharChips()">' + o[1] + '</button>').join('') + (temBlocos ? '' : '<span class="meta" style="align-self:center">Cadastre os blocos em "Dados do cronograma" para escolher blocos</span>');
  document.getElementById('taBlocos').innerHTML = cronEdit.abr === 'alguns' ? cron.blocos.map((b, i) => '<button class="chip' + (cronEdit.blocos.has(b) ? ' on' : '') + '" onclick="alternarBloco(' + i + ')">' + esc(b) + '</button>').join('') : '';
}
function alternarBloco(i) {
  const b = DB.list('cronogramas').find(c => c.id === cronEdit.cronId).blocos[i];
  cronEdit.blocos.has(b) ? cronEdit.blocos.delete(b) : cronEdit.blocos.add(b); desenharChips();
}
function diasRapido(l) { cronEdit.dias = new Set(l); desenharChips(); }
function salvarTarefa() {
  const sel = document.getElementById('taSel').value, atividade = sel === '__outra' ? document.getElementById('taOutra').value.trim() : sel;
  if (!atividade) return toast('Escolha ou escreva a atividade', true);
  if (!cronEdit.dias.size) return toast('Escolha ao menos um dia', true);
  if (cronEdit.abr === 'alguns' && !cronEdit.blocos.size) return toast('Escolha os blocos', true);
  const cron = DB.list('cronogramas').find(c => c.id === cronEdit.cronId);
  const dados = { atividade, dias: [...cronEdit.dias].sort(), abrangencia: cronEdit.abr, blocos: cronEdit.abr === 'alguns' ? [...cronEdit.blocos].sort((a, b) => String(a).localeCompare(String(b), 'pt', { numeric: true })) : [], funcao: document.getElementById('taFun').value, obs: document.getElementById('taObs').value.trim() };
  if (cronEdit.tid) DB.update('cronograma_tarefas', cronEdit.tid, dados);
  else DB.push('cronograma_tarefas', Object.assign({ cronogramaId: cron.id, posto: cron.posto, ordem: DB.tarefas(cron.id).length + 1, ativo: true }, dados));
  fecharModal(); toast('Atividade salva'); render();
}
function removerTarefa(tid) { DB.update('cronograma_tarefas', tid, { ativo: false }); fecharModal(); toast('Atividade removida do cronograma'); render(); }

const RENDER = { cronograma: rCronograma, visao: rVisao, postos: rPostos, ocorrencias: rOcorrencias, livro: rLivro, checklist: rChecklist, materiais: rMateriais, encomendas: rEncomendas, avisos: rAvisos, cobertura: rCobertura, colaboradores: rColaboradores, parametros: rParametros, acessos: rAcessos, denuncias: rDenuncias };

// ===================== PÂNICO EM TEMPO REAL =====================
function sirene() {
  try { const ctx = sirene.ctx || (sirene.ctx = new (window.AudioContext || window.webkitAudioContext)());
    for (let i = 0; i < 6; i++) { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'square'; o.frequency.setValueAtTime(i % 2 ? 700 : 1000, ctx.currentTime + i * .3); o.connect(g); g.connect(ctx.destination); g.gain.value = .15; o.start(ctx.currentTime + i * .3); o.stop(ctx.currentTime + i * .3 + .28); } } catch (e) {}
}
let panicoAtual = null;
function mostrarPanico(a) {
  panicoAtual = a.id;
  document.getElementById('panicoTit').textContent = 'PÂNICO — ' + nomePosto(a.posto);
  document.getElementById('panicoTxt').textContent = 'Botão de pânico acionado às ' + fmtHora(new Date(a.criadoEm)) + '. Ligue para o posto.';
  document.getElementById('panicoOv').classList.add('show'); sirene();
  try { if ('Notification' in window && Notification.permission === 'granted') new Notification('🚨 Pânico — ' + nomePosto(a.posto), { body: 'Botão de pânico acionado', requireInteraction: true }); } catch (e) {}
}
function cientePanico() { document.getElementById('panicoOv').classList.remove('show'); if (panicoAtual && isGestor()) DB.update('alertas', panicoAtual, { visto: true }); panicoAtual = null; render(); montarNav(); }

// ===================== INÍCIO =====================
function abrirSistema() {
  document.getElementById('login').classList.add('hide');
  document.getElementById('who').innerHTML = isGestor() ? esc(A.nome || NOME_PAPEL[A.papel]) + '<span>' + NOME_PAPEL[A.papel] + ' · ' + esc(A.email) + '</span>' : esc(nomePosto(A.posto)) + '<span>Perfil do condomínio</span>';
  Nuvem.sb.auth.getUser().then(r => { Nuvem._uid = r.data && r.data.user && r.data.user.id; });
  if (isGestor() && 'Notification' in window && Notification.permission === 'default') document.addEventListener('click', () => Notification.requestPermission().catch(() => {}), { once: true });
  if (!SECOES.find(s => s.id === secaoAtual && secaoVisivel(s))) secaoAtual = 'visao';
  ir(secaoAtual);
}
function aoMudar(tabela, p) {
  if (!A) return;
  if (tabela === 'alertas' && p && p.eventType === 'INSERT' && p.new.tipo === 'panico') mostrarPanico(paraTela(p.new));
  montarNav();
  const ativo = document.activeElement;
  if (modalAberto() || (ativo && /INPUT|TEXTAREA|SELECT/.test(ativo.tagName) && ativo.closest('#main'))) return; // não atrapalha quem está digitando
  if (secaoAtual === 'rondas' || secaoAtual === 'relatorios') return;
  setTitulo(); render();
}
function tick() { document.getElementById('clock').textContent = new Date().toLocaleString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); atualizarStatus(); }
setInterval(() => { tick(); if (A && ['visao', 'postos'].includes(secaoAtual)) aoMudar('relogio'); }, 30000);

(async function () {
  tick();
  if (!Nuvem.configurado()) { document.body.innerHTML = '<div class="erro-cfg"><img src="icons/logo.png" style="height:56px"><h2 style="font-family:var(--title);color:var(--gold);margin:16px 0">Sistema não configurado</h2><p style="color:var(--silver)">Preencha o arquivo config.js com a URL e a chave publicável do Supabase.</p></div>'; return; }
  A = await Nuvem.iniciar({ aoMudar, aoAuth, aoStatus: atualizarStatus, aoErro: (op, err) => toast('Não foi possível salvar (' + op.tabela + '): ' + (err.message || ''), true) });
  if (A && A.papel === 'posto') { await Nuvem.sair(); A = null; }
  if (A) abrirSistema();
  if (emRecuperacao && Nuvem.sb) { const { data } = await Nuvem.sb.auth.getSession(); if (data && data.session && !modalAberto()) modalSenha(true); }
})();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
</script>
