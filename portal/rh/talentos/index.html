*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tab-num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600}
.muted{color:var(--muted)}
.gold-text{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- Login ---------- */
#login{min-height:100%;display:grid;place-items:center;padding:32px 16px;background:radial-gradient(ellipse at 50% 30%,rgba(212,175,55,.10),transparent 60%),var(--tile),var(--ink);background-size:auto,120px 120px,auto}
.login-card{width:100%;max-width:420px;background:rgba(21,21,19,.92);border:1px solid var(--line-gold);border-radius:16px;padding:36px 32px 28px;box-shadow:0 30px 80px rgba(0,0,0,.6);display:grid;gap:22px}
.login-card .logo{width:100%;max-width:300px;justify-self:center}
.login-card h1{font-size:22px;text-align:center}
.login-card .sub{text-align:center;color:var(--muted);font-size:13px;margin-top:4px}
.gold-rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.7}
.demo-hint{font-size:12px;color:var(--muted);text-align:center;border:1px dashed var(--line-gold);border-radius:8px;padding:8px 10px}
.login-foot{font-size:11px;letter-spacing:.14em;text-transform:uppercase;text-align:center;color:var(--faint)}

/* ---------- Form controls ---------- */
.field{display:grid;gap:5px;min-width:0}
.field>label,.lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.input,select.input,textarea.input{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--fg);min-width:0}
textarea.input{resize:vertical;min-height:84px;line-height:1.45}
.input:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(212,175,55,.15)}
.input.auto{border-color:var(--gold-deep);border-style:dashed;background:rgba(212,175,55,.06)}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:8px;padding:9px 15px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;font-weight:600;font-size:13px;text-decoration:none;color:var(--fg);white-space:nowrap;transition:border-color .15s,background .15s,transform .05s}
.btn:hover{border-color:var(--gold)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--gold-grad);color:#1A1405;border-color:#B8860B;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:rgba(226,113,95,.4);background:transparent}
.btn.danger:hover{background:rgba(226,113,95,.08);border-color:var(--bad)}
.btn.wa{background:#1F7A45;border-color:#2A9B59;color:#fff}
.btn.sm{padding:6px 10px;font-size:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.check{display:inline-flex;gap:8px;align-items:center;cursor:pointer;font-size:13px}
.check input{accent-color:var(--gold);width:16px;height:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-opt{position:relative}
.chip-opt input{position:absolute;opacity:0;pointer-events:none}
.chip-opt span{display:inline-block;padding:5px 10px;border:1px solid var(--line);border-radius:999px;font-size:12px;cursor:pointer;color:var(--muted);user-select:none}
.chip-opt input:checked+span{border-color:var(--gold);color:var(--gold-hi);background:rgba(212,175,55,.10)}
.chip-opt input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;border:1px solid var(--line);color:var(--silver);background:var(--panel-3)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid currentColor;background:color-mix(in srgb,currentColor 12%,transparent)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

/* ---------- App shell ---------- */
#app{min-height:100%;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(180deg,rgba(12,12,11,.97),rgba(12,12,11,.93)),var(--tile);background-size:auto,120px 120px;border-bottom:1px solid var(--line-gold);backdrop-filter:blur(6px)}
.topbar-in{max-width:1280px;margin:0 auto;padding:10px 20px 0;display:grid;grid-template-columns:auto 1fr auto;gap:8px 18px;align-items:center}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--fg)}
.brand img{width:44px;height:auto}
.brand b{display:block;font-family:var(--display);font-size:19px;font-weight:600;line-height:1.1}
.brand small{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.userbox{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.mode-badge{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--warn);border:1px solid rgba(227,168,69,.45);padding:3px 8px;border-radius:999px}
.tabs{grid-column:1/-1;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px 11px;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;letter-spacing:.02em}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-current="page"]{color:var(--gold-hi);border-bottom-color:var(--gold)}
.tabs .count{font-size:11px;color:var(--faint);margin-left:5px}
main{flex:1;width:100%;max-width:1280px;margin:0 auto;padding:24px 20px 60px}
.page-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 20px;margin-bottom:20px}
.page-head h1{font-size:28px}
.page-head .actions{display:flex;flex-wrap:wrap;gap:8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel h2{font-size:17px;margin-bottom:12px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.panel-head h2{margin:0}
.demo-bar{background:rgba(227,168,69,.08);border:1px solid rgba(227,168,69,.3);color:#E9C98A;border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:18px}

/* ---------- Painel ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:4px}
.kpi .v{font-family:var(--display);font-size:34px;font-weight:600;line-height:1.05}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi.gold{border-color:var(--line-gold);background:linear-gradient(160deg,rgba(212,175,55,.10),transparent 60%),var(--panel)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:16px}
.stack{display:grid;gap:16px}
.bars{display:grid;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(0,150px) 1fr 34px;gap:10px;align-items:center;font-size:12.5px}
.bar-row .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--silver)}
.bar-track{height:8px;border-radius:99px;background:var(--panel-3);overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:var(--gold-grad)}
.pipeline{display:flex;flex-wrap:wrap;gap:8px}
.pipe{flex:1 1 110px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel-2);cursor:pointer;text-align:left}
.pipe:hover{border-color:var(--gold)}
.pipe b{display:block;font-size:22px;font-family:var(--display)}
.pipe span{font-size:11.5px}
.mini-list{display:grid}
.mini-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:center;cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.mini-row:first-child{border-top:0}
.mini-row:hover .nm{color:var(--gold-hi)}
.mini-row .nm{font-weight:600}
.mini-row small{color:var(--muted);display:block}
.alert{display:flex;gap:10px;align-items:flex-start;border:1px solid rgba(227,168,69,.35);background:rgba(227,168,69,.06);border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:16px}

/* ---------- Currículos ---------- */
.cv-layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px;align-items:start}
.filters{position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px);max-height:calc(100vh - 130px);overflow:auto;display:grid;gap:13px;padding:16px}
.filters .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters-toggle{display:none}
.search-wrap{position:relative}
.search-wrap .input{padding-left:36px;font-size:14.5px;padding-block:11px}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--gold)}
.results-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin:14px 0 10px}
.results{display:grid;gap:8px}
.cv-row{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(0,1.1fr) minmax(0,1.3fr) minmax(0,.8fr) auto auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;transition:border-color .15s}
.cv-row:hover{border-color:var(--line-gold)}
.cv-row .nm{font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cv-row .sub{font-size:12px;color:var(--muted)}
.cv-row .cell{min-width:0;font-size:12.5px}
.cv-row .cell small{display:block;color:var(--muted);font-size:11px}
.stars{display:inline-flex;gap:1px;color:var(--gold);font-size:12px;letter-spacing:1px}
.stars .off{color:var(--faint)}
.file-ic{color:var(--gold);display:inline-flex}
.empty{text-align:center;padding:40px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:12px;display:grid;gap:10px;justify-items:center}
.empty b{color:var(--fg);font-family:var(--display);font-size:18px;font-weight:600}

/* ---------- Vagas / ranking ---------- */
.vaga-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.vaga-card{display:grid;gap:10px;align-content:start}
.vaga-card h3{font-size:18px}
.vaga-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.vaga-meta b{color:var(--fg);font-weight:600}
.vaga-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.top3{display:grid;gap:4px;border-top:1px solid var(--line);padding-top:10px;font-size:12.5px}
.top3 div{display:flex;justify-content:space-between;gap:8px}
.rank-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}
.rank-row{display:grid;grid-template-columns:44px 64px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.rank-row.restricted{opacity:.6}
.rank-pos{font-family:var(--display);font-size:22px;color:var(--gold);text-align:center}
.score{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:17px;position:relative}
.score svg{position:absolute;inset:0;transform:rotate(-90deg)}
.score span{position:relative}
.breakdown{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.bd{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--panel-3);color:var(--silver);border:1px solid var(--line)}
.bd.full{border-color:rgba(118,194,122,.45);color:#A9DDAB}
.bd.zero{border-color:rgba(226,113,95,.4);color:#EBA597}
.flags{font-size:11.5px;color:var(--warn);margin-top:5px}
.rank-actions{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.legal{font-size:11.5px;color:var(--muted);border-left:2px solid var(--gold-deep);padding:4px 0 4px 10px}

/* ---------- Entrevistas ---------- */
.iv-row{display:grid;grid-template-columns:110px minmax(0,1.5fr) minmax(0,1.3fr) auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.iv-date{font-family:var(--display);font-size:20px;line-height:1.1}
.iv-date small{display:block;font-family:var(--body);font-size:11.5px;color:var(--gold)}
.iv-res{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:7px 13px;cursor:pointer;color:var(--muted);font-weight:600;font-size:12.5px}
.seg button[aria-pressed="true"]{background:rgba(212,175,55,.14);color:var(--gold-hi)}

/* ---------- Modal / drawer ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:4vh 16px;overflow:auto}
.modal{width:100%;max-width:860px;background:var(--panel);border:1px solid var(--line-gold);border-radius:14px;box-shadow:0 40px 90px rgba(0,0,0,.6)}
.modal.sm{max-width:480px}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-head h2{font-size:20px}
.modal-body{padding:20px 22px;display:grid;gap:16px}
.modal-foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;padding:14px 22px;border-top:1px solid var(--line)}
.x{background:none;border:0;color:var(--muted);font-size:24px;line-height:1;cursor:pointer;padding:4px 8px;border-radius:6px}
.x:hover{color:var(--fg)}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.fgrid .s2{grid-column:span 2}.fgrid .s3{grid-column:span 3}.fgrid .s4{grid-column:1/-1}
.section-t{font-family:var(--display);font-size:15px;color:var(--gold-hi);border-bottom:1px solid var(--line);padding-bottom:6px;margin-top:4px}
.drop{border:1.5px dashed var(--line-gold);border-radius:12px;padding:22px;text-align:center;display:grid;gap:8px;justify-items:center;background:linear-gradient(rgba(21,21,19,.86),rgba(21,21,19,.86)),var(--tile);background-size:auto,120px 120px;cursor:pointer}
.drop.over{border-color:var(--gold);background:rgba(212,175,55,.08)}
.drop b{font-family:var(--display);font-size:17px;font-weight:600}
.drop small{color:var(--muted)}
.file-strip{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px}
.notice{border-radius:10px;padding:10px 14px;font-size:12.5px;border:1px solid}
.notice.gold{border-color:var(--line-gold);background:rgba(212,175,55,.06);color:#E9D9A2}
.notice.warn{border-color:rgba(227,168,69,.45);background:rgba(227,168,69,.07);color:#EDC98A}
details.raw summary{cursor:pointer;color:var(--muted);font-size:12px}
details.raw pre{white-space:pre-wrap;font-size:11.5px;max-height:220px;overflow:auto;background:var(--panel-2);padding:10px;border-radius:8px;color:var(--silver)}
.drawer-wrap{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:flex;justify-content:flex-end}
.drawer{width:min(620px,100%);height:100%;background:var(--panel);border-left:1px solid var(--line-gold);overflow:auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer-head{padding:20px 22px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(21,21,19,.9),rgba(21,21,19,.97)),var(--tile);background-size:auto,120px 120px;display:grid;gap:10px}
.drawer-head .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.drawer-head h2{font-size:24px}
.drawer-body{padding:18px 22px 40px;display:grid;gap:18px}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px}
.dl div{min-width:0}
.dl dt{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0}
.dl dd{margin:2px 0 0;font-size:13.5px;overflow-wrap:anywhere}
.contact{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.contact code{font-family:var(--body);background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:13px;user-select:all}
.notes{display:grid;gap:8px}
.note{background:var(--panel-2);border:1px solid var(--line);border-left:2px solid var(--gold);border-radius:8px;padding:9px 12px;font-size:13px}
.note small{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}
.timeline{display:grid;gap:0;font-size:12.5px}
.timeline div{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.timeline div:first-child{border-top:0}
.timeline time{color:var(--muted);font-variant-numeric:tabular-nums}
.star-btns{display:inline-flex;gap:2px}
.star-btns button{background:none;border:0;cursor:pointer;font-size:20px;color:var(--faint);padding:0 2px;line-height:1}
.star-btns button.on{color:var(--gold)}
.confirm-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel-3);border:1px solid var(--line-gold);color:var(--fg);padding:10px 18px;border-radius:999px;z-index:80;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:calc(100% - 32px)}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.msg-box{min-height:220px;font-size:13px}
.radio-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.radio-cards label{border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;display:flex;gap:10px;align-items:center;font-weight:600}
.radio-cards input{accent-color:var(--gold)}
.radio-cards label:has(input:checked){border-color:var(--gold);background:rgba(212,175,55,.08)}
.cfg-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.ph-help{font-size:11.5px;color:var(--muted)}
.ph-help code{color:var(--gold-hi);font-size:11.5px}

@media (max-width:1060px){
  .cv-row{grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) minmax(0,1fr) auto}
  .cv-row .c-exp,.cv-row .c-date{display:none}
  .grid3{grid-template-columns:1fr 1fr}
  .grid3>:first-child{grid-column:1/-1}
}
@media (max-width:860px){
  .cv-layout{grid-template-columns:1fr}
  .filters{position:static;max-height:none}
  .filters[data-open="false"]>*:not(.filters-toggle){display:none}
  .filters-toggle{display:flex}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.grid3,.cfg-grid{grid-template-columns:1fr}
  .fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fgrid .s3{grid-column:1/-1}
  .iv-row{grid-template-columns:90px minmax(0,1fr)}
  .iv-row .iv-res,.iv-row .iv-vaga{grid-column:1/-1;justify-content:flex-start}
  .rank-row{grid-template-columns:64px minmax(0,1fr)}
  .rank-row .rank-pos{display:none}
  .rank-row .rank-actions{grid-column:1/-1;justify-content:flex-start}
  .rank-head{grid-template-columns:1fr}
}
@media (max-width:560px){
  .topbar-in{padding-inline:16px;grid-template-columns:auto 1fr}
  .userbox{grid-column:1/-1;grid-row:2;justify-content:space-between}
  .brand b{font-size:17px}
  main{padding-inline:16px}
  .cv-row{grid-template-columns:minmax(0,1fr) auto}
  .cv-row .c-loc,.cv-row .c-age{display:none}
  .page-head h1{font-size:24px}
  .fgrid{grid-template-columns:1fr}
  .fgrid .s2,.fgrid .s3{grid-column:1/-1}
  .dl{grid-template-columns:1fr}
  .radio-cards{grid-template-columns:1fr}
  .login-card{padding:28px 20px 22px}
  .timeline div{grid-template-columns:1fr;gap:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

async function extractText(file){
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  try{
    if(ext==='pdf'){
      await loadScript(LIBS.pdf);await loadScript(LIBS.pdfWorker);
      pdfjsLib.GlobalWorkerOptions.workerSrc=LIBS.pdfWorker;
      const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
      let t='';for(let i=1;i<=Math.min(pdf.numPages,8);i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();let lastY=null;for(const it of tc.items){const y=it.transform[5];if(lastY!==null)t+=Math.abs(y-lastY)>2?'\n':' ';t+=it.str;lastY=y}t+='\n'}
      return t.replace(/[ \t]+/g,' ').replace(/ ?\n ?/g,'\n');
    }
    if(ext==='docx'){await loadScript(LIBS.mammoth);const r=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});return r.value}
    if(ext==='txt')return await file.text();
  }catch(e){console.warn(e)}
  return '';
}
function parseCV(t){
  const out={};if(!t||!t.trim())return out;
  const n=norm(t);
  const lines=t.split(/\n+/).map(s=>s.trim()).filter(Boolean);
  const em=t.match(/[\w.+-]+@[\w-]+(\.[\w-]+)+/);if(em)out.email=em[0].toLowerCase();
  const ph=t.match(/(?:\+?55[\s-]?)?\(?\b\d{2}\)?[\s-]?9[\s.-]?\d{4}[\s.-]?\d{4}\b/)||t.match(/\(?\b\d{2}\)?[\s-]?\d{4}[\s.-]?\d{4}\b/);if(ph)out.telefone=fmtPhone(ph[0]);
  for(const l of lines.slice(0,10)){const ln=norm(l);if(/curriculo|vitae|dados pessoais|objetivo|resumo|perfil/.test(ln))continue;if(/^[A-Za-zÀ-ÿ' ]{5,60}$/.test(l)&&l.trim().split(/\s+/).length>=2){out.nome=titleCase(l.trim());break}}
  const dn=n.match(/nasc[a-z]*[^0-9\n]{0,25}(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);
  if(dn)out.data_nasc=`${dn[3]}-${dn[2].padStart(2,'0')}-${dn[1].padStart(2,'0')}`;
  else{const id=n.match(/(?:idade[^0-9\n]{0,5})?\b(\d{2})\s*anos\b(?!\s*de\s*experiencia)/);if(id&&+id[1]>=16&&+id[1]<=75)out.idade_informada=+id[1]}
  if(/sexo\W{0,4}feminino|\bfeminino\b|\b(casada|solteira|divorciada|viuva|brasileira)\b/.test(n))out.sexo='Feminino';
  else if(/sexo\W{0,4}masculino|\bmasculino\b|\b(casado|solteiro|divorciado|viuvo|brasileiro)\b/.test(n))out.sexo='Masculino';
  let best=null;for(const c of CIDADES){const i=n.indexOf(norm(c));if(i>=0&&(best===null||i<best.i))best={c,i}}if(best)out.cidade=best.c;
  const bm=t.match(/bairro\s*[:\-]\s*([^\n,;\/]{3,40}?)(?=\s+-\s+|\s*[\n,;\/]|\s*$)/i);if(bm)out.bairro=titleCase(bm[1].trim());
  const sc={};for(const[f,res]of Object.entries(KW_FUNCAO)){let k=0;res.forEach(r=>{const m=n.match(new RegExp(r.source,'g'));if(m)k+=m.length});if(k)sc[f]=k}
  const ranked=Object.entries(sc).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  const obj=n.match(/objetivo[^\n]*\n?([^\n]{0,80})/);let objF=null;if(obj){for(const[f,res]of Object.entries(KW_FUNCAO)){if(res.some(r=>r.test(obj[0]))){objF=f;break}}}
  if(objF||ranked[0]){out.funcao=objF||ranked[0];out.outras_funcoes=ranked.filter(f=>f!==out.funcao).slice(0,3)}
  const ex=n.match(/(\d{1,2})\s*anos de experiencia/);
  if(ex)out.experiencia_anos=+ex[1];
  else{let tot=0;const yNow=new Date().getFullYear();const re=/\b(19[89]\d|20[0-3]\d)\s*(?:-|–|a|ate|\/)\s*(19[89]\d|20[0-3]\d|atual|o momento|presente|hoje|atualmente)/g;let m;while((m=re.exec(n))){const a=+m[1];const b=/\d/.test(m[2])?+m[2]:yNow;if(b>=a&&b-a<40)tot+=Math.max(b-a,0.5)}if(tot)out.experiencia_anos=Math.min(Math.round(tot),40)}
  if(/superior completo|graduad[oa] em|bacharel/.test(n))out.escolaridade='Superior completo';
  else if(/superior incompleto|cursando|graduacao em andamento/.test(n))out.escolaridade='Superior incompleto';
  else if(/\btecnic[oa] em\b|curso tecnico/.test(n))out.escolaridade='Técnico';
  else if(/(ensino )?medio completo|2[oº°]? grau completo/.test(n))out.escolaridade='Médio completo';
  else if(/medio incompleto|2[oº°]? grau incompleto/.test(n))out.escolaridade='Médio incompleto';
  else if(/fundamental completo|1[oº°]? grau completo/.test(n))out.escolaridade='Fundamental completo';
  else if(/fundamental incompleto/.test(n))out.escolaridade='Fundamental incompleto';
  else if(/ensino medio/.test(n))out.escolaridade='Médio completo';
  const cnh=n.match(/(?:cnh|habilitacao)[^a-z0-9\n]{0,12}(?:categoria\s*|cat\.?\s*)?\b(ab|a|b|c|d|e)\b/);if(cnh)out.cnh=cnh[1].toUpperCase();else if(/nao possu[oi] (cnh|habilitacao)/.test(n))out.cnh='Não possui';
  const cur=[];for(const[c,re]of Object.entries(KW_CURSO)){if(re.test(n))cur.push(c)}if(cur.length)out.cursos=cur;
  const esc=[];if(/12\s*x\s*36/.test(n)){if(/noturn/.test(n))esc.push('12x36 noturno');if(/diurn/.test(n)||!esc.length)esc.push('12x36 diurno')}if(/6\s*x\s*1/.test(n))esc.push('6x1');if(/5\s*x\s*2/.test(n))esc.push('5x2');if(/folguista/.test(n))esc.push('Folguista');if(esc.length)out.escalas=esc;
  const pr=t.match(/pretens[aã]o[^0-9\n]{0,20}R?\$?\s*([\d.]{3,7}(?:,\d{2})?)/i);if(pr)out.pretensao=Number(pr[1].replace(/\./g,'').replace(',','.'));
  return out;
}

   RANKING

const ESC_IDX = s=>ESCOLARIDADE.indexOf(s);
function near(a,b){a=norm(a);b=norm(b);if(!a||!b)return false;const at=ALTO_TIETE.map(norm),sp=GRANDE_SP.map(norm),zl=DIVISA_ZL.map(norm);return(at.includes(a)&&at.includes(b))||(sp.includes(a)&&sp.includes(b))||(zl.includes(a)&&zl.includes(b))}
function hasSkill(c,r){const k=norm(r).replace(/\(.*?\)/g,'').split('/')[0].trim();if((c.cursos||[]).some(x=>norm(x).includes(k)))return true;const txt=norm((c.experiencias||'')+' '+(c.texto_cv||''));return k.length>3&&txt.includes(k)}
function cnhOk(has,need){if(!need||need==='Não exige')return true;if(!has||has==='Não possui')return false;return need.split('').every(ch=>has.includes(ch))||(need==='B'&&/[CDE]/.test(has))}
function scoreCand(c,v){
  const parts=[],flags=[];let restricted=false;
  const fv=v.titulo,outs=c.outras_funcoes||[];let pf=0;
  if(norm(c.funcao)===norm(fv))pf=35;else if(outs.some(f=>norm(f)===norm(fv)))pf=26;
  else if(FAMILIA[fv]&&(FAMILIA[c.funcao]===FAMILIA[fv]||outs.some(f=>FAMILIA[f]===FAMILIA[fv])))pf=15;
  else if(norm(c.texto_cv+' '+c.experiencias).includes(norm(fv)))pf=10;
  parts.push(['Função',pf,35]);
  let pl;if(!v.cidade)pl=14;else if(c.cidade&&norm(c.cidade)===norm(v.cidade)){pl=(v.bairro&&c.bairro&&norm(c.bairro)===norm(v.bairro))?20:16}else if(c.cidade&&near(c.cidade,v.cidade))pl=10;else if(!c.cidade)pl=5;else pl=2;
  parts.push(['Local',pl,20]);
  const e=+c.experiencia_anos||0,m=+v.exp_min||0;let pe=m>0?(e>=m?14+Math.min(6,(e-m)*1.5):14*e/m):Math.min(20,10+e*2);
  if(m>0&&e<m)flags.push(`experiência abaixo do mínimo (${e} de ${m} anos)`);
  parts.push(['Experiência',pe,20]);
  const req=v.requisitos||[];let pr=12;if(req.length){const miss=req.filter(r=>!hasSkill(c,r));pr=12*(req.length-miss.length)/req.length;if(miss.length)flags.push('não comprova: '+miss.join(', '))}
  const des=v.desejaveis||[];const pd=des.length?3*des.filter(r=>hasSkill(c,r)).length/des.length:3;
  parts.push(['Requisitos',pr+pd,15]);
  const ce=c.escalas||[];const ps=!v.escala?5:ce.includes(v.escala)?5:(v.escala.startsWith('12x36')&&ce.some(x=>x.startsWith('12x36')))?3:ce.length?0:2;
  if(v.escala&&ps===0)flags.push('não indicou a escala '+v.escala);
  parts.push(['Escala',ps,5]);
  let pfo=0;if(!v.escolaridade_min||ESC_IDX(c.escolaridade)>=ESC_IDX(v.escolaridade_min))pfo+=3;else flags.push('escolaridade abaixo do pedido');
  if(cnhOk(c.cnh,v.cnh))pfo+=2;else flags.push('sem CNH '+v.cnh);
  parts.push(['Formação',pfo,5]);
  if(v.sexo_req&&c.sexo&&c.sexo!=='Não informado'&&c.sexo!==v.sexo_req){restricted=true;flags.push('fora do requisito de sexo da vaga')}
  const a=age(c);if(a!==null&&((v.idade_min&&a<v.idade_min)||(v.idade_max&&a>v.idade_max))){restricted=true;flags.push('fora da faixa etária da vaga')}
  const total=Math.round(parts.reduce((s,p)=>s+p[1],0));
  return{total,parts,flags,restricted};
}
function rankFor(v,incluirTodos){
  return S.cands.filter(c=>incluirTodos||!['Contratado','Reprovado'].includes(c.status)).map(c=>({c,s:scoreCand(c,v)}))
    .sort((x,y)=>(x.s.restricted-y.s.restricted)||(y.s.total-x.s.total)||((+y.c.avaliacao||0)-(+x.c.avaliacao||0))||(y.c.recebido_em||'').localeCompare(x.c.recebido_em||''));
}

function resetFilters(){const o=S.f.ordem;S.f={q:'',funcao:'',outras:true,sexo:'',cidade:'',bairro:'',idMin:'',idMax:'',expMin:'',esc:'',cnh:'',escala:'',curso:'',status:'',origem:'',aval:'',desde:'',comArquivo:false,ordem:'recentes'}}
function filtered(){
  const f=S.f,q=norm(f.q),terms=q?q.split(/\s+/):[];
  let r=S.cands.filter(c=>{
    if(terms.length){const hay=norm([c.nome,c.funcao,(c.outras_funcoes||[]).join(' '),c.cidade,c.bairro,c.email,c.telefone,digits(c.telefone),c.experiencias,(c.cursos||[]).join(' '),c.escolaridade,(c.obs||[]).map(o=>o.texto).join(' '),c.texto_cv].join(' '));if(!terms.every(t=>hay.includes(t)))return false}
    if(f.funcao&&!(c.funcao===f.funcao||(f.outras&&(c.outras_funcoes||[]).includes(f.funcao))))return false;
    if(f.sexo&&(c.sexo||'Não informado')!==f.sexo)return false;
    if(f.cidade&&norm(c.cidade)!==norm(f.cidade))return false;
    if(f.bairro&&!norm(c.bairro).includes(norm(f.bairro)))return false;
    const a=age(c);if(f.idMin&&(a===null||a<+f.idMin))return false;if(f.idMax&&(a===null||a>+f.idMax))return false;
    if(f.expMin&&(+c.experiencia_anos||0)<+f.expMin)return false;
    if(f.esc&&ESC_IDX(c.escolaridade)<ESC_IDX(f.esc))return false;
    if(f.cnh==='Possui'&&(!c.cnh||c.cnh==='Não possui'))return false;
    if(f.cnh&&f.cnh!=='Possui'&&!cnhOk(c.cnh,f.cnh))return false;
    if(f.escala&&!(c.escalas||[]).includes(f.escala))return false;
    if(f.curso&&!(c.cursos||[]).includes(f.curso))return false;
    if(f.status&&(c.status||'Novo')!==f.status)return false;
    if(f.origem&&c.origem!==f.origem)return false;
    if(f.aval&&(+c.avaliacao||0)<+f.aval)return false;
    if(f.desde&&(c.recebido_em||'')<f.desde)return false;
    if(f.comArquivo&&!c.arquivo_path)return false;
    return true});
  const o=f.ordem;
  r.sort((a,b)=>o==='nome'?(a.nome||'').localeCompare(b.nome||''):o==='exp'?(+b.experiencia_anos||0)-(+a.experiencia_anos||0):o==='aval'?(+b.avaliacao||0)-(+a.avaliacao||0):o==='antigos'?(a.recebido_em||'').localeCompare(b.recebido_em||''):(b.recebido_em||'').localeCompare(a.recebido_em||''));
  return r;
}

      <div class="field s4"><span class="lbl">Escalas que aceita</span>${chk('escalas',ESCALAS,base.escalas)}</div>
      <div class="field s4"><span class="lbl">Cursos e habilidades</span>${chk('cursos',CURSOS,base.cursos)}</div>
      <div class="field s4"><label for="c_cursosx">Outros cursos (separe por vírgula)</label><input class="input" id="c_cursosx" name="cursos_extra" value="${h(extraCursos.join(', '))}"></div>
      <div class="field s4"><label for="c_expt">Resumo das experiências</label><textarea class="input" id="c_expt" name="experiencias" placeholder="Empresas, funções, períodos e o que fazia">${h(base.experiencias||'')}</textarea></div>
    </div>
    <div class="section-t">Controle do RH</div>
    <div class="fgrid">
      <div class="field"><label for="c_rec">Recebido em</label><input class="input" type="date" id="c_rec" name="recebido_em" value="${h(base.recebido_em||todayISO())}"></div>
      <div class="field"><label for="c_status">Situação</label><select class="input" id="c_status" name="status">${opts(Object.keys(STATUS),base.status||'Novo')}</select></div>
      <div class="field s2"><label for="c_obs">${isNew?'Observação do RH':'Nova observação do RH'}</label><input class="input" id="c_obs" name="obs_nova" placeholder="Ex.: indicado pelo síndico, disponível imediato"></div>
    </div>
    ${up&&up.text?`<details class="raw"><summary>Ver texto lido do arquivo</summary><pre>${h(up.text.slice(0,6000))}</pre></details>`:''}
    <div id="cfErr"></div>
  </div>
  <div class="modal-foot">
    ${up&&QUEUE.length>1?`<button class="btn ghost" type="button" id="cfSkip">Pular este arquivo</button>`:''}
    <button class="btn" type="button" data-close>Cancelar</button>
    <button class="btn primary" type="submit" id="cfSave">${up&&up.idx<QUEUE.length-1?'Salvar e próximo':'Salvar currículo'}</button>
  </div></form>`);
  const form=$('#cf');
  const checkDup=()=>{const em=norm($('#c_email').value),tel=digits($('#c_tel').value).slice(-8),nm=norm($('#c_nome').value);
    const d=S.cands.find(x=>x.id!==base.id&&((em&&norm(x.email)===em)||(tel.length===8&&digits(x.telefone).slice(-8)===tel)||(nm.length>6&&norm(x.nome)===nm)));
    $('#dupWarn').innerHTML=d?`<div class="notice warn">Possível duplicado: <b>${h(d.nome)}</b> já está no banco (recebido em ${fmtDate(d.recebido_em)}, ${h(d.status||'Novo')}). <button class="btn sm" type="button" id="openDup" style="margin-left:6px">Abrir ficha existente</button></div>`:'';
    if(d)$('#openDup').onclick=()=>openDrawer(d.id)};
  ['c_email','c_tel','c_nome'].forEach(id=>$('#'+id).addEventListener('change',checkDup));checkDup();
  $$('#cf .auto').forEach(el=>el.addEventListener('input',()=>el.classList.remove('auto'),{once:true}));
  if($('#cfSkip'))$('#cfSkip').onclick=()=>nextInQueue(up.idx+1);
  form.onsubmit=async e=>{
    e.preventDefault();const fd=new FormData(form);
    if(!fd.get('nome').trim()){$('#cfErr').innerHTML='<div class="notice warn">Informe o nome do candidato.</div>';$('#c_nome').focus();return}
    if(!fd.get('funcao')){$('#cfErr').innerHTML='<div class="notice warn">Escolha a função principal. Ela é usada nos filtros e no ranking das vagas.</div>';$('#c_funcao').focus();return}
    const btn=$('#cfSave');btn.disabled=true;btn.innerHTML='<span class="spin"></span> Salvando';
    const c2=Object.assign({},base);
    ['nome','sexo','data_nasc','idade_informada','telefone','email','cidade','bairro','funcao','experiencia_anos','pretensao','escolaridade','cnh','origem','experiencias','recebido_em'].forEach(k=>c2[k]=(fd.get(k)||'').toString().trim());
    c2.nome=titleCase(c2.nome);if(c2.telefone)c2.telefone=fmtPhone(c2.telefone);
    c2.outras_funcoes=fd.getAll('outras_funcoes').filter(x=>x!==c2.funcao);c2.escalas=fd.getAll('escalas');
    c2.cursos=[...fd.getAll('cursos'),...String(fd.get('cursos_extra')||'').split(',').map(s=>s.trim()).filter(Boolean)];
    const st=fd.get('status');c2.historico=(c2.historico||[]).slice();c2.obs=(c2.obs||[]).slice();
    if(isNew){c2.historico.push({em:nowISO(),por:S.user.nome,evento:'Currículo cadastrado'});c2.criado_por=S.user.nome}
    else if(st!==base.status)c2.historico.push({em:nowISO(),por:S.user.nome,evento:`Situação: ${base.status||'Novo'} → ${st}`});
    else c2.historico.push({em:nowISO(),por:S.user.nome,evento:'Dados atualizados'});
    c2.status=st;const ob=String(fd.get('obs_nova')||'').trim();if(ob)c2.obs.push({em:nowISO(),por:S.user.nome,texto:ob});
    try{
      const newFile=up&&up.file?up.file:($('#cfFile')&&$('#cfFile').files[0]);
      if(newFile){if(!isNew&&base.arquivo_path)await B.delFile(base).catch(()=>{});const r=await B.upload(c2.id,newFile);c2.arquivo_path=r.path;c2.arquivo_nome=r.nome;if(!isNew)c2.historico.push({em:nowISO(),por:S.user.nome,evento:'Arquivo do currículo atualizado'});
        if(up&&up.text)c2.texto_cv=up.text.slice(0,60000);else if(!up){const t=await extractText(newFile);if(t)c2.texto_cv=t.slice(0,60000)}}
      await persistCand(c2);
      toast(isNew?'Currículo cadastrado.':'Currículo atualizado.');
      if(up&&QUEUE.length){refreshView();nextInQueue(up.idx+1)}else{closeLayer();refreshView();if(!isNew)openDrawer(c2.id)}
    }catch(err){btn.disabled=false;btn.textContent='Tentar de novo';$('#cfErr').innerHTML=`<div class="notice warn">Não foi possível salvar: ${h(err.message||err)}. Verifique a conexão e tente de novo.</div>`}
  };
}

/* =====================================================================
   FICHA DO CANDIDATO (gaveta)

  $('#layer').innerHTML=`<div class="drawer-wrap" id="dw"><aside class="drawer" role="dialog" aria-modal="true" aria-label="Ficha de ${h(c.nome)}">

      <div class="top"><div><div class="eyebrow">${h(c.funcao||'Função não informada')}</div><h2>${h(c.nome)}</h2></div><button class="x" type="button" data-close aria-label="Fechar">×</button></div>
      <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between">

      </div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <button class="btn primary" type="button" id="dInvite">Convidar para entrevista</button>
        <a class="btn" id="dFile" target="_blank" rel="noopener" ${c.arquivo_path?'':'hidden'}>${icFile} Abrir currículo</a>
        <button class="btn" type="button" id="dEdit">Editar</button>
      </div>
    </div>
    <div class="drawer-body">
      <div><div class="lbl" style="margin-bottom:6px">Contato</div><div class="contact">
        ${c.telefone?`<code>${h(c.telefone)}</code><a class="btn sm wa" href="https://wa.me/${waNumber(c.telefone)}" target="_blank" rel="noopener">WhatsApp</a>`:''}
        ${c.email?`<code>${h(c.email)}</code><button class="btn sm" type="button" id="cpEmail">Copiar e-mail</button>`:''}
        ${!c.telefone&&!c.email?'<span class="muted">Currículo sem telefone ou e-mail.</span>':''}</div></div>
      <dl class="dl">
        ${dl('Idade / sexo',`${a!==null?a+' anos':'—'} · ${h(c.sexo||'Não informado')}`)}${dl('Nascimento',fmtDate(c.data_nasc))}
        ${dl('Cidade',h(c.cidade))}${dl('Bairro',h(c.bairro))}
        ${dl('Experiência',c.experiencia_anos!=null&&c.experiencia_anos!==''?(+c.experiencia_anos)+' anos':'')}${dl('Pretensão',c.pretensao?money(c.pretensao):'')}
        ${dl('Escolaridade',h(c.escolaridade))}${dl('CNH',h(c.cnh))}
        ${dl('Também atua como',h((c.outras_funcoes||[]).join(', ')))}${dl('Escalas',h((c.escalas||[]).join(', ')))}
        ${dl('Origem',h(c.origem))}${dl('Recebido em',fmtDate(c.recebido_em))}
      </dl>
      ${(c.cursos||[]).length?`<div><div class="lbl" style="margin-bottom:6px">Cursos e habilidades</div><div class="chips">${c.cursos.map(x=>`<span class="tag">${h(x)}</span>`).join('')}</div></div>`:''}
      ${c.experiencias?`<div><div class="lbl" style="margin-bottom:6px">Experiências</div><p style="margin:0;white-space:pre-wrap">${h(c.experiencias)}</p></div>`:''}
      <div><div class="section-t" style="margin-bottom:10px">Observações do RH</div>
        <div class="notes" id="dNotes">${(c.obs||[]).slice().reverse().map(o=>`<div class="note"><small>${fmtDT(o.em)} · ${h(o.por)}</small>${h(o.texto)}</div>`).join('')||'<p class="muted" style="margin:0">Nenhuma observação ainda.</p>'}</div>
        <div style="display:grid;gap:8px;margin-top:10px"><textarea class="input" id="dObs" rows="3" placeholder="Escreva uma observação sobre o candidato (entrevista, indicação, restrições, disponibilidade)" style="min-height:70px"></textarea>

  $('#dInvite').onclick=()=>openInvite(c);
  $('#dStatus').onchange=async e=>{const old=c.status||'Novo';c.status=e.target.value;c.historico=(c.historico||[]).concat({em:nowISO(),por:S.user.nome,evento:`Situação: ${old} → ${c.status}`});await safeSave(c);openDrawer(c.id);refreshView()};
  $$('[data-star]').forEach(b=>b.onclick=async()=>{const n=+b.dataset.star;c.avaliacao=(+c.avaliacao===n)?0:n;await safeSave(c);$$('[data-star]').forEach(x=>x.classList.toggle('on',+x.dataset.star<=c.avaliacao));refreshView()});
  $('#dObsBtn').onclick=async()=>{const t=$('#dObs').value.trim();if(!t){$('#dObs').focus();return}c.obs=(c.obs||[]).concat({em:nowISO(),por:S.user.nome,texto:t});await safeSave(c);toast('Observação adicionada.');openDrawer(c.id);refreshView()};
  $('#dDel').onclick=async()=>{if(!await confirmBox('Excluir currículo',`Excluir <b>${h(c.nome)}</b> e o arquivo anexado? Essa ação não pode ser desfeita.`,'Excluir'))return;try{await B.delCand(c);S.cands=S.cands.filter(x=>x.id!==c.id);closeLayer();counts();refreshView();toast('Currículo excluído.')}catch(e){toast('Não foi possível excluir: '+(e.message||e))}};
}
async function safeSave(c){try{await persistCand(c)}catch(e){toast('Não foi possível salvar: '+(e.message||e))}}

/* =====================================================================
   CONVITE PARA ENTREVISTA
   ===================================================================== */
function fillTpl(tpl,d){return tpl.replace(/\{(\w+)\}/g,(m,k)=>d[k]!==undefined&&d[k]!==''?d[k]:m)}
function openInvite(c,vagaId){
  const abertas=S.vagas.filter(v=>v.status==='Aberta');
  const pre=vagaId?S.vagas.find(v=>v.id===vagaId):abertas.find(v=>v.titulo===c.funcao);
  const amanha=(()=>{const d=new Date();d.setDate(d.getDate()+1);if(d.getDay()===0)d.setDate(d.getDate()+1);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)})();
  openModal(`<div class="modal-head"><h2>Convite para entrevista</h2><button class="x" type="button" data-close aria-label="Fechar">×</button></div>
  <div class="modal-body">
    <div class="eyebrow">${h(c.nome)} · ${h(c.funcao||'')}</div>
    <div class="radio-cards"><label><input type="radio" name="ivTipo" value="Presencial" checked> Entrevista presencial</label><label><input type="radio" name="ivTipo" value="Online"> Entrevista online</label></div>
    <div class="fgrid">
      <div class="field s2"><label for="iv_vaga">Vaga</label><input class="input" id="iv_vaga" list="dlVagas" value="${h(pre?pre.titulo+(pre.escala?' '+pre.escala:''):c.funcao||'')}"></div>
      <div class="field"><label for="iv_data">Data</label><input class="input" type="date" id="iv_data" value="${amanha}"></div>
      <div class="field"><label for="iv_hora">Horário</label><input class="input" type="time" id="iv_hora" value="09:00"></div>
      <div class="field s3" id="ivLocalF"><label for="iv_local">Endereço da entrevista</label><input class="input" id="iv_local" value="${h(S.cfg.endereco)}" placeholder="Rua, número, bairro, cidade"></div>
      <div class="field s3" id="ivLinkF" hidden><label for="iv_link">Link da chamada (Meet, Zoom, WhatsApp vídeo)</label><input class="input" id="iv_link" placeholder="https://meet.google.com/…"></div>
      <div class="field"><label for="iv_resp">Responsável</label><input class="input" id="iv_resp" value="${h(S.cfg.responsavel||S.user.nome)}"></div>
      <div class="field s4" id="ivDocsF"><label for="iv_docs">Documentos para levar</label><input class="input" id="iv_docs" value="${h(S.cfg.documentos)}"></div>
    </div>
    <datalist id="dlVagas">${abertas.map(v=>`<option value="${h(v.titulo+(v.escala?' '+v.escala:''))}">`).join('')}</datalist>
    <div class="field"><label for="iv_msg">Mensagem (pode editar antes de enviar)</label><textarea class="input msg-box" id="iv_msg"></textarea>
      <div><button class="btn sm ghost" type="button" id="ivReset">Refazer a partir do modelo</button></div></div>
    <div id="ivWarn"></div>
  </div>
  <div class="modal-foot">
    <button class="btn" type="button" id="ivCopy">Copiar mensagem</button>
    ${c.email?`<a class="btn" id="ivMail" target="_blank" rel="noopener">Enviar por e-mail</a>`:''}
    ${c.telefone?`<a class="btn wa" id="ivWa" target="_blank" rel="noopener">Enviar no WhatsApp</a>`:''}
    <button class="btn primary" type="button" id="ivReg">Registrar entrevista</button>
  </div>`);
  let edited=false;const msg=$('#iv_msg');
  const tipo=()=>document.querySelector('input[name=ivTipo]:checked').value;
  const data=()=>{const t=tipo();return{nome:(c.nome||'').split(' ')[0],nome_completo:c.nome,vaga:$('#iv_vaga').value||c.funcao||'',data:fmtDate($('#iv_data').value),dia_semana:diaSemana($('#iv_data').value),hora:$('#iv_hora').value,local:$('#iv_local').value||'{local}',link:$('#iv_link').value||'{link}',responsavel:$('#iv_resp').value,documentos:$('#iv_docs').value}};
  const build=()=>{if(!edited)msg.value=fillTpl(tipo()==='Online'?S.cfg.tpl_online:S.cfg.tpl_presencial,data());links()};
  const links=()=>{const t=msg.value;const miss=/\{(local|link)\}/.test(t);$('#ivWarn').innerHTML=miss?`<div class="notice warn">Preencha ${tipo()==='Online'?'o link da chamada':'o endereço'} antes de enviar.</div>`:(!c.telefone&&!c.email?'<div class="notice warn">Este currículo não tem telefone nem e-mail. Copie a mensagem e envie por outro canal.</div>':'');
    if($('#ivWa'))$('#ivWa').href=`https://wa.me/${waNumber(c.telefone)}?text=${encodeURIComponent(t)}`;
    if($('#ivMail'))$('#ivMail').href=`mailto:${encodeURIComponent(c.email)}?subject=${encodeURIComponent('Convite para entrevista · C&S Soluções em Serviços Terceirizados')}&body=${encodeURIComponent(t)}`};
  $$('input[name=ivTipo]').forEach(r=>r.onchange=()=>{const on=tipo()==='Online';$('#ivLocalF').hidden=on;$('#ivDocsF').hidden=on;$('#ivLinkF').hidden=!on;edited=false;build()});
  ['iv_vaga','iv_data','iv_hora','iv_local','iv_link','iv_resp','iv_docs'].forEach(id=>$('#'+id).addEventListener('input',build));
  msg.addEventListener('input',()=>{edited=true;links()});
  $('#ivReset').onclick=()=>{edited=false;build()};
  let registered=false;
  const register=async canal=>{if(registered)return;if(!$('#iv_data').value){toast('Informe a data da entrevista.');return}registered=true;const t=tipo();
    const iv={id:uid(),data:$('#iv_data').value,hora:$('#iv_hora').value,tipo:t,local:t==='Presencial'?$('#iv_local').value:'',link:t==='Online'?$('#iv_link').value:'',vaga:$('#iv_vaga').value,responsavel:$('#iv_resp').value,canal,enviado_em:nowISO(),enviado_por:S.user.nome,resultado:''};
    c.entrevistas=(c.entrevistas||[]).concat(iv);const old=c.status||'Novo';c.status='Entrevista agendada';
    c.historico=(c.historico||[]).concat({em:nowISO(),por:S.user.nome,evento:`Convite para entrevista ${t.toLowerCase()} em ${fmtDate(iv.data)} ${iv.hora} (${canal})${old!==c.status?` · ${old} → ${c.status}`:''}`});
    await safeSave(c);counts();toast('Entrevista registrada na agenda.')};
  $('#ivCopy').onclick=()=>copyText(msg.value,msg);
  if($('#ivWa'))$('#ivWa').addEventListener('click',e=>{if(/\{(local|link)\}/.test(msg.value)){e.preventDefault();links();return}register('WhatsApp').then(()=>setTimeout(()=>{closeLayer();refreshView()},300))});
  if($('#ivMail'))$('#ivMail').addEventListener('click',e=>{if(/\{(local|link)\}/.test(msg.value)){e.preventDefault();links();return}copyText(msg.value);register('E-mail').then(()=>setTimeout(()=>{closeLayer();refreshView()},300))});
  $('#ivReg').onclick=async()=>{await register('Registrado manualmente');closeLayer();refreshView()};
  build();
}

/* =====================================================================
   VAGAS E RANKING
   ===================================================================== */
function renderVagas(){
  if(S.vagaSel){const v=S.vagas.find(x=>x.id===S.vagaSel);if(v)return renderRanking(v);S.vagaSel=null}
  const ord={'Aberta':0,'Pausada':1,'Fechada':2};const vs=S.vagas.slice().sort((a,b)=>(ord[a.status]??3)-(ord[b.status]??3)||(b.aberta_em||'').localeCompare(a.aberta_em||''));
  const st={Aberta:'var(--ok)',Pausada:'var(--warn)',Fechada:'var(--faint)'};
  $('#main').innerHTML=`${demoBar()}
  <div class="page-head"><div><div class="eyebrow">Vagas e ranking</div><h1>Vagas</h1></div><div class="actions"><button class="btn primary" type="button" id="vNova">+ Abrir vaga</button></div></div>
  ${vs.length?`<div class="vaga-grid">${vs.map(v=>{const top=v.status==='Aberta'?rankFor(v).filter(x=>!x.s.restricted).slice(0,3):[];return`
    <article class="panel vaga-card">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:start"><div><div class="eyebrow">${h(v.cliente||'Posto não informado')}</div><h3>${h(v.titulo)}</h3></div><span class="pill" style="color:${st[v.status]||'var(--silver)'}">${h(v.status)}</span></div>
      <div class="vaga-meta"><span><b>${h(v.cidade||'—')}</b>${v.bairro?' · '+h(v.bairro):''}</span>${v.escala?`<span><b>${h(v.escala)}</b></span>`:''}<span><b class="tab-num">${v.quantidade||1}</b> vaga(s)</span>${v.salario?`<span><b class="tab-num">${money(v.salario)}</b></span>`:''}<span>aberta em ${fmtDate(v.aberta_em)}</span></div>
      ${v.descricao?`<p class="muted" style="margin:0;font-size:12.5px">${h(v.descricao)}</p>`:''}
      ${top.length?`<div class="top3"><span class="lbl">Melhores do banco</span>${top.map(x=>`<div><span>${h(x.c.nome)}</span><b class="gold-text tab-num">${x.s.total}</b></div>`).join('')}</div>`:''}
      <div class="vaga-actions"><button class="btn primary sm" type="button" data-rank="${v.id}">Ver ranking</button><button class="btn sm" type="button" data-edit="${v.id}">Editar</button></div>
    </article>`}).join('')}</div>`:`<div class="empty"><b>Nenhuma vaga cadastrada</b>Abra uma vaga com a função, o local e o perfil desejado. O sistema ordena os currículos do banco do mais aderente para o menos aderente.<button class="btn primary" type="button" onclick="openVagaModal()">+ Abrir vaga</button></div>`}`;
  $('#vNova').onclick=()=>openVagaModal();
  $$('[data-rank]').forEach(b=>b.onclick=()=>go('vagas',{vaga:b.dataset.rank}));
  $$('[data-edit]').forEach(b=>b.onclick=()=>openVagaModal(S.vagas.find(v=>v.id===b.dataset.edit)));
}
function ring(score){const r=26,c=2*Math.PI*r;const col=score>=75?'var(--ok)':score>=55?'var(--gold)':score>=35?'var(--warn)':'var(--bad)';return`<div class="score" style="color:${col}"><svg viewBox="0 0 58 58" width="58" height="58"><circle cx="29" cy="29" r="${r}" fill="none" stroke="var(--panel-3)" stroke-width="4"/><circle cx="29" cy="29" r="${r}" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-dasharray="${c*score/100} ${c}"/></svg><span class="tab-num">${score}</span></div>`}
function renderRanking(v){
  const list=rankFor(v,S.rank.todos).filter(x=>x.s.total>=S.rank.min);
  $('#main').innerHTML=`${demoBar()}
  <div class="page-head"><div><button class="btn sm ghost" type="button" id="rBack" style="margin-bottom:8px">← Vagas</button><div class="eyebrow">Ranking da vaga · ${h(v.cliente||'')}</div><h1>${h(v.titulo)}${v.escala?` <span class="muted" style="font-size:.6em;font-family:var(--body)">${h(v.escala)}</span>`:''}</h1></div>
    <div class="actions"><button class="btn" type="button" id="rEdit">Editar vaga</button></div></div>
  <div class="panel rank-head" style="margin-bottom:16px">
    <div style="display:grid;gap:8px;min-width:0">
      <div class="vaga-meta"><span>Local <b>${h(v.cidade||'qualquer')}${v.bairro?' · '+h(v.bairro):''}</b></span><span>Experiência mínima <b class="tab-num">${v.exp_min||0} ano(s)</b></span>${v.escolaridade_min?`<span>Escolaridade <b>${h(v.escolaridade_min)}</b></span>`:''}${v.cnh?`<span>CNH <b>${h(v.cnh)}</b></span>`:''}${(v.requisitos||[]).length?`<span>Obrigatórios <b>${h(v.requisitos.join(', '))}</b></span>`:''}${(v.desejaveis||[]).length?`<span>Desejáveis <b>${h(v.desejaveis.join(', '))}</b></span>`:''}</div>
      <div class="ph-help">Nota de 0 a 100: função 35 · local 20 · experiência 20 · requisitos 15 · escala 5 · escolaridade e CNH 5. Empate é decidido pela avaliação do RH.</div>
    </div>
    <div style="display:grid;gap:8px;justify-items:end">
      <label class="check"><input type="checkbox" id="rTodos" ${S.rank.todos?'checked':''}> Incluir contratados e reprovados</label>
      <label class="check"><span class="lbl">Nota mínima</span><select class="input" id="rMin" style="width:auto;padding-block:5px">${[0,40,55,70,85].map(n=>`<option value="${n}"${S.rank.min===n?' selected':''}>${n||'Todas'}</option>`).join('')}</select></label>
    </div>
  </div>
  <div class="results">${list.length?list.map((x,i)=>`
    <div class="rank-row${x.s.restricted?' restricted':''}">
      <div class="rank-pos tab-num">${i+1}º</div>${ring(x.s.total)}
      <div style="min-width:0"><button type="button" class="nm" data-open="${x.c.id}" style="background:none;border:0;padding:0;color:var(--fg);font-weight:600;font-size:14.5px;cursor:pointer;text-align:left">${h(x.c.nome)}</button> ${statusPill(x.c.status)} ${x.c.avaliacao?starsHTML(x.c.avaliacao):''}
        <div class="sub muted" style="font-size:12px">${h(x.c.funcao||'')} · ${h(x.c.cidade||'—')}${x.c.bairro?' / '+h(x.c.bairro):''} · ${+x.c.experiencia_anos||0} anos · ${age(x.c)??'—'} anos de idade</div>
        <div class="breakdown">${x.s.parts.map(([n,p,m])=>`<span class="bd ${p>=m-0.01?'full':p<=0?'zero':''}">${n} ${Math.round(p)}/${m}</span>`).join('')}</div>
        ${x.s.flags.length?`<div class="flags">Atenção: ${h(x.s.flags.join(' · '))}</div>`:''}</div>
      <div class="rank-actions"><button class="btn sm" type="button" data-open="${x.c.id}">Ficha</button><button class="btn primary sm" type="button" data-inv="${x.c.id}">Convidar</button></div>
    </div>`).join(''):`<div class="empty"><b>Nenhum candidato com essa nota</b>Reduza a nota mínima ou cadastre mais currículos.</div>`}</div>`;
  $('#rBack').onclick=()=>{S.vagaSel=null;renderVagas()};$('#rEdit').onclick=()=>openVagaModal(v);
  $('#rTodos').onchange=e=>{S.rank.todos=e.target.checked;renderRanking(v)};$('#rMin').onchange=e=>{S.rank.min=+e.target.value;renderRanking(v)};
  $$('[data-open]').forEach(b=>b.onclick=()=>openDrawer(b.dataset.open));
  $$('[data-inv]').forEach(b=>b.onclick=()=>openInvite(findCand(b.dataset.inv),v.id));
}
function openVagaModal(v){
  const isNew=!v;v=v||{id:uid(),status:'Aberta',quantidade:1,aberta_em:todayISO(),requisitos:[],desejaveis:[]};
  const chk=(name,sel)=>`<div class="chips">${CURSOS.map(o=>`<label class="chip-opt"><input type="checkbox" name="${name}" value="${h(o)}"${(sel||[]).includes(o)?' checked':''}><span>${h(o)}</span></label>`).join('')}</div>`;
  openModal(`<form id="vf" novalidate>
  <div class="modal-head"><h2>${isNew?'Abrir vaga':'Editar vaga'}</h2><button class="x" type="button" data-close aria-label="Fechar">×</button></div>
  <div class="modal-body">
    <div class="fgrid">
      <div class="field s2"><label for="v_tit">Função da vaga *</label><select class="input" id="v_tit" name="titulo">${opts(funcoes().includes(v.titulo)||!v.titulo?funcoes():[v.titulo,...funcoes()],v.titulo,'Selecione')}</select></div>
      <div class="field s2"><label for="v_cli">Cliente / posto</label><input class="input" id="v_cli" name="cliente" value="${h(v.cliente)}" placeholder="Nome do condomínio ou empresa"></div>
      <div class="field s2"><label for="v_cid">Cidade do posto</label><input class="input" id="v_cid" name="cidade" value="${h(v.cidade)}" list="dlCid2"></div>
      <div class="field s2"><label for="v_bai">Bairro do posto</label><input class="input" id="v_bai" name="bairro" value="${h(v.bairro)}"></div>
      <div class="field"><label for="v_esc">Escala</label><select class="input" id="v_esc" name="escala">${opts(ESCALAS,v.escala,'Indiferente')}</select></div>
      <div class="field"><label for="v_qtd">Quantidade</label><input class="input tab-num" type="number" min="1" id="v_qtd" name="quantidade" value="${h(v.quantidade||1)}"></div>
      <div class="field"><label for="v_sal">Salário (R$)</label><input class="input tab-num" type="number" min="0" step="0.01" id="v_sal" name="salario" value="${h(v.salario)}"></div>
      <div class="field"><label for="v_st">Situação</label><select class="input" id="v_st" name="status">${opts(['Aberta','Pausada','Fechada'],v.status)}</select></div>
    </div>
    <datalist id="dlCid2">${CIDADES.map(c=>`<option value="${h(c)}">`).join('')}</datalist>
    <div class="section-t">Perfil desejado</div>
    <div class="fgrid">
      <div class="field"><label for="v_exp">Experiência mínima (anos)</label><input class="input tab-num" type="number" min="0" step="0.5" id="v_exp" name="exp_min" value="${h(v.exp_min)}"></div>
      <div class="field s2"><label for="v_escm">Escolaridade mínima</label><select class="input" id="v_escm" name="escolaridade_min">${opts(ESCOLARIDADE,v.escolaridade_min,'Não exige')}</select></div>
      <div class="field"><label for="v_cnh">CNH</label><select class="input" id="v_cnh" name="cnh">${opts(['A','B','AB','D'],v.cnh,'Não exige')}</select></div>
      <div class="field s4"><span class="lbl">Requisitos obrigatórios</span>${chk('requisitos',v.requisitos)}</div>
      <div class="field s4"><span class="lbl">Desejáveis (contam pouco)</span>${chk('desejaveis',v.desejaveis)}</div>
      <div class="field s4"><label for="v_desc">Descrição e perfil da vaga</label><textarea class="input" id="v_desc" name="descricao" placeholder="Atividades, horário, benefícios, perfil comportamental">${h(v.descricao||'')}</textarea></div>
    </div>
    <details ${v.sexo_req||v.idade_min||v.idade_max?'open':''}><summary class="lbl" style="cursor:pointer">Restrição de sexo ou idade (somente quando a função exigir)</summary>
      <div class="fgrid" style="margin-top:10px">
        <div class="field s2"><label for="v_sx">Sexo</label><select class="input" id="v_sx" name="sexo_req">${opts(['Feminino','Masculino'],v.sexo_req,'Indiferente')}</select></div>
        <div class="field"><label for="v_imin">Idade mínima</label><input class="input tab-num" type="number" min="14" id="v_imin" name="idade_min" value="${h(v.idade_min)}"></div>
        <div class="field"><label for="v_imax">Idade máxima</label><input class="input tab-num" type="number" min="14" id="v_imax" name="idade_max" value="${h(v.idade_max)}"></div>
        <div class="legal s4">A CLT (art. 373-A) e a Lei 9.029/95 proíbem usar sexo ou idade como critério de seleção, salvo quando a natureza da atividade comprovadamente exigir. Use só nesses casos. Quem estiver fora da restrição não é excluído, apenas vai para o fim do ranking com aviso.</div>
      </div></details>
    <div id="vfErr"></div>
  </div>
  <div class="modal-foot">${!isNew?'<button class="btn danger" type="button" id="vDel" style="margin-right:auto">Excluir vaga</button>':''}<button class="btn" type="button" data-close>Cancelar</button><button class="btn primary" type="submit" id="vSave">${isNew?'Abrir vaga e ver ranking':'Salvar'}</button></div></form>`);
  $('#vf').onsubmit=async e=>{e.preventDefault();const fd=new FormData($('#vf'));
    if(!fd.get('titulo')){$('#vfErr').innerHTML='<div class="notice warn">Escolha a função da vaga.</div>';return}
    const v2=Object.assign({},v);['titulo','cliente','cidade','bairro','escala','quantidade','salario','status','exp_min','escolaridade_min','cnh','descricao','sexo_req','idade_min','idade_max'].forEach(k=>v2[k]=String(fd.get(k)??'').trim());
    v2.requisitos=fd.getAll('requisitos');v2.desejaveis=fd.getAll('desejaveis').filter(x=>!v2.requisitos.includes(x));
    ['quantidade','salario','exp_min','idade_min','idade_max'].forEach(k=>v2[k]=v2[k]===''?null:Number(v2[k]));
    try{const saved=await B.saveVaga(v2);const obj=Object.assign(v2,saved||{});const i=S.vagas.findIndex(x=>x.id===obj.id);if(i>=0)S.vagas[i]=obj;else S.vagas.unshift(obj);closeLayer();toast(isNew?'Vaga aberta.':'Vaga atualizada.');go('vagas',{vaga:obj.id})}
    catch(err){$('#vfErr').innerHTML=`<div class="notice warn">Não foi possível salvar: ${h(err.message||err)}</div>`}};
  if($('#vDel'))$('#vDel').onclick=async()=>{if(!await confirmBox('Excluir vaga',`Excluir a vaga <b>${h(v.titulo)}</b>? Os currículos não são afetados.`,'Excluir'))return;try{await B.delVaga(v);S.vagas=S.vagas.filter(x=>x.id!==v.id);closeLayer();go('vagas',{vaga:null})}catch(e){toast('Não foi possível excluir.')}};
}

/* =====================================================================
   ENTREVISTAS
   ===================================================================== */
function allInterviews(){const out=[];S.cands.forEach(c=>(c.entrevistas||[]).forEach(iv=>out.push({c,iv})));return out}
function renderEntrevistas(){
  const t=todayISO();let list=allInterviews();
  const f=S.ivFiltro;
  if(f==='proximas')list=list.filter(x=>x.iv.data>=t&&!x.iv.resultado).sort((a,b)=>(a.iv.data+a.iv.hora).localeCompare(b.iv.data+b.iv.hora));
  else if(f==='pendentes')list=list.filter(x=>x.iv.data<t&&!x.iv.resultado).sort((a,b)=>(b.iv.data).localeCompare(a.iv.data));
  else list=list.sort((a,b)=>(b.iv.data+b.iv.hora).localeCompare(a.iv.data+a.iv.hora));
  const pend=allInterviews().filter(x=>x.iv.data<t&&!x.iv.resultado).length;
  const RES=['Compareceu','Faltou','Aprovado','Reprovado'];
  $('#main').innerHTML=`${demoBar()}
  <div class="page-head"><div><div class="eyebrow">Agenda</div><h1>Entrevistas</h1></div>
    <div class="seg" role="group" aria-label="Mostrar">${[['proximas','Próximas'],['pendentes',`Sem resultado${pend?' ('+pend+')':''}`],['todas','Todas']].map(([k,l])=>`<button type="button" data-iv="${k}" aria-pressed="${f===k}">${l}</button>`).join('')}</div></div>
  <div class="results">${list.length?list.map(({c,iv})=>`
    <div class="iv-row">
      <div class="iv-date tab-num">${fmtDate(iv.data).slice(0,5)}<small>${h(diaSemana(iv.data))} · ${h(iv.hora||'')}</small></div>
      <div style="min-width:0"><button type="button" data-open="${c.id}" style="background:none;border:0;padding:0;color:var(--fg);font-weight:600;font-size:14px;cursor:pointer;text-align:left">${h(c.nome)}</button>
        <div class="muted" style="font-size:12px">${h(iv.vaga||c.funcao||'')} · ${h(iv.tipo)} · ${h(c.telefone||c.email||'sem contato')}</div></div>
      <div class="iv-vaga muted" style="font-size:12px;min-width:0;overflow-wrap:anywhere">${h(iv.tipo==='Online'?(iv.link||'link não informado'):(iv.local||'local não informado'))}<br>convite por ${h(iv.canal||'—')} · ${h(iv.responsavel||'')}</div>
      <div class="iv-res">${iv.resultado?`<span class="pill" style="color:${iv.resultado==='Aprovado'?'var(--ok)':iv.resultado==='Reprovado'||iv.resultado==='Faltou'?'var(--bad)':'var(--gold)'}">${h(iv.resultado)}</span><button class="btn sm ghost" type="button" data-undo="${c.id}|${iv.id}">Desfazer</button>`:RES.map(r=>`<button class="btn sm" type="button" data-res="${c.id}|${iv.id}|${r}">${r}</button>`).join('')}</div>
    </div>`).join(''):`<div class="empty"><b>${f==='proximas'?'Nenhuma entrevista marcada':f==='pendentes'?'Tudo em dia':'Nenhuma entrevista registrada'}</b>${f==='pendentes'?'Todas as entrevistas passadas já têm resultado.':'Abra a ficha de um candidato ou o ranking de uma vaga e use “Convidar”.'}</div>`}</div>`;
  $$('[data-iv]').forEach(b=>b.onclick=()=>{S.ivFiltro=b.dataset.iv;renderEntrevistas()});
  $$('[data-open]').forEach(b=>b.onclick=()=>openDrawer(b.dataset.open));
  $$('[data-res]').forEach(b=>b.onclick=async()=>{const[cid,ivid,r]=b.dataset.res.split('|');const c=findCand(cid);const iv=c.entrevistas.find(x=>x.id===ivid);iv.resultado=r;
    const map={Compareceu:'Entrevistado',Aprovado:'Aprovado',Reprovado:'Reprovado'};const old=c.status||'Novo';if(map[r])c.status=map[r];else if(r==='Faltou')c.status='Em análise';
    c.historico=(c.historico||[]).concat({em:nowISO(),por:S.user.nome,evento:`Entrevista de ${fmtDate(iv.data)}: ${r}${old!==c.status?` · ${old} → ${c.status}`:''}`});
    await safeSave(c);renderEntrevistas();counts();toast('Resultado registrado.')});
  $$('[data-undo]').forEach(b=>b.onclick=async()=>{const[cid,ivid]=b.dataset.undo.split('|');const c=findCand(cid);const iv=c.entrevistas.find(x=>x.id===ivid);c.historico=(c.historico||[]).concat({em:nowISO(),por:S.user.nome,evento:`Resultado da entrevista de ${fmtDate(iv.data)} desfeito (${iv.resultado})`});iv.resultado='';await safeSave(c);renderEntrevistas();counts()});
}

/* =====================================================================
   CONFIGURAÇÕES
   ===================================================================== */
function renderConfig(){
  const c=S.cfg;
  $('#main').innerHTML=`${demoBar()}
  <div class="page-head"><div><div class="eyebrow">Ajustes do RH</div><h1>Configurações</h1></div><div class="actions"><button class="btn primary" type="button" id="cfgSave">Salvar configurações</button></div></div>
  <div class="cfg-grid">
    <div class="panel stack"><h2 style="margin:0">Entrevistas</h2>
      <div class="field"><label for="g_end">Endereço padrão para entrevista presencial</label><input class="input" id="g_end" value="${h(c.endereco)}" placeholder="Rua, número, bairro, cidade"></div>
      <div class="field"><label for="g_resp">Responsável que assina o convite</label><input class="input" id="g_resp" value="${h(c.responsavel)}" placeholder="${h(S.user.nome)}"></div>
      <div class="field"><label for="g_docs">Documentos para levar</label><input class="input" id="g_docs" value="${h(c.documentos)}"></div>
      <div class="field"><label for="g_lgpd">Revisar currículos com mais de (meses)</label><input class="input tab-num" id="g_lgpd" type="number" min="1" max="60" value="${h(c.lgpd_meses)}"><span class="ph-help">Currículos mais antigos aparecem com aviso para revisão de guarda (LGPD).</span></div>
      <div class="field"><label for="g_fn">Funções (uma por linha)</label><textarea class="input" id="g_fn" rows="8">${h((c.funcoes||FUNCOES_PADRAO).join('\n'))}</textarea></div>
    </div>
    <div class="panel stack"><h2 style="margin:0">Modelos de mensagem</h2>
      <div class="ph-help">Campos automáticos: <code>{nome}</code> <code>{vaga}</code> <code>{data}</code> <code>{dia_semana}</code> <code>{hora}</code> <code>{local}</code> <code>{link}</code> <code>{responsavel}</code> <code>{documentos}</code></div>
      <div class="field"><label for="g_tp">Convite presencial</label><textarea class="input msg-box" id="g_tp">${h(c.tpl_presencial)}</textarea></div>
      <div class="field"><label for="g_to">Convite online</label><textarea class="input msg-box" id="g_to">${h(c.tpl_online)}</textarea></div>
      <div><button class="btn sm ghost" type="button" id="g_rest">Restaurar modelos originais</button></div>
    </div>
  </div>
  ${DEMO?`<div class="panel" style="margin-top:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between"><span class="muted">Modo demonstração: apaga tudo o que foi cadastrado neste navegador e volta aos exemplos.</span><button class="btn danger" type="button" id="g_reset">Restaurar dados de exemplo</button></div>`:''}`;
  $('#g_rest').onclick=()=>{$('#g_tp').value=TPL_PRESENCIAL;$('#g_to').value=TPL_ONLINE};
  $('#cfgSave').onclick=async()=>{const n={endereco:$('#g_end').value.trim(),responsavel:$('#g_resp').value.trim(),documentos:$('#g_docs').value.trim(),lgpd_meses:+$('#g_lgpd').value||12,funcoes:$('#g_fn').value.split('\n').map(s=>s.trim()).filter(Boolean),tpl_presencial:$('#g_tp').value,tpl_online:$('#g_to').value};
    try{await B.saveCfg(n);S.cfg=Object.assign(defaultCfg(),n);toast('Configurações salvas.')}catch(e){toast('Não foi possível salvar: '+(e.message||e))}};
  if($('#g_reset'))$('#g_reset').onclick=async()=>{if(!await confirmBox('Restaurar exemplos','Apagar os dados deste navegador e voltar aos exemplos?','Restaurar'))return;LS.del('cs_cv_db');await enter();toast('Dados de exemplo restaurados.')};
}

boot();
</script>
