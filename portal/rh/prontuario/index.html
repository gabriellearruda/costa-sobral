function tabDocumentos(c){
  const cats=Object.entries(CATEGORIAS).filter(([k,v])=>can.sens||!v.sensivel).sort((a,b)=>a[1].ordem-b[1].ordem);
  const blocos=cats.map(([k,cat])=>{
    const tipos=S.tipos.filter(t=>t.categoria===k&&aplicavel(t,c)).sort((a,b)=>(b.exigido-a.exigido)||(a.ordem-b.ordem));
    const avulsos=docsDe(c.id).filter(d=>d.categoria===k&&(!d.tipo_codigo||!tipoBy(d.tipo_codigo)));
    if(!tipos.length&&!avulsos.length) return '';
    const feitos=tipos.filter(t=>t.exigido&&['ok','dispensado'].includes(statusTipo(c,t).st)).length, tot=tipos.filter(t=>t.exigido).length;
    const principais=tipos.filter(t=>t.exigido||docsDe(c.id,t.codigo).length), outros=tipos.filter(t=>!principais.includes(t));
    return `<div class="cat-block"><div class="cat-title"><h3>${cat.nome}</h3>${tot?`<span class="chip ${feitos===tot?'c-ok':'c-warn'}">${feitos}/${tot} obrigatórios</span>`:''}${cat.sensivel?'<span class="chip c-mut">Restrito</span>':''}</div>
      ${principais.map(t=>linhaTipo(c,t)).join('')}${avulsos.map(d=>linhaAvulso(c,d)).join('')}
      ${outros.length?`<details class="outros"><summary>Opcionais e eventuais (${outros.length})</summary>${outros.map(t=>linhaTipo(c,t)).join('')}</details>`:''}</div>`; }).join('');
  return `<div class="page-head" style="margin-bottom:10px"><div><p style="margin:0">Pasta do colaborador. <b>Gerar</b> abre o documento preenchido para imprimir ou salvar em PDF; depois de assinado, use <b>Anexar</b>.</p></div>
    ${can.edit?`<div class="actions"><button class="btn btn-dark" data-act="kitAdmissao" data-id="${c.id}">Gerar kit de admissão</button><button class="btn" data-act="anexar" data-id="${c.id}">+ Anexar documento</button></div>`:''}</div>${blocos}`;
}
function linhaTipo(c,t){
  const s=statusTipo(c,t); const d=s.doc;
  const info=[d?.data_doc?'Data '+fmtBR(d.data_doc):'',d?.validade?'Validade '+fmtBR(d.validade):'',d?.assinatura==='online'?'Assinado online':d?.assinatura==='fisica'?'Assinado em papel':'',t.descricao].filter(Boolean).join(' · ');
  const ops=[];
  if(d?.path) ops.push(`<button class="btn btn-sm" data-act="verDoc" data-id="${d.id}">Ver</button>`);
  if(s.n>1) ops.push(`<button class="btn btn-sm btn-ghost" data-act="histDoc" data-id="${c.id}" data-cod="${t.codigo}">${s.n} versões</button>`);
  if(can.edit){
    if(t.modelo&&MODELOS[t.modelo]) ops.push(`<button class="btn btn-sm" data-act="gerarDoc" data-id="${c.id}" data-cod="${t.codigo}">Gerar</button>`);
    if(t.modelo&&MODELOS[t.modelo]&&!['ok','dispensado'].includes(s.st)) ops.push(`<button class="btn btn-sm" data-act="assinarOnline" data-id="${c.id}" data-cod="${t.codigo}">Assinar online</button>`);
    ops.push(`<button class="btn btn-sm btn-dark" data-act="anexar" data-id="${c.id}" data-cod="${t.codigo}">Anexar</button>`);
    if(s.st!=='ok'&&(t.exigido||s.st==='dispensado')) ops.push(s.st==='dispensado'?`<button class="btn btn-sm btn-ghost" data-act="dispensar" data-id="${c.id}" data-cod="${t.codigo}" data-undo="1">Reativar</button>`:`<button class="btn btn-sm btn-ghost" data-act="dispensar" data-id="${c.id}" data-cod="${t.codigo}">Dispensar</button>`);
  }
  const chip=(!t.exigido&&s.st==='pendente')?'<span class="chip c-mut">Não anexado</span>':chipSt(s.st);
  return `<div class="doc-row"><div class="nm"><b>${esc(t.nome)}</b>${t.exigido?'<span class="req">Obrigatório</span>':''}<small>${esc(info)}</small></div>${chip}<div class="ops">${ops.join('')}</div></div>`;
}
function linhaAvulso(c,d){
  return `<div class="doc-row"><div class="nm"><b>${esc(d.titulo)}</b><span class="req" style="color:var(--muted)">Avulso</span><small>${[d.data_doc?'Data '+fmtBR(d.data_doc):'',d.validade?'Validade '+fmtBR(d.validade):'',d.obs].filter(Boolean).map(esc).join(' · ')}</small></div>${chipSt(d.status)}
  <div class="ops">${d.path?`<button class="btn btn-sm" data-act="verDoc" data-id="${d.id}">Ver</button>`:''}${can.edit?`<button class="btn btn-sm btn-ghost btn-danger" data-act="delDoc" data-id="${d.id}">Excluir</button>`:''}</div></div>`;
}
function ctxDoc(c,extra={}){ return {c,rem:S.rem[c.id]||{},emp:empresaDe(c),posto:postoById(c.posto_id),cfg:S.cfg,blank:false,
  entregas:S.entregas.filter(e=>e.colaborador_id===c.id).sort((a,b)=>(a.data_entrega||'').localeCompare(b.data_entrega||'')),catalogo:S.tipos,...extra}; }
async function marcarDoc(c,t,status,extra={}){
  const pend=docsDe(c.id,t.codigo).find(d=>['gerado','em_assinatura','pendente'].includes(d.status));
  if(pend){ Object.assign(pend,await api.update('rh_documentos',pend.id,{status,...extra})); return pend; }
  const d=await api.insert('rh_documentos',{colaborador_id:c.id,tipo_codigo:t.codigo,categoria:t.categoria,titulo:t.nome,status,data_doc:hojeISO(),criado_por:S.user?.email||null,...extra});
  S.docs.push(d); return d;
}
ACT.gerarDoc=async d=>{ const c=colabById(d.id),t=tipoBy(d.cod);
  const extra=t.categoria==='treinamento'?{treino:{curso:t.nome,norma:(t.nome.match(/NR-?\d+/)||[''])[0],data:hojeISO()}}:{};
  abrirImpressao([paginaA4(ctxDoc(c,extra),t.modelo)],`${t.nome} - ${c.nome}`);
  if(statusTipo(c,t).st==='pendente') await marcarDoc(c,t,'gerado');
  api.log('gerou documento',t.nome,c.id); rerender(); };
ACT.kitAdmissao=async d=>{ const c=colabById(d.id);
  const tipos=S.tipos.filter(t=>t.exigido&&t.etapa==='admissao'&&aplicavel(t,c)&&t.modelo&&MODELOS[t.modelo]&&!['ok','dispensado'].includes(statusTipo(c,t).st));
  const lista=tipos.length?tipos:S.tipos.filter(t=>t.exigido&&t.etapa==='admissao'&&aplicavel(t,c)&&t.modelo&&MODELOS[t.modelo]);
  if(!lista.length) return toast('Nenhum modelo de admissão marcado como obrigatório nos Parâmetros.');
  const ctx=ctxDoc(c); const pags=lista.map(t=>paginaA4(t.categoria==='treinamento'?{...ctx,treino:{curso:t.nome,norma:(t.nome.match(/NR-?\d+/)||[''])[0],data:hojeISO()}}:ctx,t.modelo));
  abrirImpressao(pags,`Kit de admissão - ${c.nome}`);
  for(const t of lista){ if(statusTipo(c,t).st==='pendente') await marcarDoc(c,t,'gerado'); }
  api.log('gerou kit de admissão',`${lista.length} documentos`,c.id); toast(`${lista.length} documento(s) no kit.`); rerender(); };
ACT.assinarOnline=async d=>{ const c=colabById(d.id),t=tipoBy(d.cod);
  modal({titulo:'Assinatura online',corpo:`<ol style="padding-left:18px;line-height:1.8;margin-top:0">
    <li>Clique em <b>Gerar PDF</b> e use “Salvar como PDF”.</li><li>Abra o Autentique e envie o PDF para ${esc(c.nome)}${c.telefone?` (WhatsApp ${esc(c.telefone)})`:''}${c.email?` ou ${esc(c.email)}`:''}.</li>
    <li>Quando voltar assinado, baixe o PDF e use <b>Anexar</b> neste documento.</li></ol>
    <div class="note">O documento fica com status <b>Em assinatura</b> até o arquivo assinado ser anexado.</div>`,
    rodape:`<button class="btn" data-act="gerarDoc" data-id="${c.id}" data-cod="${t.codigo}">Gerar PDF</button><a class="btn" href="${esc(S.cfg.assinatura?.autentique_url||'https://painel.autentique.com.br')}" target="_blank" rel="noopener">Abrir Autentique</a><button class="btn-gold" data-act="marcarAssinatura" data-id="${c.id}" data-cod="${t.codigo}">Enviado para assinatura</button>`}); };
ACT.marcarAssinatura=async d=>{ const c=colabById(d.id),t=tipoBy(d.cod); await marcarDoc(c,t,'em_assinatura',{assinatura:'online'}); closeModal(); toast('Marcado como em assinatura.'); rerender(); };
ACT.dispensar=async d=>{ const c=colabById(d.id),t=tipoBy(d.cod);
  if(d.undo){ const x=docsDe(c.id,t.codigo).find(z=>z.status==='dispensado'); if(x){ await api.remove('rh_documentos',x.id); S.docs=S.docs.filter(z=>z.id!==x.id); } rerender(); return; }
  const motivo=prompt(`Dispensar "${t.nome}" para ${c.nome}?\nInforme o motivo (ex.: não se aplica, já entregue em outra via):`,'Não se aplica'); if(motivo===null) return;
  await marcarDoc(c,t,'dispensado',{obs:motivo,assinatura:'nao_se_aplica'}); toast('Documento dispensado.'); rerender(); };
ACT.verDoc=async d=>{ const doc=S.docs.find(x=>x.id===d.id); if(!doc?.path) return toast('Este registro não tem arquivo anexado.');
  await api.openFile(doc.path); api.log('abriu documento',doc.titulo,doc.colaborador_id); };
ACT.delDoc=async d=>{ const doc=S.docs.find(x=>x.id===d.id); if(!confirm(`Excluir "${doc.titulo}"? O arquivo também será apagado.`)) return;
  await api.remove('rh_documentos',doc.id); await api.removeFile(doc.path); S.docs=S.docs.filter(x=>x.id!==doc.id); api.log('excluiu documento',doc.titulo,doc.colaborador_id); toast('Documento excluído.'); closeModal(); rerender(); };
ACT.histDoc=d=>{ const c=colabById(d.id),t=tipoBy(d.cod); const ds=docsDe(c.id,t.codigo);
  modal({titulo:`${t.nome} — versões`,corpo:`<div class="tbl-wrap"><table><tr><th>Data</th><th>Status</th><th>Validade</th><th>Obs.</th><th></th></tr>
  ${ds.map(x=>`<tr><td>${fmtBR(x.data_doc)||'—'}</td><td>${chipSt(x.status)}</td><td>${fmtBR(x.validade)||'—'}</td><td class="small">${esc(x.obs||'')}</td><td class="right nowrap">${x.path?`<button class="btn btn-sm" data-act="verDoc" data-id="${x.id}">Ver</button>`:''}${can.edit?`<button class="btn btn-sm btn-ghost btn-danger" data-act="delDoc" data-id="${x.id}">Excluir</button>`:''}</td></tr>`).join('')}</table></div>`}); };

/* upload genérico (usado por todas as abas) */
ACT.anexar=d=>{ const c=colabById(d.id); const t=d.cod?tipoBy(d.cod):null;
  const cats=Object.entries(CATEGORIAS).filter(([k,v])=>can.sens||!v.sensivel);
  const tiposOpt=S.tipos.filter(x=>x.ativo&&aplicavel(x,c)&&(can.sens||!CATEGORIAS[x.categoria]?.sensivel)).map(x=>[x.codigo,`${CATEGORIAS[x.categoria]?.nome} · ${x.nome}`]);
  modal({titulo:'Anexar documento',corpo:`<form class="form" id="fUp" onsubmit="return false">
    <label class="full">Tipo de documento<select name="tipo" data-chg="upTipo">${opts([['','Avulso (outro documento)'],...tiposOpt],t?.codigo||'')}</select></label>
    <label class="full" id="upTitWrap" ${t?'style="display:none"':''}>Título (avulso)<input name="titulo" placeholder="Ex.: Declaração de comparecimento"></label>
    <label id="upCatWrap" ${t?'style="display:none"':''}>Categoria (avulso)<select name="categoria">${opts(cats.map(([k,v])=>[k,v.nome]),d.cat||'funcional')}</select></label>
    <label>Data do documento<input type="date" name="data_doc" value="${hojeISO()}" data-chg="upData"></label>
    <label>Validade<input type="date" name="validade" value="${t?.validade_meses?addMonths(hojeISO(),t.validade_meses):''}"></label>
    <label>Assinatura<select name="assinatura">${opts([['fisica','Física (papel escaneado)'],['online','Online (Autentique)'],['nao_se_aplica','Não se aplica']],t?.quem_fornece==='colaborador'||t?.quem_fornece==='terceiro'?'nao_se_aplica':'fisica')}</select></label>
    <label class="full">Arquivo (PDF ou foto, até 15 MB)<input type="file" name="arquivo" accept=".pdf,image/*" required></label>
    <label class="full">Observação<input name="obs"></label></form>`,
    rodape:`<button class="btn" data-act="closeModal">Cancelar</button><button class="btn-gold" data-act="salvarUpload" data-id="${c.id}">Anexar</button>`}); };
ACT.upTipo=(d,el)=>{ const t=tipoBy(el.value); $('#upTitWrap').style.display=t?'none':''; $('#upCatWrap').style.display=t?'none':'';
  const dt=$('#fUp [name=data_doc]').value||hojeISO(); $('#fUp [name=validade]').value=t?.validade_meses?addMonths(dt,t.validade_meses):''; };
ACT.upData=(d,el)=>{ const t=tipoBy($('#fUp [name=tipo]').value); if(t?.validade_meses&&el.value) $('#fUp [name=validade]').value=addMonths(el.value,t.validade_meses); };
async function subirArquivo(c,categoria,file){
  if(file.size>15*1024*1024) throw new Error('Arquivo maior que 15 MB.');
  const safe=file.name.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w.-]+/g,'_').slice(-80);
  return api.upload(`${c.id}/${categoria}/${Date.now()}_${safe}`,file);
}
ACT.salvarUpload=async(d,btn)=>{ const c=colabById(d.id),f=formData($('#fUp')); if(!f.arquivo) return toast('Escolha o arquivo.');
  const t=tipoBy(f.tipo); const categoria=t?.categoria||f.categoria; const titulo=t?.nome||f.titulo||f.arquivo.name;
  btn.disabled=true; btn.textContent='Enviando…';
  try{ const path=await subirArquivo(c,categoria,f.arquivo);
    const campos={path,arquivo_nome:f.arquivo.name,data_doc:f.data_doc||null,validade:f.validade||null,assinatura:f.assinatura,obs:f.obs||null,status:'anexado'};
    let doc; const pend=t?docsDe(c.id,t.codigo).find(x=>['gerado','em_assinatura','pendente','dispensado'].includes(x.status)):null;
    if(pend){ doc=Object.assign(pend,await api.update('rh_documentos',pend.id,campos)); }
    else { doc=await api.insert('rh_documentos',{colaborador_id:c.id,tipo_codigo:t?.codigo||null,categoria,titulo,criado_por:S.user?.email||null,...campos}); S.docs.push(doc); }
    api.log('anexou documento',titulo,c.id); closeModal(); toast('Documento anexado.'); rerender(); return doc;
  }catch(e){ btn.disabled=false; btn.textContent='Anexar'; throw e; } };

/* ---------- saúde ---------- */
function tabSaude(c){
  const asos=S.docs.filter(d=>d.colaborador_id===c.id&&d.categoria==='saude').sort((a,b)=>(b.data_doc||'').localeCompare(a.data_doc||''));
  const af=S.afast.filter(a=>a.colaborador_id===c.id).sort((a,b)=>(b.inicio||'').localeCompare(a.inicio||''));
  const umAno=addDays(hojeISO(),-365); const dias12=af.filter(a=>a.inicio>=umAno&&/atestado/i.test(a.tipo)).reduce((s,a)=>s+Number(a.dias||0),0);
  const prox=proximoASO(c), u=ultimoASO(c);
  return `<div class="kpis"><div class="kpi gold"><div class="v">${u?fmtBR(u.data_doc):'—'}</div><div class="l">Último ASO${u?' · '+esc(tipoBy(u.tipo_codigo)?.nome||''):''}</div></div>
    <div class="kpi"><div class="v" style="color:${!prox?'var(--bad)':prox<hojeISO()?'var(--bad)':prox<=addDays(hojeISO(),30)?'var(--warn)':'var(--ok)'}">${prox?fmtBR(prox):'Sem ASO'}</div><div class="l">Próximo ASO periódico</div></div>
    <div class="kpi"><div class="v">${dias12}</div><div class="l">Dias de atestado em 12 meses</div></div><div class="kpi"><div class="v">${af.length}</div><div class="l">Registros de afastamento</div></div></div>
  <div class="card"><div class="card-head"><h3>Exames e documentos de saúde</h3>${can.edit?`<button class="btn btn-sm btn-dark" data-act="anexar" data-id="${c.id}" data-cod="aso_periodico">+ Anexar ASO</button>`:''}</div>
  ${asos.length?`<div class="tbl-wrap"><table><tr><th>Documento</th><th>Data</th><th>Validade</th><th>Status</th><th></th></tr>${asos.map(d=>`<tr><td>${esc(d.titulo)}</td><td>${fmtBR(d.data_doc)||'—'}</td><td>${fmtBR(d.validade)||'—'}</td><td>${chipSt(d.status)}</td><td class="right nowrap">${d.path?`<button class="btn btn-sm" data-act="verDoc" data-id="${d.id}">Ver</button>`:''}${can.edit?`<button class="btn btn-sm btn-ghost btn-danger" data-act="delDoc" data-id="${d.id}">Excluir</button>`:''}</td></tr>`).join('')}</table></div>`:'<div class="empty">Nenhum exame anexado.</div>'}</div>
  <div class="card"><div class="card-head"><h3>Atestados e afastamentos</h3>${can.edit?`<button class="btn btn-sm btn-dark" data-act="novoAfast" data-id="${c.id}">+ Lançar atestado / afastamento</button>`:''}</div>
  ${af.length?`<div class="tbl-wrap"><table><tr><th>Tipo</th><th>Início</th><th class="right">Dias</th><th>Retorno</th><th>CID informado</th><th>Obs.</th><th></th></tr>${af.map(a=>`<tr><td>${esc(a.tipo)}</td><td>${fmtBR(a.inicio)}</td><td class="right">${a.dias}</td><td>${fmtBR(addDays(a.inicio,Math.ceil(a.dias)))}</td><td>${a.cid_informado?'Sim':'Não'}</td><td class="small muted">${esc(a.obs||'')}</td><td class="right nowrap">${a.documento_id?`<button class="btn btn-sm" data-act="verDoc" data-id="${a.documento_id}">Ver</button>`:''}${can.edit?`<button class="btn btn-sm btn-ghost btn-danger" data-act="delReg" data-t="rh_afastamentos" data-id="${a.id}">Excluir</button>`:''}</td></tr>`).join('')}</table></div>`:'<div class="empty">Nenhum atestado ou afastamento lançado.</div>'}
  <p class="muted small">Afastamentos de 30 dias ou mais geram alerta de ASO de retorno. Os atestados lançados aqui são a mesma informação usada no fechamento da folha (assiduidade e cesta).</p></div>`;
}
ACT.novoAfast=d=>{ modal({titulo:'Lançar atestado / afastamento',corpo:`<form class="form" id="fAf" onsubmit="return false">
  <label class="full">Tipo<select name="tipo">${opts(['Atestado médico','Atestado odontológico','Declaração de horas','Afastamento INSS (auxílio-doença)','Acidente de trabalho','Licença-maternidade','Licença-paternidade','Licença (outras)'])}</select></label>
  <label>Início<input type="date" name="inicio" value="${hojeISO()}"></label><label>Dias (aceita fração, ex.: 0,5)<input name="dias" value="1" inputmode="decimal"></label>

  rodape:`<button class="btn" data-act="closeModal">Cancelar</button><button class="btn-gold" data-act="salvarAfast" data-id="${d.id}">Salvar</button>`}); };
ACT.salvarAfast=async(d,btn)=>{ const c=colabById(d.id),f=formData($('#fAf')); const dias=num(f.dias); if(!f.inicio||!dias) return toast('Informe início e dias.');
  btn.disabled=true; let docId=null;
  if(f.arquivo){ const path=await subirArquivo(c,'saude',f.arquivo);
    const doc=await api.insert('rh_documentos',{colaborador_id:c.id,tipo_codigo:'atestado',categoria:'saude',titulo:`${f.tipo} (${fmtBR(f.inicio)})`,path,arquivo_nome:f.arquivo.name,data_doc:f.inicio,status:'anexado',assinatura:'nao_se_aplica',criado_por:S.user?.email||null});
    S.docs.push(doc); docId=doc.id; }
  S.afast.push(await api.insert('rh_afastamentos',{colaborador_id:c.id,tipo:f.tipo,inicio:f.inicio,dias,cid_informado:f.cid_informado,obs:f.obs||null,documento_id:docId}));
  if(dias>15&&c.status==='ativo'&&f.inicio<=hojeISO()&&confirm('Afastamento acima de 15 dias. Mudar o status do colaborador para "Afastado"?')) Object.assign(c,await api.update('rh_colaboradores',c.id,{status:'afastado'}));
  api.log('lançou afastamento',f.tipo,c.id); closeModal(); toast('Lançamento salvo.'); rerender(); };

/* ---------- EPI e uniforme ---------- */

function tabEpi(c){

  <div class="card"><div class="card-head"><h3>Entregas e devoluções</h3><div class="actions">

/* =====================================================================
   KIT DEFESA TRABALHISTA
   - Itens "empresa": documentos padrão por empresa (mesmos para todos os kits)
   - Itens "colaborador": puxados do prontuário (ou anexados na hora)
   - Gera um PDF único com capa, índice, pendências e numeração de páginas
   ===================================================================== */
const KIT = { meta:{}, excl:{}, extras:{} };   // estado por colaborador (id → …)
const kitItensCfg = () => (S.cfg.kit?.itens?.length ? S.cfg.kit.itens : CONFIG_PADRAO.kit.itens);
const kitItens = () => kitItensCfg().filter(i=>i.ativo);
const slugTxt = s => norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'x';
const ymRot = ym => ym ? `${ym.slice(5,7)}/${ym.slice(0,4)}` : '';
const DESLIG_TIPOS = ['aso_demissional','trct','pedido_demissao','esocial_s2299','fgts_rescisorio'];

function docsEmpresa(emp,tipo){ return S.docsEmp.filter(d=>d.empresa===emp&&d.tipo===tipo)
  .sort((a,b)=>(a.data_doc||a.created_at||'').localeCompare(b.data_doc||b.created_at||'')); }
function mesesEntre(ini,fim){ const out=[]; if(!ini||!fim||ini>fim) return out;
  let [y,m]=ini.slice(0,7).split('-').map(Number); const [yf,mf]=fim.slice(0,7).split('-').map(Number);
  while(y<yf||(y===yf&&m<=mf)){ out.push(`${y}-${String(m).padStart(2,'0')}`); m++; if(m>12){m=1;y++;} if(out.length>240) break; }
  return out; }
function kitMeta(c){ if(!KIT.meta[c.id]) KIT.meta[c.id]={processo:'',vara:'',audiencia:'',ini:c.admissao||'',fim:c.demissao||hojeISO(),obs:''};
  if(!KIT.excl[c.id]) KIT.excl[c.id]=new Set(); if(!KIT.extras[c.id]) KIT.extras[c.id]=new Set(); return KIT.meta[c.id]; }

/* avalia um item do kit para o colaborador: arquivos encontrados, faltantes e avisos */
function avaliarItem(c,it,meta){
  if(it.origem==='empresa'){
    const fs=docsEmpresa(c.empresa,it.id), venc=fs.filter(f=>f.validade&&f.validade<hojeISO());
    return {arquivos:fs.map(f=>({titulo:f.titulo||it.nome,path:f.path,data:f.data_doc,nome:f.arquivo_nome,validade:f.validade})),
      falta:fs.length?[]:[`${it.nome} (${c.empresa||'empresa'})`],
      avisos:venc.length?[`${venc.length} arquivo(s) com validade vencida — atualize antes de protocolar`]:[]};
  }
  const tipos=it.tipos||[];
  let ds=S.docs.filter(d=>d.colaborador_id===c.id&&tipos.includes(d.tipo_codigo)&&d.status==='anexado');
  if(it.periodico&&(meta.ini||meta.fim)) ds=ds.filter(d=>!d.data_doc||((!meta.ini||d.data_doc>=meta.ini.slice(0,7)+'-01')&&(!meta.fim||d.data_doc<=meta.fim)));
  const comArq=ds.filter(d=>d.path).sort((a,b)=>(a.data_doc||'').localeCompare(b.data_doc||'')), semArq=ds.filter(d=>!d.path);
  const falta=[], avisos=[], ativo=c.status!=='desligado';
  if(it.todos){ tipos.forEach(t=>{ if(ativo&&DESLIG_TIPOS.includes(t)) return; if(!comArq.some(d=>d.tipo_codigo===t)) falta.push(tipoBy(t)?.nome||t); });
    if(ativo&&tipos.some(t=>DESLIG_TIPOS.includes(t))) avisos.push('Colaborador ainda ativo: documentos de desligamento não cobrados'); }
  else if(!comArq.length) falta.push(it.nome);
  if(semArq.length) avisos.push(`${semArq.length} registro(s) marcados como anexados, mas sem arquivo no sistema`);
  if(it.periodico&&comArq.length&&meta.ini&&meta.fim){ const cob=new Set(comArq.map(d=>(d.data_doc||'').slice(0,7)));
    const faltam=mesesEntre(meta.ini,meta.fim).filter(m=>!cob.has(m));
    if(faltam.length) avisos.push(`Meses sem arquivo: ${faltam.slice(0,8).map(ymRot).join(', ')}${faltam.length>8?` e mais ${faltam.length-8}`:''}`); }
  return {arquivos:comArq.map(d=>({titulo:d.titulo,path:d.path,data:d.data_doc,nome:d.arquivo_nome,docId:d.id,tipo:d.tipo_codigo})),falta,avisos};
}

/* ---------------------------------------------------------------- tela */
function viewKit(id){
  const c=id?colabById(id):null;
  const ordem=S.colabs.slice().sort((a,b)=>(a.status==='desligado'?0:1)-(b.status==='desligado'?0:1)||a.nome.localeCompare(b.nome));
  const head=`<div class="page-head"><div><h1>Kit Defesa Trabalhista</h1><p>Escolha o colaborador (reclamante). Os documentos da empresa entram em todos os kits; os demais vêm do prontuário.</p></div>
    <label class="small muted" style="min-width:280px">Colaborador<select data-chg="kitColab" style="margin-top:4px">${opts(ordem.map(x=>[x.id,`${x.nome}${x.status==='desligado'?' — desligado':''}`]),c?.id||'','— escolher —')}</select></label></div>`;
  return head+cardDocsEmpresa(c)+(c?kitColaborador(c):kitHistorico(null));
}
ACT.kitColab=(d,el)=>go(el.value?`#/kit/${el.value}`:'#/kit');

function cardDocsEmpresa(c){
  const itens=kitItens().filter(i=>i.origem==='empresa'); if(!itens.length) return '';
  const emps=(S.cfg.empresas||[]).filter(e=>!c||e.nome===c.empresa);
  let faltam=0;
  const blocos=emps.map(e=>{ const linhas=itens.map(it=>{ const fs=docsEmpresa(e.nome,it.id); if(!fs.length) faltam++;
      const venc=fs.some(f=>f.validade&&f.validade<hojeISO());
      return `<div class="doc-row"><div class="nm"><b>${esc(it.nome)}</b>
        <small>${fs.length?fs.map(f=>`<a href="#" data-act="verArq" data-path="${esc(f.path)}">${esc(f.titulo||f.arquivo_nome||'arquivo')}</a>${f.data_doc?' · '+fmtBR(f.data_doc):''}${f.validade?` · validade ${fmtBR(f.validade)}`:''}${can.edit?` <a href="#" class="btn-danger" data-act="delDocEmp" data-id="${f.id}" title="Excluir">✕</a>`:''}`).join('<br>'):'Nenhum arquivo'}</small></div>
        ${fs.length?(venc?'<span class="chip c-warn">Vencido</span>':`<span class="chip c-ok">${fs.length} arquivo(s)</span>`):'<span class="chip c-bad">Faltando</span>'}

}

function kitColaborador(c){

  const mapeados=new Set(kitItens().flatMap(i=>i.tipos||[]));
  const outros=S.docs.filter(d=>d.colaborador_id===c.id&&d.path&&!mapeados.has(d.tipo_codigo)).sort((a,b)=>(a.categoria||'').localeCompare(b.categoria||'')||(a.data_doc||'').localeCompare(b.data_doc||''));

    const st=!on?'<span class="chip c-mut">Fora do kit</span>':av.falta.length?(n?'<span class="chip c-warn">Incompleto</span>':'<span class="chip c-bad">Faltando</span>'):n?`<span class="chip c-ok">${n} arquivo(s)</span>`:'<span class="chip c-mut">Não cobrado</span>';
    const lista=n?(n<=3?av.arquivos.map(a=>arqLink(a)).join('<br>'):`<details><summary class="muted" style="cursor:pointer">${n} arquivos${av.arquivos[0].data?` (${fmtBR(av.arquivos[0].data)} a ${fmtBR(av.arquivos[n-1].data)})`:''}</summary>${av.arquivos.map(a=>arqLink(a)).join('<br>')}</details>`):'';
    const ops=[]; if(can.edit){ if(it.origem==='empresa') ops.push(`<button class="btn btn-sm" data-act="anexarEmp" data-emp="${esc(c.empresa)}" data-tipo="${it.id}">Anexar</button>`);
      else { ops.push(`<button class="btn btn-sm btn-dark" data-act="anexar" data-id="${c.id}" data-cod="${esc((it.tipos||[])[0]||'')}">Anexar</button>`);
        if(it.periodico) ops.push(`<button class="btn btn-sm" data-act="kitLote" data-id="${c.id}" data-item="${it.id}">Anexar vários</button>`); } }
    return `<div class="doc-row" style="${on?'':'opacity:.55'}"><input type="checkbox" ${on?'checked':''} data-chg="kitIncl" data-id="${c.id}" data-item="${it.id}" aria-label="Incluir no kit">
      <div class="nm"><b>${esc(it.nome)}</b> <span class="chip ${it.origem==='empresa'?'c-gold':'c-mut'}" style="font-size:10px">${it.origem==='empresa'?'Empresa':'Prontuário'}</span>
      <small>${lista}${av.falta.length&&on?`<span style="color:var(--bad)">Falta: ${esc(av.falta.join(', '))}</span>`:''}${av.avisos.length&&on?`<span style="color:var(--warn);display:block">${av.avisos.map(esc).join('<br>')}</span>`:''}</small></div>
      ${st}<div class="ops">${ops.join('')}</div></div>`; };
  return `<div class="grid2" style="grid-template-columns:1fr 2fr;margin-top:14px">
    <div class="card"><h3 style="margin-bottom:8px">Dados do processo</h3>
      <div class="form" style="grid-template-columns:1fr">
      <label>Reclamante<input value="${esc(c.nome)}" disabled></label>
      <label>Nº do processo<input data-chg="kitMeta" data-id="${c.id}" data-k="processo" value="${esc(meta.processo)}" placeholder="0000000-00.0000.5.02.0000"></label>
      <label>Vara / comarca<input data-chg="kitMeta" data-id="${c.id}" data-k="vara" value="${esc(meta.vara)}" placeholder="Ex.: 1ª Vara do Trabalho de Suzano"></label>
      <label>Data da audiência<input type="date" data-chg="kitMeta" data-id="${c.id}" data-k="audiencia" value="${esc(meta.audiencia)}"></label>
      <label>Período dos documentos (de)<input type="date" data-chg="kitMeta" data-id="${c.id}" data-k="ini" data-full="1" value="${esc(meta.ini)}"></label>
      <label>até<input type="date" data-chg="kitMeta" data-id="${c.id}" data-k="fim" data-full="1" value="${esc(meta.fim)}"></label>
      <label>Observações (saem na capa)<textarea data-chg="kitMeta" data-id="${c.id}" data-k="obs">${esc(meta.obs)}</textarea></label></div>
      <p class="muted small">O período filtra ponto, holerites, horas extras e FGTS e aponta os meses sem arquivo. Padrão: admissão até o desligamento.</p></div>

/* anexar vários arquivos mensais (holerites, ponto…) de uma vez */
let LOTE=null;
function mesDoNome(n){ const s=n.replace(/[^0-9]/g,' ');
  let m=n.match(/(20\d{2})[-_. ]?(0[1-9]|1[0-2])(?!\d)/); if(m) return `${m[1]}-${m[2]}`;
  m=n.match(/(0[1-9]|1[0-2])[-_. ]?(20\d{2})/); if(m) return `${m[2]}-${m[1]}`;
  const meses=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez']; const nn=norm(n);
  const i=meses.findIndex(x=>nn.includes(x)); const y=n.match(/20\d{2}/); if(i>=0&&y) return `${y[0]}-${String(i+1).padStart(2,'0')}`; return ''; }
ACT.kitLote=d=>{ const c=colabById(d.id), it=kitItensCfg().find(i=>i.id===d.item); LOTE={cid:c.id,tipos:it.tipos||[],arquivos:[]};
  modal({titulo:`Anexar vários — ${it.nome}`,wide:true,corpo:`<form class="form" id="fLote" onsubmit="return false">
    <label>Tipo de documento<select name="tipo">${opts((it.tipos||[]).map(t=>[t,tipoBy(t)?.nome||t]))}</select></label>
    <label>Primeira competência (se o nome do arquivo não tiver o mês)<input type="month" name="inicio" value="${(kitMeta(c).ini||hojeISO()).slice(0,7)}" data-chg="loteRecalc"></label>
    <label class="full">Arquivos (um por mês)<input type="file" multiple accept=".pdf,image/*" data-chg="loteArqs"></label></form>
    <div id="loteBox" class="muted small">Selecione os arquivos. O mês é lido do nome (ex.: holerite_2026-03.pdf, ponto 03-2026.pdf, março 2026.pdf); os demais seguem em sequência a partir da primeira competência.</div>`,
    rodape:`<button class="btn" data-act="closeModal">Cancelar</button><button class="btn-gold" data-act="loteSalvar" id="loteGo" disabled>Anexar todos</button>`}); };
function loteDesenhar(){ const ini=$('#fLote [name=inicio]').value||hojeISO().slice(0,7); let [y,m]=ini.split('-').map(Number);
  LOTE.arquivos.forEach(a=>{ if(!a.manual){ a.mes=mesDoNome(a.file.name)||`${y}-${String(m).padStart(2,'0')}`; if(!mesDoNome(a.file.name)){ m++; if(m>12){m=1;y++;} } } });

/* ---------------------------------------------------------------- geração do PDF */
ACT.kitGerar=async(d,btn)=>{
  const c=colabById(d.id), meta=kitMeta(c), excl=KIT.excl[c.id];
  const itens=kitItens().filter(it=>!excl.has(it.id)).map(it=>({it,av:avaliarItem(c,it,meta)}));
  const faltas=itens.flatMap(x=>x.av.falta.map(f=>({item:x.it.nome,doc:f})));
  if(faltas.length&&!d.forcar){ modal({titulo:'Documentos faltantes',corpo:`<p style="margin-top:0">A solicitação do kit tem <b>${faltas.length} pendência(s)</b>:</p>
      <ul style="margin:0 0 10px;padding-left:18px;line-height:1.7">${faltas.map(f=>`<li>${esc(f.doc)}</li>`).join('')}</ul>
      <div class="note">Você pode voltar e anexar, ou gerar mesmo assim: as pendências ficam listadas na capa do kit.</div>`,
    rodape:`<button class="btn" data-act="closeModal">Voltar e anexar</button><button class="btn-gold" data-act="kitGerar" data-id="${c.id}" data-forcar="1">Gerar mesmo assim</button>`}); return; }
  closeModal();
  if(typeof PDFLib==='undefined') return toast('A biblioteca de PDF não carregou. Verifique a internet e recarregue a página.');
  const b=$(`[data-act=kitGerar][data-id="${c.id}"]`); if(b){ b.disabled=true; b.textContent='Montando o kit…'; }
  try{
    const extras=S.docs.filter(x=>KIT.extras[c.id].has(x.id)&&x.path).map(x=>({titulo:x.titulo,path:x.path,data:x.data_doc,nome:x.arquivo_nome}));
    const r=await montarKitPDF(c,meta,itens,extras,faltas);
    const nome=`Kit_Defesa_${slugTxt(c.nome).replace(/-/g,'_')}_${hojeISO()}.pdf`;
    baixarArquivo(r.bytes,nome,'application/pdf');
    let path=null;
    if(can.edit){ try{ path=await api.upload(`kits/${c.id}/${Date.now()}_${nome}`,new File([r.bytes],nome,{type:'application/pdf'})); }
      catch(e){ toast('Kit baixado, mas não foi salvo no sistema: '+e.message); }
      S.kits.push(await api.insert('rh_kits',{colaborador_id:c.id,processo:meta.processo||null,vara:meta.vara||null,audiencia:meta.audiencia||null,
        periodo_ini:meta.ini||null,periodo_fim:meta.fim||null,itens:r.indice,faltantes:faltas,paginas:r.paginas,path,obs:meta.obs||null,criado_por:S.user?.email||null})); }
    api.log('gerou kit defesa',meta.processo||'sem nº de processo',c.id);
    toast(r.erros.length?`Kit gerado (${r.paginas} págs.), mas ${r.erros.length} arquivo(s) não puderam ser incluídos — veja a capa.`:`Kit gerado: ${r.paginas} páginas.`);
  }finally{ rerender(); }
};
function baixarArquivo(bytes,nome,tipo){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([bytes],{type:tipo}));
  a.download=nome; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },4000); }

/* WinAnsi (fontes padrão do PDF) não tem todos os caracteres */
const wa = s => String(s??'').normalize('NFC').replace(/≥/g,'>=').replace(/≤/g,'<=').replace(/[ ]/g,' ')
  .replace(/[^\x20-\x7E\xA1-\xFF–—‘’“”•…]/g,'');
function quebrar(txt,font,size,maxW){ const out=[]; String(txt).split('\n').forEach(par=>{ let l='';
  par.split(/\s+/).forEach(w=>{ const t=l?l+' '+w:w; if(font.widthOfTextAtSize(t,size)>maxW&&l){ out.push(l); l=w; } else l=t; }); out.push(l); }); return out; }

async function imagemParaPDF(blob){ // devolve {bytes,png:boolean}
  const tipo=(blob.type||'').toLowerCase();
  if((tipo==='image/jpeg'||tipo==='image/png')&&blob.size<1.5e6) return {bytes:new Uint8Array(await blob.arrayBuffer()),png:tipo==='image/png'};
  const bmp=await createImageBitmap(blob); const k=Math.min(1,2200/Math.max(bmp.width,bmp.height));
  const cv=document.createElement('canvas'); cv.width=Math.round(bmp.width*k); cv.height=Math.round(bmp.height*k);
  const g=cv.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,cv.width,cv.height); g.drawImage(bmp,0,0,cv.width,cv.height);
  const jb=await new Promise(ok=>cv.toBlob(ok,'image/jpeg',0.82)); return {bytes:new Uint8Array(await jb.arrayBuffer()),png:false};
}
async function anexarNoPDF(out,blob,a,F){
  const {PDFDocument,rgb}=PDFLib; const nome=(a.nome||a.path||'').toLowerCase(); const tipo=(blob.type||'').toLowerCase();
  if(tipo==='application/pdf'||nome.endsWith('.pdf')){
    const src=await PDFDocument.load(await blob.arrayBuffer(),{ignoreEncryption:true});
    const ps=await out.copyPages(src,src.getPageIndices()); ps.forEach(p=>out.addPage(p)); return ps.length; }
  if(tipo.startsWith('image/')||/\.(jpe?g|png|webp|gif|bmp)$/.test(nome)){
    const im=await imagemParaPDF(blob.type?blob:new Blob([blob],{type:nome.endsWith('.png')?'image/png':'image/jpeg'}));
    const img=im.png?await out.embedPng(im.bytes):await out.embedJpg(im.bytes);
    const W=595.28,H=841.89,mg=32,top=28; const p=out.addPage([W,H]);
    const sc=Math.min((W-2*mg)/img.width,(H-2*mg-top)/img.height); const w=img.width*sc,h=img.height*sc;
    p.drawText(wa(`${a.titulo||''}${a.data?' · '+fmtBR(a.data):''}`).slice(0,110),{x:mg,y:H-mg+4,size:8,font:F.font,color:rgb(.45,.43,.4)});
    p.drawImage(img,{x:(W-w)/2,y:H-mg-top-h+10,width:w,height:h}); return 1; }
  throw new Error('formato não suportado (use PDF, JPG ou PNG)');
}

async function montarKitPDF(c,meta,itens,extras,faltas){
  const {PDFDocument,StandardFonts,rgb}=PDFLib;
  const out=await PDFDocument.create(); const F={font:await out.embedFont(StandardFonts.Helvetica),bold:await out.embedFont(StandardFonts.HelveticaBold)};

  const grupos=itens.filter(x=>x.av.arquivos.length).map(x=>({nome:x.it.nome,origem:x.it.origem,arquivos:x.av.arquivos}));

  return {bytes:await out.save(),paginas:total,erros,indice};
}

/* =====================================================================
   RESCISÃO — solicitação para a contabilidade + cálculo das cestas
   Regras (editáveis em Parâmetros → Rescisão e cestas):
   • Cesta 1 (R$ 151,91): trabalhou do dia 1º ao dia 15 do mês sem falta
     injustificada. Paga no mês seguinte.
   • Cesta 2 / assiduidade (R$ 315,00): trabalhou o mês inteiro sem falta
     injustificada. 1 atestado → 240; 2 → 140; 3 ou mais → zero.
     Também zera com atrasos significativos registrados no ponto.
   • Na rescisão entram as cestas da competência anterior (ainda não pagas)
     e as da competência do último dia.
   ===================================================================== */
let RS=null, RS_TIMER=null;
const RC = () => S.cfg.rescisao || CONFIG_PADRAO.rescisao;
const ymOf = d => String(d||'').slice(0,7);
const ymPrev = ym => { let [y,m]=ym.split('-').map(Number); m--; if(!m){m=12;y--;} return `${y}-${String(m).padStart(2,'0')}`; };
const fimMes = ym => { const [y,m]=ym.split('-').map(Number); return `${ym}-${String(new Date(y,m,0).getDate()).padStart(2,'0')}`; };
const diaMes = (ym,d) => `${ym}-${String(d).padStart(2,'0')}`;
const fmtDM = d => d ? `${d.slice(8,10)}/${d.slice(5,7)}` : '';

/* ---------------------------------------------------------------- cálculo */
function calcCestas(rs,c){
  const R=RC(), ult=rs.ultimo_dia; if(!ult) return {linhas:[],total:0};
  const adm=c?.admissao||'1900-01-01', dados=rs.dados||{};
  const faltas=(dados.faltas||[]).map(f=>f.data).filter(Boolean).sort();
  const ates=(dados.atestados||[]).filter(a=>a.data);
  const atr=dados.atrasos||{}; const dMin=Number(R.cesta1.dia_minimo||15);
  const faixas=(R.cesta2.faixas||[315,240,140]).map(Number), zera=Number(R.cesta2.zera_a_partir||3);
  const linhas=[];
  for(const [ym,quando] of [[ymPrev(ymOf(ult)),'anterior'],[ymOf(ult),'atual']]){
    const ini=`${ym}-01`, d15=diaMes(ym,dMin), fim=fimMes(ym);
    const fM=faltas.filter(d=>d.startsWith(ym)), f15=fM.filter(d=>d<=d15), nA=ates.filter(a=>a.data.startsWith(ym)).length;
    const c1={valor:0,motivo:''}, c2={valor:0,motivo:''};
    if(adm>ini) c1.motivo='Admitido(a) depois do dia 1º';
    else if(ult<d15) c1.motivo=`Não trabalhou até o dia ${dMin}`;
    else if(f15.length) c1.motivo=`Falta injustificada em ${f15.map(fmtDM).join(', ')}`;
    else { c1.valor=Number(R.cesta1.valor); c1.motivo=`Dias 1 a ${dMin} sem falta injustificada`; }
    if(adm>ini) c2.motivo='Admitido(a) depois do dia 1º';
    else if(ult<fim) c2.motivo=`Mês incompleto (último dia ${fmtDM(ult)})`;
    else if(fM.length) c2.motivo=`Falta injustificada em ${fM.map(fmtDM).join(', ')}`;
    else if(atr[quando]&&atr.confirmado) c2.motivo='Zerada por atrasos significativos registrados no ponto';
    else if(nA>=zera) c2.motivo=`${nA} atestados no mês — zerada`;
    else { c2.valor=Number(faixas[nA]??0); c2.motivo=nA?`${nA} atestado(s) no mês — valor reduzido`:'Mês completo, sem faltas nem atestados'; }
    if(atr[quando]&&!atr.confirmado&&c2.valor) c2.alerta='Atrasos marcados, mas sem confirmação do registro no ponto: cesta mantida';
    const pago=quando==='anterior'&&!!dados.ant_pago;
    linhas.push({ym,rot:ymRot(ym),quando,c1,c2,pago,nA,faltas:fM});
  }
  const total=linhas.filter(l=>!l.pago).reduce((s,l)=>s+l.c1.valor+l.c2.valor,0);
  return {linhas,total};
}
function diasAvisoSugeridos(c,tipo,ult){
  const t=norm(tipo);
  if(!t||/justa causa$|^justa causa|experiencia|termino/.test(t)&&!/sem justa/.test(t)) return 0;
  if(/pedido/.test(t)) return 30;
  const anos=c?.admissao&&ult?Math.floor(diffDays(ult,c.admissao)/365.25):0;
  return Math.min(90,30+3*Math.max(0,anos));
}
function diasBeneficio(c,ult){ const dias=Number(S.cfg.beneficios?.dias_escala?.[c?.escala]||22); if(!ult) return dias;
  const d=Number(ult.slice(8,10)), tot=Number(fimMes(ymOf(ult)).slice(8,10)); return Math.round(dias*d/tot); }
function calcBeneficios(rs,c){ const b=rs.dados.beneficios||{}, dEst=diasBeneficio(c,rs.ultimo_dia), dMes=Number(S.cfg.beneficios?.dias_escala?.[c?.escala]||22);
  return ['vt','vr','va'].map(k=>{ const x=b[k]||{}; const dias=x.dias===''||x.dias==null?dEst:Number(x.dias);
    return {k,nome:{vt:'Vale-transporte (VT)',vr:'Vale-refeição (VR)',va:'Vale-alimentação (VA)'}[k],tem:!!x.tem,valor:Number(x.valor||0),dias,
      total:x.tem?Number(x.valor||0)*dias:0,creditado:!!x.creditado,naoUsados:x.tem&&x.creditado?Math.max(0,dMes-dias):0}; }); }
function calcAjustes(rs){ const extras=(RC().regras_extras||[]).map((r,i)=>({...r,i,on:rs.dados.regras?.[i]??!!r.auto}));
  const linhas=[...extras.filter(r=>r.on).map(r=>({desc:r.nome,valor:Number(r.valor||0),tipo:r.tipo})),...(rs.dados.ajustes||[]).filter(a=>a.desc||a.valor)];
  return {extras,linhas,total:linhas.reduce((s,a)=>s+(a.tipo==='desconto'?-1:1)*Number(a.valor||0),0)}; }

function prefillPeriodo(c,ult){ const de=`${ymPrev(ymOf(ult))}-01`;
  return {faltas:S.ocorr.filter(o=>o.colaborador_id===c.id&&/falta injust/i.test(o.tipo)&&o.data>=de&&o.data<=ult).map(o=>({data:o.data,obs:o.descricao||''})).sort((a,b)=>a.data.localeCompare(b.data)),
    atestados:S.afast.filter(a=>a.colaborador_id===c.id&&/atestado/i.test(a.tipo)&&a.inicio>=de&&a.inicio<=ult).map(a=>({data:a.inicio,dias:a.dias,tipo:a.tipo})).sort((a,b)=>a.data.localeCompare(b.data))}; }
async function rsCriar(c){
  const ult=hojeISO(), r=S.rem[c.id]||{}, pf=prefillPeriodo(c,ult);
  const tipo=/experi/i.test(c.tipo_contrato||'')&&c.admissao&&diffDays(ult,c.admissao)<90?'Período de experiência':'';
  const dados={aviso:{tipo:tipo?'Não se aplica':'',dias:null,inicio:'',obs:''},
    beneficios:{vt:{tem:r.vt!==false&&!!r.vt_dia,valor:r.vt_dia||0,dias:null,creditado:false},vr:{tem:r.vr!==false&&!!r.vr_dia,valor:r.vr_dia||0,dias:null,creditado:false},va:{tem:!!r.va,valor:r.va_dia||0,dias:null,creditado:false}},
    faltas:pf.faltas,atestados:pf.atestados,atrasos:{anterior:false,atual:false,confirmado:false,descricao:''},ant_pago:false,regras:{},ajustes:[],obs:'',desligar:true};
  const rec=await api.insert('rh_rescisoes',{colaborador_id:c.id,ultimo_dia:ult,tipo,dados,status:'rascunho',criado_por:S.user?.email||null});
  S.resc.push(rec); api.log('iniciou rescisão','',c.id); go(`#/rescisao/${rec.id}`);
}

const num2 = v => Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function resumoRescisao(c){

  <table>${ben.map(b=>`<tr><td>${b.nome}</td><td class="right small">${b.tem?`${b.dias} dia(s) × ${moneyBR(b.valor)}${b.naoUsados?`<div style="color:var(--warn)">descontar ${b.naoUsados} dia(s) não usados</div>`:''}`:'<span class="muted">não possui</span>'}</td></tr>`).join('')}</table>
  ${aj.linhas.length?`<h3 style="margin:16px 0 6px">Ajustes</h3><table>${aj.linhas.map(a=>`<tr><td>${esc(a.desc)}</td><td class="right">${a.tipo==='desconto'?'− ':''}${moneyBR(a.valor)}</td></tr>`).join('')}</table>`:''}

function setPath(o,path,v){ const ks=path.split('.'); let x=o; ks.slice(0,-1).forEach((k,i)=>{ if(x[k]==null) x[k]=/^\d+$/.test(ks[i+1])?[]:{}; x=x[k]; }); x[ks[ks.length-1]]=v; }
function rsValor(el){ if(el.type==='checkbox') return el.checked; if(el.type==='number') return el.value===''?null:Number(el.value); return el.value; }
document.addEventListener('input',e=>{ const el=e.target.closest('[data-rs]'); if(!el||!RS||el.type==='checkbox'||el.tagName==='SELECT'||el.type==='date') return;
  setPath(RS,el.dataset.rs,rsValor(el)); const c=colabById(RS.colaborador_id); const box=$('#rsResumo'); if(box&&c) box.innerHTML=resumoRescisao(c); rsAgendar(); });
document.addEventListener('change',e=>{ const el=e.target.closest('[data-rs]'); if(!el||!RS) return;
  setPath(RS,el.dataset.rs,rsValor(el));
  if(el.dataset.rs==='tipo'&&/experi|termino|justa causa/i.test(el.value)&&!/sem justa/i.test(el.value)&&!RS.dados.aviso?.tipo) RS.dados.aviso.tipo='Não se aplica';

  rsAgendar(); });
function rsAgendar(){ if(!can.edit||RS?.status==='enviada') return; clearTimeout(RS_TIMER); RS_TIMER=setTimeout(rsSalvar,700); }
async function rsSalvar(){ if(!RS) return; const up=await api.update('rh_rescisoes',RS.id,{ultimo_dia:RS.ultimo_dia||null,tipo:RS.tipo||null,dados:RS.dados});

ACT.pacotePosto=()=>{ const p=postoById($('#selPosto').value); if(!p) return toast('Escolha o posto.');
  const cs=S.colabs.filter(c=>c.posto_id===p.id&&c.status!=='desligado'); if(!cs.length) return toast('Nenhum colaborador ativo neste posto.');
  const linhas=cs.map(c=>{ const u=ultimoASO(c), epi=statusTipo(c,tipoBy('ficha_epi')||{codigo:'ficha_epi'}).st, tr=S.treinos.filter(t=>t.colaborador_id===c.id).map(t=>t.curso);
    return `<tr><td>${esc(c.nome)}</td><td>${esc(c.funcao||'')}</td><td>${esc([c.escala,c.turno].filter(Boolean).join(' · '))}</td><td>${fmtBR(c.admissao)}</td><td>${u?fmtBR(u.data_doc)+' — apto':'Pendente'}</td><td>${epi==='ok'?'Assinada':'Pendente'}</td><td style="font-size:8pt">${esc(tr.join('; ')||'—')}</td></tr>`; }).join('');
  const emp=empresaDe(cs[0]);
  const corpo={nome:`Relação de colaboradores — ${p.nome}`,render:()=>`<table class="id"><tr><td><small>Posto</small><b>${esc(p.nome)}</b></td><td><small>Competência</small><b>${new Date().toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</b></td></tr>${p.endereco?`<tr><td colspan="2"><small>Endereço</small>${esc(p.endereco)}</td></tr>`:''}</table>
    <table class="grid"><tr><th>Colaborador(a)</th><th>Função</th><th>Escala</th><th>Admissão</th><th>Último ASO</th><th>Ficha EPI</th><th>Treinamentos</th></tr>${linhas}</table>
    <p class="decl">Declaramos que os colaboradores acima estão registrados, com exames ocupacionais e entrega de EPI conforme as Normas Regulamentadoras. As guias de INSS e FGTS do mês seguem anexas à nota fiscal.</p>${assin(['Responsável pela empresa'])}`};
  MODELOS.__pacote=corpo; abrirImpressao([paginaA4({c:null,emp,cfg:S.cfg,blank:false},'__pacote')],`Pacote ${p.nome}`); delete MODELOS.__pacote;
  api.log('gerou pacote do posto',p.nome); };

  await api.remove('rh_doc_tipos',t.id); S.tipos=S.tipos.filter(x=>x.id!==t.id); closeModal(); toast('Excluído.'); rerender(); };

ACT.salvarListas=async(d,btn)=>{
  const L={...S.cfg.listas}; $$('#fList [data-lista]').forEach(el=>{ L[el.dataset.lista]=el.value.split('\n').map(s=>s.trim()).filter(Boolean); });
  const dias={...(S.cfg.beneficios?.dias_escala||{})}; $$('#fList .bDias').forEach(el=>{ if(el.value) dias[el.dataset.e]=Number(el.value); });
  btn.disabled=true;
  await saveCfg('listas',L);
  await saveCfg('beneficios',{...S.cfg.beneficios,coparticipacao_vt:Number($('#bVt').value||6),dias_escala:dias});
  await saveCfg('assinatura',{autentique_url:$('#aUrl').value.trim(),cidade:$('#aCid').value.trim()||'Suzano'});
  await saveCfg('canal_denuncia_url',$('#aDen').value.trim()); await saveCfg('alertas',{dias_aviso:Number($('#aDias').value||30)});
  const lf=$('#aLogo').files[0]; if(lf){ await saveCfg('logo',await reduzirImagem(lf,360)); aplicarLogo(); }
  toast('Parâmetros salvos.'); rerender(); };
ACT.tirarLogo=async()=>{ await saveCfg('logo',''); aplicarLogo(); rerender(); };
function reduzirImagem(file,max){ return new Promise((ok,ko)=>{ if(file.type==='image/svg+xml'){ const r=new FileReader(); r.onload=()=>ok(r.result); r.onerror=ko; r.readAsDataURL(file); return; }
  const img=new Image(); img.onload=()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)); const cv=document.createElement('canvas'); cv.width=Math.round(img.width*k); cv.height=Math.round(img.height*k);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); ok(cv.toDataURL('image/png')); URL.revokeObjectURL(img.src); }; img.onerror=ko; img.src=URL.createObjectURL(file); }); }

/* usuários */
let USERS=[];
function parUsuarios(){
  if(DEMO) return `<div class="card"><h3>Simular perfil (demonstração)</h3><p class="muted small">No modo demonstração não há login. Troque o perfil para ver o que cada pessoa enxerga.</p>
    <select data-chg="demoPapel" style="width:auto">${opts([['admin','Admin'],['dp','DP / RH'],['diretoria','Diretoria (leitura)'],['supervisor','Supervisor (sem saúde e salário)']],S.papel)}</select></div>`;
  setTimeout(carregarUsuarios,0);
  return `<div class="card"><h3 style="margin-bottom:8px">Conceder acesso</h3><p class="muted small" style="margin-top:0">A pessoa precisa já ter login no Portal C&amp;S (mesmo e-mail e senha).</p>
  <div class="form"><label>E-mail<input id="uEmail" type="email"></label><label>Nome<input id="uNome"></label>
  <label>Perfil<select id="uPapel">${opts([['dp','DP / RH — edita tudo'],['diretoria','Diretoria — lê tudo'],['supervisor','Supervisor — sem saúde, folha e salário'],['admin','Admin — tudo + usuários']],'dp')}</select></label>
  <div style="align-self:end"><button class="btn-gold" data-act="concederAcesso">Conceder</button></div></div></div>
  <div class="card"><h3 style="margin-bottom:8px">Quem tem acesso</h3><div id="uLista" class="muted">Carregando…</div></div>`;
}
async function carregarUsuarios(){ const box=$('#uLista'); if(!box) return;
  const {data,error}=await sb.from('rh_acessos').select('*').order('nome'); if(error){ box.textContent=error.message; return; } USERS=data;
  box.innerHTML=`<div class="tbl-wrap"><table><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Ativo</th></tr>${data.map(u=>`<tr><td>${esc(u.nome||'—')}</td><td>${esc(u.email||'')}</td>
  <td><select data-chg="papelUser" data-id="${u.user_id}" style="width:auto">${opts([['admin','Admin'],['dp','DP / RH'],['diretoria','Diretoria'],['supervisor','Supervisor']],u.papel)}</select></td>
  <td><input type="checkbox" ${u.ativo?'checked':''} data-chg="ativoUser" data-id="${u.user_id}" ${u.user_id===S.user.id?'disabled':''}></td></tr>`).join('')}</table></div>`; }
ACT.concederAcesso=async()=>{ const e=$('#uEmail').value.trim(); if(!e) return toast('Informe o e-mail.');

function mostrarApp(){
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');

function loginMsg(t){ $('#loginErr').textContent=t||''; }

async function aposLogin(user){
  S.user=user;
  const {data,error}=await sb.from('rh_acessos').select('*').eq('user_id',user.id).maybeSingle();
  if(error||!data||!data.ativo){
    loginMsg(error?('Erro: '+error.message):'Seu usuário ainda não tem acesso ao Prontuário. Peça ao administrador para liberar o seu e-mail.');
    $('#btnSair2').classList.remove('hidden'); return; }
  S.papel=data.papel; $('#loginBtn').textContent='Carregando…';
  await loadAll(); mostrarApp();
}

async function iniciar(){
  $('#loginEmblem').innerHTML=`<img src="${LOGO_OFICIAL}" alt="C&amp;S Soluções em Serviços Terceirizados">`;
  const fav=document.createElement('link'); fav.rel='icon'; fav.href=EMBLEMA_OFICIAL; document.head.appendChild(fav);
  if(DEMO){
    if(!DemoStore.get()) DemoStore.set(seedDemo());
    S.user={email:'demonstracao'}; S.papel='admin';
    await loadAll(); mostrarApp(); return;
  }
  if(typeof supabase==='undefined'){ loginMsg('Não foi possível carregar a biblioteca do Supabase. Verifique a internet.'); return; }
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,storageKey:'cs-prontuario-auth'}});
  sb.auth.onAuthStateChange(async(ev)=>{ if(ev==='PASSWORD_RECOVERY'){ const p=prompt('Digite a nova senha (mínimo 8 caracteres):');
    if(p&&p.length>=8){ const {error}=await sb.auth.updateUser({password:p}); alert(error?error.message:'Senha alterada.'); } } });
  const {data:{session}}=await sb.auth.getSession();
  if(session?.user) await aposLogin(session.user).catch(e=>loginMsg(e.message));
}

ACT.entrar=async()=>{
  const email=$('#lgEmail').value.trim(), senha=$('#lgSenha').value; if(!email||!senha) return loginMsg('Informe e-mail e senha.');
  loginMsg(''); const b=$('#loginBtn'); b.disabled=true; b.textContent='Entrando…';
  try{ const {data,error}=await sb.auth.signInWithPassword({email,password:senha});
    if(error) throw new Error(/invalid/i.test(error.message)?'E-mail ou senha incorretos.':error.message);
    await aposLogin(data.user);
  }catch(e){ loginMsg(e.message); } finally{ b.disabled=false; if(!S.cfg||$('#app').classList.contains('hidden')) b.textContent='Entrar'; }
};
ACT.esqueci=async()=>{ const email=$('#lgEmail').value.trim(); if(!email) return loginMsg('Digite seu e-mail acima e clique de novo.');
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname}); loginMsg(error?error.message:'Enviamos um link de redefinição para o seu e-mail.'); };
ACT.sair=async()=>{ if(DEMO){ if(confirm('Apagar os dados de demonstração e recomeçar?')){ localStorage.removeItem(DemoStore.key); location.reload(); } return; }
  await sb.auth.signOut(); location.hash=''; location.reload(); };
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&['lgEmail','lgSenha'].includes(e.target.id)) ACT.entrar(); });
