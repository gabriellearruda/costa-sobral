<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Portal do Colaborador · C&amp;S</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>:root{
  --ink:#0d0d0d;--ink-2:#141311;--ink-3:#1e1c19;
  --gold:#c79a3b;--gold-hi:#e8c675;--gold-deep:#8a6a22;
  --silver:#c7c7c7;--cream:#f3f0e9;--cream-2:#ebe6db;
  --paper:#ffffff;--line:#ddd6c8;--muted:#7a7469;--text:#1d1b18;
  --ok:#2f7d4f;--ok-bg:#e4f2e8;--warn:#a86b00;--warn-bg:#fbf0d9;
  --bad:#b03a2e;--bad-bg:#f8e3e0;--info:#2c5d8a;--info-bg:#e2ecf6;
  --grad:linear-gradient(135deg,var(--gold-deep),var(--gold) 45%,var(--gold-hi) 70%,var(--gold) 100%);
  --r:10px;--shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Montserrat',system-ui,sans-serif;font-size:14px;color:var(--text);background:var(--cream);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;margin:0;letter-spacing:.2px}
h1{font-size:30px}h2{font-size:24px}h3{font-size:19px}
a{color:var(--gold-deep)}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- login ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#1d1a15,var(--ink) 70%);padding:24px}
.login-card{width:100%;max-width:380px;background:var(--ink-2);border:1px solid #2b2722;border-radius:16px;padding:34px 28px;color:var(--cream);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.login-card h1{color:var(--cream);font-size:28px;margin:14px 0 4px}
.login-card p{color:#a59e92;font-size:12.5px;margin:0 0 22px;letter-spacing:.4px}
.login-card input{width:100%;margin-bottom:10px;background:#0f0e0c;border:1px solid #3a352d;color:var(--cream);border-radius:8px;padding:12px}
.login-card input:focus{outline:none;border-color:var(--gold)}
.login-card .btn-gold{width:100%;margin-top:6px}
.login-card .link{background:none;border:0;color:var(--gold);margin-top:14px;cursor:pointer;font-size:12.5px;text-decoration:underline}
.login-err{color:#e6857a;font-size:12.5px;min-height:18px;margin-top:8px}
.emblem{width:100%;max-width:290px;margin:0 auto 6px;display:block}
.emblem img{width:100%;height:auto;display:block}

/* ---------- shell ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--ink);color:var(--cream);display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid #2a2620}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img,.brand svg{width:40px;height:36px;object-fit:contain;flex:none}
.brand b{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;white-space:nowrap}
.brand small{display:block;font-size:10.5px;color:var(--gold);letter-spacing:1.6px;text-transform:uppercase}
.nav{display:flex;gap:4px;margin-left:12px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{background:none;border:0;color:#bdb5a7;padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;font-size:13px;font-weight:500}
.nav button:hover{color:var(--cream);background:#1c1915}
.nav button.on{color:var(--ink);background:var(--grad);font-weight:600}
.userbox{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:#bdb5a7;white-space:nowrap}
.userbox .tag{border:1px solid var(--gold);color:var(--gold);border-radius:20px;padding:2px 9px;font-size:10.5px;text-transform:uppercase;letter-spacing:1px}
.userbox button{background:none;border:1px solid #3a352d;color:#bdb5a7;border-radius:7px;padding:5px 9px;cursor:pointer}
.demo-bar{background:var(--warn-bg);color:var(--warn);text-align:center;font-size:12px;padding:6px 12px;border-bottom:1px solid #eedcb3}
main{max-width:1240px;margin:0 auto;padding:22px 18px 80px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 13px;cursor:pointer;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn-gold{background:var(--grad);border:0;color:var(--ink);font-weight:600;border-radius:8px;padding:10px 16px;cursor:pointer}
.btn-dark{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.btn-dark:hover{border-color:var(--gold)}
.btn-sm{padding:5px 9px;font-size:12px;border-radius:7px}
.btn-ghost{background:none;border-color:transparent}
.btn-danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- cards / kpis ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card+.card{margin-top:14px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);cursor:default}
.kpi .v{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:600;line-height:1}
.kpi .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}
.kpi.gold{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.kpi.gold .v{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi.gold .l{color:#a59e92}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:600;background:#faf8f3;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #eee8dc;vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:#fbf8f1}
.muted{color:var(--muted)}
.small{font-size:12px}
.right{text-align:right}
.nowrap{white-space:nowrap}

/* ---------- chips / progress ---------- */
.chip{display:inline-block;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:600;white-space:nowrap}
.c-ok{background:var(--ok-bg);color:var(--ok)}
.c-warn{background:var(--warn-bg);color:var(--warn)}
.c-bad{background:var(--bad-bg);color:var(--bad)}
.c-info{background:var(--info-bg);color:var(--info)}
.c-mut{background:#eee9df;color:var(--muted)}
.c-gold{background:#f4e9cf;color:var(--gold-deep)}
.prog{height:7px;background:#eee8dc;border-radius:9px;overflow:hidden;min-width:70px}
.prog i{display:block;height:100%;background:var(--grad)}
.prog.low i{background:var(--bad)}
.prog-row{display:flex;align-items:center;gap:8px}
.prog-row span{font-size:11.5px;color:var(--muted);min-width:34px;text-align:right}

/* ---------- forms ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select{min-width:150px}
input,select,textarea{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px;font-size:13px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(199,154,59,.15)}
input[type=checkbox]{width:auto;accent-color:var(--gold-deep);transform:scale(1.15)}
textarea{min-height:70px;resize:vertical}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 14px}
.form label{display:block;font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.3px}
.form label>input,.form label>select,.form label>textarea{margin-top:4px}
.form .full{grid-column:1/-1}
.form-sec{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;grid-column:1/-1;margin-top:8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
fieldset[disabled] input,fieldset[disabled] select,fieldset[disabled] textarea{background:#f7f5f0}
fieldset{border:0;padding:0;margin:0;min-width:0}

/* ---------- ficha ---------- */
.ficha-head{background:var(--ink);color:var(--cream);border-radius:14px;padding:18px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px;border:1px solid #2a2620}
.avatar{width:58px;height:58px;border-radius:50%;background:var(--grad);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:700;flex:none}
.ficha-head h2{color:var(--cream);font-size:26px}
.ficha-meta{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12.5px;color:#bdb5a7;margin-top:4px}
.ficha-meta b{color:var(--gold);font-weight:600}
.ficha-head .prog{background:#2a2620;width:150px}
.ficha-side{margin-left:auto;text-align:right;min-width:170px}
.ficha-side .chip{margin-bottom:6px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 13px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap;font-size:13px}
.tabs button.on{color:var(--text);border-bottom-color:var(--gold);font-weight:600}
.cat-block{margin-bottom:16px}
.cat-title{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cat-title h3{font-size:18px}
.doc-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--paper);margin-bottom:6px;flex-wrap:wrap}
.doc-row .nm{flex:1;min-width:180px}
.doc-row .nm b{font-weight:600;font-size:13px}
.doc-row .nm small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.doc-row .ops{display:flex;gap:5px;flex-wrap:wrap}
.req{color:var(--gold-deep);font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-left:6px}
.timeline{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.tl-item{position:relative;margin-bottom:12px}
.tl-item:before{content:'';position:absolute;left:-22px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--gold);border:2px solid var(--cream)}
.tl-item small{color:var(--muted)}
.alert-row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #eee8dc;cursor:pointer}
.alert-row:last-child{border-bottom:0}
.alert-row .who{font-weight:600}
.alert-row .what{color:var(--muted);font-size:12.5px}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:13px}

/* ---------- modal / toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(13,13,13,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow-y:auto}
.modal{background:var(--paper);border-radius:14px;width:100%;max-width:640px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal.wide{max-width:920px}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h button{background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted)}
.modal-b{padding:18px 20px}
.modal-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:10px 18px;border-radius:9px;font-size:13px;z-index:80;border:1px solid var(--gold);opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.tpl{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--paper);display:flex;flex-direction:column;gap:8px}
.tpl b{font-size:13.5px}
.tpl small{color:var(--muted);font-size:11.5px;flex:1}
.tpl .ops{display:flex;gap:6px}
.note{background:#faf6ec;border:1px solid #efe3c4;border-radius:9px;padding:10px 12px;font-size:12.5px;color:#6b5a33}
@media(max-width:700px){
  .topbar{flex-wrap:wrap;padding:10px 12px}
  .nav{order:3;width:100%;margin-left:0}
  .userbox .nm{display:none}
  main{padding:16px 12px 70px}
  .ficha-side{margin-left:0;text-align:left;flex-basis:100%}
  .ficha-side .prog{margin-left:0!important}
  .ficha-head h2{font-size:22px}
  .avatar{width:46px;height:46px;font-size:19px}
  h1{font-size:25px}
}

details.outros{margin:4px 0 0}
details.outros summary{cursor:pointer;font-size:12.5px;color:var(--muted);padding:6px 2px;font-weight:600;list-style:none}
details.outros summary::-webkit-details-marker{display:none}
details.outros summary:before{content:'+ ';color:var(--gold-deep)}
details.outros[open] summary:before{content:'− '}
.ficha-acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}
.ficha-acts .btn{background:#1c1915;color:var(--cream);border-color:#3a352d;text-decoration:none}
.ficha-acts .btn:hover{border-color:var(--gold)}
.rs-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:14px;align-items:start}
.rs-side{position:sticky;top:72px}
.rs-line{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.rs-line>input,.rs-line>select{flex:1;min-width:120px;width:auto}
details.card>summary::-webkit-details-marker{display:none}
@media(max-width:860px){.rs-grid{grid-template-columns:1fr}.rs-side{position:static}}
@media(max-width:700px){.ficha-acts{justify-content:flex-start}}
</style>
</head>

   Cada modelo recebe ctx = {c, rem, emp, posto, cfg, blank, entregas,
   treino, extra, catalogo} e devolve o HTML do corpo.

const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmtBR = d => { if(!d) return ''; const [y,m,dd]=String(d).slice(0,10).split('-'); return dd&&m&&y?`${dd}/${m}/${y}`:String(d); };
const moneyBR = v => (v==null||v==='')?'':Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const hojeISO = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const dataExtenso = iso => { const d=iso?new Date(iso+'T12:00:00'):new Date();
  const m=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  return `${d.getDate()} de ${m[d.getMonth()]} de ${d.getFullYear()}`; };

/* campo: valor preenchido ou linha em branco */
function F(ctx, v, w=160){ if(!ctx.blank && v!=null && String(v).trim()!=='') return `<b class="fill">${esc(v)}</b>`;
  return `<span class="blank" style="min-width:${w}px"></span>`; }
function linhas(n){ return Array.from({length:n},()=>'<div class="ln"></div>').join(''); }
function assin(rotulos){ return `<div class="sigs">${rotulos.map(r=>`<div class="sig"><div class="sl"></div>${r}</div>`).join('')}</div>`; }
function localData(ctx){ const cid=ctx.cfg.assinatura?.cidade||'Suzano';
  return ctx.blank?`<p class="ld">${esc(cid)}, ____ de ________________ de ______.</p>`:`<p class="ld">${esc(cid)}, ${dataExtenso(hojeISO())}.</p>`; }
function idColab(ctx){ const c=ctx.c||{};
  return `<table class="id"><tr><td><small>Colaborador(a)</small>${F(ctx,c.nome,260)}</td><td><small>CPF</small>${F(ctx,c.cpf,120)}</td></tr>
  <tr><td><small>Função</small>${F(ctx,c.funcao,200)}</td><td><small>Admissão</small>${F(ctx,fmtBR(c.admissao),100)}</td></tr>
  <tr><td><small>Posto / local</small>${F(ctx,ctx.posto?.nome,200)}</td><td><small>Escala</small>${F(ctx,c.escala,100)}</td></tr></table>`; }

    return `${idColab(ctx)}<p><b>${esc(empNome(ctx))}</b>, CNPJ ${esc(empCNPJ(ctx))}, e o(a) colaborador(a) acima identificado(a) ajustam, por acordo individual escrito, nos termos do art. 59-A da CLT e da convenção coletiva da categoria, o regime de trabalho de <b>12 (doze) horas de trabalho seguidas por 36 (trinta e seis) horas ininterruptas de descanso</b>.</p>
    <ol class="cl"><li>Horário de trabalho: ${F(ctx,c.horario,160)}, turno ${F(ctx,c.turno,90)}.</li>
    <li>O intervalo para repouso e alimentação será observado ou indenizado conforme a convenção coletiva vigente.</li>
    <li>A remuneração mensal pactuada abrange o descanso semanal remunerado e os descansos em feriados, observado o que dispuser a convenção coletiva quanto a feriados trabalhados.</li>
    <li>O presente acordo pode ser revisto por qualquer das partes, mediante comunicação prévia, retornando-se à jornada contratual ordinária.</li></ol>
    ${localData(ctx)}${assin(['EMPREGADORA','EMPREGADO(A)'])}`;}},

  vale_transporte:{nome:'Opção ou recusa do vale-transporte',cat:'contrato',desc:'Declaração do trajeto e opção pelo benefício (Lei 7.418/85).',
    render:ctx=>{const c=ctx.c||{},rm=ctx.rem||{};const op=ctx.blank?null:rm.vt;
    return `${idColab(ctx)}<p><b>Endereço residencial:</b> ${F(ctx,[c.endereco,c.bairro,c.cidade].filter(Boolean).join(', '),380)}</p>
    <p class="opt">${op===true?'☒':'☐'} <b>OPTO</b> pela utilização do vale-transporte, autorizando o desconto de até ${ctx.cfg.beneficios?.coparticipacao_vt||6}% do meu salário-base.</p>
    <table class="grid"><tr><th>Trajeto</th><th>Meio (ônibus, trem, metrô)</th><th>Linha / empresa</th><th>Valor por viagem</th></tr>
    <tr><td>Casa → trabalho</td><td></td><td></td><td></td></tr><tr><td>Casa → trabalho</td><td></td><td></td><td></td></tr>
    <tr><td>Trabalho → casa</td><td></td><td></td><td></td></tr><tr><td>Trabalho → casa</td><td></td><td></td><td></td></tr></table>
    <p class="opt">${op===false?'☒':'☐'} <b>NÃO OPTO</b> pela utilização do vale-transporte, por não necessitar do benefício.</p>
    <p class="decl">Comprometo-me a atualizar estas informações sempre que mudar de endereço ou de trajeto e declaro estar ciente de que a declaração falsa ou o uso indevido do vale-transporte constitui falta grave.</p>
    ${localData(ctx)}${assin(['Assinatura do(a) colaborador(a)'])}`;}},

  dependentes_ir:{nome:'Declaração de dependentes para IR',cat:'contrato',desc:'Dependentes para dedução do IRRF na folha.',
    render:ctx=>`${idColab(ctx)}<p>Declaro, para fins de dedução do Imposto de Renda Retido na Fonte, que possuo os dependentes abaixo:</p>
    <table class="grid"><tr><th>Nome completo</th><th>Parentesco</th><th>Nascimento</th><th>CPF</th></tr>${'<tr><td></td><td></td><td></td><td></td></tr>'.repeat(6)}</table>
    <p class="opt">☐ Declaro que <b>não possuo</b> dependentes para fins de Imposto de Renda.</p>
    <p class="decl">Declaro que as informações são verdadeiras, assumindo a responsabilidade por elas, e que comunicarei qualquer alteração.</p>
    ${localData(ctx)}${assin(['Assinatura do(a) colaborador(a)'])}`},

  termo_lgpd:{nome:'Termo de ciência LGPD',cat:'contrato',desc:'Informa a finalidade do tratamento dos dados do colaborador.',
    render:ctx=>`${idColab(ctx)}<p>Declaro estar ciente de que <b>${esc(empNome(ctx))}</b>, CNPJ ${esc(empCNPJ(ctx))}, trata meus dados pessoais, nos termos da Lei 13.709/2018 (LGPD), para as seguintes finalidades:</p>
    <ol class="cl"><li>Execução do contrato de trabalho e cumprimento de obrigações legais e regulatórias (art. 7º, II e V), como registro no eSocial, folha de pagamento, FGTS, INSS, férias e rescisão.</li>
    <li>Saúde e segurança do trabalho, incluindo exames ocupacionais e atestados, tratados como dados sensíveis para cumprimento de obrigação legal (art. 11, II, "a").</li>
    <li>Concessão de benefícios (vale-transporte, vale-refeição, cesta e outros).</li>
    <li>Gestão da prestação de serviços nos postos, incluindo a comprovação de regularidade trabalhista exigida pelos clientes tomadores de serviço.</li></ol>
    <p>Os dados poderão ser compartilhados apenas com: contabilidade, órgãos públicos (eSocial, Receita Federal, Caixa, INSS), clínica de medicina e segurança do trabalho, operadoras de benefícios, instituição bancária e clientes tomadores, no limite do necessário. Os documentos serão guardados pelos prazos legais e eliminados após o seu término.</p>
    <p>Posso, a qualquer tempo, solicitar acesso, correção e informações sobre o uso dos meus dados (art. 18) junto ao Departamento Pessoal.</p>
    ${localData(ctx)}${assin(['Assinatura do(a) colaborador(a)'])}`},

  termo_regulamento:{nome:'Ciência do regulamento, conduta e canal de denúncia',cat:'contrato',desc:'Regulamento interno, código de conduta, POPs e canal de escuta.',
    render:ctx=>`${idColab(ctx)}<p>Declaro que recebi, li e compreendi os documentos abaixo, comprometendo-me a cumpri-los:</p>
    <p class="opt">☐ Regulamento interno da empresa<br>☐ Código de conduta e política contra assédio e discriminação<br>☐ Procedimentos operacionais (POPs) do posto de trabalho<br>☐ Normas de saúde e segurança e uso obrigatório de EPI<br>☐ Canal de escuta e denúncia confidencial${ctx.cfg.canal_denuncia_url?` (${esc(ctx.cfg.canal_denuncia_url)})`:''}, com garantia de não retaliação</p>
    <p class="decl">Estou ciente de que o descumprimento das normas pode resultar nas medidas disciplinares previstas em lei.</p>
    ${localData(ctx)}${assin(['Assinatura do(a) colaborador(a)'])}`},

  ordem_servico:{nome:'Ordem de serviço de SST',cat:'contrato',desc:'Riscos da função e medidas de proteção (NR-1). Preencher com base no PGR.',
    render:ctx=>`${idColab(ctx)}
    <h4>1. Riscos da atividade (conforme o PGR)</h4>
    <table class="grid"><tr><th style="width:140px">Tipo</th><th>Riscos identificados</th></tr>
    <tr><td>Físicos</td><td></td></tr><tr><td>Químicos</td><td></td></tr><tr><td>Biológicos</td><td></td></tr><tr><td>Ergonômicos / psicossociais</td><td></td></tr><tr><td>Acidentes</td><td></td></tr></table>
    <h4>2. Medidas de prevenção e EPIs obrigatórios</h4>${linhas(3)}
    <h4>3. Procedimentos em caso de acidente ou emergência</h4>
    <p>Comunicar imediatamente o supervisor e o Departamento Pessoal; procurar atendimento médico; preservar o local quando possível. Em emergência, acionar SAMU 192 ou Bombeiros 193.</p>
    <h4>4. Direito de recusa</h4><p>O(a) colaborador(a) pode interromper a atividade quando constatar risco grave e iminente à sua vida ou saúde, comunicando imediatamente o superior (NR-1).</p>
    <p class="decl">Declaro ter recebido e compreendido esta ordem de serviço.</p>
    ${localData(ctx)}${assin(['Colaborador(a)','Responsável pela empresa'])}`},

  direito_imagem:{nome:'Contrato de cessão de direito de uso de imagem',cat:'contrato',desc:'Autorização gratuita de uso de imagem e voz em materiais institucionais (CF art. 5º, X; CC art. 20; LGPD).',
    render:ctx=>{const c=ctx.c||{};
    return `<p><b>CEDENTE:</b> ${F(ctx,c.nome,260)}, CPF ${F(ctx,c.cpf,120)}, RG ${F(ctx,c.rg,100)}, ocupante da função de ${F(ctx,c.funcao,160)}.</p>
    <p><b>CESSIONÁRIA:</b> <b>${esc(empNome(ctx))}</b>, inscrita no CNPJ ${esc(empCNPJ(ctx))}${ctx.emp?.endereco?`, com sede em ${esc(ctx.emp.endereco)}`:''}.</p>
    <p>As partes acima identificadas celebram o presente contrato de cessão de direito de uso de imagem e voz, mediante as cláusulas seguintes:</p>
    <ol class="cl">
    <li><b>Objeto.</b> O(A) CEDENTE autoriza a CESSIONÁRIA a captar e utilizar sua imagem, nome e voz, registrados em fotografias e vídeos produzidos durante as atividades de trabalho, uniformizado(a), nos postos atendidos e em treinamentos e eventos da empresa.</li>
    <li><b>Finalidade.</b> O uso é exclusivamente institucional: site da empresa, redes sociais oficiais, portfólios, apresentações, propostas comerciais, materiais de treinamento e comunicação interna. É vedado o uso que atente contra a honra, a boa fama ou a respeitabilidade do(a) CEDENTE (Código Civil, art. 20).</li>
    <li><b>Gratuidade.</b> A cessão é feita a título gratuito, sem qualquer remuneração, e não integra o salário para nenhum efeito.</li>
    <li><b>Prazo e abrangência.</b> A autorização vale durante o contrato de trabalho, em todo o território nacional, em meio impresso e digital.</li>
    <li><b>Desligamento.</b> Após o fim do contrato de trabalho, a CESSIONÁRIA não produzirá novos materiais com a imagem do(a) CEDENTE e retirará das suas redes e do seu site, em até 30 dias após solicitação escrita, as publicações em que ele(a) apareça em destaque. Materiais impressos já distribuídos não precisarão ser recolhidos.</li>
    <li><b>Revogação.</b> O(A) CEDENTE pode revogar esta autorização a qualquer tempo, por escrito ao Departamento Pessoal, com efeito para usos futuros, sem prejuízo do contrato de trabalho (LGPD, art. 8º, §5º).</li>
    <li><b>Dados pessoais.</b> As imagens serão tratadas conforme a Lei 13.709/2018 (LGPD), apenas para as finalidades acima.</li></ol>
    <p class="opt">☐ <b>AUTORIZO</b> o uso da minha imagem e voz nos termos acima.<br>☐ <b>NÃO AUTORIZO</b> o uso da minha imagem e voz.</p>
    ${localData(ctx)}${assin(['CEDENTE','CESSIONÁRIA'])}${assin(['Testemunha 1 (nome e CPF)','Testemunha 2 (nome e CPF)'])}`;}},

  ficha_epi:{nome:'Ficha de entrega de EPI',cat:'epi_uniforme',desc:'NR-6: data, item, CA, quantidade e assinatura a cada entrega.',
    render:ctx=>{const it=(ctx.entregas||[]).filter(e=>e.tipo==='EPI');
    const rows=it.map(e=>`<tr><td>${fmtBR(e.data_entrega)}</td><td>${esc(e.item)}</td><td>${esc(e.ca||'')}</td><td class="c">${e.quantidade||1}</td><td>${esc(e.motivo||'')}</td><td>${fmtBR(e.data_devolucao)}</td><td></td></tr>`).join('');
    const vazias=Math.max(12-it.length,4);
    return `${idColab(ctx)}<p class="decl">Declaro ter recebido gratuitamente os Equipamentos de Proteção Individual abaixo, ter sido treinado(a) quanto ao uso correto, guarda, conservação e higienização, e me comprometo a usá-los apenas para a finalidade a que se destinam, comunicando qualquer dano ou extravio (NR-6).</p>
    <table class="grid"><tr><th>Data</th><th>EPI / descrição</th><th>Nº CA</th><th>Qtd</th><th>Motivo</th><th>Devolução</th><th style="width:130px">Assinatura</th></tr>${rows}${'<tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>'.repeat(vazias)}</table>
    ${assin(['Colaborador(a)','Responsável pela entrega'])}`;}},

  termo_uniforme:{nome:'Termo de entrega de uniforme',cat:'epi_uniforme',desc:'Peças, tamanhos e quantidades entregues.',
    render:ctx=>{const c=ctx.c||{};const it=(ctx.entregas||[]).filter(e=>e.tipo==='Uniforme');
    const rows=it.map(e=>`<tr><td>${fmtBR(e.data_entrega)}</td><td>${esc(e.item)}</td><td class="c">${esc(e.tamanho||'')}</td><td class="c">${e.quantidade||1}</td><td>${esc(e.motivo||'')}</td><td></td></tr>`).join('');
    return `${idColab(ctx)}<p><small>Tamanhos:</small> camisa ${F(ctx,c.tam_camisa,40)} · calça ${F(ctx,c.tam_calca,40)} · calçado ${F(ctx,c.tam_calcado,40)} · jaqueta ${F(ctx,c.tam_jaqueta,40)}</p>
    <table class="grid"><tr><th>Data</th><th>Peça</th><th>Tam.</th><th>Qtd</th><th>Motivo</th><th style="width:130px">Assinatura</th></tr>${rows}${'<tr><td></td><td></td><td></td><td></td><td></td><td></td></tr>'.repeat(Math.max(10-it.length,4))}</table>
    <p class="decl">Recebi as peças de uniforme acima, de uso obrigatório e exclusivo no trabalho, e me comprometo a conservá-las e devolvê-las no desligamento.</p>
    ${assin(['Colaborador(a)','Responsável pela entrega'])}`;}},

  certificado_treinamento:{nome:'Registro / certificado de treinamento',cat:'treinamento',desc:'Campos exigidos pela NR-1: conteúdo, carga, local, data, instrutor e assinaturas.',
    render:ctx=>{const t=ctx.treino||{};
    return `${idColab(ctx)}<table class="id"><tr><td><small>Treinamento</small>${F(ctx,t.curso,300)}</td><td><small>Norma</small>${F(ctx,t.norma,80)}</td></tr>
    <tr><td><small>Data</small>${F(ctx,fmtBR(t.data),100)}</td><td><small>Carga horária</small>${F(ctx,t.carga_horaria?t.carga_horaria+' h':'',60)}</td></tr>
    <tr><td><small>Local</small>${F(ctx,t.local,200)}</td><td><small>Validade</small>${F(ctx,fmtBR(t.validade),100)}</td></tr>
    <tr><td colspan="2"><small>Instrutor(a) e qualificação</small>${F(ctx,t.instrutor,380)}</td></tr></table>
    <h4>Conteúdo programático</h4>${linhas(6)}
    <p class="decl">Certificamos que o(a) colaborador(a) participou do treinamento acima. O tempo de capacitação foi computado como jornada de trabalho.</p>
    ${assin(['Colaborador(a)','Instrutor(a)','Responsável técnico'])}`;}},

  lista_presenca:{nome:'Lista de presença de treinamento',cat:'treinamento',desc:'Para treinamentos em grupo; depois anexe na pasta de cada participante.',
    render:ctx=>`<table class="id"><tr><td><small>Treinamento</small>${F(ctx,'',300)}</td><td><small>Norma</small>${F(ctx,'',80)}</td></tr>
    <tr><td><small>Data / horário</small>${F(ctx,'',160)}</td><td><small>Carga horária</small>${F(ctx,'',60)}</td></tr>
    <tr><td><small>Local</small>${F(ctx,'',200)}</td><td><small>Instrutor(a)</small>${F(ctx,'',160)}</td></tr></table>
    <table class="grid"><tr><th style="width:30px">#</th><th>Nome</th><th style="width:110px">CPF</th><th style="width:110px">Função</th><th style="width:150px">Assinatura</th></tr>
    ${Array.from({length:18},(_,i)=>`<tr><td class="c">${i+1}</td><td></td><td></td><td></td><td></td></tr>`).join('')}</table>
    ${assin(['Instrutor(a)','Responsável técnico'])}`},

  aviso_ferias:{nome:'Aviso de férias',cat:'funcional',desc:'Comunicado com 30 dias de antecedência (CLT, art. 135).',
    render:ctx=>{const x=ctx.extra||{};
    return `${idColab(ctx)}<p>Comunicamos que, nos termos do art. 135 da CLT, suas férias serão concedidas conforme abaixo:</p>
    <table class="id"><tr><td><small>Período aquisitivo</small>${F(ctx,x.aquisitivo,200)}</td><td><small>Dias de férias</small>${F(ctx,x.dias,50)}</td></tr>
    <tr><td><small>Início do gozo</small>${F(ctx,fmtBR(x.inicio),100)}</td><td><small>Término do gozo</small>${F(ctx,fmtBR(x.fim),100)}</td></tr>
    <tr><td><small>Retorno ao trabalho</small>${F(ctx,fmtBR(x.retorno),100)}</td><td><small>Abono pecuniário (venda de 10 dias)</small> ☐ Sim ☐ Não</td></tr></table>
    <p class="decl">O pagamento das férias, acrescido de 1/3, será efetuado até 2 dias antes do início do gozo.</p>
    ${localData(ctx)}${assin(['EMPREGADORA','Ciente — colaborador(a)'])}`;}},

  advertencia:{nome:'Advertência disciplinar',cat:'funcional',desc:'Registro da falta. Se houver recusa, colher assinatura de 2 testemunhas.',
    render:ctx=>{const x=ctx.extra||{};
    return `${idColab(ctx)}<p>Pela presente, fica o(a) colaborador(a) acima <b>ADVERTIDO(A)</b> em razão do fato ocorrido em ${F(ctx,fmtBR(x.data),90)}, descrito a seguir:</p>
    ${!ctx.blank&&x.descricao?`<div class="desc">${esc(x.descricao)}</div>`:linhas(4)}
    <p>Esperamos que o fato não se repita, ficando ciente de que a reincidência poderá acarretar a aplicação de penalidades mais severas, previstas na legislação trabalhista.</p>
    ${localData(ctx)}${assin(['EMPREGADORA','Ciente — colaborador(a)'])}
    <div class="box"><b>Em caso de recusa em assinar</b>${assin(['Testemunha 1 (nome e CPF)','Testemunha 2 (nome e CPF)'])}</div>`;}},

  suspensao:{nome:'Suspensão disciplinar',cat:'funcional',desc:'Até 30 dias (CLT, art. 474). Dias descontados do salário e do DSR.',
    render:ctx=>{const x=ctx.extra||{};
    return `${idColab(ctx)}<p>Comunicamos que o(a) colaborador(a) acima está <b>SUSPENSO(A)</b> por ${F(ctx,x.dias,40)} dia(s), de ${F(ctx,fmtBR(x.inicio),90)} a ${F(ctx,fmtBR(x.fim),90)}, devendo retornar ao trabalho em ${F(ctx,fmtBR(x.retorno),90)}, em razão do fato ocorrido em ${F(ctx,fmtBR(x.data),90)}:</p>
    ${!ctx.blank&&x.descricao?`<div class="desc">${esc(x.descricao)}</div>`:linhas(4)}
    <p>Os dias de suspensão não serão remunerados. A reincidência poderá ensejar a rescisão do contrato por justa causa (CLT, art. 482).</p>
    ${localData(ctx)}${assin(['EMPREGADORA','Ciente — colaborador(a)'])}
    <div class="box"><b>Em caso de recusa em assinar</b>${assin(['Testemunha 1 (nome e CPF)','Testemunha 2 (nome e CPF)'])}</div>`;}},

  autorizacao_desconto:{nome:'Autorização de desconto em folha',cat:'funcional',desc:'Desconto autorizado por escrito (CLT, art. 462).',
    render:ctx=>{const x=ctx.extra||{};
    return `${idColab(ctx)}<p>Autorizo a empresa a descontar do meu salário o valor de ${F(ctx,moneyBR(x.valor),110)}, em ${F(ctx,x.parcelas,40)} parcela(s), referente a:</p>
    ${!ctx.blank&&x.descricao?`<div class="desc">${esc(x.descricao)}</div>`:linhas(3)}
    <p class="decl">Declaro que esta autorização é dada de livre e espontânea vontade.</p>
    ${localData(ctx)}${assin(['Assinatura do(a) colaborador(a)'])}`;}},

  pedido_demissao:{nome:'Pedido de demissão',cat:'desligamento',desc:'Com ou sem cumprimento do aviso prévio.',
    render:ctx=>`<p>À <b>${esc(empNome(ctx))}</b>, CNPJ ${esc(empCNPJ(ctx))}.</p>
    <p>Eu, ${F(ctx,ctx.c?.nome,260)}, CPF ${F(ctx,ctx.c?.cpf,120)}, ocupante da função de ${F(ctx,ctx.c?.funcao,160)}, venho por meio desta solicitar o meu desligamento da empresa, por motivos particulares.</p>
    <p class="opt">☐ Cumprirei o aviso prévio de 30 dias.<br>☐ Solicito a dispensa do cumprimento do aviso prévio, ciente do desconto correspondente nas verbas rescisórias.</p>
    ${localData(ctx)}${assin(['Assinatura do(a) colaborador(a)','Recebido por (empresa)'])}`},

  termo_devolucao:{nome:'Termo de devolução de materiais',cat:'desligamento',desc:'Uniforme, EPI, crachá, chaves e equipamentos do posto.',
    render:ctx=>{const it=(ctx.entregas||[]).filter(e=>!e.data_devolucao);
    const rows=it.map(e=>`<tr><td>${esc(e.tipo)}</td><td>${esc(e.item)}</td><td class="c">${e.quantidade||1}</td><td class="c">☐ Sim ☐ Não</td><td></td></tr>`).join('');
    const fixos=['Crachá','Chaves do posto','Rádio / celular','Outros'].map(i=>`<tr><td>Material</td><td>${i}</td><td></td><td class="c">☐ Sim ☐ Não</td><td></td></tr>`).join('');
    return `${idColab(ctx)}<table class="grid"><tr><th>Tipo</th><th>Item</th><th>Qtd</th><th>Devolvido</th><th>Estado / observação</th></tr>${rows}${fixos}</table>
    <p class="decl">Declaro ter devolvido os itens assinalados acima.</p>${localData(ctx)}${assin(['Colaborador(a)','Recebido por (empresa)'])}`;}}
};

/* ---------- página A4 de impressão ---------- */
function paginaA4(ctx, codigo){
  const m=MODELOS[codigo]; const emp=ctx.emp||{};
  const logo=`<img src="${ctx.cfg.logo||LOGO_OFICIAL}" alt="C&amp;S">`;
  return `<section class="page"><header><div class="lg">${logo}</div><div class="em"><b>${esc(emp.razao||emp.nome||'C&S')}</b><small>${emp.cnpj?'CNPJ '+esc(emp.cnpj):''}${emp.endereco?' · '+esc(emp.endereco):''}</small></div><div class="dt">${ctx.blank?'':'Gerado em '+fmtBR(hojeISO())}</div></header>
  <h1>${esc(m.nome)}</h1>${m.render(ctx)}<footer>${esc(emp.nome||'C&S')} · Prontuário do colaborador · ${esc(m.nome)}</footer></section>`;
}

/* =====================================================================
   CORE — dados (Supabase ou demonstração), estado, utilitários, rotas
   ===================================================================== */
const TABLES = ['rh_config','rh_postos','rh_doc_tipos','rh_colaboradores','rh_remuneracao',
  'rh_documentos','rh_afastamentos','rh_entregas','rh_treinamentos','rh_alocacoes','rh_ocorrencias',
  'rh_docs_empresa','rh_kits','rh_rescisoes'];
const PK = {rh_config:'chave', rh_remuneracao:'colaborador_id'};
const BUCKET = 'prontuarios';
let sb = null, DEMO = !(SUPABASE_URL && SUPABASE_ANON_KEY);

/* ---------- utilitários ---------- */
const $ = (s,r=document) => r.querySelector(s);
const $$ = (s,r=document) => [...r.querySelectorAll(s)];
const toD = s => s ? new Date(String(s).slice(0,10)+'T12:00:00') : null;
const isoOf = d => { const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4); return z.toISOString().slice(0,10); };
const addDays = (s,n) => { const d=toD(s); d.setDate(d.getDate()+Number(n)); return isoOf(d); };
const addMonths = (s,n) => { const d=toD(s); d.setMonth(d.getMonth()+Number(n)); return isoOf(d); };
const diffDays = (a,b) => Math.round((toD(a)-toD(b))/864e5);
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const num = v => { if(v==null||v==='') return 0; if(typeof v==='number') return v;
  const s=String(v).replace(/[R$\s]/g,''); return Number(s.includes(',')?s.replace(/\./g,'').replace(',','.'):s)||0; };
const iniciais = n => String(n||'?').split(' ').filter(Boolean).filter((p,i,a)=>i===0||i===a.length-1).map(p=>p[0]).join('').toUpperCase();
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2));
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2800); }
function fail(e){ console.error(e); toast('Erro: '+(e?.message||e)); }

/* ---------- armazenamento da demonstração ---------- */
const DemoStore = {
  key:'cs_prontuario_demo_v1',
  get(){ try{ return JSON.parse(localStorage.getItem(this.key))||null; }catch(e){ return null; } },
  set(d){ try{ localStorage.setItem(this.key, JSON.stringify(d)); }catch(e){ toast('Armazenamento do navegador cheio (modo demonstração).'); } },
  idb(){ return new Promise((ok,ko)=>{ const r=indexedDB.open('cs_prontuario_files',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('f'); r.onsuccess=()=>ok(r.result); r.onerror=()=>ko(r.error); }); },
  async putFile(path,blob){ const db=await this.idb(); return new Promise((ok,ko)=>{ const tx=db.transaction('f','readwrite'); tx.objectStore('f').put(blob,path); tx.oncomplete=ok; tx.onerror=()=>ko(tx.error); }); },
  async getFile(path){ const db=await this.idb(); return new Promise((ok,ko)=>{ const q=db.transaction('f').objectStore('f').get(path); q.onsuccess=()=>ok(q.result); q.onerror=()=>ko(q.error); }); },
  async delFile(path){ const db=await this.idb(); return new Promise(ok=>{ const tx=db.transaction('f','readwrite'); tx.objectStore('f').delete(path); tx.oncomplete=ok; }); }
};

/* ---------- API única ---------- */
const api = {
  async list(t){
    if(DEMO){ return structuredClone(DemoStore.get()?.[t]||[]); }
    const out=[]; let from=0; const step=1000;
    while(true){ const {data,error}=await sb.from(t).select('*').range(from,from+step-1);
      if(error){ if(/permission|policy/i.test(error.message)) return out; throw error; }
      out.push(...data); if(data.length<step) break; from+=step; }
    return out;
  },
  async insert(t,obj){
    if(DEMO){ const d=DemoStore.get(); const k=PK[t]||'id'; const row={...obj};
      if(!row[k]) row[k]=uid(); if(!row.created_at) row.created_at=new Date().toISOString();
      d[t]=d[t]||[]; d[t].push(row); DemoStore.set(d); return structuredClone(row); }
    const {data,error}=await sb.from(t).insert(obj).select().single(); if(error) throw error; return data;
  },
  async insertMany(t,arr){
    if(!arr.length) return [];
    if(DEMO){ const out=[]; for(const o of arr) out.push(await this.insert(t,o)); return out; }
    const {data,error}=await sb.from(t).insert(arr).select(); if(error) throw error; return data;
  },
  async update(t,key,obj){
    const k=PK[t]||'id';
    if(DEMO){ const d=DemoStore.get(); const r=(d[t]||[]).find(x=>x[k]===key); if(!r) throw new Error('Registro não encontrado');
      Object.assign(r,obj,{updated_at:new Date().toISOString()}); DemoStore.set(d); return structuredClone(r); }
    const {data,error}=await sb.from(t).update(obj).eq(k,key).select().single(); if(error) throw error; return data;
  },
  async upsert(t,obj){
    const k=PK[t]||'id';
    if(DEMO){ const d=DemoStore.get(); d[t]=d[t]||[]; const r=d[t].find(x=>x[k]===obj[k]);
      if(r) Object.assign(r,obj,{updated_at:new Date().toISOString()}); else d[t].push({...obj});
      DemoStore.set(d); return structuredClone(d[t].find(x=>x[k]===obj[k])); }
    const {data,error}=await sb.from(t).upsert(obj,{onConflict:k}).select().single(); if(error) throw error; return data;
  },
  async remove(t,key){
    const k=PK[t]||'id';
    if(DEMO){ const d=DemoStore.get(); d[t]=(d[t]||[]).filter(x=>x[k]!==key); DemoStore.set(d); return; }
    const {error}=await sb.from(t).delete().eq(k,key); if(error) throw error;
  },
  async upload(path,file){
    if(DEMO){ await DemoStore.putFile(path,file); return path; }
    const {error}=await sb.storage.from(BUCKET).upload(path,file,{upsert:false,contentType:file.type||undefined}); if(error) throw error; return path;
  },
  async getBlob(path){
    if(DEMO){ const b=await DemoStore.getFile(path); if(!b) throw new Error('Arquivo não encontrado'); return b; }
    const {data,error}=await sb.storage.from(BUCKET).download(path); if(error) throw error; return data;
  },
  async openFile(path){
    if(DEMO){ const b=await DemoStore.getFile(path); if(!b) throw new Error('Arquivo não encontrado'); window.open(URL.createObjectURL(b),'_blank'); return; }
    const w=window.open('about:blank','_blank');
    try{
      let url;
      if(DEMO){ const b=await DemoStore.getFile(path); if(!b) throw new Error('Arquivo não encontrado'); url=URL.createObjectURL(b); }
      else { const {data,error}=await sb.storage.from(BUCKET).createSignedUrl(path,300); if(error) throw error; url=data.signedUrl; }
      if(w) w.location.href=url; else window.open(url,'_blank');
    }catch(e){ if(w) w.close(); throw e; }
  },
  async removeFile(path){
    if(!path) return;
    if(DEMO) return DemoStore.delFile(path);
    await sb.storage.from(BUCKET).remove([path]);
  },
  async log(acao,alvo,colaborador_id){
    if(DEMO) return;
    try{ await sb.from('rh_log').insert({acao,alvo,colaborador_id:colaborador_id||null,email:S.user?.email}); }catch(e){}
  },
  async grant(email,papel,nome){
    const {data,error}=await sb.rpc('rh_conceder_acesso',{p_email:email,p_papel:papel,p_nome:nome||''}); if(error) throw error; return data;
  }
};

/* ---------- estado ---------- */
const S = { user:null, papel:'admin', cfg:structuredClone(CONFIG_PADRAO),
  postos:[], tipos:[], colabs:[], rem:{}, docs:[], afast:[], entregas:[], treinos:[], aloc:[], ocorr:[],
  docsEmp:[], kits:[], resc:[] };
const can = {
  get edit(){ return ['admin','dp'].includes(S.papel); },
  get sens(){ return ['admin','dp','diretoria'].includes(S.papel); },
  get admin(){ return S.papel==='admin'; }
};

async function loadAll(){
  const [cfg,postos,tipos,colabs,rem,docs,afast,entregas,treinos,aloc,ocorr,docsEmp,kits,resc] = await Promise.all(TABLES.map(t=>api.list(t)));
  S.cfg = structuredClone(CONFIG_PADRAO);
  const plain=o=>o&&typeof o==='object'&&!Array.isArray(o);
  cfg.forEach(r=>{ const v=(plain(r.valor) && 'v' in r.valor) ? r.valor.v : r.valor;
    S.cfg[r.chave] = (plain(v)&&plain(S.cfg[r.chave])) ? {...S.cfg[r.chave],...v} : v; });
  S.postos=postos.sort((a,b)=>a.nome.localeCompare(b.nome));
  S.tipos=tipos.sort((a,b)=>(a.ordem||0)-(b.ordem||0));
  S.colabs=colabs.sort((a,b)=>a.nome.localeCompare(b.nome));
  S.rem=Object.fromEntries(rem.map(r=>[r.colaborador_id,r]));
  S.docs=docs; S.afast=afast; S.entregas=entregas; S.treinos=treinos; S.aloc=aloc; S.ocorr=ocorr;
  S.docsEmp=docsEmp; S.kits=kits; S.resc=resc;
  if(!S.tipos.length && can.edit){ await seedCatalogo(); await saveCfg('catalogo_versao',CATALOGO_VERSAO); }
  else if(can.edit && Number(S.cfg.catalogo_versao||1)<CATALOGO_VERSAO){ await atualizarCatalogo(); }
}
/* acrescenta os documentos novos de cada versão sem mexer no que o usuário já configurou */
async function atualizarCatalogo(){
  const de=Number(S.cfg.catalogo_versao||1), have=new Set(S.tipos.map(t=>t.codigo)), cods=[];
  for(let v=de+1; v<=CATALOGO_VERSAO; v++) cods.push(...(CATALOGO_NOVOS[v]||[]));
  const novos=CATALOGO_PADRAO.filter(t=>cods.includes(t.codigo)&&!have.has(t.codigo)).map(t=>({...t}));
  if(novos.length){ const rows=await api.insertMany('rh_doc_tipos',novos); S.tipos.push(...rows); S.tipos.sort((a,b)=>(a.ordem||0)-(b.ordem||0));
    toast(`Catálogo atualizado: ${rows.length} documento(s) novo(s).`); }
  await saveCfg('catalogo_versao',CATALOGO_VERSAO);
}
async function seedCatalogo(faltantes){
  const have=new Set(S.tipos.map(t=>t.codigo));
  const novos=CATALOGO_PADRAO.filter(t=>!have.has(t.codigo)).map(t=>({...t}));
  if(!novos.length){ toast('O catálogo já tem todos os documentos padrão.'); return; }
  const rows=await api.insertMany('rh_doc_tipos',novos);
  S.tipos.push(...rows); S.tipos.sort((a,b)=>(a.ordem||0)-(b.ordem||0));
  if(faltantes) toast(`${rows.length} tipo(s) de documento restaurado(s).`);
}
async function saveCfg(chave,valor){ S.cfg[chave]=valor; await api.upsert('rh_config',{chave,valor:{v:valor},updated_at:new Date().toISOString()}); }

/* ---------- consultas ---------- */
const colabById = id => S.colabs.find(c=>c.id===id);
const postoById = id => S.postos.find(p=>p.id===id);
const tipoBy = cod => S.tipos.find(t=>t.codigo===cod);
const empresaDe = c => (S.cfg.empresas||[]).find(e=>e.nome===c?.empresa) || (S.cfg.empresas||[])[0] || {};
const COND = { acordo_12x36:c=>c.escala==='12x36', reservista:c=>!c.sexo||/^m/i.test(c.sexo) };
function aplicavel(t,c){ if(!t.ativo) return false;
  if(t.aplica_funcoes?.length && c.funcao && !t.aplica_funcoes.includes(c.funcao)) return false;
  if(COND[t.codigo] && !COND[t.codigo](c)) return false; return true; }
const docsDe = (cid,cod) => S.docs.filter(d=>d.colaborador_id===cid && (cod===undefined||d.tipo_codigo===cod))
  .sort((a,b)=>(b.data_doc||b.created_at||'').localeCompare(a.data_doc||a.created_at||''));
function statusTipo(c,t){
  const ds=docsDe(c.id,t.codigo); if(!ds.length) return {st:'pendente',doc:null,n:0};
  const anex=ds.find(d=>d.status==='anexado');
  if(anex){ if(t.etapa!=='admissao' && anex.validade && anex.validade<hojeISO()) return {st:'vencido',doc:anex,n:ds.length};
    return {st:'ok',doc:anex,n:ds.length}; }
  const d=ds[0]; return {st:d.status,doc:d,n:ds.length};
}
const ST_CHIP = { ok:['Anexado','c-ok'], dispensado:['Dispensado','c-mut'], pendente:['Pendente','c-bad'], vencido:['Vencido','c-bad'],
  gerado:['Gerado','c-info'], em_assinatura:['Em assinatura','c-warn'], anexado:['Anexado','c-ok'] };
const chipSt = st => { const [l,c]=ST_CHIP[st]||[st,'c-mut']; return `<span class="chip ${c}">${l}</span>`; };
const STATUS_COLAB = { admissao:['Em admissão','c-info'], ativo:['Ativo','c-ok'], afastado:['Afastado','c-warn'], ferias:['Férias','c-gold'], desligado:['Desligado','c-mut'] };
const chipColab = s => { const [l,c]=STATUS_COLAB[s]||[s,'c-mut']; return `<span class="chip ${c}">${l}</span>`; };

function obrigatorios(c){
  const vis=S.tipos.filter(t=>t.exigido && t.etapa==='admissao' && aplicavel(t,c) && (can.sens||!CATEGORIAS[t.categoria]?.sensivel));
  const feitos=vis.filter(t=>['ok','dispensado'].includes(statusTipo(c,t).st));
  return {total:vis.length, feitos:feitos.length, faltam:vis.filter(t=>!feitos.includes(t)),
    pct: vis.length? Math.round(feitos.length/vis.length*100):100};
}
function progBar(p){ return `<div class="prog-row"><div class="prog ${p<50?'low':''}" style="flex:1"><i style="width:${p}%"></i></div><span>${p}%</span></div>`; }

/* ---------- alertas ---------- */
const ASO_CODES=['aso_admissional','aso_periodico','aso_retorno','aso_mudanca'];
function ultimoASO(c){ return S.docs.filter(d=>d.colaborador_id===c.id && ASO_CODES.includes(d.tipo_codigo) && d.status==='anexado')
  .sort((a,b)=>(b.data_doc||'').localeCompare(a.data_doc||''))[0]; }
function proximoASO(c){ const u=ultimoASO(c); if(!u) return null;
  if(u.validade) return u.validade; const m=tipoBy('aso_periodico')?.validade_meses||12; return u.data_doc?addMonths(u.data_doc,m):null; }
function alertasDe(c){
  const A=[], hoje=hojeISO(), aviso=Number(S.cfg.alertas?.dias_aviso||30);
  if(c.status==='desligado') return A;
  const add=(nivel,titulo,detalhe,tab,data)=>A.push({cid:c.id,nome:c.nome,nivel,titulo,detalhe,tab,data:data||hoje});
  const ob=obrigatorios(c);
  if(ob.faltam.length) add(c.status==='admissao'?'bad':'warn',`${ob.faltam.length} documento(s) obrigatório(s) pendente(s)`,ob.faltam.slice(0,3).map(t=>t.nome).join(', ')+(ob.faltam.length>3?'…':''),'documentos');
  if(can.sens){
    const prox=proximoASO(c);
    if(!ultimoASO(c)) add(c.status==='admissao'?'bad':'warn','Sem ASO anexado','O ASO admissional deve existir antes do início','saude');
    else if(prox && prox<=addDays(hoje,aviso)) add(prox<hoje?'bad':'warn',prox<hoje?'ASO periódico vencido':'ASO periódico vencendo',`Vencimento ${fmtBR(prox)}`,'saude',prox);
    S.afast.filter(a=>a.colaborador_id===c.id).forEach(a=>{
      const ret=addDays(a.inicio,Math.ceil(a.dias));
      if(Number(a.dias)>=30){ const temRet=S.docs.some(d=>d.colaborador_id===c.id&&d.tipo_codigo==='aso_retorno'&&(d.data_doc||'')>=a.inicio);
        if(!temRet && diffDays(ret,hoje)<=10 && diffDays(ret,hoje)>=-30) add('warn','ASO de retorno necessário',`Afastamento de ${a.dias} dias, retorno ${fmtBR(ret)}`,'saude',ret); }
      if(a.inicio<=hoje && ret>hoje && c.status!=='afastado' && Number(a.dias)>15) add('info','Afastado no momento',`${a.tipo} até ${fmtBR(addDays(ret,-1))}`,'saude',ret);
    });
  }
  // validade de documentos (não ASO)
  const vistos=new Set();
  docsDe(c.id).forEach(d=>{ if(!d.validade||d.status!=='anexado'||ASO_CODES.includes(d.tipo_codigo)) return;
    const k=d.tipo_codigo||d.titulo; if(vistos.has(k)) return; vistos.add(k);
    if(CATEGORIAS[d.categoria]?.sensivel&&!can.sens) return;
    if(d.validade<=addDays(hoje,aviso)) add(d.validade<hoje?'bad':'warn',`${d.titulo} ${d.validade<hoje?'vencido':'vencendo'}`,`Validade ${fmtBR(d.validade)}`,'documentos',d.validade); });
  // treinamentos
  const tv=new Set();
  S.treinos.filter(t=>t.colaborador_id===c.id).sort((a,b)=>(b.data||'').localeCompare(a.data||'')).forEach(t=>{
    if(tv.has(norm(t.curso))) return; tv.add(norm(t.curso));
    if(t.validade && t.validade<=addDays(hoje,aviso)) add(t.validade<hoje?'bad':'warn',`Treinamento ${t.validade<hoje?'vencido':'vencendo'}: ${t.curso}`,`Validade ${fmtBR(t.validade)}`,'treinamentos',t.validade); });
  // experiência
  if(c.admissao && /experi/i.test(c.tipo_contrato||'')){
    [[44,'1ª etapa (45 dias)'],[89,'prazo final (90 dias)']].forEach(([n,l])=>{ const fim=addDays(c.admissao,n); const dd=diffDays(fim,hoje);
      if(dd>=0 && dd<=10) add('info',`Experiência: ${l} termina em ${dd} dia(s)`,`Decidir prorrogação/efetivação até ${fmtBR(fim)}`,'contrato',fim); });
  }
  // férias
  if(c.admissao){ const anos=Math.floor(diffDays(hoje,c.admissao)/365.25);
    for(let k=Math.max(1,anos-1);k<=anos;k++){ const fimAq=addMonths(c.admissao,12*k), limite=addMonths(c.admissao,12*(k+1));
      const gozou=S.ocorr.some(o=>o.colaborador_id===c.id&&o.tipo==='Férias'&&o.data>=fimAq&&o.data<limite);
      if(gozou) continue;
      if(limite<hoje) add('bad','Férias vencidas',`Período aquisitivo ${fmtBR(addMonths(c.admissao,12*(k-1)))}–${fmtBR(addDays(fimAq,-1))} sem registro de gozo`,'historico',limite);
      else if(limite<=addDays(hoje,90)) add('warn','Férias a programar',`Conceder antes de ${fmtBR(addDays(limite,-31))} (período ${k})`,'historico',limite);
    } }
  return A;
}
const NIVEL_ORD={bad:0,warn:1,info:2};
function todosAlertas(){ return S.colabs.flatMap(alertasDe).sort((a,b)=>NIVEL_ORD[a.nivel]-NIVEL_ORD[b.nivel]||a.data.localeCompare(b.data)); }

/* ---------- modal ---------- */
function modal({titulo,corpo,rodape='',wide=false,onOpen}){
  closeModal(); const bg=document.createElement('div'); bg.className='modal-bg'; bg.id='modal';
  bg.innerHTML=`<div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true"><div class="modal-h"><h3>${titulo}</h3><button data-act="closeModal" aria-label="Fechar">×</button></div><div class="modal-b">${corpo}</div>${rodape?`<div class="modal-f">${rodape}</div>`:''}</div>`;
  bg.addEventListener('mousedown',e=>{ if(e.target===bg) closeModal(); });
  document.body.appendChild(bg); onOpen&&onOpen(bg); const f=bg.querySelector('input,select,textarea'); f&&f.focus();
  return bg;
}
function closeModal(){ $('#modal')?.remove(); }
function formData(root){ const o={}; $$('[name]',root).forEach(el=>{ if(el.type==='checkbox') o[el.name]=el.checked;
  else if(el.type==='file') o[el.name]=el.files[0]||null; else o[el.name]=el.value.trim(); }); return o; }
const opts = (arr,sel,vazio) => (vazio!==undefined?`<option value="">${vazio}</option>`:'')+arr.map(v=>{ const [val,lab]=Array.isArray(v)?v:[v,v];
  return `<option value="${esc(val)}" ${String(val)===String(sel??'')?'selected':''}>${esc(lab)}</option>`; }).join('');

/* ---------- ações (delegação) ---------- */
const ACT = { closeModal };
document.addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const fn=ACT[b.dataset.act]; if(fn){ e.preventDefault(); Promise.resolve(fn(b.dataset,b,e)).catch(fail); } });
document.addEventListener('change',e=>{ const b=e.target.closest('[data-chg]'); if(!b) return;
  const fn=ACT[b.dataset.chg]; if(fn) Promise.resolve(fn(b.dataset,b,e)).catch(fail); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

/* ---------- rotas ---------- */
const go = h => { if(location.hash===h) render(); else location.hash=h; };
window.addEventListener('hashchange',()=>render());
function render(keep){
  if(!S.user) return;
  const [_,pg,id,tab]=(location.hash||'#/painel').split('/');
  $$('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.pg===(pg==='colab'?'colaboradores':(pg||'painel'))));
  $$('.nav [data-sens]').forEach(b=>b.classList.toggle('hidden',!can.sens));
  const m=$('main');
  try{
    if(pg==='colaboradores') m.innerHTML=viewLista();
    else if(pg==='colab') { const c=colabById(id); m.innerHTML=c?viewFicha(c,tab||'resumo'):'<div class="empty">Colaborador não encontrado.</div>'; }
    else if(pg==='modelos') m.innerHTML=viewModelos();
    else if(pg==='kit') m.innerHTML=can.sens?viewKit(id):semAcesso();
    else if(pg==='rescisao') m.innerHTML=can.sens?viewRescisao(id):semAcesso();
    else if(pg==='parametros') m.innerHTML=viewParametros(id||'documentos');
    else m.innerHTML=viewPainel();
  }catch(e){ console.error(e); m.innerHTML=`<div class="empty">Erro ao montar a tela: ${esc(e.message)}</div>`; }
  if(!keep) window.scrollTo({top:0});
}
const rerender = () => render(true);
const semAcesso = () => '<div class="card empty">Seu perfil não tem acesso a esta área.</div>';
ACT.go = d => go(d.go);

/* =====================================================================
   PAINEL · LISTA DE COLABORADORES · NOVO · IMPORTAÇÃO · EXPORTAÇÃO
   ===================================================================== */
function viewPainel(){
  const ativos=S.colabs.filter(c=>c.status!=='desligado');
  const al=todosAlertas(); const crit=al.filter(a=>a.nivel==='bad');
  const pend=ativos.filter(c=>obrigatorios(c).faltam.length);
  const asoV=can.sens?ativos.filter(c=>{const p=proximoASO(c);return !ultimoASO(c)||(p&&p<=addDays(hojeISO(),Number(S.cfg.alertas?.dias_aviso||30)));}).length:null;
  const porPosto={}; ativos.forEach(c=>{ const k=c.posto_id||'_'; (porPosto[k]=porPosto[k]||[]).push(c); });
  const linhasPosto=Object.entries(porPosto).map(([k,cs])=>{ const p=postoById(k); const pct=Math.round(cs.reduce((s,c)=>s+obrigatorios(c).pct,0)/cs.length);
    return {nome:p?.nome||'Sem posto definido',n:cs.length,pct,alert:cs.reduce((s,c)=>s+alertasDe(c).filter(a=>a.nivel!=='info').length,0)}; })
    .sort((a,b)=>a.pct-b.pct);
  const al20=al.slice(0,40);
  return `<div class="page-head"><div><h1>Painel do prontuário</h1><p>Situação dos ${ativos.length} colaboradores ativos em ${fmtBR(hojeISO())}</p></div>
    <div class="actions">${can.edit?`<button class="btn btn-dark" data-act="novoColab">+ Novo colaborador</button>`:''}<button class="btn" data-act="go" data-go="#/colaboradores">Ver todos</button></div></div>
  <div class="kpis">
    <div class="kpi gold"><div class="v">${ativos.filter(c=>['ativo','ferias','afastado'].includes(c.status)).length}</div><div class="l">Ativos</div></div>
    <div class="kpi"><div class="v">${ativos.filter(c=>c.status==='admissao').length}</div><div class="l">Em admissão</div></div>
    <div class="kpi"><div class="v">${ativos.filter(c=>['afastado','ferias'].includes(c.status)).length}</div><div class="l">Afastados / férias</div></div>
    <div class="kpi"><div class="v" style="color:${pend.length?'var(--bad)':'var(--ok)'}">${pend.length}</div><div class="l">Com documento obrigatório pendente</div></div>
    ${asoV!==null?`<div class="kpi"><div class="v" style="color:${asoV?'var(--warn)':'var(--ok)'}">${asoV}</div><div class="l">ASO vencido, vencendo ou ausente</div></div>`:''}
    <div class="kpi"><div class="v" style="color:${crit.length?'var(--bad)':'var(--ok)'}">${crit.length}</div><div class="l">Alertas críticos</div></div>
  </div>
  <div class="grid2">
    <div class="card"><div class="card-head"><h3>Alertas e vencimentos</h3><span class="muted small">${al.length} no total</span></div>
      ${al20.length?al20.map(a=>`<div class="alert-row" data-act="go" data-go="#/colab/${a.cid}/${a.tab}">
        <span class="chip ${a.nivel==='bad'?'c-bad':a.nivel==='warn'?'c-warn':'c-info'}">${a.nivel==='bad'?'Crítico':a.nivel==='warn'?'Atenção':'Aviso'}</span>
        <div style="flex:1;min-width:0"><div class="who">${esc(a.nome)}</div><div class="what">${esc(a.titulo)} · ${esc(a.detalhe)}</div></div></div>`).join(''):'<div class="empty">Nenhum alerta. Tudo em dia.</div>'}
      ${al.length>40?`<p class="muted small">Mostrando os 40 primeiros. Abra cada colaborador para ver todos.</p>`:''}
    </div>
    <div class="card"><div class="card-head"><h3>Documentação por posto</h3></div>
      ${linhasPosto.length?`<div class="tbl-wrap"><table><tr><th>Posto</th><th class="right">Pessoas</th><th style="width:150px">Obrigatórios</th><th class="right">Alertas</th></tr>
      ${linhasPosto.map(l=>`<tr><td>${esc(l.nome)}</td><td class="right">${l.n}</td><td>${progBar(l.pct)}</td><td class="right">${l.alert||'—'}</td></tr>`).join('')}</table></div>`:'<div class="empty">Cadastre colaboradores para ver o resumo.</div>'}
      ${can.edit?`<p class="muted small" style="margin-top:10px">O pacote mensal para o síndico (relação de colaboradores, ASOs, EPIs e treinamentos do posto) sai em <a href="#/modelos">Modelos</a>.</p>`:''}
    </div>
  </div>`;
}

/* ---------- lista ---------- */
const F_LISTA={q:'',empresa:'',status:'_ativos',posto:'',funcao:''};
function filtrarColabs(){
  const q=norm(F_LISTA.q);
  return S.colabs.filter(c=>{
    if(F_LISTA.status==='_ativos'&&c.status==='desligado') return false;
    if(F_LISTA.status&&F_LISTA.status!=='_ativos'&&c.status!==F_LISTA.status) return false;
    if(F_LISTA.empresa&&c.empresa!==F_LISTA.empresa) return false;
    if(F_LISTA.posto&&(c.posto_id||'_')!==F_LISTA.posto) return false;
    if(F_LISTA.funcao&&c.funcao!==F_LISTA.funcao) return false;
    if(q&&!norm([c.nome,c.cpf,c.matricula,c.funcao].join(' ')).includes(q)) return false;
    return true; });
}
function viewLista(){
  const L=S.cfg.listas;
  const funcoes=[...new Set([...(L.funcoes||[]),...S.colabs.map(c=>c.funcao).filter(Boolean)])];
  return `<div class="page-head"><div><h1>Colaboradores</h1><p>Clique em um nome para abrir a ficha completa.</p></div>
    <div class="actions">${can.edit?`<button class="btn btn-dark" data-act="novoColab">+ Novo colaborador</button><button class="btn" data-act="importar">Importar planilha</button>`:''}<button class="btn" data-act="exportarLista">Exportar Excel</button></div></div>
  <div class="filters">
    <input id="fq" placeholder="Buscar nome, CPF ou matrícula" value="${esc(F_LISTA.q)}" data-chg="filtro" data-k="q" style="flex:1;min-width:220px">
    <select data-chg="filtro" data-k="status">${opts([['_ativos','Todos menos desligados'],['','Todos'],...Object.entries(STATUS_COLAB).map(([k,v])=>[k,v[0]])],F_LISTA.status)}</select>
    <select data-chg="filtro" data-k="empresa">${opts((S.cfg.empresas||[]).map(e=>e.nome),F_LISTA.empresa,'Todas as empresas')}</select>
    <select data-chg="filtro" data-k="posto">${opts([['_','Sem posto'],...S.postos.map(p=>[p.id,p.nome])],F_LISTA.posto,'Todos os postos')}</select>
    <select data-chg="filtro" data-k="funcao">${opts(funcoes,F_LISTA.funcao,'Todas as funções')}</select>
  </div>
  <div id="listaBox">${tabelaLista()}</div>`;
}
function tabelaLista(){
  const cs=filtrarColabs();
  if(!S.colabs.length) return `<div class="card empty">Nenhum colaborador cadastrado ainda.${can.edit?' Use <b>Importar planilha</b> para trazer a base salarial ou <b>Novo colaborador</b>.':''}</div>`;
  if(!cs.length) return '<div class="card empty">Nenhum colaborador com esses filtros.</div>';
  return `<p class="muted small">${cs.length} colaborador(es)</p><div class="tbl-wrap"><table>
  <tr><th>Nome</th><th>Empresa</th><th>Função</th><th>Posto</th><th>Escala</th><th>Admissão</th><th>Status</th><th style="width:130px">Obrigatórios</th><th class="right">Alertas</th></tr>
  ${cs.map(c=>{const ob=obrigatorios(c);const al=alertasDe(c).filter(a=>a.nivel!=='info');const crit=al.some(a=>a.nivel==='bad');
    return `<tr class="click" data-act="go" data-go="#/colab/${c.id}"><td><b>${esc(c.nome)}</b>${c.cpf?`<div class="muted small">${esc(c.cpf)}</div>`:''}</td>
    <td class="small">${esc(c.empresa||'')}</td><td class="small">${esc(c.funcao||'—')}</td><td class="small">${esc(postoById(c.posto_id)?.nome||'—')}</td>
    <td class="small nowrap">${esc(c.escala||'—')}</td><td class="small nowrap">${fmtBR(c.admissao)||'—'}</td><td>${chipColab(c.status)}</td>
    <td>${progBar(ob.pct)}</td><td class="right">${al.length?`<span class="chip ${crit?'c-bad':'c-warn'}">${al.length}</span>`:'<span class="muted">—</span>'}</td></tr>`;}).join('')}
  </table></div>`;
}
ACT.filtro=(d,el)=>{ F_LISTA[d.k]=el.value; $('#listaBox').innerHTML=tabelaLista(); };
document.addEventListener('input',e=>{ if(e.target.id==='fq'){ F_LISTA.q=e.target.value; const b=$('#listaBox'); if(b) b.innerHTML=tabelaLista(); } });

ACT.salvarNovo=async()=>{
  const f=formData($('#fNovo')); if(!f.nome) return toast('Informe o nome.');
  const sal=f.salario_base; delete f.salario_base;
  Object.keys(f).forEach(k=>{ if(f[k]==='') f[k]=null; });
  const c=await api.insert('rh_colaboradores',{...f,nome:f.nome.toUpperCase()});
  S.colabs.push(c); S.colabs.sort((a,b)=>a.nome.localeCompare(b.nome));
  if(can.sens||sal){ const r=await api.upsert('rh_remuneracao',{colaborador_id:c.id,salario_base:num(sal)}); S.rem[c.id]=r; }
  if(c.posto_id||c.escala){ const a=await api.insert('rh_alocacoes',{colaborador_id:c.id,posto_id:c.posto_id,escala:c.escala,turno:c.turno,inicio:c.admissao||hojeISO(),obs:'Admissão'}); S.aloc.push(a); }
  api.log('criou colaborador',c.nome,c.id);
  closeModal(); toast('Colaborador criado.'); go(`#/colab/${c.id}/documentos`);
};

/* ---------- exportar ---------- */
ACT.exportarLista=()=>{
  if(typeof XLSX==='undefined') return toast('Biblioteca de planilhas não carregou. Verifique a internet.');
  const rows=filtrarColabs().map(c=>{ const ob=obrigatorios(c),r=S.rem[c.id]||{};
    const o={Nome:c.nome,CPF:c.cpf||'',Empresa:c.empresa||'',Função:c.funcao||'',Posto:postoById(c.posto_id)?.nome||'',Escala:c.escala||'',Turno:c.turno||'',
      Admissão:fmtBR(c.admissao),Status:STATUS_COLAB[c.status]?.[0]||c.status,'Obrigatórios %':ob.pct,'Pendências':ob.faltam.map(t=>t.nome).join('; ')};
    if(can.sens){ o['Salário base']=Number(r.salario_base||0); o['Próximo ASO']=fmtBR(proximoASO(c)); }
    return o; });
  const ws=XLSX.utils.json_to_sheet(rows); ws['!cols']=Object.keys(rows[0]||{Nome:1}).map(k=>({wch:Math.max(10,k.length+2)})); ws['!cols'][0]={wch:36};
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Colaboradores');
  XLSX.writeFile(wb,`Colaboradores_CS_${hojeISO()}.xlsx`); api.log('exportou lista','colaboradores');
};

/* ---------- importação de planilha (BASE_SALARIAL e similares) ---------- */
const IMP_CAMPOS=[
  ['nome','Nome',/^(nome|colaborador|funcion[aá]rio|empregado)/i],['funcao','Função',/fun[cç][aã]o|cargo/i],
  ['cpf','CPF',/cpf/i],['admissao','Admissão',/admiss/i],['salario_base','Salário base',/sal[aá]rio|bruto|base|vencimento/i],
  ['posto','Posto / condomínio',/posto|local|condom|cliente/i],['escala','Escala',/escala/i],['turno','Turno',/turno/i],
  ['telefone','Telefone',/tel|celular|whats|contato/i],['nascimento','Nascimento',/nasc/i],['pis','PIS',/pis/i],['rg','RG',/^rg/i],
  ['obs','Observações',/obs/i]];
let IMP=null;
ACT.importar=()=>{
  if(typeof XLSX==='undefined') return toast('Biblioteca de planilhas não carregou. Verifique a internet.');
  IMP=null;
  modal({titulo:'Importar colaboradores de planilha',wide:true,corpo:`<p class="muted small" style="margin-top:0">Aceita .xlsx, .xls ou .csv. Cada aba vira uma empresa (ex.: aba COSTA → COSTA &amp; SOBRAL, aba CS → C&amp;S). Quem já existe com o mesmo nome e empresa é atualizado, não duplicado.</p>
    <input type="file" id="impFile" accept=".xlsx,.xls,.csv" data-chg="impLer"><div id="impBox" style="margin-top:12px"></div>`,
    rodape:`<button class="btn" data-act="closeModal">Cancelar</button><button class="btn-gold" id="impGo" data-act="impExecutar" disabled>Importar</button>`});
};
ACT.impLer=async(d,el)=>{
  const f=el.files[0]; if(!f) return; const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});
  const abas=wb.SheetNames.map(nome=>{ const rows=XLSX.utils.sheet_to_json(wb.Sheets[nome],{header:1,defval:'',raw:true});
    let hr=rows.findIndex((r,i)=>i<20&&r.some(v=>/^\s*(nome|colaborador|funcion)/i.test(String(v)))); if(hr<0) hr=0;
    const head=(rows[hr]||[]).map(h=>String(h).trim());
    const map={}; IMP_CAMPOS.forEach(([k,,re])=>{ const i=head.findIndex((h,ix)=>h&&re.test(h)&&!Object.values(map).includes(ix)); if(i>=0) map[k]=i; });
    const dados=rows.slice(hr+1).filter(r=>map.nome!=null&&String(r[map.nome]||'').trim().length>2);
    const empresa=/costa|sobral/i.test(nome)?'COSTA & SOBRAL':/^c\s*&?\s*s$|^cs\b/i.test(nome.trim())?'C&S':'';
    return {nome,head,map,dados,empresa,usar:dados.length>0&&!!empresa||dados.length>0}; });
  IMP={abas}; impDesenhar();
};
function impDesenhar(){
  const emps=(S.cfg.empresas||[]).map(e=>e.nome);
  $('#impBox').innerHTML=IMP.abas.map((a,ai)=>`<div class="card" style="padding:12px">
    <div class="card-head"><label style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" ${a.usar?'checked':''} data-chg="impSet" data-a="${ai}" data-k="usar"> Aba “${esc(a.nome)}” · ${a.dados.length} linha(s)</label>
      <label class="small muted">Empresa <select data-chg="impSet" data-a="${ai}" data-k="empresa" style="width:auto">${opts(emps,a.empresa,'— escolher —')}</select></label></div>
    <div class="form" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr))">${IMP_CAMPOS.filter(([k])=>can.sens||k!=='salario_base').map(([k,l])=>`<label>${l}<select data-chg="impMap" data-a="${ai}" data-k="${k}">${opts(a.head.map((h,i)=>[i,h||'(coluna '+(i+1)+')']),a.map[k],'— não importar —')}</select></label>`).join('')}</div>
    ${a.dados.length?`<p class="muted small" style="margin:8px 0 0">Prévia: ${a.dados.slice(0,3).map(r=>esc(String(r[a.map.nome]||''))).join(' · ')}${a.dados.length>3?' …':''}</p>`:''}
  </div>`).join('');
  const ok=IMP.abas.some(a=>a.usar&&a.dados.length&&a.empresa&&a.map.nome!=null); $('#impGo').disabled=!ok;
}
ACT.impSet=(d,el)=>{ const a=IMP.abas[d.a]; a[d.k]=el.type==='checkbox'?el.checked:el.value; impDesenhar(); };
ACT.impMap=(d,el)=>{ const a=IMP.abas[d.a]; if(el.value==='') delete a.map[d.k]; else a.map[d.k]=Number(el.value); impDesenhar(); };
function impData(v){ if(!v) return null; if(v instanceof Date) return isoOf(v);
  if(typeof v==='number'){ const d=new Date(Math.round((v-25569)*864e5)); return isoOf(new Date(d.getTime()+d.getTimezoneOffset()*6e4)); }
  const m=String(v).match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/); if(m){ const y=m[3].length===2?'20'+m[3]:m[3]; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  const iso=String(v).match(/\d{4}-\d{2}-\d{2}/); return iso?iso[0]:null; }
ACT.impExecutar=async(d,btn)=>{
  btn.disabled=true; btn.textContent='Importando…';
  let novos=0,atual=0,postosNovos=0;
  for(const a of IMP.abas.filter(a=>a.usar&&a.empresa&&a.map.nome!=null)){
    for(const r of a.dados){
      const g=k=>a.map[k]!=null?r[a.map[k]]:'';
      const nome=String(g('nome')).trim().replace(/\s+/g,' ').toUpperCase(); if(!nome) continue;
      const obs=String(g('obs')||'').trim();
      const campos={nome,empresa:a.empresa};
      const setTxt=(k,v)=>{ v=String(v??'').trim(); if(v) campos[k]=v; };
      setTxt('funcao',g('funcao')); setTxt('cpf',g('cpf')); setTxt('escala',g('escala')); setTxt('turno',g('turno'));
      setTxt('telefone',g('telefone')); setTxt('pis',g('pis')); setTxt('rg',g('rg'));
      const ad=impData(g('admissao')); if(ad) campos.admissao=ad; const nc=impData(g('nascimento')); if(nc) campos.nascimento=nc;
      const pn=String(g('posto')||'').trim();
      if(pn){ let p=S.postos.find(p=>norm(p.nome)===norm(pn)); if(!p){ p=await api.insert('rh_postos',{nome:pn,ativo:true}); S.postos.push(p); postosNovos++; } campos.posto_id=p.id; }
      let c=S.colabs.find(x=>norm(x.nome)===norm(nome)&&x.empresa===a.empresa);
      if(c){ c=await api.update('rh_colaboradores',c.id,campos); Object.assign(colabById(c.id),c); atual++; }
      else { c=await api.insert('rh_colaboradores',{status:'ativo',tipo_contrato:'Prazo indeterminado',...campos}); S.colabs.push(c); novos++; }
      if(can.sens){
        const rem={colaborador_id:c.id};
        if(a.map.salario_base!=null){ const s=num(g('salario_base')); if(s) rem.salario_base=s; }
        if(obs){ rem.obs=obs;
          if(/ac[uú]mulo/i.test(obs)){ const m=obs.match(/ac[uú]mulo[^\d]{0,15}(\d{1,2})\s*%/i); rem.acumulo_pct=m?Number(m[1]):20; }
          const b=obs.match(/bonifica[cç][aã]o[^\d]{0,15}([\d.]+,\d{2}|\d+(?:\.\d+)?)/i); if(b) rem.bonificacao=num(b[1]);
          const ins=obs.match(/insalubr[^\d]{0,15}([\d.]+,\d{2}|\d+(?:\.\d+)?)/i); if(ins) rem.insalubridade=num(ins[1]); }
        if(Object.keys(rem).length>1){ S.rem[c.id]=await api.upsert('rh_remuneracao',{...(S.rem[c.id]||{}),...rem}); }
      }
    }
  }
  S.colabs.sort((a,b)=>a.nome.localeCompare(b.nome)); S.postos.sort((a,b)=>a.nome.localeCompare(b.nome));
  api.log('importou planilha',`${novos} novos, ${atual} atualizados`);
  closeModal(); toast(`${novos} novo(s), ${atual} atualizado(s)${postosNovos?`, ${postosNovos} posto(s) criado(s)`:''}.`); go('#/colaboradores');
};

      ${can.sens?`<div class="ficha-acts"><a class="btn btn-sm" href="#/kit/${c.id}">Kit defesa</a>${can.edit&&c.status!=='desligado'?`<button class="btn btn-sm" data-act="rsDaFicha" data-id="${c.id}">Iniciar rescisão</button>`:''}${S.resc.some(r=>r.colaborador_id===c.id)?`<a class="btn btn-sm" href="#/rescisao/${S.resc.filter(r=>r.colaborador_id===c.id).sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''))[0].id}">Ver rescisão</a>`:''}</div>`:''}</div></div>
