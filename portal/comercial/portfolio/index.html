<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gerador de Portfólio · C&amp;S</title>
<style>
@font-face{font-family:'Corm';src:url(fonts/Cormorant.woff2) format('woff2');font-weight:300 700;font-style:normal}
@font-face{font-family:'Corm';src:url(fonts/Cormorant-Italic.woff2) format('woff2');font-weight:300 700;font-style:italic}
@font-face{font-family:'Mont';src:url(fonts/Montserrat.woff2) format('woff2');font-weight:100 900}
:root{--gold:#C9A24A;--gold-d:#A47A26;--ink:#1A1813;--txt:#3b3830;--muted:#8d8678;--cream:#F4F0E7;--card:#FBF8F1;--line:#E4DAC4;--ui-line:#E3E0D8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Mont,system-ui,sans-serif;background:#ECEAE4;color:var(--txt)}
.topbar{height:56px;background:#0D0D0D;display:flex;align-items:center;gap:10px;padding:0 18px;position:sticky;top:0;z-index:50;border-bottom:2px solid #D4AF37}
.topbar .brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:14px}.topbar .brand img{height:30px}
.topbar .sp{flex:1}.estado{color:#cfc6ae;font-size:12px}.estado i{color:#e4a59c;font-style:normal}
.btn{font-family:inherit;font-size:13px;font-weight:600;border:none;border-radius:8px;padding:9px 14px;cursor:pointer}
.btn-gold{background:#D4AF37;color:#111}.btn-ghost{background:transparent;color:#EDE7D6;border:1px solid #4a463c}
.lnk{color:#e7c77a;font-size:12px;text-decoration:none;margin-left:4px}
.layout{display:grid;grid-template-columns:440px 1fr;height:calc(100vh - 56px)}
.editor{overflow-y:auto;background:#fff;border-right:1px solid var(--ui-line);padding:14px 16px 80px}
.preview{overflow:auto;background:#6b6a66;padding:26px}
#paper{display:flex;flex-direction:column;align-items:center;gap:22px}
.grp{border:1px solid var(--ui-line);border-radius:10px;margin-bottom:10px;background:#fff}
.grp>summary{list-style:none;cursor:pointer;padding:10px 12px;font-size:12px;font-weight:700;letter-spacing:.4px;color:#A67C1E;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.grp>summary::-webkit-details-marker{display:none}.grp>summary .sw{margin-left:auto;font-size:11px;font-weight:600;color:#6b675e;text-transform:none;letter-spacing:0;display:flex;align-items:center;gap:5px}
.grp .in{padding:0 12px 12px}
.fld{margin-bottom:9px}.fld label{display:block;font-size:11px;font-weight:600;color:#6b675e;margin-bottom:4px}.fld label i{font-weight:400;color:#9a968c}
.fld input,.fld textarea{width:100%;font-family:inherit;font-size:12.5px;color:#2c2a26;border:1px solid #d7d3c8;border-radius:7px;padding:7px 9px;outline:none}
.fld textarea{resize:vertical;min-height:60px;line-height:1.45}.fld input:focus,.fld textarea:focus{border-color:#D4AF37}
.hint{font-size:10.5px;color:#9a968c;line-height:1.45;margin-bottom:8px}
.opts{display:flex;flex-direction:column;gap:5px;margin-bottom:8px}.opts label{display:flex;gap:8px;align-items:center;font-size:12.5px;cursor:pointer}
.legrow{display:flex;gap:8px;align-items:center;margin-bottom:6px}.legrow img{width:34px;height:34px;object-fit:cover;border-radius:5px;flex:none}.legrow input{flex:1;min-width:0}
.fotos-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.fp{position:relative;border:2px solid transparent;border-radius:7px;padding:0;background:none;cursor:pointer;overflow:hidden}
.fp img{width:100%;height:62px;object-fit:cover;display:block;opacity:.45}.fp.on{border-color:#D4AF37}.fp.on img{opacity:1}
.fp span{position:absolute;top:3px;right:3px;background:#D4AF37;color:#111;font-size:10px;font-weight:700;border-radius:9px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a1a1a;color:#fff;border-left:3px solid #D4AF37;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%)}.toast.err{border-left-color:#d9534f}

/* ---------------- folhas do portfólio ---------------- */
.page{position:relative;width:210mm;height:297mm;background:var(--cream);padding:17mm 17mm 20mm;overflow:hidden;box-shadow:0 4px 22px rgba(0,0,0,.3);flex:0 0 auto}
.kk{font-size:7.6px;letter-spacing:3.4px;text-transform:uppercase;color:var(--gold-d);font-weight:600;margin-bottom:5px}
h1.t{font-family:Corm;font-weight:400;font-size:42.5px;line-height:1.05;color:var(--ink)}h1.t em{font-style:italic;color:var(--gold-d)}
.rl{width:62px;height:1.4px;background:var(--gold);margin:10px 0 14px}
p.ld{font-size:12.0px;line-height:1.75;color:var(--txt);font-weight:300}p.ld b{font-weight:600;color:var(--ink)}p.ld+p.ld{margin-top:9px}
ul.ck{list-style:none;margin-top:10px}ul.ck li{position:relative;padding-left:17px;font-size:11.8px;line-height:1.5;margin-bottom:5px;font-weight:300}
ul.ck li::before{content:"\2713";position:absolute;left:0;color:var(--gold-d);font-weight:700;font-size:11.2px}
.ft{position:absolute;left:17mm;right:17mm;bottom:10mm;border-top:1px solid var(--line);padding-top:5px;display:flex;justify-content:space-between;font-size:6.4px;letter-spacing:2.4px;color:var(--muted);text-transform:uppercase}
.ft b{color:var(--gold-d);letter-spacing:1px}
.cardx{background:var(--card);border:1px solid var(--line);border-radius:4px}
.ic{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--gold);display:flex;align-items:center;justify-content:center}
.ic svg{width:15px;height:15px;stroke:var(--gold-d);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* capa */
.capa{padding:14mm}.capa .fr{position:absolute;inset:9mm;border:1px solid var(--line)}
.capa .fr::before,.capa .fr::after{content:'';position:absolute;width:26px;height:26px;border-color:var(--gold);border-style:solid}
.capa .fr::before{top:-1px;left:-1px;border-width:2px 0 0 2px}.capa .fr::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
.capa .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 30mm}
.capa .mid img{width:118mm}.capa .k2{margin-top:16mm;font-size:8px;letter-spacing:4.6px;color:var(--gold-d);font-weight:600;text-transform:uppercase}
.capa .sub{font-family:Corm;font-size:20px;line-height:1.3;color:var(--ink);margin-top:9mm;font-weight:400}
.capa .slo{font-family:Corm;font-style:italic;font-size:15px;color:var(--gold-d);margin-top:7mm}
.capa .base{position:absolute;bottom:17mm;left:0;right:0;text-align:center;font-size:7.4px;letter-spacing:3.2px;color:var(--ink);font-weight:600;text-transform:uppercase}
.capa .base span{color:var(--muted);font-weight:400}
/* quem somos */
.qs{display:grid;grid-template-columns:1.25fr 1fr;gap:9mm;align-items:start}.qs img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:center 20%;border-radius:3px;box-shadow:0 8px 20px rgba(0,0,0,.14)}
.idt{margin-top:11mm}.idt .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm;margin-top:4mm}
.idt .cardx{padding:5mm}.idt h3{font-family:Corm;font-weight:500;font-size:21.2px;color:var(--gold-d);margin-bottom:3mm}.idt p{font-size:10.8px;line-height:1.6;font-weight:300}
.pal{margin-top:8mm;text-align:center;font-size:9.2px;letter-spacing:3px;color:var(--gold-d);font-weight:600}
/* serviços */
.sv{display:grid;grid-template-columns:1fr 1fr;gap:6mm 8mm;margin-top:8mm}.sv .s{display:flex;gap:4mm}.sv h4,.dif h4{font-family:Corm;font-size:19.4px;font-weight:600;color:var(--ink);margin-bottom:1.5mm;line-height:1.15}
.sv p,.dif p{font-size:10.5px;line-height:1.55;font-weight:300}
.cob{margin-top:9mm;display:flex;gap:4mm;align-items:center;padding:5mm 6mm;background:#F8F1DF;border:1px solid #E6D3A4;border-left:3px solid var(--gold);border-radius:3px}
.cob h4{font-family:Corm;font-size:20.0px;font-weight:600;color:var(--gold-d)}.cob p{font-size:10.8px;line-height:1.5;font-weight:300}
/* método */
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:5mm;margin-top:7mm}.st .n{font-family:Corm;font-size:35.0px;color:var(--gold);line-height:1}
.st .r{height:1px;background:var(--line);margin:2mm 0 2.5mm}.st h4{font-size:11.0px;font-weight:700;color:var(--ink);margin-bottom:1.5mm}.st p{font-size:10.0px;line-height:1.5;font-weight:300}
.ph{display:flex;flex-wrap:wrap;justify-content:center;gap:5mm;margin-top:10mm}.ph figure{width:44mm}
.ph img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:center 22%;display:block;border:3px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.14)}
.ph figcaption{font-size:6.4px;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold-d);font-weight:700;text-align:center;margin-top:2.5mm;line-height:1.5}
/* investimento */
.ct{margin-top:8mm;padding:6mm 7mm}.ct h4{font-size:12.0px;font-weight:700;color:var(--gold-d);margin-bottom:3mm}.ct .g2{display:grid;grid-template-columns:1fr 1fr;gap:0 8mm}.ct ul.ck{margin-top:0}
.dt{display:grid;grid-template-columns:repeat(3,1fr);gap:5mm;margin-top:9mm}.dt .cardx{text-align:center;padding:6mm 4mm;background:#F8F1DF;border-color:#E6D3A4}
.dt b{display:block;font-family:Corm;font-size:37.5px;color:var(--gold-d);font-weight:500;line-height:1}.dt h5{font-size:9.2px;letter-spacing:1.6px;text-transform:uppercase;margin:2mm 0 1.5mm;color:var(--ink)}
.dt p{font-size:10.0px;line-height:1.5;font-weight:300}.nt{margin-top:9mm;border-top:1px solid var(--line);padding-top:4mm;font-size:10.5px;font-style:italic;color:var(--muted);text-align:center;line-height:1.6}
/* condições */
.cd{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm;margin-top:6mm}.cd .cardx{padding:5mm}.cd h4{font-family:Corm;font-size:18.8px;font-weight:600;color:var(--gold-d);margin-bottom:2mm;line-height:1.15}.cd p{font-size:10.2px;line-height:1.55;font-weight:300}
.jur{margin-top:8mm;background:#141311;border-radius:3px;padding:6mm 7mm;color:#EDE6D4}.jur .kk{color:#E1C06A}.jur ul.ck{display:grid;grid-template-columns:1fr 1fr;gap:0 8mm}.jur ul.ck li{color:#E8E1CF}
.seg{margin-top:6mm;display:grid;grid-template-columns:1fr 1fr;gap:4mm}.seg .cardx{padding:5mm;display:flex;gap:4mm}.seg h4{font-size:11.5px;font-weight:700;color:var(--ink);margin-bottom:1.5mm}.seg p{font-size:10.2px;line-height:1.5;font-weight:300}
/* diferenciais */
.dif{display:grid;grid-template-columns:1fr 1fr;gap:5mm;margin-top:8mm}.dif .cardx{display:flex;gap:4mm;padding:5mm}
/* tecnologia */
.tc{margin-top:6mm;display:flex;flex-direction:column;gap:4mm}.tc .cardx{display:grid;grid-template-columns:50% 1fr;gap:5mm;padding:3mm;align-items:center}
.tc img{width:100%;display:block;border-radius:2px}.tc h4{font-family:Corm;font-size:16px;font-weight:600;color:var(--ink);line-height:1.15;margin-bottom:1.5mm}.tc p{font-size:8.2px;line-height:1.5;font-weight:300}.tc ul.ck{margin-top:2mm}.tc ul.ck li{font-size:8px;margin-bottom:2px}
/* referências */
.rf-top{text-align:center}.rf-top .lg{display:inline-block;background:#0D0D0D;padding:3mm 7mm;border-radius:3px}.rf-top .lg img{height:12mm;display:block}
.rf-top h1{font-family:Corm;font-weight:500;font-size:28px;letter-spacing:3px;color:var(--ink);margin-top:5mm}.rf-top .s2{font-size:6.6px;letter-spacing:2.6px;color:var(--muted);text-transform:uppercase;margin-top:1mm}
.rf-top .rl{margin:4mm auto 0;width:100%;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.rf-in{margin-top:5mm;padding:4mm 5mm;border-left:2px solid var(--gold);background:var(--card);font-size:8.2px;line-height:1.6;font-weight:300}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:3.5mm;margin-top:5mm}.rg .cardx{padding:4mm 5mm;border-top:2px solid var(--gold)}
.rg h4{font-family:Corm;font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.15}.rg .tg{display:inline-block;margin:1.5mm 0 2.5mm;font-size:5.8px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold-d);border:1px solid #E6D3A4;padding:1px 6px;font-weight:600}
.rg p{font-size:7.6px;line-height:1.6}.rg p span{display:inline-block;width:16mm;color:var(--muted);font-size:6px;letter-spacing:1.2px;text-transform:uppercase}.rg p b{color:var(--gold-d);font-weight:600}
.cn{display:grid;gap:3mm;margin-top:4mm}.cn img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;border-radius:2px}
.esp{margin-top:5mm;background:#0D0D0D;color:#EDE6D4;text-align:center;padding:3.5mm;border-radius:2px}.esp .kk{color:#E1C06A;margin-bottom:1.5mm}.esp p{font-size:7.8px}
/* fecho */
.cg{display:grid;grid-template-columns:1fr 1fr;gap:4mm;margin-top:8mm}.cg .cardx{display:flex;gap:4mm;align-items:center;padding:5mm}
.cg small{display:block;font-size:8.0px;letter-spacing:2px;text-transform:uppercase;color:var(--gold-d);font-weight:700;margin-bottom:1mm}.cg p{font-family:Corm;font-size:18.8px;color:var(--ink);line-height:1.25}
.fim{position:absolute;left:0;right:0;bottom:30mm;text-align:center}.fim img{width:62mm}.fim p{font-family:Corm;font-style:italic;font-size:17.5px;color:var(--gold-d);margin-top:4mm}
@page{size:A4;margin:0}
@media print{body{background:#fff}.topbar,.editor,.toast{display:none!important}.layout{display:block;height:auto}.preview{padding:0;overflow:visible;background:#fff}
  #paper{display:block}.page{box-shadow:none;page-break-after:always;break-after:page}.page:last-child{page-break-after:auto}}
</style>
</head>
<body>
<script src="/app/vendor/supabase.js"></script>
<script src="/app/config.js"></script>
<script src="/portal/_comum/cs-auth.js"></script>
<div class="topbar">
  <div class="brand"><img src="img/escudo.png" alt="C&amp;S"> · Gerador de Portfólio</div>
  <div class="sp"></div><span class="estado" id="estado" data-sujo="0"></span>
  <button class="btn btn-ghost" onclick="restaurar()">Texto padrão</button>
  <button class="btn btn-ghost" onclick="salvar()">Salvar</button>
  <button class="btn btn-gold" onclick="exportarPDF()">Exportar PDF</button>
  <a class="lnk" href="/portal/">Portal</a><a class="lnk" href="#" onclick="CSAuth.sair();return false">Sair</a>
</div>
<div class="layout"><div class="editor" id="editor"></div><div class="preview"><div id="paper"></div></div></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   GERADOR DE PORTFÓLIO C&S — apresentação institucional (antes de proposta).
   Textos próprios ficam em com_parametros 'portfolio'. Referências, cortesias,
   seguros, tecnologia e unidades vêm do Gerador de propostas ('propostas'),
   para as duas peças dizerem sempre a mesma coisa.
   ===================================================================== */
const AP='/portal/comercial/apresentacao/img/', PR='/portal/comercial/propostas/';
const FOTOS=[{k:'portaria',n:'Portaria e controle de acesso',src:'img/m-portaria.jpg'},{k:'limpeza',n:'Limpeza e conservação',src:'img/m-limpeza.jpg'},
  {k:'zeladoria',n:'Zeladoria',src:'img/m-zeladoria.jpg'},{k:'jardinagem',n:'Jardinagem e áreas verdes',src:'img/m-jardinagem.jpg'},
  {k:'garagem',n:'Lavagem e higienização de garagens',src:'img/m-garagem.jpg'},{k:'quem',n:'Portaria/Controle de acesso',src:'img/quem.jpg'},
  {k:'controle-acesso',n:'Controle de acesso',src:AP+'controle-acesso.jpg'},{k:'triciclo',n:'Triciclo de lixo',src:AP+'triciclo.jpg'},{k:'viaturas',n:'Supervisão móvel',src:AP+'viaturas.jpg'}];
const CONDOS=[{k:'condo-1',src:AP+'condo-1.jpg'},{k:'condo-2',src:AP+'condo-2.jpg'},{k:'condo-3',src:AP+'condo-3.jpg'},{k:'condo-4',src:AP+'condo-4.jpg'}];

/* base compartilhada (iguais ao Gerador de propostas; o banco sobrescreve) */
const B0={
  refsIntro:"A satisfação dos nossos clientes é o nosso maior compromisso. Apresentamos abaixo algumas das gestões condominiais atendidas pelo Grupo C&S, com os respectivos contatos autorizados para verificação do nosso padrão de qualidade e excelência em atendimento.",
  refs:[["High Belém","Grande porte / Alto padrão","Contato","Zafira (administrador)","(11) 2056-2036 · a/c Sra Jane"],
    ["Smart Studio","Grande porte / Alto padrão","Contato","Zafira (administrador)","(11) 2056-2036 · a/c Sra Jane"],
    ["Condomínio Flex Suzano","Grande porte / Residencial","Síndico","Fabio","(11) 94021-4631"],
    ["Paulista I","Grande porte / Residencial","Síndico","Alex","(11) 97170-4521"],
    ["Condomínio Ecoway","Grande porte / Condomínio clube","Síndico","Robson","(11) 95290-9557"],
    ["Condomínio Residencial Nova Petrópolis II","Médio porte / Residencial","Síndica","Deise","(11) 94905-7572"],
    ["Condomínio Solar das Oliveiras","Médio porte / Residencial","Síndica","Adriana","(11) 96669-9348"]],
  contempla:["Salários, encargos e benefícios conforme CCT","Cobertura de faltas, férias e afastamentos","Vale-transporte e refeição da equipe","Uniformes completos e EPIs","Supervisão periódica e gestão da operação","Emissão de nota fiscal de serviços"],
  cortesias:[["Materiais de higiene","Fornecimento básico de materiais de limpeza e higiene para as áreas comuns, renovados mensalmente."],["Rádios de comunicação (HT)","Comunicação digital entre os postos, em regime de comodato."],["Celulares corporativos","Canal direto da portaria com moradores, administração e supervisão."],["Veículo de transporte de lixo","Veículo específico e preparado para coleta e transporte de lixo na área do condomínio."],["Carrinho de limpeza multifuncional","Equipamento profissional completo para a rotina de conservação."],["Relógio de ponto digital","Registro digital de jornada da equipe, com controle de frequência e transparência na gestão."],["Primeira lavagem de garagem e áreas comuns","Lavagem inicial das áreas de garagem e comuns na implantação, como cortesia de boas-vindas (serviço único)."],["Serviços de jardinagem (1x ao mês)","Manutenção mensal de jardins e áreas verdes, como cortesia durante a vigência do contrato."]],
  seguros:[["Seguro de Responsabilidade Civil","Nossa empresa conta com seguro de Responsabilidade Civil, garantindo a segurança de suas atividades."],["Seguro de vida e acidentes de trabalho","Nossos colaboradores contam com seguro de vida e acidentes de trabalho, uma segurança jurídica ainda maior ao contratante."]],
  tecIntro:"Para complementar a operação de portaria e controle de acesso, a C&S disponibiliza soluções tecnológicas que trazem mais agilidade, controle e autonomia ao dia a dia do condomínio.",
  tecNota:"Imagens ilustrativas. Instalação e configuração conforme a estrutura do condomínio, definidas em visita técnica.",
  tecnologias:[{k:"rfid",titulo:"Identificação veicular por RFID (TAG UHF)",desc:"TAG instalada no para-brisa e lida automaticamente na chegada do veículo, com liberação de portão ou cancela sem parar.",itens:"Acesso rápido para veículos cadastrados\nRegistro automático de entradas e saídas\nIntegração com portaria, cancelas e CFTV\nOperação contínua 24 horas",img:"img/tec-rfid.jpg"},
    {k:"totem",titulo:"Totem de monitoramento 24h",desc:"Totem na entrada do condomínio com câmeras de alta definição e cobertura 360°, interfone com a portaria e sinalização de área monitorada.",itens:"Monitoramento contínuo da entrada e áreas estratégicas\nControle de acesso veicular integrado\nInterfone direto com a portaria\nIntegração com os programas Smart Sampa e Smart Suzano (mediante adesão)",img:"img/tec-totem.jpg"},
    {k:"armario",titulo:"Armário inteligente para encomendas",desc:"Compartimentos individuais para receber encomendas 24 horas, com retirada pelo morador por código, QR Code ou aplicativo.",itens:"Recebimento de encomendas 24 horas\nAviso automático ao morador no recebimento e na retirada\nRetirada no horário ideal, sem depender da portaria\nMenos fluxo e mais organização na portaria",img:"img/tec-armario.jpg"}],
  locais:{carrao:{nome:"Vila Carrão (São Paulo)",tel:"(11) 92661-2817 · (11) 92524-2324",end:"Av. Conselheiro Carrão, 258, sala 8 – São Paulo, SP"},suzano:{nome:"Suzano",tel:"(11) 92661-2817 · (11) 95324-2324",end:"Av. Rio de Janeiro, 100 – Suzano, SP"}}
};
/* textos próprios do portfólio (base: apresentação institucional atual) */

  h+=g('servicos',f('Abertura','servIntro',3)+f('Serviços','servicos',8,'Serviço | descrição, um por linha')+f('Quadro de destaque','cobertura',3,'Título | texto'));
  h+=g('metodo',f('Abertura','metodoIntro',3)+f('Etapas','passos',5,'Etapa | descrição')+'<div class="fld"><label>Fotos <i>(clique na ordem em que vão aparecer)</i></label><div class="fotos-pick">'+
    FOTOS.map(x=>{const i=C.fotos.indexOf(x.k);return '<button type="button" class="fp'+(i>=0?' on':'')+'" title="'+esc(leg(x))+'" onclick="ordem(\'fotos\',\''+x.k+'\')"><img src="'+x.src+'" alt="">'+(i>=0?'<span>'+(i+1)+'</span>':'')+'</button>';}).join('')+'</div></div>'+
    '<div class="fld"><label>Legendas das fotos <i>(em branco: legenda padrão)</i></label>'+C.fotos.map(k=>{const x=FOTOS.find(q=>q.k===k);if(!x)return '';
      return '<div class="legrow"><img src="'+x.src+'" alt=""><input value="'+esc((C.legendas||{})[k]||'')+'" placeholder="'+esc(x.n)+'" oninput="setLeg(\''+k+'\',this.value)"></div>';}).join('')+'</div>');
  h+=g('invest',f('Chamada','investKicker')+f('Texto','investTexto',5)+f('Destaques','destaques',4,'Número | título | texto')+f('Nota final','investNota',3)+'<div class="hint">A lista "O valor mensal já contempla" vem dos Parâmetros das propostas.</div>');
  h+=g('condicoes',f('Condições','condicoes',8,'Título | texto')+f('Segurança jurídica','juridico',6,'um por linha')+
    '<label class="opts"><span><input type="checkbox" '+(C.mostrarSeguros?'checked':'')+' onchange="setv(\'mostrarSeguros\',this.checked)"> Mostrar "Seguros e garantias"</span></label>');
  h+=g('diferenciais',f('Abertura','difIntro',3)+'<div class="opts">'+B.cortesias.map(c=>'<label><input type="checkbox" '+(C.difSel.includes(c[0])?'checked':'')+' onchange="marca(\'difSel\',\''+esc(c[0]).replace(/'/g,"\\'")+'\',this.checked)"> '+esc(c[0])+'</label>').join('')+'</div>');
  h+=g('tecnologia',f('Complemento da abertura','tecExtra',2)+'<div class="opts">'+B.tecnologias.map(t=>'<label><input type="checkbox" '+(C.tecSel.includes(t.k)?'checked':'')+' onchange="marca(\'tecSel\',\''+t.k+'\',this.checked)"> '+esc(t.titulo)+'</label>').join('')+'</div>');
  h+=g('refs','<div class="hint">Clique na ordem em que as referências vão aparecer (até 8).</div><div class="opts">'+B.refs.map(r=>{const i=C.refsSel.indexOf(r[0]);return '<label><input type="checkbox" '+(i>=0?'checked':'')+' onchange="refTroca(\''+esc(r[0]).replace(/'/g,"\\'")+'\',this.checked)"> '+(i>=0?'<b>'+(i+1)+'.</b> ':'')+esc(r[0])+' <span style="color:#9a968c">· '+esc(r[3])+'</span></label>';}).join('')+'</div>'+
    '<div class="fld"><label>Fotos de condomínios</label><div class="fotos-pick">'+CONDOS.map(x=>{const i=C.condos.indexOf(x.k);return '<button type="button" class="fp'+(i>=0?' on':'')+'" onclick="ordem(\'condos\',\''+x.k+'\')"><img src="'+x.src+'" alt="">'+(i>=0?'<span>'+(i+1)+'</span>':'')+'</button>';}).join('')+'</div></div>'+f('Especialidades','especialidades'));
  h+=g('fecho',f('Texto','fechoTexto',4)+f('WhatsApp','whatsapp')+f('E-mail','email')+f('Site','site')+'<div class="opts">'+Object.keys(B.locais).map(k=>'<label><input type="checkbox" '+(C.unidades.includes(k)?'checked':'')+' onchange="marca(\'unidades\',\''+k+'\',this.checked)"> Unidade '+esc(B.locais[k].nome)+'</label>').join('')+'</div>');
  $('editor').innerHTML=h;estado();
}
function refTroca(nm,on){if(on&&C.refsSel.length>=8){toast('No máximo 8 referências por página.',1);editor();return}marca('refsSel',nm,on);}

/* ---------- banco ---------- */
async function carregar(){
  const r=await sb.from('com_parametros').select('chave,valor').in('chave',['propostas','portfolio']);
  (r.data||[]).forEach(x=>{const v=x.valor||{};
    if(x.chave==='propostas'){Object.keys(B0).forEach(k=>{if(v[k]!=null)B[k]=v[k];});
      if(!B.refs.some(r=>/flex/i.test(r[0])))B.refs.splice(2,0,B0.refs[2]);}       // Flex ainda não salvo nos parâmetros
    if(x.chave==='portfolio')Object.keys(C0).forEach(k=>{if(v[k]!=null)C[k]=v[k];});});
  C.paginas=Object.assign({},C0.paginas,C.paginas);}
async function salvar(sil){const r=await sb.from('com_parametros').upsert({chave:'portfolio',valor:C});
  if(r.error){toast('Não foi possível salvar: '+r.error.message,1);return false}$('estado').dataset.sujo='0';estado();if(!sil)toast('Portfólio salvo.');return true;}
function restaurar(){if(!confirm('Voltar todos os textos do portfólio ao padrão? (Referências, cortesias e tecnologia continuam vindo dos Parâmetros das propostas.)'))return;C=JSON.parse(JSON.stringify(C0));render();editor();sujo();toast('Texto padrão carregado. Clique em Salvar para manter.');}
async function exportarPDF(){if($('estado').dataset.sujo==='1')await salvar(true);
  await Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r;})));await document.fonts.ready;
  const t=document.title;document.title='Apresentacao_Institucional_CS';setTimeout(()=>{window.print();document.title=t;},150);}

render();editor();
CSAuth.iniciar({sistema:'o Gerador de Portfólio', papeis:['comercial','diretoria']}).then(async r=>{
  sb=r.sb;try{await carregar();}catch(e){toast('Não foi possível carregar os parâmetros.',1)}render();editor();
}).catch(()=>{});
window.addEventListener('beforeunload',e=>{if($('estado').dataset.sujo==='1'){e.preventDefault();e.returnValue='';}});
</script>
