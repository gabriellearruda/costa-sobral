<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Motor Comercial C&amp;S</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
:root{
  --ink:#0D0D0D; --gold:#C79A3B; --gold-deep:#9E7424; --silver:#C7C7C7; --cream:#F3F0E9;
  --bg:#F3F0E9; --surface:#FFFDF8; --surface-2:#F8F5EE; --sunk:#ECE7DC;
  --text:#1B1914; --text-2:#4A463D; --muted:#7A7466; --line:#E2DBCC; --line-strong:#CFC6B3;
  --accent:#9E7424; --accent-fill:#C79A3B; --accent-soft:#F4EAD4; --on-accent:#0D0D0D;
  --side:#0D0D0D; --side-text:#D9D4C8; --side-muted:#8C8676; --side-line:#26241F;
  --hot:#B5412C; --hot-soft:#F7E2DC; --warm:#B7791F; --warm-soft:#F8ECD6;
  --cold:#3F6E91; --cold-soft:#E1EAF2; --ok:#3B7A50; --ok-soft:#DFEEE3;
  --shadow:0 1px 2px rgba(40,30,10,.06),0 8px 24px rgba(40,30,10,.07);
  --radius:10px; --radius-s:6px;
  --f-display:"Cormorant Garamond","Cormorant",Georgia,"Times New Roman",serif;
  --f-ui:"Montserrat","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11100E; --surface:#1A1916; --surface-2:#201E1A; --sunk:#0C0B0A;
    --text:#EDE8DC; --text-2:#C9C2B3; --muted:#9A9384; --line:#2D2A24; --line-strong:#3D3930;
    --accent:#D9AE55; --accent-fill:#C79A3B; --accent-soft:#2E2617; --on-accent:#0D0D0D;
    --side:#080807; --side-line:#1F1D19;
    --hot:#E0735E; --hot-soft:#3A1F19; --warm:#E0A64A; --warm-soft:#35291A;
    --cold:#7FAAD0; --cold-soft:#1B2833; --ok:#6DB585; --ok-soft:#1A2B20;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11100E; --surface:#1A1916; --surface-2:#201E1A; --sunk:#0C0B0A;
  --text:#EDE8DC; --text-2:#C9C2B3; --muted:#9A9384; --line:#2D2A24; --line-strong:#3D3930;
  --accent:#D9AE55; --accent-fill:#C79A3B; --accent-soft:#2E2617; --on-accent:#0D0D0D;
  --side:#080807; --side-line:#1F1D19;
  --hot:#E0735E; --hot-soft:#3A1F19; --warm:#E0A64A; --warm-soft:#35291A;
  --cold:#7FAAD0; --cold-soft:#1B2833; --ok:#6DB585; --ok-soft:#1A2B20;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent-fill);outline-offset:2px}
.num,td.n,.tab{font-variant-numeric:tabular-nums}
/* Cormorant usa algarismos 'antigos' por padrão; números sempre alinhados */
.kpi .v,.golden .big,.lane-h .c,.score-ring b,.topbar h1,.display,.drawer-h h2,.modal-h h3,.login-card h1,.brand b{font-variant-numeric:lining-nums tabular-nums;font-feature-settings:'lnum' 1,'tnum' 1}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
.display{font-family:var(--f-display);font-weight:600;letter-spacing:.005em}
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:12px} .tiny{font-size:11px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Login ---------- */
#login{min-height:100%;display:grid;place-items:center;background:var(--ink);padding:24px 16px}
.login-card{width:100%;max-width:380px;color:#EDE8DC;text-align:center}
.emblem{display:inline-grid;place-items:center;width:64px;height:64px;border:1px solid var(--gold);border-radius:50%;font-family:var(--f-display);font-size:24px;color:var(--gold);font-weight:600}
.login-card h1{font-family:var(--f-display);font-size:34px;font-weight:600;margin-top:14px;color:#F3F0E9}
.login-card .tagline{color:#8C8676;font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin:4px 0 26px}
.login-card form{display:grid;gap:10px;text-align:left}
.login-card label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8C8676}
.login-card input{width:100%;padding:12px 14px;background:#161513;border:1px solid #2D2A24;border-radius:8px;color:#F3F0E9}
.login-card input:focus{border-color:var(--gold);outline:none}
.login-card .btn-gold{margin-top:8px;padding:12px}
.login-msg{min-height:20px;font-size:12.5px;color:#E0A64A;text-align:center}
.linkbtn{background:none;border:0;color:#B8AE98;text-decoration:underline;cursor:pointer;font-size:12px;padding:4px}

/* ---------- Shell ---------- */
#app{display:grid;grid-template-columns:232px 1fr;height:100%}
.side{background:var(--side);color:var(--side-text);display:flex;flex-direction:column;padding:20px 14px;gap:18px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand .emblem{width:42px;height:42px;font-size:16px;flex:none}
.brand b{display:block;font-family:var(--f-display);font-size:21px;color:#F3F0E9;line-height:1.05;font-weight:600}
.brand span{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--side-muted)}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border:0;background:none;border-radius:8px;color:var(--side-text);cursor:pointer;text-align:left;font-size:13px;font-weight:500}
.nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;opacity:.8}
.nav button:hover{background:#1A1916}
.nav button[aria-current="page"]{background:#1E1B15;color:var(--gold)}
.nav button[aria-current="page"] svg{opacity:1}
.nav .badge{margin-left:auto;background:var(--gold);color:#0D0D0D;border-radius:20px;font-size:10.5px;font-weight:700;padding:1px 7px}
.side-foot{margin-top:auto;border-top:1px solid var(--side-line);padding-top:14px;display:grid;gap:8px;font-size:12px}
.side-foot .who{display:flex;align-items:center;gap:9px}
.avatar{width:30px;height:30px;border-radius:50%;background:#2A261E;color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.side-foot .linkbtn{color:var(--side-muted);text-align:left;padding:0}
.mode-pill{font-size:10.5px;color:#0D0D0D;background:var(--gold);border-radius:4px;padding:3px 7px;font-weight:600;letter-spacing:.02em}

.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--bg);flex-wrap:wrap}
.topbar h1{font-family:var(--f-display);font-size:28px;font-weight:600;line-height:1.1}
.topbar .sub{font-size:12px;color:var(--muted)}
.topbar .spacer{flex:1}
.search{position:relative}
.search input{width:240px;max-width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2}
.search-results{position:absolute;top:calc(100% + 4px);left:0;right:0;min-width:280px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);z-index:40;max-height:340px;overflow:auto}
.search-results button{display:block;width:100%;text-align:left;padding:8px 12px;border:0;background:none;cursor:pointer;border-bottom:1px solid var(--line)}
.search-results button:hover{background:var(--surface-2)}
.content{flex:1;overflow:auto;padding:22px 24px 90px}
.demo-banner{background:var(--accent-soft);color:var(--text-2);border:1px solid var(--line-strong);border-radius:8px;padding:8px 12px;font-size:12.5px;margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- Buttons & form ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:600;font-size:12.5px;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--accent-fill)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#0D0D0D}
.btn-gold:hover{background:#D4A84B;border-color:#D4A84B}
.btn-ink{background:var(--ink);border-color:var(--ink);color:#F3F0E9}
:root[data-theme="dark"] .btn-ink{background:#2A2721;border-color:#3D3930}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-ink{background:#2A2721;border-color:#3D3930}}
.btn-wa{background:#1F7A4D;border-color:#1F7A4D;color:#fff}
.btn-wa:hover{background:#18643F;border-color:#18643F}
.btn-ghost{background:none;border-color:transparent}
.btn-ghost:hover{background:var(--surface-2);border-color:var(--line)}
.btn-danger{color:var(--hot)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-icon{padding:6px;width:32px;height:32px}
.btn[disabled],.btn.disabled{opacity:.5;cursor:not-allowed}
.field{display:grid;gap:4px;min-width:0}
.field>span{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field>span .gold{color:var(--accent)}
.input,select.input,textarea.input{width:100%;padding:8px 10px;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);min-width:0}
textarea.input{resize:vertical;min-height:70px}
.input:focus{border-color:var(--accent-fill);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.span2{grid-column:span 2}.span3{grid-column:1/-1}
.chips-input{display:flex;flex-wrap:wrap;gap:6px}
.chip-toggle{border:1px solid var(--line-strong);background:var(--surface);border-radius:20px;padding:4px 11px;font-size:12px;cursor:pointer}
.chip-toggle[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-fill);color:var(--text);font-weight:600}
.check{display:flex;align-items:center;gap:8px;font-size:13px}

/* ---------- Pills & badges ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:600;white-space:nowrap;line-height:1.6}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.nodot::before{display:none}
.t-Quente{background:var(--hot-soft);color:var(--hot)}
.t-Morno{background:var(--warm-soft);color:var(--warm)}
.t-Frio{background:var(--cold-soft);color:var(--cold)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-gold{background:var(--accent-soft);color:var(--accent)}
.p-mute{background:var(--sunk);color:var(--text-2)}
.p-hot{background:var(--hot-soft);color:var(--hot)}
.stage-tag{font-size:11px;font-weight:600;color:var(--text-2);background:var(--sunk);padding:2px 8px;border-radius:4px;white-space:nowrap}

/* ---------- Panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h2{font-size:14px;font-weight:700}
.panel-h .spacer{flex:1}
.panel-b{padding:16px}
.stack{display:grid;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:18px;align-items:start}
.cols-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:18px}
.kpi{background:var(--surface);padding:14px 16px;display:grid;gap:2px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:32px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .d{font-size:12px;color:var(--text-2)}
.kpi.alert .v{color:var(--hot)}

/* ---------- Queue (Hoje) ---------- */
.queue{display:grid}
.q-item{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:0 14px;padding:14px 16px 14px 0;border-bottom:1px solid var(--line);align-items:start}
.q-item:last-child{border-bottom:0}
.q-item .sev{align-self:stretch;border-radius:0 3px 3px 0;background:var(--line-strong)}
.q-item.s-hot .sev{background:var(--hot)} .q-item.s-warm .sev{background:var(--warm)} .q-item.s-gold .sev{background:var(--accent-fill)} .q-item.s-cold .sev{background:var(--cold)} .q-item.s-ok .sev{background:var(--ok)}
.q-main{min-width:0;display:grid;gap:4px}
.q-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.q-title button{border:0;background:none;padding:0;font-weight:700;font-size:14.5px;cursor:pointer;text-align:left;color:var(--text)}
.q-title button:hover{color:var(--accent)}
.q-why{font-size:13px;color:var(--text-2)}
.q-why b{color:var(--text)}
.q-meta{font-size:11.5px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.q-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:320px}
.q-filter{display:flex;gap:4px;background:var(--sunk);padding:3px;border-radius:8px}
.q-filter button{border:0;background:none;padding:5px 10px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;color:var(--text-2)}
.q-filter button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* metas */
.meta-row{display:grid;gap:6px;padding:10px 0;border-bottom:1px dashed var(--line)}
.meta-row:last-child{border-bottom:0}
.meta-row .top{display:flex;justify-content:space-between;font-size:12.5px}
.meta-row .top b{font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent-fill);border-radius:4px}
.bar.done i{background:var(--ok)}

/* ---------- Kanban ---------- */
.kanban-wrap{overflow-x:auto;padding-bottom:8px;margin:0 -24px;padding-inline:24px}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:250px;gap:12px;align-items:start;min-height:60vh}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;max-height:calc(100vh - 200px)}
.col-h{padding:10px 12px;border-bottom:1px solid var(--line);display:grid;gap:2px}
.col-h .t{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase}
.col-h .t span{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.col-h .s{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.col-b{padding:8px;display:grid;gap:8px;overflow-y:auto;min-height:80px;align-content:start}
.col.drop{outline:2px dashed var(--accent-fill);outline-offset:-2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;display:grid;gap:6px;cursor:grab}
.card:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.card .n{font-weight:700;font-size:13px;line-height:1.3}
.card .m{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.card .v{font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.countdown{font-size:11px;font-weight:600;padding:1px 7px;border-radius:4px;background:var(--sunk);color:var(--text-2)}
.countdown.urg{background:var(--hot-soft);color:var(--hot)} .countdown.soon{background:var(--warm-soft);color:var(--warm)}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:default;background:var(--surface)}
table.t th[data-sort]{cursor:pointer}
table.t th[data-sort]:hover{color:var(--text)}
table.t td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--surface-2)}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters select.input,.filters input.input{width:auto;padding:6px 9px;font-size:12.5px}

/* ---------- Janela ---------- */
.lanes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.lane{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;min-width:0}
.lane-h{padding:10px 12px;border-bottom:1px solid var(--line)}
.lane-h .t{font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.lane-h .c{font-family:var(--f-display);font-size:28px;font-weight:600;line-height:1}
.lane.l0 .lane-h{border-top:3px solid var(--hot);border-radius:var(--radius) var(--radius) 0 0}
.lane.l1 .lane-h{border-top:3px solid var(--hot)}
.lane.l2 .lane-h{border-top:3px solid var(--warm)}
.lane.l3 .lane-h{border-top:3px solid var(--accent-fill)}
.lane.l4 .lane-h,.lane.l5 .lane-h{border-top:3px solid var(--line-strong)}
.lane .lane-h{border-radius:var(--radius) var(--radius) 0 0}
.lane-b{padding:6px;display:grid;gap:6px;align-content:start;max-height:420px;overflow:auto}
.mini{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--surface-2);cursor:pointer;display:grid;gap:2px}
.mini:hover{border-color:var(--accent-fill)}
.mini b{font-size:12.5px;line-height:1.3}
.mini span{font-size:11px;color:var(--muted)}

/* ---------- Charts ---------- */
.hbar{display:grid;grid-template-columns:minmax(90px,130px) minmax(0,1fr) auto;gap:6px 10px;align-items:center;font-size:12.5px}
.hbar .track{height:14px;background:var(--sunk);border-radius:0 4px 4px 0;position:relative}
.hbar .fill{height:100%;background:var(--accent-fill);border-radius:0 4px 4px 0;min-width:2px}
.hbar .fill.alt{background:var(--hot)}
.hbar .val{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap}
.hbar .lab{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-ui)}
.chart .gridl{stroke:var(--line);stroke-width:1}
.chart .barm{fill:var(--accent-fill)}
.chart .barm:hover{fill:var(--gold-deep)}
.chart .metal{stroke:var(--text-2);stroke-width:1.5;stroke-dasharray:4 4;fill:none}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:#F3F0E9;font-size:12px;padding:6px 9px;border-radius:6px;z-index:100;white-space:nowrap;box-shadow:var(--shadow)}

/* ---------- Drawer (ficha) ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,9,7,.45);z-index:50;display:flex;justify-content:flex-end}
.drawer{width:min(720px,100%);height:100%;background:var(--bg);display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.2);animation:slidein .18s ease-out}
@keyframes slidein{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
.drawer-h{background:var(--ink);color:#EDE8DC;padding:16px 20px 0;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.drawer-h .top{display:flex;gap:12px;align-items:flex-start}
.drawer-h h2{font-family:var(--f-display);font-size:28px;font-weight:600;color:#F3F0E9;line-height:1.1}
.drawer-h .meta{font-size:12px;color:#9A9384;margin-top:3px}
.drawer-h .close{margin-left:auto;background:none;border:1px solid #3D3930;color:#EDE8DC;border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:18px;flex:none}
.score-ring{flex:none;width:56px;height:56px;position:relative}
.score-ring svg{width:56px;height:56px;transform:rotate(-90deg)}
.score-ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:22px;color:#F3F0E9}
.tabs{display:flex;gap:2px;margin-top:14px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:#9A9384;padding:9px 12px;cursor:pointer;font-weight:600;font-size:12.5px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--gold)}
.drawer-b{flex:1;overflow:auto;padding:18px 20px 40px}
.drawer-f{border-top:1px solid var(--line);padding:12px 20px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;background:var(--surface);flex-wrap:wrap}
.actions-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.info-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.info-grid>div{background:var(--surface);padding:10px 12px;min-width:0}
.info-grid dt{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.info-grid dd{margin:2px 0 0;font-weight:600;overflow-wrap:anywhere}
.golden{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:var(--radius);background:var(--accent-soft);border:1px solid var(--line-strong)}
.golden .big{font-family:var(--f-display);font-size:38px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
.next-act{padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.timeline{display:grid;gap:0}
.tl{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:8px 0;position:relative}
.tl::before{content:"";position:absolute;left:13px;top:34px;bottom:-8px;width:1px;background:var(--line)}
.tl:last-child::before{display:none}
.tl .ic{width:28px;height:28px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--text-2)}
.tl .ic.wa{background:#DCEFE4;color:#1F7A4D}
.tl .ic.st{background:var(--accent-soft);color:var(--accent)}
.tl .body{font-size:13px}
.tl .when{font-size:11px;color:var(--muted)}
.hint{font-size:12.5px;padding:10px 12px;border-radius:8px;background:var(--surface-2);border:1px dashed var(--line-strong);color:var(--text-2)}
.hint b{color:var(--text)}

/* ---------- Modal ---------- */
.modal-scrim{position:fixed;inset:0;background:rgba(10,9,7,.5);z-index:70;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:12px;width:min(560px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;box-shadow:var(--shadow);border:1px solid var(--line)}
.modal.wide{width:min(960px,100%)}
.modal-h{padding:16px 18px 10px;display:flex;align-items:flex-start;gap:10px}
.modal-h h3{font-family:var(--f-display);font-size:24px;font-weight:600;line-height:1.15}
.modal-h p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.modal-h .x{margin-left:auto;border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted)}
.modal-b{padding:6px 18px 16px;overflow:auto;display:grid;gap:12px}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.quick-dates{display:flex;gap:6px;flex-wrap:wrap}
.preview-msg{white-space:pre-wrap;background:#E7F3EA;color:#14301F;border-radius:10px 10px 10px 2px;padding:10px 12px;font-size:13px;line-height:1.45;border:1px solid #CFE5D6}
.tpl-list{display:grid;gap:6px;max-height:220px;overflow:auto}
.tpl-opt{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;background:var(--surface);text-align:left;width:100%}
.tpl-opt[aria-pressed="true"]{border-color:var(--accent-fill);background:var(--accent-soft)}
.tpl-opt small{margin-left:auto;color:var(--muted)}

/* ---------- Toast ---------- */
#toasts{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:90;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--ink);color:#F3F0E9;padding:10px 14px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;border-left:3px solid var(--gold)}
.toast button{background:none;border:0;color:var(--gold);font-weight:700;cursor:pointer}

/* ---------- FAB & mobile nav ---------- */
.fab{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:var(--gold);color:#0D0D0D;border:0;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:28px;cursor:pointer;z-index:30;display:grid;place-items:center}
.fab:hover{background:#D4A84B}
.mnav{display:none}

@media (max-width:1100px){
  .cols,.cols-2{grid-template-columns:minmax(0,1fr)}
  .lanes{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:820px){
  #app{grid-template-columns:1fr}
  .side{display:none}
  .topbar{padding:12px 16px}
  .topbar h1{font-size:24px}
  .search{order:3;width:100%}
  .search input{width:100%}
  .content{padding:16px 16px 110px}
  .kanban-wrap{margin:0 -16px;padding-inline:16px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .v{font-size:26px}
  .q-item{grid-template-columns:4px minmax(0,1fr)}
  .q-actions{grid-column:2;justify-content:flex-start;max-width:none;margin-top:6px}
  .lanes{grid-template-columns:minmax(0,1fr)}
  .grid2,.grid3,.info-grid{grid-template-columns:minmax(0,1fr)}
  .span2{grid-column:auto}
  .mnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--side);padding:6px 4px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));z-index:35;justify-content:space-around}
  .mnav button{background:none;border:0;color:var(--side-muted);display:grid;justify-items:center;gap:2px;font-size:10px;font-weight:600;padding:4px 6px;cursor:pointer;position:relative}
  .mnav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6}
  .mnav button[aria-current="page"]{color:var(--gold)}
  .mnav .dot{position:absolute;top:0;right:4px;background:var(--gold);color:#0D0D0D;border-radius:10px;font-size:9px;padding:0 5px}
  .fab{bottom:calc(76px + env(safe-area-inset-bottom,0px));right:16px}
  .hide-m{display:none!important}
  table.t.cardify thead{display:none}
  table.t.cardify tr{display:grid;grid-template-columns:minmax(0,1fr) auto;padding:10px 4px;border-bottom:1px solid var(--line)}
  table.t.cardify td{border:0;padding:1px 8px}
  table.t.cardify td.opt{display:none}
}
@media (min-width:821px){.only-m{display:none!important}}

.emblem img{width:74%;height:74%;object-fit:contain;display:block}
</style>

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));

const pad = n => String(n).padStart(2, '0');
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => isoDate(new Date());
const addDays = (iso, n) => { const d = parseD(iso || today()); d.setDate(d.getDate() + n); return isoDate(d); };

function daysFrom(s) { // dias de hoje até a data (positivo = futuro)
  if (!s) return null; const d = parseD(s); const t = parseD(today()); d.setHours(0, 0, 0, 0);
  return Math.round((d - t) / 864e5);
}
function daysSince(ts) { if (!ts) return null; return Math.floor((Date.now() - new Date(ts).getTime()) / 864e5); }
const fmtD = s => { if (!s) return '—'; const d = parseD(s); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`; };
const fmtDs = s => { if (!s) return '—'; const d = parseD(s); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}`; };
const fmtDT = s => { if (!s) return '—'; const d = new Date(s); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const brl = v => v == null || v === '' || isNaN(v) ? '—' : Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
const brlK = v => { v = Number(v) || 0; if (Math.abs(v) >= 1e6) return 'R$ ' + (v / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mi'; if (Math.abs(v) >= 1e4) return 'R$ ' + Math.round(v / 1e3).toLocaleString('pt-BR') + ' mil'; return brl(v); };
const int = v => (Number(v) || 0).toLocaleString('pt-BR');
const firstName = s => { const t = String(s || '').trim().split(/\s+/); return (/^(sr|sra|srta|dona|dr|dra|seu)\.?$/i.test(t[0] || '') && t[1] ? t[0] + ' ' + t[1] : t[0]) || ''; };
const initials = s => String(s || '?').trim().split(/\s+/).slice(0, 2).map(p => p[0]).join('').toUpperCase();
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
const digits = s => String(s || '').replace(/\D/g, '');
function cnpjValido(c) {
  c = digits(c); if (c.length !== 14 || /^(\d)\1{13}$/.test(c)) return false;
  const dv = (b, p) => { const r = b.split('').reduce((a, d, i) => a + Number(d) * p[i], 0) % 11; return r < 2 ? 0 : 11 - r; };
  const d1 = dv(c.slice(0, 12), [5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2]); const d2 = dv(c.slice(0, 12) + d1, [6, 5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2]);
  return c.endsWith(`${d1}${d2}`);
}
const fmtCnpj = c => { c = digits(c); return c.length === 14 ? `${c.slice(0, 2)}.${c.slice(2, 5)}.${c.slice(5, 8)}/${c.slice(8, 12)}-${c.slice(12)}` : (c || ''); };
const brDateToIso = s => { const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(s || '').trim()); return m ? `${m[3]}-${m[2]}-${m[1]}` : (/^\d{4}-\d{2}-\d{2}$/.test(String(s || '')) ? s : null); };
function waNumber(tel) {
  let d = digits(tel); if (!d) return '';
  if (d.startsWith('0')) d = d.replace(/^0+/, '');
  if (d.length === 10 || d.length === 11) d = '55' + d;
  return d;
}
function fmtTel(tel) {
  let d = digits(tel); if (d.startsWith('55') && d.length > 11) d = d.slice(2);
  if (d.length === 11) return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
  if (d.length === 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
  return tel || '';
}
function weekStart(d = new Date()) { const x = new Date(d); x.setHours(0, 0, 0, 0); const wd = (x.getDay() + 6) % 7; x.setDate(x.getDate() - wd); return x; }
function lsGet(k, def) { try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* armazenamento indisponível */ } }
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function loadScript(src) {
  return new Promise((res, rej) => { if ([...document.scripts].some(s => s.src === src)) return res(); const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Falha ao carregar ' + src)); document.head.appendChild(s); });
}

function cleanLead(l) {
  const o = {};
  for (const k of LEAD_COLS) {
    if (!(k in l)) continue;
    let v = l[k];
    if (v === '' || v === undefined) v = null;
    if (NUM_COLS.includes(k) && v != null && typeof v !== 'number') { const s = String(v).trim(); v = Number(s.includes(',') ? s.replace(/\./g, '').replace(',', '.') : s); if (isNaN(v)) v = null; }
    if (ARR_COLS.includes(k)) v = Array.isArray(v) ? v : (v ? String(v).split(',').map(s => s.trim()).filter(Boolean) : []);
    if (['vencimento_estimado', 'consentimento_lgpd'].includes(k)) v = !!v;
    if (k === 'cnpj' && v) v = cnpjValido(v) ? fmtCnpj(v) : null;
    o[k] = v;
  }
  if (!o.nome) o.nome = 'Sem nome';
  return o;
}

let sb = null;
const SupaDB = {
  async init() {
    await loadScript(SUPA_URL);
    sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
    sb.auth.onAuthStateChange((ev) => { if (ev === 'PASSWORD_RECOVERY') setTimeout(() => UI.setPasswordModal(), 50); });
    const { data } = await sb.auth.getSession();
    return !!data.session;
  },
  async signIn(email, password) { const { error } = await sb.auth.signInWithPassword({ email, password }); if (error) throw new Error(error.message === 'Invalid login credentials' ? 'E-mail ou senha incorretos.' : error.message); },
  async signOut() { await sb.auth.signOut(); },
  async resetPassword(email) { const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname }); if (error) throw error; },
  async setPassword(pw) { const { error } = await sb.auth.updateUser({ password: pw }); if (error) throw error; },
  async me() {
    const { data: { user } } = await sb.auth.getUser();
    if (!user) return null;
    const { data, error } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
    if (error) throw error;
    if (!data) throw new Error('Seu usuário ainda não tem perfil. Rode o schema.sql no Supabase e entre de novo.');
    if (!data.ativo) throw new Error('Seu acesso está desativado. Fale com o administrador.');
    return data;
  },
  async all(table, build) {
    const out = []; let from = 0; const size = 1000;
    for (;;) {
      let q = sb.from(table).select('*'); if (build) q = build(q);
      const { data, error } = await q.range(from, from + size - 1);
      if (error) throw error; out.push(...data); if (data.length < size) break; from += size;
    }
    return out;
  },
  async loadAll() {
    const since = new Date(Date.now() - 400 * 864e5).toISOString();
    const desde60 = new Date(Date.now() - 90 * 864e5).toISOString();
    const [leads, ativ, props, tpls, cfg, profiles, buscas] = await Promise.all([
      this.all('leads', q => q.order('created_at')),
      this.all('atividades', q => q.gte('created_at', since).order('created_at')),
      this.all('propostas', q => q.order('created_at')),
      this.all('templates', q => q.order('ordem')),
      this.all('config'),
      this.all('profiles', q => q.order('nome')),
      this.all('buscas', q => q.gte('created_at', desde60).order('created_at', { ascending: false })).catch(() => [])
    ]);
    return { leads, ativ, props, tpls, cfg, profiles, buscas };
  },
  async leadHistory(id) { return this.all('atividades', q => q.eq('lead_id', id).order('created_at')); },
  async saveLead(l) { const { data, error } = await sb.from('leads').upsert(cleanLead(l)).select().single(); if (error) throw error; return data; },
  async insertLeads(rows) {
    let n = 0;
    for (let i = 0; i < rows.length; i += 200) {
      const chunk = rows.slice(i, i + 200).map(cleanLead);
      const { data, error } = await sb.from('leads').upsert(chunk, { onConflict: 'place_id', ignoreDuplicates: true }).select();
      if (error) throw error; n += data.length; data.forEach(d => upsertLocal('leads', d));
    }
    return n;
  },
  async deleteLead(id) { const { error, count } = await sb.from('leads').delete({ count: 'exact' }).eq('id', id); if (error) throw error; if (!count) throw new Error('Somente o administrador pode excluir leads.'); },
  async addAtiv(a) { const { data, error } = await sb.from('atividades').insert(a).select().single(); if (error) throw error; return data; },
  async deleteAtiv(id) { const { error } = await sb.from('atividades').delete().eq('id', id); if (error) throw error; },
  async saveProp(p) { const { data, error } = await sb.from('propostas').upsert(p).select().single(); if (error) throw error; return data; },
  async deleteProp(id) { const { error } = await sb.from('propostas').delete().eq('id', id); if (error) throw error; },
  async saveTpl(t) { const { data, error } = await sb.from('templates').upsert(t).select().single(); if (error) throw error; return data; },
  async saveTpls(arr) { const { data, error } = await sb.from('templates').upsert(arr, { onConflict: 'chave' }).select(); if (error) throw error; return data; },
  async deleteTpl(id) { const { error } = await sb.from('templates').delete().eq('id', id); if (error) throw error; },
  async saveCfg(chave, valor) { const { error } = await sb.from('config').upsert({ chave, valor }); if (error) throw error; },
  async saveProfile(p) { const { data, error } = await sb.from('profiles').update({ nome: p.nome, papel: p.papel, ativo: p.ativo }).eq('id', p.id).select().single(); if (error) throw error; return data; },
  async fn(body) {
    const { data, error } = await sb.functions.invoke('prospectar', { body });
    if (error) { let msg = error.message; try { const j = await error.context.json(); msg = j.error || msg; } catch (e) { /* sem corpo */ }
      if (/Failed to send|not found|404/i.test(msg)) msg = 'A função "prospectar" não está publicada no Supabase. Veja o passo 6 do guia.'; throw new Error(msg); }
    if (data && data.error) throw new Error(data.error);
    return data;
  },
  async saveBusca(b) { const { data, error } = await sb.from('buscas').update({ importados: b.importados }).eq('id', b.id).select().single(); if (error) throw error; return data; },
  subscribe(onChange) {
    const ch = sb.channel('motor-cs');
    ['leads', 'atividades', 'propostas'].forEach(t => ch.on('postgres_changes', { event: '*', schema: 'public', table: t }, p => onChange(t, p)));
    ch.subscribe();
  }
};

function upsertLocal(coll, obj) {
  const arr = S[coll]; const i = arr.findIndex(x => x.id === obj.id);
  if (i >= 0) arr[i] = obj; else arr.push(obj);
  if (coll === 'leads') invalidate();
}
function removeLocal(coll, id) { S[coll] = S[coll].filter(x => x.id !== id); if (coll === 'leads') invalidate(); }

function fillTemplate(corpo, lead) {
  const c = S.cfg.links || {};
  const ind = lead.indicado_por_id ? byId(lead.indicado_por_id)?.contato_nome || byId(lead.indicado_por_id)?.nome : lead.indicado_por_texto;
  const dv = daysFrom(lead.vencimento_contrato);
  const serv = (lead.servicos_interesse && lead.servicos_interesse.length ? lead.servicos_interesse : lead.servicos_atuais || []).map(s => s.toLowerCase());
  const map = {
    contato: firstName(lead.contato_nome), nome: lead.nome || '', cidade: lead.cidade || 'sua região',
    vendedor: firstName(S.me?.nome) || 'equipe C&S', servicos: serv.length ? serv.join(', ') : 'portaria, limpeza e zeladoria',
    vencimento: fmtD(lead.vencimento_contrato), dias_vencimento: dv == null ? '—' : String(dv),
    indicado_por: ind || 'Um contato em comum', data_mais_2: fmtDs(addDays(today(), 2)),
    link_apresentacao: c.apresentacao || '[link da apresentação]', link_avaliacao: c.avaliacao || '[link da avaliação]',
    link_portfolio_jardinagem: c.portfolio_jardinagem || '[link do portfólio]', link_portfolio_garagem: c.portfolio_garagem || '[link do portfólio]',
    link_site: c.site || 'cservicos.com', link_portfolio: c.portfolio_jardinagem || c.portfolio_garagem || '[link do portfólio]'
  };
  let t = corpo;
  if (!map.contato) t = t.replace(/,\s*\{contato\}(?=[!.?,])/g, '').replace(/\{contato\},\s*/g, '');
  return t.replace(/\{(\w+)\}/g, (m, k) => (k in map ? map[k] : m));

let _cache = null;

  const sorted = [...S.ativ].sort((a, b) => a.created_at < b.created_at ? -1 : 1);
  for (const a of sorted) {
    if (!TOUCH_TYPES.includes(a.tipo)) continue;
    lastTouch[a.lead_id] = a.created_at;
    if (new Date(a.created_at).getTime() >= cutoff14) touches14[a.lead_id] = (touches14[a.lead_id] || 0) + 1;
    semResp[a.lead_id] = /sem resposta/i.test(a.descricao || '') ? (semResp[a.lead_id] || 0) + 1 : 0;
  }

  for (const l of S.leads) {
    if (l.administradora_id) (linked[l.administradora_id] = linked[l.administradora_id] || []).push(l);
    if (l.indicado_por_id) (referred[l.indicado_por_id] = referred[l.indicado_por_id] || []).push(l);
  }
  const info = {};
  for (const l of S.leads) {
    const lt = [l.ultimo_toque_em, lastTouch[l.id]].filter(Boolean).sort().pop() || null;
    const ctx = { lastTouch: lt, touches14: touches14[l.id] || 0, semResp: semResp[l.id] || 0, linked: linked[l.id] || [], referred: referred[l.id] || [] };
    ctx.score = scoreLead(l, ctx);
    ctx.temp = tempOf(l, ctx.score);
    ctx.prob = (S.cfg.prob[l.estagio] ?? 0) / 100;
    ctx.valor = Number(l.estagio === 'Ganho' ? (l.valor_fechado_mensal || l.valor_estimado_mensal) : l.valor_estimado_mensal) || 0;

  const t = I(l.id).temp;
  if (t === 'Cliente') return '<span class="pill p-ok">Cliente</span>';
  return `<span class="pill t-${t}" title="Score ${I(l.id).score}/100${l.temp_manual ? ' · definido manualmente' : ''}">${t}</span>`;
}
function countdown(l) {
  const dv = daysFrom(l.vencimento_contrato); if (dv == null) return '';
  const cls = dv <= 30 ? 'urg' : dv <= 90 ? 'soon' : '';
  const txt = dv < 0 ? `venceu há ${-dv}d` : `vence em ${dv}d`;
  return `<span class="countdown ${cls}" title="Contrato atual vence em ${fmtD(l.vencimento_contrato)}${l.vencimento_estimado ? ' (estimado)' : ''}">${txt}${l.vencimento_estimado ? '*' : ''}</span>`;
}

const STAGE_TPL = { 'Mapeado': 'primeiro_contato', 'Contato': 'qualificacao', 'Qualificado': 'agendar_visita', 'Visita': 'pos_visita', 'Proposta': 'followup_proposta', 'Negociação': 'negociacao', 'Ganho': 'pedir_indicacao', 'Perdido': 'reativar_perdido', 'Nutrição': 'reaquecer' };
function firstTpl(l) {
  if (l.origem === 'Site' && !I(l.id).lastTouch) return 'site';
  if (l.tipo === 'Administradora') return 'administradora';
  if (l.origem === 'Indicação' || l.indicado_por_id || l.indicado_por_texto) return 'primeiro_contato_indicacao';
  return 'primeiro_contato';
}
function suggestTpl(l) { return l.estagio === 'Mapeado' ? firstTpl(l) : STAGE_TPL[l.estagio]; }

/* Motivos para acionar um lead hoje. Retorna em ordem de prioridade. */
function reasonsFor(l) {
  if ((l.tags || []).includes('nao_contatar')) return [];
  const R = []; const c = I(l.id); const rg = S.cfg.regras; const T = today();
  const closed = CLOSED.includes(l.estagio);
  const sinceTouch = daysSince(c.lastTouch || l.estagio_desde || l.created_at);
  if (l.origem === 'Site' && l.estagio === 'Mapeado' && !c.lastTouch)
    R.push({ k: 'site', pri: 100, sev: 'hot', txt: `<b>Pedido de orçamento pelo site</b> — responda rápido (${daysSince(l.created_at) ? 'há ' + daysSince(l.created_at) + ' dia(s)' : 'hoje'})`, tpl: 'site' });
  if (l.proxima_acao_em && !['Ganho'].includes(l.estagio)) {
    const d = daysFrom(l.proxima_acao_em);
    if (d < 0) R.push({ k: 'atrasada', pri: 90 + Math.min(-d, 9), sev: 'hot', txt: `<b>Atrasada há ${-d} dia(s):</b> ${esc(l.proxima_acao || 'próxima ação')}`, tpl: suggestTpl(l) });
    else if (d === 0) R.push({ k: 'hoje', pri: 82, sev: 'gold', txt: `<b>Para hoje:</b> ${esc(l.proxima_acao || 'próxima ação')}`, tpl: suggestTpl(l) });
  }
  const dv = daysFrom(l.vencimento_contrato);
  if (dv != null && l.estagio !== 'Ganho') {
    const quiet = sinceTouch == null || sinceTouch >= (dv <= 30 ? 3 : 7);
    if (quiet) {
      if (dv < 0 && dv >= -30) R.push({ k: 'janela', pri: 72, sev: 'warm', txt: `<b>Contrato venceu há ${-dv} dia(s)</b> — confirme se renovou ou está em aberto`, tpl: 'janela' });
      else if (dv >= 0 && dv <= 30) R.push({ k: 'janela', pri: 88, sev: 'hot', txt: `<b>Contrato vence em ${dv} dia(s)</b> — última chance antes da renovação`, tpl: 'janela' });
      else if (dv > 30 && dv <= 60) R.push({ k: 'janela', pri: 78, sev: 'warm', txt: `<b>Janela de troca: ${dv} dias</b> para o vencimento — hora de proposta`, tpl: 'janela' });
      else if (dv > 60 && dv <= 90) R.push({ k: 'janela', pri: 70, sev: 'warm', txt: `<b>Janela de troca: ${dv} dias</b> — garanta a visita técnica`, tpl: 'janela' });
      else if (dv > 90 && dv <= rg.janela_dias) R.push({ k: 'janela', pri: 60, sev: 'gold', txt: `<b>Janela abrindo:</b> contrato vence em ${dv} dias`, tpl: 'janela' });
    }
  }
  if (l.estagio === 'Proposta') {
    const d = daysSince(l.estagio_desde);
    if (d >= rg.proposta_parada_dias && (sinceTouch == null || sinceTouch >= 3)) R.push({ k: 'proposta', pri: 76, sev: 'warm', txt: `<b>Proposta sem resposta há ${d} dias</b> — faça o follow-up`, tpl: 'followup_proposta' });
  }
  if (ACTIVE.includes(l.estagio)) {
    const cad = S.cfg.cadencia[l.estagio] || 5;
    if (sinceTouch != null && sinceTouch > cad && !(l.proxima_acao_em && daysFrom(l.proxima_acao_em) > 0))
      R.push({ k: 'esfriando', pri: 55 + Math.min(sinceTouch - cad, 15), sev: 'cold', txt: `<b>Esfriando:</b> ${sinceTouch} dias sem contato (cadência de ${l.estagio}: ${cad} dias)`, tpl: STAGE_TPL[l.estagio] });
  }
  if ((l.estagio === 'Perdido' || l.estagio === 'Nutrição')) {
    const due = l.reativar_em ? daysFrom(l.reativar_em) <= 0 : (l.estagio === 'Nutrição' && sinceTouch != null && sinceTouch >= (S.cfg.cadencia['Nutrição'] || 45));
    if (due && !(l.proxima_acao_em && daysFrom(l.proxima_acao_em) > 0))
      R.push({ k: 'reativar', pri: 64, sev: 'gold', txt: `<b>Hora de reaquecer</b>${l.motivo_perda ? ' — perdido por: ' + esc(l.motivo_perda) : ''}${sinceTouch != null ? ` · ${sinceTouch} dias sem contato` : ''}`, tpl: l.estagio === 'Perdido' ? 'reativar_perdido' : 'reaquecer' });
  }
  if (l.estagio === 'Ganho' && l.ganho_em && !l.indicacao_pedida_em && daysSince(l.ganho_em) >= rg.indicacao_dias)
    R.push({ k: 'indicacao', pri: 50, sev: 'ok', txt: `<b>Cliente há ${daysSince(l.ganho_em)} dias</b> — peça uma indicação`, tpl: 'pedir_indicacao' });
  if (l.estagio === 'Mapeado' && !c.lastTouch && (l.caminho_quente || l.indicado_por_id || l.indicado_por_texto || l.origem === 'Indicação'))
    R.push({ k: 'quente', pri: 58, sev: 'gold', txt: `<b>Caminho quente disponível:</b> ${esc(l.caminho_quente || 'indicação de ' + (byId(l.indicado_por_id)?.nome || l.indicado_por_texto || 'contato'))}`, tpl: firstTpl(l) });
  if (closed && l.estagio === 'Perdido') return R.filter(r => ['reativar', 'janela', 'atrasada', 'hoje'].includes(r.k));
  return R.sort((a, b) => b.pri - a.pri);
}

function scopeLeads() {
  const sc = UI.scope; if (sc === 'todos' || !S.me) return S.leads;
  return S.leads.filter(l => l.responsavel === S.me.id || (!l.responsavel && sc === 'meus'));
}
function buildQueue() {
  const items = [];
  for (const l of scopeLeads()) {
    const rs = reasonsFor(l);
    if (!rs.length) continue;
    const snooze = l.proxima_acao_em && daysFrom(l.proxima_acao_em) > 0 && rs[0].k !== 'site';
    if (snooze && rs[0].k !== 'janela') continue;
    items.push({ l, r: rs[0], more: rs.slice(1), pri: rs[0].pri + I(l.id).score / 20 });
  }
  return items.sort((a, b) => b.pri - a.pri);
}
function prospectSuggestions(n = 6) {
  return scopeLeads().filter(l => l.estagio === 'Mapeado' && !I(l.id).lastTouch && !(l.tags || []).includes('nao_contatar') && !reasonsFor(l).length)
    .sort((a, b) => I(b.id).score - I(a.id).score).slice(0, n);
}

/* ---------- métricas ---------- */
function weekStats(userId, start = weekStart()) {
  const s = start.getTime(); const e = s + 7 * 864e5;
  const inW = a => { const t = new Date(a.created_at).getTime(); return t >= s && t < e && (!userId || a.created_by === userId); };
  const at = S.ativ.filter(inW);
  return {
    toques: at.filter(a => TOUCH_TYPES.includes(a.tipo)).length,
    visitas: at.filter(a => a.tipo === 'Visita').length,
    propostas: at.filter(a => a.tipo === 'Proposta').length,
    novos: S.leads.filter(l => { const t = new Date(l.created_at).getTime(); return t >= s && t < e && (!userId || l.created_by === userId || (!l.created_by && l.responsavel === userId)); }).length
  };
}
function pipelineStats(leads = scopeLeads()) {
  let total = 0, pond = 0, n = 0;
  for (const l of leads) if (PIPE.includes(l.estagio)) { const c = I(l.id); total += c.valor; pond += c.valor * c.prob; n++; }
  return { total, pond, n };
}

    (!f.resp || (f.resp === '_none' ? !l.responsavel : l.responsavel === f.resp)) && (!f.origem || l.origem === f.origem) && (!f.cidade || l.cidade === f.cidade) &&
    (!q || norm([l.nome, l.razao_social, l.contato_nome, l.cidade, l.bairro, l.email, l.fornecedor_atual].join(' ')).includes(q) || (qd.length >= 4 && (digits(l.telefone).includes(qd) || digits(l.cnpj).includes(qd)))));
  const key = f.sort; const dir = f.dir;

/* ---------------- PAINEL ---------------- */
function barChart(data, { h = 170, fmt = v => int(v), meta = null } = {}) {
  const W = 560, padL = 34, padB = 22, padT = 12; const n = data.length || 1;
  const max0 = Math.max(1, meta || 0, ...data.map(d => d.v));
  const step = niceStep(max0 / 4); const max = Math.ceil(max0 / step) * step;
  const y = v => padT + (h - padT - padB) * (1 - v / max);
  const bw = (W - padL) / n; const barW = Math.min(36, bw * .62);
  let g = '';
  for (let v = 0; v <= max + 1e-9; v += step) g += `<line class="gridl" x1="${padL}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${padL - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`;
  const bars = data.map((d, i) => { const x = padL + bw * i + (bw - barW) / 2; const hh = Math.max(0, y(0) - y(d.v)); const r = Math.min(4, hh / 2);
    const path = hh > 0 ? `M${x},${y(0)} v${-(hh - r)} q0,${-r} ${r},${-r} h${barW - 2 * r} q${r},0 ${r},${r} v${hh - r} z` : '';
    return `${path ? `<path class="barm" d="${path}"/>` : ''}<rect x="${padL + bw * i}" y="${padT}" width="${bw}" height="${h - padT - padB}" fill="transparent" data-tip="${esc(d.tip || d.lab + ': ' + fmt(d.v))}"/><text x="${x + barW / 2}" y="${h - 6}" text-anchor="middle">${esc(d.lab)}</text>`; }).join('');
  const ml = meta ? `<line class="metal" x1="${padL}" x2="${W}" y1="${y(meta)}" y2="${y(meta)}"/><text x="${W}" y="${y(meta) - 5}" text-anchor="end">meta ${fmt(meta)}</text>` : '';
  return `<svg viewBox="0 0 ${W} ${h}" role="img">${g}${bars}${ml}</svg>`;
}
function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(Math.max(x, 1e-9)))); const m = x / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; }
function hbars(rows, fmt = int) {
  const max = Math.max(1, ...rows.map(r => r.v));
  return `<div class="hbar">${rows.map(r => `<span class="lab" title="${esc(r.lab)}">${esc(r.lab)}</span><div class="track" data-tip="${esc(r.tip || r.lab + ': ' + fmt(r.v))}"><div class="fill ${r.alt ? 'alt' : ''}" style="width:${Math.max(r.v ? 1 : 0, r.v / max * 100)}%"></div></div><span class="val">${fmt(r.v)}${r.extra ? ` <span class="muted tiny">${r.extra}</span>` : ''}</span>`).join('')}</div>`;
}
function viewPainel() {

  const t90 = d => d && daysSince(d) <= 90;
  const won90 = won.filter(l => t90(l.ganho_em)); const lost90 = lost.filter(l => t90(l.estagio_desde));
  const winRate = (won90.length + lost90.length) ? won90.length / (won90.length + lost90.length) : null;

  const avgCycle = cycle.length ? Math.round(cycle.reduce((a, b) => a + b, 0) / cycle.length) : null;
  const mrr = won.reduce((s, l) => s + I(l.id).valor, 0);
  const kpis = `<div class="kpis">

/* ---------------- Vínculo condomínio → administradora pelo e-mail ---------------- */
let _sug = { porAdm: [], grupos: [] };
const GENERICOS = /^(gmail|googlemail|hotmail|outlook|live|msn|yahoo|uol|bol|terra|ig|icloud|me|globo|r7|zipmail)\./;
const dominioDe = e => (String(e || '').split('@')[1] || '').toLowerCase().trim();
const hostDe = u => { try { return new URL(/^https?:/i.test(u) ? u : 'https://' + u).hostname.replace(/^www\./, '').toLowerCase(); } catch (e) { return ''; } };
function vinculoSugestoes() {
  const admByDom = {};
  S.leads.filter(l => l.tipo === 'Administradora').forEach(a => [dominioDe(a.email), hostDe(a.site)].filter(d => d && !GENERICOS.test(d)).forEach(d => { admByDom[d] = a; }));
  const porAdm = {}; const grupos = {};
  S.leads.filter(l => l.tipo === 'Condomínio' && !l.administradora_id && l.email).forEach(c => {
    const d = dominioDe(c.email); const a = admByDom[d];
    if (a) { (porAdm[a.id] = porAdm[a.id] || { adm: a, condos: [] }).condos.push(c); return; }
    const key = d && !GENERICOS.test(d) ? 'd:' + d : 'e:' + c.email.toLowerCase().trim();
    (grupos[key] = grupos[key] || { dominio: key.startsWith('d:') ? d : null, email: c.email.toLowerCase().trim(), condos: [] }).condos.push(c);
  });
  return { porAdm: Object.values(porAdm).sort((a, b) => b.condos.length - a.condos.length), grupos: Object.values(grupos).filter(g => g.condos.length >= 2).sort((a, b) => b.condos.length - a.condos.length).slice(0, 30) };
}
async function vincularTodos(condos, admId) {

}

const Modal = {
  stack: [],
  open({ title, sub = '', body, foot = '', wide = false, onMount }) {
    const host = document.createElement('div');

    host.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">

    host.addEventListener('mousedown', e => { if (e.target === host) this.close(host); });
    host.addEventListener('click', e => { if (e.target.closest('[data-mclose]')) this.close(host); });
    $('#overlay').appendChild(host); this.stack.push(host);
    onMount && onMount(host);
    const f = host.querySelector('[autofocus]') || host.querySelector('input:not([type=hidden]),select,textarea');
    f && setTimeout(() => f.focus(), 30);
    return host;
  },
  close(h) { h = h || this.stack[this.stack.length - 1]; if (!h) return; h.remove(); this.stack = this.stack.filter(x => x !== h); },

      const h = this.open({ title: 'Confirmar', body: `<p style="margin:0">${text}</p>`, foot: `<button type="button" class="btn" data-mclose>Cancelar</button><button type="button" class="btn ${danger ? 'btn-ink' : 'btn-gold'}" id="mOk">${ok}</button>`,
        onMount: host => { host.querySelector('#mOk').onclick = () => { this.close(host); res(true); }; host.addEventListener('click', e => { if (e.target.closest('[data-mclose]')) res(false); }); } });
    });
  }
};

      if (!r) return;
      if (r.stage && (stageIdx(r.stage) > stageIdx(l.estagio) || ['Nutrição', 'Perdido'].includes(r.stage) || CLOSED.includes(l.estagio) || l.estagio === 'Nutrição')) st.value = r.stage;

}

   IMPORTAÇÃO (Apify / planilha) e EXPORTAÇÃO
   ===================================================================== */
function pick(row, keys) { for (const k of keys) { if (row[k] != null && row[k] !== '') return Array.isArray(row[k]) ? row[k][0] : row[k]; } return null; }
function flattenRow(r) { const o = {}; for (const [k, v] of Object.entries(r)) { if (Array.isArray(v)) { o[k] = v; v.forEach((x, i) => { if (typeof x !== 'object') o[`${k}/${i}`] = x; }); } else if (v && typeof v === 'object') { for (const [k2, v2] of Object.entries(v)) o[`${k}/${k2}`] = v2; } else o[k] = v; } return o; }
function classify(nome, cat, tipoCol) {
  const t = norm(tipoCol);
  if (t) {
    if (/admin/.test(t)) return { tipo: 'Administradora' };
    if (/ruido|publico|prefeitura/.test(t)) return { tipo: 'Condomínio', skip: 'ruído' };
    if (/concorr|facilit|terceiriz/.test(t)) return { tipo: 'Empresa', skip: 'concorrente' };
    if (/contad|contab|parceir|advoc|imobil/.test(t)) return { tipo: 'Parceiro' };
    if (/condom/.test(t)) return { tipo: 'Condomínio' };
    if (/industr/.test(t)) return { tipo: 'Indústria' };
    if (/empresa/.test(t)) return { tipo: 'Empresa' };
  }
  const s = norm(nome + ' ' + (cat || ''));
  if (/prefeitura|secretaria|camara municipal|governo|policia|escola estadual/.test(s)) return { tipo: 'Condomínio', skip: 'órgão público' };
  if (/administra|gestao condominial|gestao de condominio|sindico profissional/.test(s)) return { tipo: 'Administradora' };
  if (/facilities|terceiriza|limpeza|portaria|seguranca|vigilancia|zeladoria|servicos gerais/.test(s) && !/condominio|residencial|edificio/.test(norm(nome))) return { tipo: 'Empresa', skip: 'concorrente' };
  if (/contabil|contador|advocacia|advogad|imobiliaria/.test(s)) return { tipo: 'Parceiro' };
  if (/condominio|residencial|edificio|conjunto|torre|village|park/.test(s)) return { tipo: 'Condomínio' };
  if (/industria|fabrica|metalurg|logistic|galpao/.test(s)) return { tipo: 'Indústria' };
  return { tipo: 'Empresa' };
}
function mapImportRow(raw) {
  const r = flattenRow(raw);
  const nome = pick(r, ['title', 'nome', 'Nome', 'name', 'Name', 'nome_fantasia', 'razao_social', 'Razão social']);
  if (!nome) return null;
  const cat = pick(r, ['categoryName', 'categoria', 'Categoria', 'category', 'categories/0']);
  const cls = classify(nome, cat, pick(r, ['tipo', 'Tipo']));
  const temp = pick(r, ['temp', 'temperatura', 'Temperatura']);
  const tn = temp ? String(temp).charAt(0).toUpperCase() + String(temp).slice(1).toLowerCase() : null;
  const cnpj = pick(r, ['cnpj', 'CNPJ']);
  const score = pick(r, ['totalScore']);
  return {
    nome: String(nome).trim(), tipo: cls.tipo, _skip: cls.skip || null, _cat: cat,
    cidade: pick(r, ['city', 'cidade', 'Cidade']), bairro: pick(r, ['neighborhood', 'bairro', 'Bairro']),
    endereco: pick(r, ['address', 'endereco', 'Endereço', 'street']),
    telefone: pick(r, ['phone', 'phoneUnformatted', 'telefone', 'Telefone', 'whatsapp', 'WhatsApp']),
    email: pick(r, ['emails/0', 'emails', 'email', 'E-mail', 'Email']), site: pick(r, ['website', 'site', 'Site']),
    instagram: pick(r, ['instagrams/0', 'instagrams', 'instagram', 'Instagram']), place_id: pick(r, ['placeId', 'place_id']) || null,
    potencial: pick(r, ['potencial', 'Potencial', 'carteira']), unidades: pick(r, ['unidades', 'Unidades']),
    contato_nome: pick(r, ['contato', 'contato_nome', 'Contato']), caminho_quente: pick(r, ['caminho_quente', 'Caminho quente']),
    temp_manual: ['Quente', 'Morno', 'Frio'].includes(tn) ? tn : null,
    cnpj: cnpj && cnpjValido(cnpj) ? fmtCnpj(cnpj) : null, razao_social: pick(r, ['razao_social', 'Razão social']),
    cep: pick(r, ['cep', 'CEP', 'postalCode']), data_abertura: brDateToIso(pick(r, ['data_abertura', 'Data de abertura'])),
    obs: [pick(r, ['notas', 'obs', 'observacao', 'Observações']), cat ? 'Categoria Google: ' + cat : null, score ? `Nota Google ${score} (${pick(r, ['reviewsCount']) || 0} avaliações)` : null].filter(Boolean).join(' · ') || null
  };
}
/* leitor de CSV próprio: aceita ";" (Excel pt-BR / Receita), "," e tabulação */
function parseCSV(text) {
  text = text.replace(/^\uFEFF/, '');
  const first = text.slice(0, text.indexOf('\n') + 1 || text.length);
  const sep = [';', ',', '\t'].sort((a, b) => first.split(b).length - first.split(a).length)[0];
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; continue; }
    if (ch === '"') q = true; else if (ch === sep) { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); cur = ''; if (row.some(c => c !== '')) rows.push(row); row = []; }
    else cur += ch;
  }
  row.push(cur); if (row.some(c => c !== '')) rows.push(row);
  const head = (rows.shift() || []).map(h => h.trim());
  return rows.map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] ?? '').trim()])));
}
async function readImportFile(file) {
  const name = file.name.toLowerCase();
  if (name.endsWith('.json')) { const j = JSON.parse(await file.text()); return Array.isArray(j) ? j : (j.items || j.data || [j]); }
  if (name.endsWith('.csv') || name.endsWith('.txt')) {
    const buf = await file.arrayBuffer(); let txt = new TextDecoder('utf-8').decode(buf);
    if (txt.includes('\uFFFD')) txt = new TextDecoder('windows-1252').decode(buf);
    return parseCSV(txt);
  }
  await loadScript(XLSX_URL);
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
  let best = []; for (const sn of wb.SheetNames) { const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { defval: '' }); if (rows.length > best.length && rows.some(r => pick(r, ['title', 'nome', 'Nome', 'name']))) best = rows; }
  return best;
}
function markRows(rows) {
  const ex = { pid: new Set(), nm: new Set(), tel: new Set(), cnpj: new Set() };
  S.leads.forEach(l => { l.place_id && ex.pid.add(l.place_id); ex.nm.add(norm(l.nome)); const t = digits(l.telefone).slice(-8); t.length === 8 && ex.tel.add(t); l.cnpj && ex.cnpj.add(digits(l.cnpj)); });
  const seen = new Set();
  return rows.map(r => {
    const keys = [r.place_id && 'p' + r.place_id, r.cnpj && 'c' + digits(r.cnpj), 'n' + norm(r.nome) + '|' + norm(r.cidade)].filter(Boolean);
    const t8 = digits(r.telefone).slice(-8);
    r._dup = (r.place_id && ex.pid.has(r.place_id)) || (r.cnpj && ex.cnpj.has(digits(r.cnpj))) || ex.nm.has(norm(r.nome)) || (t8.length === 8 && r.tipo !== 'Condomínio' && ex.tel.has(t8)) || keys.some(k => seen.has(k));
    keys.forEach(k => seen.add(k)); r._inc = !r._dup && !r._skip; return r;
  });
}
/* Tela de revisão usada pelo importador de arquivos e pela aba Prospectar */
function reviewModal(rows, { title = 'Importar leads', sub = '', origem = 'Apify / Google Maps', onImported } = {}) {
  rows = markRows(rows);
  Modal.open({ title, sub, wide: true, body: '<div id="rvBody"></div>', foot: `<button type="button" class="btn" data-mclose>Cancelar</button><button type="button" class="btn btn-gold" id="rvGo" disabled>Importar</button>`, onMount: h => {
    let ori = origem, resp = '', lendo = false, lidos = 0, filtro = 'todos';
    const semCnpj = () => rows.filter(r => r.site && !r.cnpj && !r._sitesLido && !r._skip);
    const draw = () => {
      const inc = rows.filter(r => r._inc); const pend = semCnpj();
      const vis = rows.filter(r => filtro === 'todos' || (filtro === 'novos' ? !r._dup && !r._skip : r.tipo === filtro));
      h.querySelector('#rvBody').innerHTML = `<div class="grid3" style="margin-bottom:10px">
          <label class="field"><span>Origem</span><select class="input" id="rvOri">${ORIGENS.map(o => `<option ${o === ori ? 'selected' : ''}>${o}</option>`).join('')}</select></label>
          <label class="field"><span>Responsável</span><select class="input" id="rvResp"><option value="">Sem responsável</option>${S.profiles.filter(p => p.ativo).map(p => `<option value="${p.id}" ${resp === p.id ? 'selected' : ''}>${esc(p.nome)}</option>`).join('')}</select></label>
          <div class="field"><span>Resumo</span><div class="small"><b>${inc.length}</b> para importar · ${rows.filter(r => r._dup).length} já existem · ${rows.filter(r => r._skip).length} descartados · ${rows.filter(r => r.cnpj).length} com CNPJ</div></div></div>
        <div class="row" style="margin-bottom:10px">
          <div class="q-filter" role="group">${[['todos', 'Todos'], ['novos', 'Só novos'], ['Administradora', 'Administradoras'], ['Condomínio', 'Condomínios']].map(([k, t]) => `<button type="button" data-f="${k}" aria-pressed="${filtro === k}">${t}</button>`).join('')}</div>
          <span class="spacer" style="flex:1"></span>
          ${pend.length || lendo ? `<button type="button" class="btn btn-sm" id="rvSites" ${lendo ? 'disabled' : ''}>${lendo ? `Lendo sites… ${lidos}/${lidos + pend.length}` : `Buscar CNPJ, e-mail e Instagram nos sites (${pend.length})`}</button>` : ''}
          <button type="button" class="btn btn-sm btn-ghost" id="rvAll">Marcar novos</button><button type="button" class="btn btn-sm btn-ghost" id="rvNone">Desmarcar todos</button></div>
        <div class="table-wrap" style="max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:8px"><table class="t"><thead><tr><th></th><th>Nome</th><th>Tipo</th><th>Cidade</th><th>Telefone</th><th>Site / CNPJ</th><th>Situação</th></tr></thead><tbody>
        ${vis.map(r => { const i = rows.indexOf(r); return `<tr><td><input type="checkbox" data-i="${i}" ${r._inc ? 'checked' : ''} aria-label="Incluir"></td><td><b>${esc(r.nome)}</b><div class="tiny muted">${esc(r._cat || r.razao_social || '')}</div></td><td><select class="input" data-ti="${i}" style="padding:3px 6px;font-size:12px">${TIPOS.map(t => `<option ${t === r.tipo ? 'selected' : ''}>${t}</option>`).join('')}</select></td><td>${esc(r.cidade || '')}</td><td class="num">${esc(fmtTel(r.telefone))}</td><td class="small">${r.cnpj ? `<span class="num">${esc(r.cnpj)}</span>` : r.site ? `<span class="muted">${esc(String(r.site).replace(/^https?:\/\/(www\.)?/, '').slice(0, 28))}</span>` : '<span class="muted">—</span>'}${r.email ? `<div class="tiny muted">${esc(r.email)}</div>` : ''}</td><td>${r._dup ? '<span class="pill p-mute">já existe</span>' : r._skip ? `<span class="pill p-hot">${r._skip}</span>` : '<span class="pill p-ok">novo</span>'}</td></tr>`; }).join('')}</tbody></table></div>
        ${!vis.length ? '<div class="empty small">Nada neste filtro.</div>' : ''}`;
      h.querySelector('#rvGo').disabled = !inc.length || lendo; h.querySelector('#rvGo').textContent = `Importar ${inc.length || ''} lead(s)`;
      h.querySelector('#rvOri').onchange = e => { ori = e.target.value; };
      h.querySelector('#rvResp').onchange = e => { resp = e.target.value; };
      h.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filtro = b.dataset.f; draw(); });
      h.querySelectorAll('[data-i]').forEach(cb => cb.onchange = () => { rows[+cb.dataset.i]._inc = cb.checked; draw(); });
      h.querySelectorAll('[data-ti]').forEach(sl => sl.onchange = () => { rows[+sl.dataset.ti].tipo = sl.value; });
      h.querySelector('#rvAll').onclick = () => { rows.forEach(r => { r._inc = !r._dup && !r._skip; }); draw(); };
      h.querySelector('#rvNone').onclick = () => { rows.forEach(r => { r._inc = false; }); draw(); };
      const sb = h.querySelector('#rvSites'); sb && (sb.onclick = async () => {
        lendo = true; draw();
        try {
          let fila = semCnpj();
          while (fila.length) {
            const lote = fila.slice(0, 15);
            const res = await DB.fn({ action: 'sites', sites: lote.map(r => r.site) });
            (res.sites || []).forEach((x, k) => { const r = lote[k]; r._sitesLido = true; if (x.cnpj) r.cnpj = x.cnpj; if (x.email && !r.email) r.email = x.email; if (x.instagram && !r.instagram) r.instagram = x.instagram; });
            lote.forEach(r => { r._sitesLido = true; }); lidos += lote.length; fila = semCnpj(); draw();
            if (!h.isConnected) return;
          }
          const antes = rows.filter(r => r._dup).length; rows = markRows(rows);
          const novosDup = rows.filter(r => r._dup).length - antes;
          toast(`Sites lidos. ${rows.filter(r => r.cnpj).length} com CNPJ${novosDup > 0 ? ` · ${novosDup} já estavam na base (mesmo CNPJ)` : ''}.`);
        } catch (e) { toast('Não consegui ler os sites: ' + esc(e.message)); }
        lendo = false; if (h.isConnected) draw();
      });
    };
    draw();
    h.querySelector('#rvGo').onclick = async () => {
      const btn = h.querySelector('#rvGo'); btn.disabled = true; btn.textContent = 'Importando…';
      const now = nowISO(); const seenC = new Set();
      const payload = rows.filter(r => r._inc).filter(r => !r.cnpj || !seenC.has(r.cnpj) && seenC.add(r.cnpj)).map(r => {
        const o = { ...r, id: uid(), origem: ori, responsavel: resp || null, estagio: 'Mapeado', estagio_desde: now, created_at: now, created_by: S.me.id };
        Object.keys(o).filter(k => k.startsWith('_')).forEach(k => delete o[k]); return o; });
      try { const n = await DB.insertLeads(payload); invalidate(); Modal.close(h); UI.render(); toast(`<b>${n}</b> lead(s) importado(s). Os melhores aparecem em Hoje → Próximos a prospectar.`); onImported && onImported(n); }
      catch (err) { btn.disabled = false; btn.textContent = 'Tentar de novo'; errToast(err); }
    };
  } });
}
function importModal() {
  const body = `<div class="hint">Aceita o arquivo do <b>Apify (Google Maps)</b> em .json, .xlsx ou .csv, a planilha gerada pelo <b>script da Receita</b> (receita_condominios_administradoras.csv) e planilhas próprias. Colunas reconhecidas: nome/title, cnpj, telefone/phone, email, site/website, cidade/city, bairro, cep, placeId, tipo, potencial, caminho_quente, temp.</div>
    <label class="field"><span>Arquivo</span><input class="input" type="file" id="imFile" accept=".json,.xlsx,.xls,.csv,.txt"></label>`;
  Modal.open({ title: 'Importar leads', body, foot: '<button type="button" class="btn" data-mclose>Cancelar</button>', onMount: h => {
    h.querySelector('#imFile').onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      try {
        const rows = (await readImportFile(f)).map(mapImportRow).filter(Boolean);
        if (!rows.length) { toast('Não encontrei linhas com nome/title nesse arquivo.'); return; }
        const receita = rows.some(r => r.cnpj) && !rows.some(r => r.place_id);
        Modal.close(h); reviewModal(rows, { title: 'Importar leads', sub: esc(f.name) + ` · ${rows.length} linha(s)`, origem: receita ? 'Receita Federal' : 'Apify / Google Maps' });
      } catch (err) { toast('Não consegui ler o arquivo: ' + esc(err.message)); }
    };
  } });
}

async function saveCfgSection(key) {
  const vals = { ...S.cfg[key] };
  $$(`[data-cfg^="${key}."]`).forEach(el => { const k = el.dataset.cfg.split('.')[1]; vals[k] = el.type === 'number' ? (el.value === '' ? null : Number(el.value)) : el.value.trim(); });
  try { await DB.saveCfg(key, vals); S.cfg[key] = vals; invalidate(); toast('Configuração salva.'); UI.render(); } catch (e) { errToast(e); }
}

  'tpl-edit': el => tplModal(el.dataset.id ? S.tpls.find(t => t.id === el.dataset.id) : null),
  'cfg-save': el => saveCfgSection(el.dataset.sec),
  'prof-save': async el => { const id = el.dataset.id; const p = S.profiles.find(x => x.id === id); const o = { ...p, nome: $(`[data-pn="${id}"]`).value.trim() || p.nome, papel: $(`[data-pp="${id}"]`).value, ativo: $(`[data-pa="${id}"]`).checked };
    try { const s = await DB.saveProfile(o); upsertLocal('profiles', s); if (id === S.me.id) S.me = s; UI.render(); setWho(); toast('Usuário salvo.'); } catch (e) { errToast(e); } },
  backup: () => { downloadBlob(`backup-motor-comercial-${today()}.json`, JSON.stringify({ exportado_em: nowISO(), leads: S.leads, atividades: S.ativ, propostas: S.props, templates: S.tpls, config: S.cfg }, null, 1), 'application/json'); toast('Backup gerado.'); },
  'demo-reset': async () => { if (!(await Modal.confirm('Apagar tudo e restaurar os dados de exemplo?', 'Restaurar', true))) return; DemoDB.reset(); await reload(); UI.render(); toast('Dados de exemplo restaurados.'); },
  logout: async () => { await DB.signOut(); location.reload(); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) { if (!e.target.closest('.search')) $('#searchResults').hidden = true; return; }
  const fn = ACT[el.dataset.act] || ACT_EXTRA[el.dataset.act]; if (fn) fn(el, e);
});
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  if (e.key === 'Escape') { if (Modal.stack.length) Modal.close(); else if (UI.openLead) Ficha.close(); $('#searchResults').hidden = true; return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey || $('#app').hidden) return;
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); novoLeadModal(); }
  if (e.key === '/') { e.preventDefault(); $('#globalSearch').focus(); }
});
document.addEventListener('mouseover', e => { const t = e.target.closest('[data-tip]'); const tip = $('#tip'); if (!t) { tip.hidden = true; return; } tip.textContent = t.dataset.tip; tip.hidden = false; });
document.addEventListener('mousemove', e => { const tip = $('#tip'); if (tip.hidden) return; const w = tip.offsetWidth; tip.style.left = Math.min(window.innerWidth - w - 8, e.clientX + 12) + 'px'; tip.style.top = (e.clientY - 34) + 'px'; });
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS.some(x => x.id === v) && v !== UI.view) UI.go(v); });

function bindSearch() {
  const inp = $('#globalSearch'); const box = $('#searchResults');
  inp.oninput = debounce(() => {
    const q = norm(inp.value); const qd = digits(inp.value);
    if (q.length < 2) { box.hidden = true; return; }
    const m = S.leads.filter(l => norm([l.nome, l.razao_social, l.contato_nome, l.cidade, l.bairro, l.email].join(' ')).includes(q) || (qd.length >= 4 && (digits(l.telefone).includes(qd) || digits(l.cnpj).includes(qd)))).sort((a, b) => I(b.id).score - I(a.id).score).slice(0, 8);
    box.innerHTML = m.length ? m.map(l => `<button type="button" data-act="open" data-id="${l.id}"><b>${esc(l.nome)}</b><div class="tiny muted">${l.tipo} · ${l.estagio}${l.contato_nome ? ' · ' + esc(l.contato_nome) : ''}${l.cidade ? ' · ' + esc(l.cidade) : ''}</div></button>`).join('') : `<div class="empty small">Nada encontrado. <button type="button" class="linkbtn" style="color:var(--accent)" id="srNew">Cadastrar “${esc(inp.value)}”</button></div>`;
    box.hidden = false;
    const nb = $('#srNew'); nb && (nb.onclick = () => { box.hidden = true; novoLeadModal({ nome: inp.value }); inp.value = ''; });
  }, 150);
  inp.onkeydown = e => { if (e.key === 'Enter') { const b = box.querySelector('[data-act=open]'); if (b) { Ficha.open(b.dataset.id); box.hidden = true; inp.value = ''; inp.blur(); } } };
  inp.onfocus = () => { if (inp.value.length >= 2) inp.oninput(); };
}

/* =====================================================================
   INICIALIZAÇÃO
   ===================================================================== */
function normLead(l) { for (const k of ARR_COLS) l[k] = Array.isArray(l[k]) ? l[k] : []; for (const k of NUM_COLS) if (l[k] != null) l[k] = Number(l[k]); return l; }
async function reload() {
  const d = await DB.loadAll();
  S.leads = d.leads.map(normLead); S.ativ = d.ativ; S.props = d.props; S.tpls = d.tpls; S.profiles = d.profiles; S.buscas = d.buscas || [];
  const cfg = clone(DEFAULT_CFG); for (const row of d.cfg) cfg[row.chave] = { ...(cfg[row.chave] || {}), ...row.valor }; S.cfg = cfg;
  invalidate();
}
function setWho() { $('#meName').textContent = S.me.nome; $('#meRole').textContent = S.me.papel === 'admin' ? 'Administrador' : 'Vendedor'; $('#meAvatar').textContent = initials(S.me.nome); $('#modePill').innerHTML = IS_DEMO ? '<span class="mode-pill">Demonstração</span>' : ''; }
const rtRender = debounce(() => { const typing = UI.openLead && UI.tab === 'dados'; if (typing) { const keep = UI.openLead; UI.openLead = null; UI.render(); UI.openLead = keep; } else UI.render(); }, 400);
function onRealtime(table, p) {
  const coll = { leads: 'leads', atividades: 'ativ', propostas: 'props' }[table];
  if (p.eventType === 'DELETE') removeLocal(coll, p.old.id);
  else upsertLocal(coll, coll === 'leads' ? normLead(p.new) : p.new);
  invalidate(); rtRender();
}
async function enter() {
  S.me = await DB.me();
  await reload();
  if (S.me.papel === 'admin' && !S.tpls.length) { try { S.tpls = await DB.saveTpls(DEFAULT_TPLS.map(t => ({ ...t, ativo: true }))); } catch (e) { console.warn('seed templates', e); } }
  if (!S.tpls.length) S.tpls = DEFAULT_TPLS.map(t => ({ ...t, id: 'tmp-' + t.chave, ativo: true }));
  UI.scope = lsGet('cs_scope', S.me.papel === 'admin' ? 'todos' : 'meus');
  const hv = location.hash.slice(1); UI.view = VIEWS.some(v => v.id === hv) ? hv : lsGet('cs_view', 'hoje');
  if (!VIEWS.some(v => v.id === UI.view)) UI.view = 'hoje';
  $('#login').hidden = true; $('#app').hidden = false;
  setWho(); bindSearch(); UI.render();
  DB.subscribe(onRealtime); Pros.resume();
}
function showLogin(msg) {
  $('#app').hidden = true; $('#login').hidden = false; $('#loginMsg').textContent = msg || '';
  $('#loginForm').onsubmit = async e => {
    e.preventDefault(); $('#loginMsg').textContent = 'Entrando…';
    try { await DB.signIn($('#loginEmail').value.trim(), $('#loginPass').value); await enter(); } catch (err) { $('#loginMsg').textContent = err.message; }
  };
  $('#forgotBtn').onclick = async () => { const em = $('#loginEmail').value.trim(); if (!em) { $('#loginMsg').textContent = 'Digite seu e-mail acima e clique de novo.'; return; } try { await DB.resetPassword(em); $('#loginMsg').textContent = 'Enviamos um link para redefinir a senha.'; } catch (err) { $('#loginMsg').textContent = err.message; } };
}
UI.setPasswordModal = () => Modal.open({ title: 'Definir nova senha', body: `<label class="field"><span>Nova senha (mín. 8 caracteres)</span><input class="input" type="password" id="npw" autocomplete="new-password"></label>`, foot: `<button type="button" class="btn btn-gold" id="npwOk">Salvar senha</button>`, onMount: h => { h.querySelector('#npwOk').onclick = async () => { const v = h.querySelector('#npw').value; if (v.length < 8) { toast('Use pelo menos 8 caracteres.'); return; } try { await DB.setPassword(v); Modal.close(h); toast('Senha alterada.'); if ($('#app').hidden) await enter(); } catch (e) { errToast(e); } }; } });

$('#logoutBtn').onclick = () => ACT.logout();
$('#fab').onclick = () => novoLeadModal();
(async function boot() {
  try {
    const logged = await DB.init();
    if (logged) await enter(); else showLogin();
  } catch (e) { console.error(e); showLogin('Erro ao conectar: ' + (e.message || e)); }
})();

</script>
</body>
</html>
