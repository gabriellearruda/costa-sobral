:root{
  --gold:#D4AF37; --gold-d:#A67C1E; --ink:#1A1A1A; --ink2:#0D0D0D;
  --cream:#FAF7EF; --card:#F0ECDF; --line:#DDD6C2;
  --body:#43413B; --muted:#8A8578;
  --ui-bg:#F5F4F1; --ui-panel:#FFFFFF; --ui-line:#E3E0D8; --ui-text:#2C2A26;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{font-family:'Mont',system-ui,sans-serif;color:var(--ui-text);background:var(--ui-bg);}

/* ---------- CHROME DO APP ---------- */
.topbar{height:56px;background:var(--ink2);display:flex;align-items:center;gap:14px;
  padding:0 18px;position:sticky;top:0;z-index:50;border-bottom:2px solid var(--gold);}
.topbar .brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:14px;letter-spacing:.3px;}
.topbar .brand .g{color:var(--gold);}
.topbar .sp{flex:1;}
.btn{font-family:inherit;font-size:13px;font-weight:600;border:none;border-radius:8px;
  padding:9px 16px;cursor:pointer;transition:filter .15s,background .15s;}
.btn-gold{background:var(--gold);color:var(--ink2);}
.btn-gold:hover{filter:brightness(1.06);}
.btn-ghost{background:transparent;color:#EDE7D6;border:1px solid #4a463c;}
.btn-ghost:hover{background:#1c1a16;}

.layout{display:grid;grid-template-columns:430px 1fr;height:calc(100vh - 56px);}
.editor{overflow-y:auto;background:var(--ui-panel);border-right:1px solid var(--ui-line);padding:18px 18px 60px;}
.preview-pane{overflow:auto;background:#6b6a66;padding:28px;display:flex;flex-direction:column;align-items:center;gap:22px;}

/* editor widgets */
.grp{margin-bottom:22px;}
.grp>h2{font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--gold-d);text-transform:uppercase;
  margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--ui-line);}
.fld{margin-bottom:11px;}
.fld label{display:block;font-size:11px;font-weight:600;color:#6b675e;margin-bottom:4px;}
.fld input,.fld textarea,.fld select{width:100%;font-family:inherit;font-size:13px;color:var(--ui-text);
  background:#fff;border:1px solid #d7d3c8;border-radius:7px;padding:8px 10px;outline:none;transition:border .15s;}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--gold);}
.fld textarea{resize:vertical;min-height:60px;line-height:1.4;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;}
.subcard{border:1px solid var(--ui-line);border-radius:9px;padding:11px;margin-bottom:10px;background:#fbfaf7;position:relative;}
.subcard .rm{position:absolute;top:8px;right:8px;background:#f3ece0;color:#9a7b3a;border:none;border-radius:6px;
  width:24px;height:24px;font-size:15px;line-height:1;cursor:pointer;font-weight:700;}
.subcard .rm:hover{background:#ecdfca;}
.addbtn{width:100%;font-family:inherit;font-size:12px;font-weight:600;color:var(--gold-d);
  background:#faf5e9;border:1px dashed #d8c48f;border-radius:8px;padding:9px;cursor:pointer;}
.addbtn:hover{background:#f6eed9;}
.catbar{display:flex;gap:6px;margin-top:2px}.catbar select{flex:1;min-width:0;font:inherit;font-size:11.5px;border:1px solid var(--ui-line);border-radius:6px;padding:4px 6px;color:#6b675e;background:#fff}
.catbar button{font:inherit;font-size:11px;border:1px solid #e0d6bd;background:#faf5e9;color:var(--gold-d);border-radius:6px;padding:4px 8px;cursor:pointer;white-space:nowrap}
.catadd{display:flex;gap:6px;margin:4px 0 8px}.catadd select{flex:1;min-width:0;font:inherit;font-size:12.5px;border:1px solid #d8c48f;border-radius:8px;padding:8px;background:#fff}
.btn-cat{font:inherit;font-size:12px;font-weight:700;border:none;border-radius:8px;padding:8px 12px;background:var(--gold);color:#111;cursor:pointer;white-space:nowrap}
.hint{font-size:10.5px;color:#9a968c;margin-top:3px;line-height:1.4;}
.calc{background:#f7f3e9;border:1px solid #e6dcc2;border-radius:8px;padding:10px 12px;font-size:12px;}
.calc b{color:var(--gold-d);}
.check-menu label.opt{display:flex;align-items:flex-start;gap:8px;font-size:12px;font-weight:500;color:#4a463c;
  padding:6px 0;cursor:pointer;border-bottom:1px solid #f0ede5;}
.check-menu input{width:auto;margin-top:2px;}
.warn{background:#fdf3f2;border:1px solid #f0c9c4;color:#a3443a;border-radius:8px;padding:9px 11px;font-size:12px;margin-bottom:11px;line-height:1.45;display:none;}
.warn.show{display:block;}
.warn b{font-weight:700;}

/* ---------- FOLHA / PÁGINAS (identidade C&S fixa) ---------- */
.paper{width:210mm;min-height:297mm;background:var(--cream);box-shadow:0 4px 24px rgba(0,0,0,.35);
  position:relative;overflow:hidden;flex:0 0 auto;}
.page{position:relative;width:210mm;height:297mm;background:var(--cream);
  padding:16mm 16mm 20mm 16mm;overflow:hidden;font-family:'Mont';color:var(--body);}
.page + .page{border-top:1px dashed #cfc9b8;}
.foot{position:absolute;left:16mm;right:16mm;bottom:11mm;padding-top:5px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;}
.foot .fl{font-size:7.5px;letter-spacing:2.5px;color:var(--muted);text-transform:uppercase;}
.foot .fn{font-size:8px;letter-spacing:1px;color:var(--gold-d);font-weight:600;}
.kicker{font-size:9px;letter-spacing:3.2px;text-transform:uppercase;color:var(--gold-d);font-weight:600;margin-bottom:6px;}
h1.sec{font-family:'Playfair';font-weight:700;font-size:30px;color:var(--ink);line-height:1.05;}
.rule{width:88px;height:3px;margin-top:11px;border-radius:2px;background:linear-gradient(90deg,var(--gold),rgba(212,175,55,0));}
p.lead{font-size:11.5px;line-height:1.7;color:var(--body);}
p.lead + p.lead{margin-top:11px;}
.check{list-style:none;margin-top:6px;}
.check li{font-size:10.5px;line-height:1.55;color:var(--body);padding:3px 0 3px 20px;position:relative;}
.check li::before{content:"\2713";position:absolute;left:0;color:var(--gold-d);font-weight:700;font-size:11px;}
.cover{display:flex;flex-direction:column;align-items:center;height:100%;text-align:center;}
.cover::before{content:"";position:absolute;top:0;left:0;right:0;height:120mm;background:radial-gradient(120% 80% at 50% 0%, #FFFDF7 0%, var(--cream) 70%);}
.cover-logo{margin-top:44mm;width:130mm;max-width:78%;position:relative;z-index:2;}
.cover-title{font-family:'Playfair';font-weight:700;font-size:46px;letter-spacing:1px;color:var(--ink2);margin-top:26mm;position:relative;z-index:2;}
.cover-rule{width:120px;height:1.5px;background:linear-gradient(90deg,rgba(212,175,55,0),var(--gold),rgba(212,175,55,0));margin:14px 0 20px;z-index:2;}
.cover-client{font-size:17px;font-weight:700;color:var(--gold-d);letter-spacing:.3px;z-index:2;}
.cover-ac{font-size:12px;color:var(--muted);margin-top:9px;z-index:2;}
.cover-meta{position:absolute;bottom:20mm;left:0;right:0;text-align:center;font-size:10px;color:var(--muted);z-index:2;}
.cover-meta b{color:var(--gold-d);font-weight:700;}
.photo{border-radius:12px;object-fit:cover;box-shadow:0 6px 18px rgba(0,0,0,.10);}
.qs-grid{display:grid;grid-template-columns:1fr 300px;gap:26px;margin-top:20px;align-items:start;}
.qs-photo{width:300px;height:360px;}
.identity{margin-top:30px;}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:12px;}
.mvc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 16px 18px;}
.mvc h3{font-family:'Playfair';font-weight:700;font-size:16px;color:var(--gold-d);margin-bottom:8px;}
.mvc p{font-size:10px;line-height:1.55;color:var(--body);}
.keywords{margin-top:26px;text-align:center;font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--gold-d);}
.serv-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 28px;margin-top:20px;}
.serv{display:flex;gap:13px;align-items:flex-start;}
.ic-circle{flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;background:#FBF9F1;}
.serv h4{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:3px;}
.serv p{font-size:9.5px;line-height:1.5;color:var(--body);}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:16px;text-align:center;}
.step .num{font-family:'Playfair';font-weight:700;font-size:34px;color:var(--gold);line-height:1;}
.step h4{font-size:11.5px;font-weight:700;color:var(--ink);margin:7px 0 4px;}
.step p{font-size:9.5px;line-height:1.45;color:var(--body);}
.quote{font-family:'Playfair';font-style:italic;font-size:16px;color:var(--gold-d);text-align:center;margin:26px 0 14px;}
.team{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.team img{width:100%;height:150px;border-radius:12px;object-fit:cover;box-shadow:0 6px 18px rgba(0,0,0,.10);}
table.tb{width:100%;border-collapse:collapse;margin-top:18px;border-radius:10px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.05);}
table.tb thead th{background:var(--gold);color:var(--ink2);font-size:10px;font-weight:700;text-align:left;padding:12px 14px;}
table.tb tbody td{font-size:10px;color:var(--body);padding:13px 14px;border-bottom:1px solid var(--line);}
table.tb tbody tr:nth-child(odd){background:#F7F3E9;}
table.tb tbody tr:nth-child(even){background:#F1ECDD;}
.num-r{text-align:right;white-space:nowrap;}
.attr-cards{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px;}
.attr{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
.attr h4{font-size:12.5px;font-weight:700;color:var(--gold-d);margin-bottom:6px;}
.attr h4 span{color:var(--muted);font-weight:500;font-size:10px;}
.note{font-size:9px;font-style:italic;color:var(--muted);margin-top:11px;line-height:1.5;}
.cort-intro{font-size:10.5px;color:var(--body);margin-top:6px;}
.cort-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 26px;margin-top:14px;}
.cort{display:flex;gap:12px;align-items:flex-start;}
.cort h4{font-size:11px;font-weight:700;color:var(--ink);margin-bottom:2px;}
.cort p{font-size:9px;line-height:1.45;color:var(--body);}
table.inv thead th{background:var(--gold);color:var(--ink2);font-size:10px;font-weight:700;padding:12px 14px;text-align:left;}
table.inv thead th.r{text-align:right;}
table.inv tbody td{font-size:10.5px;padding:14px;border-bottom:1px solid var(--line);}
table.inv tbody tr:nth-child(odd){background:#F7F3E9;}
table.inv tbody tr:nth-child(even){background:#F1ECDD;}
.total-row{background:var(--ink2)!important;}
.total-row td{color:var(--gold);font-weight:700;font-size:12.5px;padding:14px;letter-spacing:.5px;}
.extenso{text-align:right;font-style:italic;font-size:9.5px;color:var(--muted);margin-top:8px;}
.inv-note{font-size:9px;color:var(--muted);margin-top:6px;line-height:1.5;}
.contempla{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-top:20px;}
.contempla h4{font-size:12px;font-weight:700;color:var(--gold-d);margin-bottom:6px;}
.contempla .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 26px;}
.cond-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:14px;}
.cond{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px;min-height:96px;}
.cond h4{font-family:'Playfair';font-weight:700;font-size:13px;color:var(--gold-d);margin-bottom:6px;line-height:1.15;}
.cond p{font-size:9.5px;line-height:1.5;color:var(--body);}
.contact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px;}
.contact{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 12px;text-align:center;}
.contact .ic-circle{margin:0 auto 10px;}
.contact p{font-size:11px;line-height:1.5;color:var(--body);}
.accept{background:#F4F0E6;border:1px solid var(--line);border-radius:12px;padding:24px 26px;margin-top:16px;}
.accept .decl{font-size:10.5px;line-height:1.7;color:var(--body);}
.sign-row{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:36px;}
.sign{text-align:center;}
.sign .ln{border-top:1px solid #B9B2A0;margin-bottom:8px;}
.sign .who{font-size:11px;color:var(--body);}
.sign .role{font-size:9px;color:var(--muted);margin-top:2px;}
.localdata{font-size:10.5px;color:var(--body);margin-top:26px;}
.localdata .u{display:inline-block;border-bottom:1px solid #B9B2A0;}
.logo-dark-wrap{text-align:center;margin-top:34px;}
.logo-dark-wrap img{width:200px;border-radius:10px;}

/* ---------- IMPRESSÃO ---------- */
@page{size:A4;margin:0;}
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
  .topbar,.editor{display:none!important;}
  .layout{display:block;height:auto;}
  .preview-pane{display:block;background:#fff;padding:0;overflow:visible;}
  .paper{box-shadow:none;margin:0;}
  .page{page-break-after:always;}
  .page:last-child{page-break-after:auto;}
  .page + .page{border-top:none;}
}
.topbar .brand .g-escudo{height:30px;width:auto}

/* ---- novo: histórico, parâmetros, fotos e páginas no layout da proposta ---- */
.topbar .estado{color:#cfc6ae;font-size:12px;margin-right:6px}.topbar .estado b{color:var(--gold)}.topbar .estado i{color:#e4a59c;font-style:normal}
.topbar .lnk{color:#e7c77a;font-size:12px;text-decoration:none;margin-left:6px}
.numbox{font-size:13px;font-weight:700;color:var(--gold-d);background:#faf5e9;border:1px dashed #d8c48f;border-radius:7px;padding:8px 10px}
.opt-inline{display:flex;align-items:center;gap:8px;font-size:12px;color:#4a463c;margin:4px 0 10px;cursor:pointer}.opt-inline input{width:auto}
.row-q{display:grid;grid-template-columns:70px 1fr;gap:9px}
.fotos-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.fp{position:relative;border:2px solid transparent;border-radius:7px;padding:0;background:#eee;cursor:pointer;aspect-ratio:1;overflow:hidden}
.fp img{width:100%;height:100%;object-fit:cover;display:block;opacity:.55}.fp.on{border-color:var(--gold)}.fp.on img{opacity:1}
.fp span{position:absolute;top:3px;right:3px;min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:#111;font-size:11px;font-weight:700;line-height:18px;text-align:center}
.fp:not(.on) span{display:none}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a1a1a;color:#fff;border-left:3px solid var(--gold);padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%)}.toast.err{border-left-color:#d9534f}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:150;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.mdl{background:#fff;border-radius:12px;max-width:820px;width:100%;padding:22px 24px;position:relative}.mdl.largo{max-width:980px}
.mdl h2{font-family:'Playfair';font-size:22px;margin-bottom:10px}.mdl h3{font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--gold-d);margin:14px 0 8px}
.mdl .x{position:absolute;top:12px;right:14px;border:none;background:none;font-size:24px;cursor:pointer;color:#777}
.mdl .busca{width:100%;padding:9px 12px;border:1px solid #d7d3c8;border-radius:8px;font:inherit;margin-bottom:10px}
.pgrp{border-top:1px solid var(--ui-line);padding-top:6px}.fld label i{font-weight:400;color:#9a968c}
table.hist{width:100%;border-collapse:collapse;font-size:12.5px}table.hist th{text-align:left;font-size:11px;color:#8a8578;border-bottom:1px solid #e3e0d8;padding:6px}
table.hist td{padding:7px 6px;border-bottom:1px solid #f0ede5}table.hist .r{text-align:right}table.hist select{font:inherit;font-size:12px;padding:3px}
.btn-mini{padding:5px 10px;font-size:12px;background:var(--gold);color:#111}.btn-ghost-d{background:#f3efe4;color:#5a5446;margin-right:auto}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.postos-box{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:18px;background:var(--card)}
.postos-box .hd{background:var(--gold);color:var(--ink2);font-size:9px;font-weight:700;letter-spacing:1.4px;padding:8px 14px;text-transform:uppercase}
.postos-box .pgrid{display:grid;grid-template-columns:1fr 1fr}
.postos-box .attr{background:transparent;border:none;border-radius:0;border-bottom:1px solid var(--line);padding:11px 14px}
.postos-box .attr:nth-child(odd){border-right:1px solid var(--line)}.postos-box .attr .check li{font-size:9.6px;line-height:1.45}
.team.n6{grid-template-columns:repeat(3,1fr);gap:10px}.team.n6 img{height:118px}
.ref-grid{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:16px;background:var(--card)}
.ref{padding:11px 14px;border-bottom:1px solid var(--line)}.ref:nth-child(odd){border-right:1px solid var(--line)}
.ref h4{font-family:'Playfair';font-weight:700;font-size:12.5px;color:var(--ink)}.ref .seg{font-size:7.5px;letter-spacing:2px;color:var(--gold-d);font-weight:700;text-transform:uppercase;margin:2px 0 6px}
.ref p{font-size:9px;color:var(--muted);line-height:1.5}.ref p b{color:var(--gold-d)}
.condos{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.condos img{width:100%;height:112px;object-fit:cover;display:block}
table.tb th.c,table.tb td.c{text-align:center}
.logo-final{display:block;margin:30px auto 0;width:62mm}
table.tb tr.total-row td{background:var(--ink2)!important;color:var(--gold)!important;font-weight:700;font-size:11px;letter-spacing:.4px}
@media print{.toast,#modalRoot{display:none!important}}

function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function parseBRL(v){if(v==null)return 0;v=String(v).trim();if(!v)return 0;v=v.replace(/[^0-9.,]/g,'');
  if(v.indexOf(',')>=0){v=v.replace(/\./g,'').replace(',','.');}else if((v.match(/\./g)||[]).length>1){v=v.replace(/\./g,'');}
  const n=parseFloat(v);return isNaN(n)?0:n;}
function fmtBRL(n){return 'R$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function extenso(n){
  n=Math.round(n*100)/100; let reais=Math.floor(n); let cent=Math.round((n-reais)*100);
  function ate999(x){const u=['','um','dois','três','quatro','cinco','seis','sete','oito','nove'],d10=['dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'],
    d=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'],c=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
    if(x===0)return'';if(x===100)return'cem';let p=[];const ce=Math.floor(x/100),r=x%100;if(ce>0)p.push(c[ce]);
    if(r>0){let s;if(r<10)s=u[r];else if(r<20)s=d10[r-10];else{const dz=Math.floor(r/10),un=r%10;s=d[dz]+(un>0?' e '+u[un]:'');}p.push(s);}return p.join(' e ');}
  function inteiro(x){if(x===0)return'zero';const mi=Math.floor(x/1000000),mil=Math.floor((x%1000000)/1000),un=x%1000;let parts=[];
    if(mi>0)parts.push(ate999(mi)+(mi===1?' milhão':' milhões'));if(mil>0)parts.push(mil===1?'mil':ate999(mil)+' mil');if(un>0)parts.push(ate999(un));
    if(parts.length===1)return parts[0];const last=parts.pop();const join=((un>0&&un<100)||(un===0))?' e ':', ';return parts.join(', ')+join+last;}
  let s=inteiro(reais)+' '+(reais===1?'real':'reais');if(cent>0)s+=' e '+inteiro(cent)+' '+(cent===1?'centavo':'centavos');return s;}
function totalMensal(){let t=0;S.investimento.forEach(i=>{t+=parseBRL(i.unit)*(parseInt(i.qtd)||0);});return t;}

/* ---------------- BANCO: salvar, histórico, parâmetros ---------------- */
function dadosLimpos(){const o=JSON.parse(JSON.stringify(S));delete o._id;delete o._status;return o;}
async function salvar(silencioso){
  if(!S.cliente.trim()){toast('Preencha o nome do cliente antes de salvar.',1);return false}
  const tot=totalMensal();
  if(!S._id){
    const r=await sb.rpc('com_salvar_proposta_nova',{p_dados:dadosLimpos(),p_cliente:S.cliente,p_ac:S.ac,p_total:tot});
    if(r.error){toast('Não foi possível salvar: '+r.error.message,1);return false}
    S._id=r.data.id;S.numero=r.data.numero;S._status=r.data.status;
  }else{
    const r=await sb.from('com_propostas').update({dados:dadosLimpos(),cliente:S.cliente,ac:S.ac,valor_total:tot,status:S._status}).eq('id',S._id);
    if(r.error){toast('Não foi possível salvar: '+r.error.message,1);return false}
  }
  document.getElementById('estado').dataset.sujo='0';renderEditor();renderPreview();
  if(!silencioso)toast('Proposta Nº '+S.numero+' salva.');return true;
}
async function exportarPDF(){
  if(!S._id||document.getElementById('estado').dataset.sujo==='1'){if(!(await salvar(true)))return;}
  const d=new Date(),nome='Proposta_Comercial_CS_'+(S.cliente||'CLIENTE').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'').toUpperCase()+' - '+pad2(d.getDate())+'.'+pad2(d.getMonth()+1);
  const t=document.title;document.title=nome;setTimeout(()=>{window.print();document.title=t},150);
}
function nova(){if(document.getElementById('estado').dataset.sujo==='1'&&!confirm('Há alterações não salvas. Começar uma proposta nova mesmo assim?'))return;
  S=estadoVazio();document.getElementById('estado').dataset.sujo='0';renderEditor();renderPreview();}
function duplicar(){S=Object.assign(JSON.parse(JSON.stringify(S)),{_id:null,numero:'',_status:'rascunho',mesAno:mesAnoHoje()});marcaAlterado();renderEditor();renderPreview();toast('Cópia criada. Ela ganha um número novo ao salvar.');}

let HIST=[];
async function historico(){
  const r=await sb.from('com_propostas').select('id,numero,cliente,valor_total,status,criado_em,atualizado_em').is('cancelado_em',null).order('ano',{ascending:false}).order('seq',{ascending:false}).limit(500);
  if(r.error){toast('Erro ao abrir o histórico: '+r.error.message,1);return}
  HIST=r.data;modal('<h2>Histórico de propostas</h2><input class="busca" placeholder="Buscar por número ou cliente" oninput="filtraHist(this.value)"><div id="histLista"></div>');filtraHist('');
}
function filtraHist(q){q=(q||'').toLowerCase();const st={rascunho:'Rascunho',enviada:'Enviada',aceita:'Aceita',recusada:'Recusada'};
  const l=HIST.filter(p=>!q||(p.numero+' '+p.cliente).toLowerCase().includes(q));
  document.getElementById('histLista').innerHTML=l.length?'<table class="hist"><thead><tr><th>Nº</th><th>Cliente</th><th class="r">Total mensal</th><th>Status</th><th>Atualizada</th><th></th></tr></thead><tbody>'+
    l.map(p=>'<tr><td><b>'+esc(p.numero)+'</b></td><td>'+esc(p.cliente)+'</td><td class="r">'+fmtBRL(+p.valor_total)+'</td><td><select onchange="mudaStatus(\''+p.id+'\',this.value)">'+Object.keys(st).map(k=>'<option value="'+k+'"'+(p.status===k?' selected':'')+'>'+st[k]+'</option>').join('')+'</select></td><td>'+new Date(p.atualizado_em).toLocaleDateString('pt-BR')+'</td><td><button class="btn btn-mini" onclick="abrir(\''+p.id+'\')">Abrir</button></td></tr>').join('')+'</tbody></table>':'<p class="hint">Nenhuma proposta salva ainda.</p>';}
async function mudaStatus(id,st){const r=await sb.from('com_propostas').update({status:st}).eq('id',id);if(r.error)return toast('Erro: '+r.error.message,1);
  const p=HIST.find(x=>x.id===id);if(p)p.status=st;if(S._id===id){S._status=st;atualizaEstado();}toast('Status atualizado.');}
async function abrir(id){if(document.getElementById('estado').dataset.sujo==='1'&&!confirm('Há alterações não salvas. Abrir outra proposta mesmo assim?'))return;
  const r=await sb.from('com_propostas').select('*').eq('id',id).single();if(r.error)return toast('Erro: '+r.error.message,1);
  S=Object.assign(estadoVazio(),r.data.dados,{_id:r.data.id,numero:r.data.numero,_status:r.data.status});
  fecharModal();document.getElementById('estado').dataset.sujo='0';renderEditor();renderPreview();toast('Proposta Nº '+S.numero+' aberta.');}

async function carregarParametros(){
  const r=await sb.from('com_parametros').select('valor').eq('chave','propostas').maybeSingle();
  if(r.data&&r.data.valor){const v=r.data.valor;Object.keys(P0).forEach(k=>{if(v[k]!=null)P[k]=v[k];});P._ultimoAno=v.ultimoAno;P._ultimoNumero=v.ultimoNumero;}
  const ex=(P.fotosExtras||[]).map(f=>f.path);
  if(ex.length){const s=await sb.storage.from('comercial').createSignedUrls(ex,3600*8);(s.data||[]).forEach((x,i)=>{if(x.signedUrl)URL_EXTRA[ex[i]]=x.signedUrl});}
}
async function salvarParametros(v){
  const r0=await sb.from('com_parametros').select('valor').eq('chave','propostas').maybeSingle();
  const atual=(r0.data&&r0.data.valor)||{};const novo=Object.assign({},atual,v);
  const r=await sb.from('com_parametros').upsert({chave:'propostas',valor:novo});
  if(r.error){toast('Não foi possível salvar os parâmetros: '+r.error.message,1);return false}return true;
}
async function enviarFoto(inp){const f=inp.files&&inp.files[0];if(!f)return;
  if(f.size>8*1024*1024)return toast('Foto muito grande (máx. 8 MB).',1);
  const path='propostas/fotos/'+Date.now()+'-'+f.name.normalize('NFD').replace(/[^\w.-]+/g,'_');
  const up=await sb.storage.from('comercial').upload(path,f,{contentType:f.type});if(up.error)return toast('Erro ao enviar: '+up.error.message,1);
  const k='x'+Date.now().toString(36);P.fotosExtras=(P.fotosExtras||[]).concat([{k,n:f.name,path}]);
  if(!(await salvarParametros({fotosExtras:P.fotosExtras})))return;
  const s=await sb.storage.from('comercial').createSignedUrl(path,3600*8);if(s.data)URL_EXTRA[path]=s.data.signedUrl;
  if(S.fotos.length<6)S.fotos.push(k);renderEditor();renderPreview();marcaAlterado();toast('Foto adicionada ao banco de imagens.');}

/* Descrições prontas dos postos (Parâmetros > Descrições prontas dos postos) */
function catalogo(){return P.postosCatalogo||[];}
function opcoesCatalogo(){return catalogo().map((c,k)=>'<option value="'+k+'">'+esc(c.titulo+(c.subtitulo?' '+c.subtitulo:''))+'</option>').join('');}
function copiaCat(k){const c=catalogo()[k];return {titulo:c.titulo,subtitulo:c.subtitulo||'',itens:c.itens};}
function addCatalogo(){const k=document.getElementById('catNovo').value;if(k==='')return toast('Escolha um posto na lista.',1);
  const vazio=S.atribuicoes.findIndex(a=>!a.titulo&&!a.itens);if(vazio>=0)S.atribuicoes[vazio]=copiaCat(+k);else S.atribuicoes.push(copiaCat(+k));
  renderEditor();renderPreview();marcaAlterado();}
function usarCatalogo(i,k){if(k==='')return;const a=S.atribuicoes[i];
  if((a.titulo||a.itens)&&!confirm('Trocar o texto deste posto pela descrição pronta?'))return renderEditor();
  S.atribuicoes[i]=copiaCat(+k);renderEditor();renderPreview();marcaAlterado();}
async function salvarNoCatalogo(i){const a=S.atribuicoes[i];if(!a.titulo.trim()||!a.itens.trim())return toast('Preencha o posto e as atividades antes de salvar.',1);
  const cat=catalogo().slice();const j=cat.findIndex(c=>c.titulo.trim().toLowerCase()===a.titulo.trim().toLowerCase()&&(c.subtitulo||'').trim()===(a.subtitulo||'').trim());
  if(j>=0&&!confirm('Já existe uma descrição pronta para "'+a.titulo+'". Substituir pelo texto deste posto?'))return;
  const novo={titulo:a.titulo.trim(),subtitulo:(a.subtitulo||'').trim(),itens:a.itens.trim()};if(j>=0)cat[j]=novo;else cat.push(novo);
  if(!(await salvarParametros({postosCatalogo:cat})))return;P.postosCatalogo=cat;renderEditor();toast(j>=0?'Descrição pronta atualizada.':'Descrição pronta salva.');}
function catalogoTexto(){return catalogo().map(c=>c.titulo+(c.subtitulo?' | '+c.subtitulo:'')+'\n'+c.itens).join('\n---\n');}
function lerCatalogo(t){return t.split(/\n\s*-{3,}\s*\n/).map(b=>b.split('\n').map(x=>x.trim()).filter(Boolean)).filter(b=>b.length).map(b=>{const [ti,sub]=b[0].split('|').map(x=>x.trim());return {titulo:ti,subtitulo:sub||'',itens:b.slice(1).join('\n')};});}
