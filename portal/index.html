function composerHTML(){
  return `
  <div class="card composer" id="composer">
    <div class="row" style="align-items:flex-start">${avatar(S.me)}<textarea id="cmp-text" placeholder="Compartilhe algo com a equipe…" maxlength="4000"></textarea></div>
    <div id="cmp-prev"></div>
    <div class="sched-row" id="cmp-sched" hidden>${ico('clock')}<span class="small muted">Publicar em</span><input type="datetime-local" id="cmp-when"><button class="linkbtn" id="cmp-sched-x">cancelar agendamento</button></div>
    <div class="cmp-bar">
      <label class="icbtn" title="Adicionar arte ou foto">${ico('image')}<input type="file" id="cmp-file" accept="image/*" hidden></label>
      <button class="icbtn" id="cmp-sched-btn" title="Agendar publicação">${ico('clock')}</button>
      <select id="cmp-tipo" title="Etiqueta">${TIPOS_POST.map(t => `<option ${t.n==='Aviso' ? 'selected' : ''}>${t.n}</option>`).join('')}</select>
      ${isGestor() ? `<label class="tog">${ico('award')}<input type="checkbox" id="cmp-oficial"> Oficial</label><label class="tog">${ico('pin')}<input type="checkbox" id="cmp-fixar"> Fixar</label>` : ''}
      <span class="grow"></span>
      <button class="btn gold" id="cmp-pub">${ico('send')} Publicar</button>
    </div>
  </div>`;
}

function bindComposer(){
  let file = null;
  const prev = $('#cmp-prev');
  $('#cmp-file').onchange = async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    if (f.size > 15*1024*1024) return toast('Imagem muito grande (máx. 15 MB).', true);
    file = await compressImage(f).catch(() => f);
    prev.innerHTML = `<div class="prev-img"><img src="${URL.createObjectURL(file)}"><button title="Remover">${ico('x')}</button></div>`;
    prev.querySelector('button').onclick = () => { file = null; prev.innerHTML = ''; };
  };
  $('#cmp-sched-btn').onclick = () => {
    const box = $('#cmp-sched'); box.hidden = !box.hidden; $('#cmp-sched-btn').classList.toggle('on', !box.hidden);
    if (!box.hidden && !$('#cmp-when').value){ const d = new Date(Date.now() + 864e5); d.setHours(8, 0, 0, 0); $('#cmp-when').value = new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,16); }
  };
  $('#cmp-sched-x').onclick = () => { $('#cmp-sched').hidden = true; $('#cmp-sched-btn').classList.remove('on'); };
  $('#cmp-tipo').onchange = e => { if (isGestor() && e.target.value === 'Comunicado') $('#cmp-oficial').checked = true; };
  $('#cmp-pub').onclick = async () => {
    const texto = $('#cmp-text').value.trim();
    if (!texto && !file) return toast('Escreva algo ou adicione uma imagem.', true);
    const agendado = !$('#cmp-sched').hidden && $('#cmp-when').value;
    const publicar_em = agendado ? new Date($('#cmp-when').value).toISOString() : nowISO();
    if (agendado && new Date(publicar_em) < new Date()) return toast('A data do agendamento já passou.', true);
    const b = $('#cmp-pub'); b.disabled = true; b.innerHTML = 'Publicando…';
    try {
      let imagem_url = null;
      if (file) imagem_url = await API.uploadMidia(`feed/${S.me.id}/${Date.now()}-${slug(file.name)}`, file);
      await API.insert('posts', {texto, tipo:$('#cmp-tipo').value, imagem_url, publicar_em, oficial: !!$('#cmp-oficial')?.checked, fixado: !!$('#cmp-fixar')?.checked});
      $('#cmp-text').value = ''; prev.innerHTML = ''; file = null; $('#cmp-sched').hidden = true; $('#cmp-sched-btn').classList.remove('on');
      if ($('#cmp-oficial')) $('#cmp-oficial').checked = false; if ($('#cmp-fixar')) $('#cmp-fixar').checked = false;
      toast(agendado ? 'Publicação agendada para ' + fmtDT(publicar_em) : 'Publicado!');
      await loadFeed();
    } catch(e){ fail(friendly(e)); }
    b.disabled = false; b.innerHTML = `${ico('send')} Publicar`;
  };
}

async function loadFeed(focusId){
  try {
    const posts = await API.list('posts', {order:[['fixado', false], ['publicar_em', false]], limit:S.postLimit});
    const ids = posts.map(p => p.id);
    const [rx, cm] = ids.length ? await Promise.all([API.list('reacoes', {f:[['post_id','in',ids]]}), API.list('comentarios', {f:[['post_id','in',ids]], order:[['criado_em', true]]})]) : [[], []];
    Object.assign(S, {posts, reacoes:rx, coments:cm, feedLoadedAt:nowISO()});
    renderFeed();
    if (focusId){ S.openCm.add(focusId); renderFeed(); const el = document.getElementById('post-' + focusId); if (el){ el.scrollIntoView({behavior:'smooth', block:'center'}); el.animate([{boxShadow:'0 0 0 3px #C79A3B'}, {boxShadow:'0 0 0 0 transparent'}], {duration:1800}); } }
  } catch(e){ $('#feed').innerHTML = `<div class="card empty">Não foi possível carregar o mural. <br><button class="btn sm" onclick="loadFeed()">Tentar de novo</button></div>`; fail(e); }
}

function renderFeed(){
  const box = $('#feed'); if (!box) return;
  const list = S.posts.filter(p => !S.filtroTipo || p.tipo === S.filtroTipo);
  if (!list.length){ box.innerHTML = `<div class="card empty">${medal('megaphone','', 'lg')}<div>${S.filtroTipo ? 'Nenhuma publicação com esta etiqueta.' : 'Nenhuma publicação ainda. Que tal a primeira?'}</div></div>`; return; }
  box.innerHTML = list.map(postHTML).join('') + (S.posts.length >= S.postLimit ? `<div style="text-align:center"><button class="btn" id="btn-more">Carregar mais</button></div>` : '');
  $('#btn-more')?.addEventListener('click', () => { S.postLimit += 30; loadFeed(); });
}

function postHTML(p){
  const a = perfil(p.autor_id), mine = p.autor_id === S.me.id;
  const sched = new Date(p.publicar_em) > new Date();
  const unread = !mine && !sched && S.leitura && p.publicar_em > S.leitura;
  const tipo = TIPOS_POST.find(t => t.n === p.tipo) || {n:p.tipo, c:''};
  const rs = S.reacoes.filter(r => r.post_id === p.id), cs = S.coments.filter(c => c.post_id === p.id);
  const canMenu = mine || isGestor() || isAdmin();
  const open = S.openCm.has(p.id);
  return `
  <article class="card post ${p.oficial ? 'oficial' : ''} ${sched ? 'sched' : ''} ${unread ? 'unread' : ''}" id="post-${p.id}" data-id="${p.id}">
    ${canMenu ? `<div class="post-menu"><button class="icbtn" data-act="post-menu" title="Opções">${ico('more')}</button></div>` : ''}
    <div class="post-h">
      ${avatar(a)}
      <div style="min-width:0;padding-right:34px">
        <div class="row" style="gap:6px;flex-wrap:wrap"><span class="nm">${esc(a.nome)}</span>${p.oficial ? `<span class="chip dark" title="Publicação oficial">${ico('award','gold')} Oficial</span>` : ''}</div>
        <div class="meta">${esc(a.cargo || PAPEIS[a.papel] || '')} · <span title="${fmtDT(p.publicar_em)}">${rel(p.publicar_em)}</span>${p.editado_em ? ' · editado' : ''}</div>
        <div class="badges"><span class="chip ${tipo.c}">${esc(tipo.n)}</span>${p.fixado ? `<span class="chip">${ico('pin')} Fixado</span>` : ''}${sched ? `<span class="chip warn">${ico('clock')} Agendado · ${fmtDT(p.publicar_em)}</span>` : ''}</div>
      </div>
    </div>
    ${p.texto ? `<div class="post-body">${linkify(p.texto)}</div>` : ''}
    ${p.imagem_url ? `<div class="post-img"><img src="${esc(p.imagem_url)}" alt="" loading="lazy" data-act="lightbox"></div>` : ''}
    <div class="post-f">
      ${EMOJIS.map(em => { const who = rs.filter(r => r.emoji === em); const on = who.some(r => r.usuario_id === S.me.id);
        return `<button class="rx ${on ? 'on' : ''}" data-act="react" data-e="${em}" title="${esc(who.map(r => perfil(r.usuario_id).nome).join(', '))}">${em}${who.length ? `<b>${who.length}</b>` : ''}</button>`; }).join('')}
      <button class="cm-toggle" data-act="cm-toggle">${ico('chat')} ${cs.length ? cs.length + (cs.length > 1 ? ' comentários' : ' comentário') : 'Comentar'}</button>
    </div>
    ${open ? `<div class="comments">
      ${cs.map(c => { const ca = perfil(c.autor_id); return `<div class="cm">${avatar(ca,'sm')}<div class="bub"><div class="row" style="gap:8px"><b>${esc(ca.nome)}</b><span class="tiny muted">${rel(c.criado_em)}</span><span class="grow"></span>${c.autor_id === S.me.id || isAdmin() ? `<button class="linkbtn" style="color:var(--soft)" data-act="cm-del" data-c="${c.id}" title="Excluir">${ico('trash')}</button>` : ''}</div><p>${linkify(c.texto)}</p></div></div>`; }).join('')}
      <div class="cm-new">${avatar(S.me,'sm')}<input placeholder="Escreva um comentário…" maxlength="1000" data-cm="${p.id}"><button class="icbtn" data-act="cm-send" title="Enviar">${ico('send')}</button></div>
    </div>` : ''}
  </article>`;
}

/* ações do feed (delegadas) */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, post = el.closest('.post'), pid = post?.dataset.id;
  try {
    if (act === 'lightbox'){ const lb = document.createElement('div'); lb.className = 'lightbox'; lb.innerHTML = `<img src="${el.src}">`; lb.onclick = () => lb.remove(); document.body.appendChild(lb); }
    if (act === 'react'){
      const em = el.dataset.e, mine = S.reacoes.find(r => r.post_id === pid && r.emoji === em && r.usuario_id === S.me.id);
      if (mine){ S.reacoes = S.reacoes.filter(r => r !== mine); renderFeed(); await API.remove('reacoes', [['post_id','eq',pid], ['usuario_id','eq',S.me.id], ['emoji','eq',em]]); }
      else { const r = {post_id:pid, usuario_id:S.me.id, emoji:em}; S.reacoes.push(r); renderFeed(); await API.insert('reacoes', {post_id:pid, emoji:em}); }
    }
    if (act === 'cm-toggle'){ S.openCm.has(pid) ? S.openCm.delete(pid) : S.openCm.add(pid); renderFeed(); if (S.openCm.has(pid)) $(`#post-${pid} [data-cm]`)?.focus(); }
    if (act === 'cm-send') sendComment(post.querySelector('[data-cm]'));
    if (act === 'cm-del'){ if (!(await confirmBox('Excluir este comentário?', {ok:'Excluir', danger:true}))) return; await API.remove('comentarios', [['id','eq',el.dataset.c]]); S.coments = S.coments.filter(c => c.id !== el.dataset.c); renderFeed(); }
    if (act === 'post-menu') postMenu(el, S.posts.find(p => p.id === pid));
  } catch(err){ fail(friendly(err)); loadFeed(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('[data-cm]') && !e.shiftKey){ e.preventDefault(); sendComment(e.target); } if (e.key === 'Escape'){ closePop(); $('.lightbox')?.remove(); } });
async function sendComment(inp){
  const texto = inp.value.trim(); if (!texto) return; const pid = inp.dataset.cm; inp.disabled = true;
  try { const c = await API.insert('comentarios', {post_id:pid, texto}); S.coments.push(c); renderFeed(); $(`#post-${pid} [data-cm]`)?.focus(); }
  catch(e){ fail(friendly(e)); inp.disabled = false; }
}

function postMenu(anchor, p){
  const mine = p.autor_id === S.me.id, items = [];
  if (isGestor()) items.push({t: p.fixado ? 'Desafixar do topo' : 'Fixar no topo', i:'pin', f: () => updPost(p, {fixado: !p.fixado})});
  if (isGestor()) items.push({t: p.oficial ? 'Remover selo Oficial' : 'Marcar como Oficial', i:'award', f: () => updPost(p, {oficial: !p.oficial})});
  if (mine || isGestor()) items.push({t:'Editar publicação', i:'edit', f: () => modalEditPost(p)});
  if (mine || isAdmin()) items.push({t:'Excluir publicação', i:'trash', danger:true, f: async () => { if (await confirmBox('Excluir esta publicação? Reações e comentários também serão apagados.', {ok:'Excluir', danger:true})) { await API.remove('posts', [['id','eq',p.id]]); toast('Publicação excluída.'); loadFeed(); } }});
  showMenu(anchor, items);
}
async function updPost(p, patch){ try { await API.update('posts', p.id, patch); await loadFeed(); } catch(e){ fail(friendly(e)); } }

function modalEditPost(p){
  const sched = new Date(p.publicar_em) > new Date();
  const local = d => { const x = new Date(d); return new Date(x - x.getTimezoneOffset()*6e4).toISOString().slice(0,16); };
  const m = openModal({title:'Editar publicação', body:`
    <div class="field"><label>Texto</label><textarea class="inp" id="ep-t" rows="6">${esc(p.texto)}</textarea></div>
    <div class="grid2"><div class="field"><label>Etiqueta</label><select class="inp" id="ep-tipo">${TIPOS_POST.map(t => `<option ${t.n===p.tipo ? 'selected' : ''}>${t.n}</option>`).join('')}</select></div>
    ${sched ? `<div class="field"><label>Publicar em</label><input class="inp" type="datetime-local" id="ep-when" value="${local(p.publicar_em)}"></div>` : ''}</div>
    ${p.imagem_url ? `<label class="check"><input type="checkbox" id="ep-rmimg"> Remover a imagem desta publicação</label>` : ''}`,
    foot:`<button class="btn" data-close>Cancelar</button><button class="btn gold" id="ep-save">Salvar</button>`});
  $('#ep-save', m.el).onclick = async () => {
    const patch = {texto:$('#ep-t', m.el).value.trim(), tipo:$('#ep-tipo', m.el).value};
    if (sched) patch.publicar_em = new Date($('#ep-when', m.el).value).toISOString();
    if ($('#ep-rmimg', m.el)?.checked) patch.imagem_url = null;
    if (!patch.texto && (!p.imagem_url || patch.imagem_url === null)) return toast('A publicação não pode ficar vazia.', true);
    try { if (API.demo && (patch.texto !== p.texto || 'imagem_url' in patch)) patch.editado_em = nowISO(); await API.update('posts', p.id, patch); m.close(); toast('Publicação atualizada.'); loadFeed(); } catch(e){ fail(friendly(e)); }
  };
}

function renderRail(){
  const rail = $('#rail'); if (!rail) return;
  const prox = proximosEventos(45).slice(0, 5);
  const sis = visibleSistemas().sort((a, b) => (isNovo(b) - isNovo(a)) || ((b.area_id === S.me.area_id) - (a.area_id === S.me.area_id)) || a.ordem - b.ordem).slice(0, 6);
  const docs = [...S.docs].sort((a, b) => b.atualizado_em > a.atualizado_em ? 1 : -1).slice(0, 5);
  rail.innerHTML = `
    <div class="card"><h3>${ico('grid','gold')} Acesso rápido</h3>
      ${sis.length ? `<div class="qa">${sis.map(s => `<a href="${esc(safeHref(s.url))}" target="_blank" rel="noopener" title="${esc(s.descricao)}">${medal(s.icone, s.icone_custom, 'md')}<span>${esc(s.nome)}</span></a>`).join('')}</div>` : '<div class="muted small">Nenhum sistema disponível.</div>'}
      <a href="#/sistemas" class="small" style="display:block;margin-top:10px;font-weight:600;color:var(--gold-d);text-decoration:none">Ver todos os sistemas →</a></div>
    <div class="card"><h3>${ico('calendar','gold')} Próximos eventos</h3>
      ${prox.length ? prox.map(evHTML).join('') : '<div class="muted small">Nada nos próximos dias.</div>'}
      <a href="#/agenda" class="small" style="display:block;margin-top:10px;font-weight:600;color:var(--gold-d);text-decoration:none">Abrir agenda →</a></div>
    <div class="card"><h3>${ico('folder','gold')} Documentos recentes</h3>
      ${docs.length ? docs.map(d => `<div class="mini-doc" data-doc="${d.id}">${medal(docIcon(d), '', 'sm')}<div style="min-width:0"><div class="t small clamp1" style="font-weight:600">${esc(d.titulo)}</div><div class="tiny muted">${esc(pasta(d.pasta_id)?.nome || '')} · ${fmtD(d.atualizado_em)}</div></div></div>`).join('') : '<div class="muted small">Nenhum documento ainda.</div>'}
      <a href="#/documentos" class="small" style="display:block;margin-top:10px;font-weight:600;color:var(--gold-d);text-decoration:none">Central de documentos →</a></div>`;
  rail.onclick = e => { const d = e.target.closest('[data-doc]'); if (d) openDoc(S.docs.find(x => x.id === d.dataset.doc)); };
}
function evHTML(ev){ const d = parseD(ev.data); return `<div class="ev"><div class="dt"><b>${d.getDate()}</b><span>${MESES[d.getMonth()]}</span></div><div style="min-width:0"><div class="small clamp1" style="font-weight:600">${esc(ev.titulo)}</div><div class="tiny muted">${esc(ev.tipo)}${ev.hora ? ' · ' + esc(ev.hora) : ''} · ${fmtDay(ev.data)}</div></div></div>`; }

/* notificações */
async function refreshUnread(){
  try {
    S.unread = await API.count('posts', [['publicar_em','gt',S.leitura], ['publicar_em','lte',nowISO()], ['autor_id','neq',S.me.id]]);
    const dot = $('#bell-dot'), nav = $('#nav-unread');
    if (dot){ dot.hidden = !S.unread; dot.textContent = S.unread > 9 ? '9+' : S.unread; }
    if (nav){ nav.hidden = !S.unread; nav.textContent = S.unread > 9 ? '9+' : S.unread; }
    document.title = (S.unread ? `(${S.unread}) ` : '') + portalName();
  } catch(e){}
}
async function poll(){
  if (document.hidden || !S.me) return;
  await refreshUnread();
  if ($('#feed') && S.feedLoadedAt){
    try { const n = await API.count('posts', [['publicar_em','gt',S.feedLoadedAt], ['publicar_em','lte',nowISO()], ['autor_id','neq',S.me.id]]);
      if (n){ $('#newpill').hidden = false; $('#newpill span').textContent = n > 1 ? `${n} novas publicações` : '1 nova publicação'; } } catch(e){}
  }
}
async function bellPop(anchor){
  if (closePop()) return;
  const pop = mkPop(anchor, 'bell-pop');
  pop.innerHTML = `<div class="hd"><h3>Notificações</h3><button class="linkbtn" id="bp-read">Marcar como lidas</button></div><div class="lst"><div class="empty"><div class="spin" style="margin:auto"></div></div></div>`;
  place(pop, anchor);
  const lastSeen = S.leitura;
  try {
    const posts = await API.list('posts', {f:[['publicar_em','lte',nowISO()], ['autor_id','neq',S.me.id]], order:[['publicar_em', false]], limit:12});
    pop.querySelector('.lst').innerHTML = posts.length ? posts.map(p => { const a = perfil(p.autor_id); return `<div class="it ${p.publicar_em > lastSeen ? 'un' : ''}" data-p="${p.id}">${avatar(a,'sm')}<div style="min-width:0"><div class="small"><b>${esc(a.nome)}</b> publicou ${p.oficial ? '<b>comunicado oficial</b>' : 'em <b>' + esc(p.tipo) + '</b>'}</div><div class="small muted clamp1">${esc(p.texto || '📷 Imagem')}</div><div class="tiny muted">${rel(p.publicar_em)}</div></div></div>`; }).join('') : `<div class="empty small">Nenhuma notificação.</div>`;
    pop.querySelector('.lst').onclick = e => { const it = e.target.closest('[data-p]'); if (it){ closePop(); const h = '#/inicio/' + it.dataset.p; if (location.hash === h) pageInicio(it.dataset.p); else location.hash = h; } };
  } catch(e){ fail(e); }
  $('#bp-read', pop).onclick = markRead;
  markRead(true);
}
async function markRead(silent){
  S.leitura = nowISO();
  try { await API.upsert('leituras', {usuario_id:S.me.id, ultimo_visto:S.leitura}); } catch(e){}
  S.unread = 0; refreshUnread();
  if (silent !== true){ closePop(); $$('.post.unread').forEach(p => p.classList.remove('unread')); }
}

/* ============================ SISTEMAS ============================ */
function pageSistemas(){
  const vis = visibleSistemas();
  const areasUsadas = S.areas.filter(a => vis.some(s => s.area_id === a.id));
  $('#main').innerHTML = `
  <div class="page-h"><div><h1>Sistemas</h1><p>Todas as ferramentas da C&amp;S em um só lugar. Cada sistema abre em uma nova aba.</p></div><span class="grow"></span>
    ${isAdmin() ? `<a class="btn gold" href="#/admin/sistemas">${ico('plus')} <span>Incluir sistema</span></a>` : ''}</div>
  <div class="row wrap" style="margin-bottom:18px;gap:12px">
    <div class="search" style="max-width:320px">${ico('search')}<input id="sys-q" placeholder="Filtrar sistemas…"></div>
    <div class="filters" id="sys-f" style="margin:0">${[{id:'', nome:'Todas as áreas'}, ...areasUsadas].map(a => `<button class="fchip ${S.sysArea===a.id ? 'on' : ''}" data-a="${a.id}">${esc(a.nome)}</button>`).join('')}</div>
  </div>
  <div id="sys-list"></div>`;
  const draw = () => {
    const q = norm($('#sys-q').value);
    const list = vis.filter(s => (!S.sysArea || s.area_id === S.sysArea) && (!q || norm(s.nome + ' ' + s.descricao).includes(q)));
    const grupos = [...S.areas, {id:null, nome:'Outros', icone:'layers'}].map(a => ({a, it:list.filter(s => (s.area_id || null) === a.id && (a.id !== null || !area(s.area_id)))})).filter(g => g.it.length);
    const semArea = list.filter(s => s.area_id && !area(s.area_id)); if (semArea.length) { const o = grupos.find(g => g.a.id === null); o ? o.it.push(...semArea) : grupos.push({a:{id:null, nome:'Outros', icone:'layers'}, it:semArea}); }
    $('#sys-list').innerHTML = grupos.length ? grupos.map(({a, it}) => `
      <section class="area-sec"><div class="area-h">${medal(a.icone, a.icone_custom, 'md')}<h2>${esc(a.nome)}</h2><span class="chip">${it.length}</span></div>
      <div class="sys-grid">${it.map(sysCard).join('')}</div></section>`).join('')
      : `<div class="card empty">${medal('grid','','lg')}Nenhum sistema encontrado.</div>`;
  };
  $('#sys-q').oninput = draw;
  $('#sys-f').onclick = e => { const b = e.target.closest('.fchip'); if (!b) return; S.sysArea = b.dataset.a; $$('#sys-f .fchip').forEach(x => x.classList.toggle('on', x === b)); draw(); };
  draw();
}
function sysCard(s){
  return `<a class="card sys" href="${esc(safeHref(s.url))}" target="_blank" rel="noopener">${medal(s.icone, s.icone_custom, 'lg')}
    <div style="min-width:0;padding-right:18px"><div class="t">${esc(s.nome)}</div><div class="d">${esc(s.descricao || '')}</div></div>
    <span class="go">${ico('external')}</span>${isNovo(s) ? '<span class="chip gold novo">Novo</span>' : ''}</a>`;
}

/* ============================ DOCUMENTOS ============================ */
const filhos = id => S.pastas.filter(p => (p.pai_id || null) === (id || null)).sort((a, b) => a.ordem - b.ordem || a.nome.localeCompare(b.nome));
function descendentes(id){ const out = [id]; for (const f of filhos(id)) out.push(...descendentes(f.id)); return out; }
const docCount = id => { const ids = new Set(descendentes(id)); return S.docs.filter(d => ids.has(d.pasta_id)).length; };
function caminho(id){ const out = []; let p = pasta(id); while (p){ out.unshift(p); p = pasta(p.pai_id); } return out; }
function docIcon(d){
  if (d.tipo === 'link') return /drive\.google|docs\.google/.test(d.url || '') ? 'folder' : 'link';
  const ext = (d.arquivo_nome || '').split('.').pop().toLowerCase();
  return ['xls','xlsx','csv'].includes(ext) ? 'table' : ['ppt','pptx'].includes(ext) ? 'presentation' : ['png','jpg','jpeg','webp','gif','svg'].includes(ext) ? 'image' : 'file-text';
}
async function openDoc(d){
  if (!d) return;
  if (d.tipo === 'link') return window.open(safeHref(d.url), '_blank', 'noopener');
  const w = window.open('', '_blank');
  try { const u = await API.docUrl(d.arquivo_path); if (API.demo && w){ w.document.write(`<iframe src="${u}" style="border:0;width:100%;height:100%"></iframe>`); } else if (w) w.location = u; else location.href = u; }
  catch(e){ w?.close(); fail(friendly(e)); }
}

function pageDocs(pid){
  const cur = pid ? pasta(pid) : null;
  if (pid && !cur) { location.hash = '#/documentos'; return; }
  caminho(pid).forEach(p => S.treeOpen.add(p.id));
  const subs = filhos(pid), docs = S.docs.filter(d => (d.pasta_id || null) === (pid || null)).sort((a, b) => a.titulo.localeCompare(b.titulo));
  const g = isGestor();
  $('#main').innerHTML = `
  <div class="page-h"><div><div class="crumbs"><a href="#/documentos">Documentos</a>${caminho(pid).map(p => `${ico('chev-r')}<a href="#/documentos/${p.id}">${esc(p.nome)}</a>`).join('')}</div>
    <h1>${cur ? esc(cur.nome) : 'Central de Documentos'}</h1><p>${cur ? esc(cur.descricao || '') : 'POPs, políticas, modelos e materiais da marca — organizados por categoria.'}</p></div>
    <span class="grow"></span>
    <div class="row wrap">
      ${g ? `<button class="btn" id="d-newf">${ico('folder-plus')} <span>${cur ? 'Nova subpasta' : 'Nova categoria'}</span></button>` : ''}
      ${g && cur ? `<button class="btn gold" id="d-newd">${ico('plus')} <span>Novo documento</span></button><button class="icbtn" id="d-more" title="Opções da pasta">${ico('more')}</button>` : ''}
    </div></div>
  <div class="docs">
    <div class="card tree"><div class="search" style="margin-bottom:10px">${ico('search')}<input id="d-q" placeholder="Buscar documento…"></div><ul>${treeHTML(null, pid)}</ul></div>
    <div id="d-body">
      ${subs.length ? `<div class="sec-t">${cur ? 'Subpastas' : 'Categorias'}</div><div class="fold-grid">${subs.map(f => `<div class="card fold" data-f="${f.id}">${medal('folder','','md')}<div style="min-width:0"><div class="t">${esc(f.nome)}</div><div class="tiny muted">${docCount(f.id)} documento(s)${filhos(f.id).length ? ' · ' + filhos(f.id).length + ' subpasta(s)' : ''}</div></div></div>`).join('')}</div>` : ''}
      ${cur ? `<div class="sec-t">Documentos</div>${docs.length ? `<div class="card doc-list">${docs.map(docRow).join('')}</div>` : `<div class="card empty">${medal('file-text','','lg')}Nenhum documento nesta pasta${g ? '. Clique em “Novo documento” para incluir.' : '.'}</div>`}` : ''}
      ${!cur && !subs.length ? `<div class="card empty">${medal('folder','','lg')}Nenhuma categoria criada ainda.</div>` : ''}
    </div>
  </div>`;
  $('.tree').onclick = e => {
    const car = e.target.closest('.car'); const n = e.target.closest('.tn'); if (!n) return;
    if (car && car.dataset.id){ S.treeOpen.has(car.dataset.id) ? S.treeOpen.delete(car.dataset.id) : S.treeOpen.add(car.dataset.id); $('.tree > ul').innerHTML = treeHTML(null, pid); return; }
    location.hash = n.dataset.id ? '#/documentos/' + n.dataset.id : '#/documentos';
  };
  $('#d-body').onclick = e => {
    const f = e.target.closest('[data-f]'); if (f) return location.hash = '#/documentos/' + f.dataset.f;
    const b = e.target.closest('[data-da]'); if (!b) return; const d = S.docs.find(x => x.id === b.dataset.id);
    if (b.dataset.da === 'open') openDoc(d); if (b.dataset.da === 'edit') modalDoc(d, pid); if (b.dataset.da === 'del') delDoc(d);
  };
  const q = $('#d-q'); q.oninput = debounce(() => {
    const t = norm(q.value); if (!t) return pageDocs(pid);
    const res = S.docs.filter(d => norm(d.titulo + ' ' + d.descricao + ' ' + (d.arquivo_nome || '')).includes(t));
    $('#d-body').innerHTML = `<div class="sec-t">Resultados para “${esc(q.value)}”</div>${res.length ? `<div class="card doc-list">${res.map(d => docRow(d, true)).join('')}</div>` : `<div class="card empty">Nenhum documento encontrado.</div>`}`;
  }, 180);
  if (g){
    $('#d-newf').onclick = () => modalPasta(null, pid);
    if (cur){ $('#d-newd').onclick = () => modalDoc(null, pid);
      $('#d-more').onclick = e => showMenu(e.currentTarget, [{t:'Renomear / descrição', i:'edit', f:() => modalPasta(cur, cur.pai_id)}, {t:'Excluir pasta', i:'trash', danger:true, f:() => delPasta(cur)}]); }
  }
}
function treeHTML(parent, cur){
  return filhos(parent).map(f => { const kids = filhos(f.id).length, open = S.treeOpen.has(f.id);
    return `<li><div class="tn ${f.id === cur ? 'on' : ''}" data-id="${f.id}"><span class="car ${open ? 'open' : ''}" data-id="${kids ? f.id : ''}">${kids ? ico('chev-r') : ''}</span>${ico('folder')}<span class="clamp1">${esc(f.nome)}</span><span class="n">${docCount(f.id) || ''}</span></div>${kids && open ? `<ul>${treeHTML(f.id, cur)}</ul>` : ''}</li>`; }).join('');
}
function docRow(d, showPath){
  const g = isGestor();
  return `<div class="doc">${medal(docIcon(d),'','md')}<div class="grow" style="min-width:0">
    <div class="t" data-da="open" data-id="${d.id}">${esc(d.titulo)} ${d.versao ? `<span class="chip" style="height:20px">${esc(d.versao)}</span>` : ''}</div>
    ${d.descricao ? `<div class="small muted">${esc(d.descricao)}</div>` : ''}
    <div class="tiny muted">${showPath ? esc(caminho(d.pasta_id).map(p => p.nome).join(' › ')) + ' · ' : ''}${d.tipo === 'link' ? 'Link' : esc(d.arquivo_nome || 'Arquivo') + (d.tamanho ? ' · ' + fmtSize(d.tamanho) : '')} · atualizado em ${fmtD(d.atualizado_em)}</div></div>
    <div class="acts"><button class="btn sm" data-da="open" data-id="${d.id}">${ico(d.tipo === 'link' ? 'external' : 'eye')} Abrir</button>
    ${g ? `<button class="icbtn" data-da="edit" data-id="${d.id}" title="Editar">${ico('edit')}</button><button class="icbtn" data-da="del" data-id="${d.id}" title="Excluir">${ico('trash')}</button>` : ''}</div></div>`;
}
function pastaOptions(sel, excl){
  const out = []; const walk = (pid, lvl) => filhos(pid).forEach(f => { if (excl && descendentes(excl).includes(f.id)) return; out.push(`<option value="${f.id}" ${f.id === sel ? 'selected' : ''}>${'&nbsp;&nbsp;&nbsp;'.repeat(lvl)}${lvl ? '└ ' : ''}${esc(f.nome)}</option>`); walk(f.id, lvl + 1); });
  walk(null, 0); return out.join('');
}
function modalPasta(p, parent){
  const m = openModal({title: p ? 'Editar pasta' : parent ? 'Nova subpasta' : 'Nova categoria', body:`
    <div class="field"><label>Nome</label><input class="inp" id="mp-n" value="${esc(p?.nome || '')}" placeholder="Ex.: POPs, Políticas, Kit de Marca"></div>
    <div class="field"><label>Descrição (opcional)</label><input class="inp" id="mp-d" value="${esc(p?.descricao || '')}"></div>
    <div class="grid2">
      <div class="field"><label>Dentro de</label><select class="inp" id="mp-pai"><option value="">— Categoria principal —</option>${pastaOptions(parent, p?.id)}</select></div>
      <div class="field"><label>Ordem</label><input class="inp" type="number" id="mp-o" value="${p?.ordem ?? filhos(parent).length + 1}"></div>
    </div>`, foot:`<button class="btn" data-close>Cancelar</button><button class="btn gold" id="mp-s">Salvar</button>`});
  $('#mp-n', m.el).focus();
  $('#mp-s', m.el).onclick = async () => {
    const row = {nome:$('#mp-n', m.el).value.trim(), descricao:$('#mp-d', m.el).value.trim(), pai_id:$('#mp-pai', m.el).value || null, ordem:+$('#mp-o', m.el).value || 0};
    if (!row.nome) return toast('Dê um nome para a pasta.', true);
    try { const r = p ? await API.update('pastas', p.id, row) : await API.insert('pastas', row);
      S.pastas = p ? S.pastas.map(x => x.id === r.id ? r : x) : [...S.pastas, r]; m.close(); toast('Pasta salva.');
      p ? pageDocs(p.id) : (location.hash = '#/documentos/' + r.id); } catch(e){ fail(friendly(e)); }
  };
}
async function delPasta(p){
  const ids = descendentes(p.id), docs = S.docs.filter(d => ids.includes(d.pasta_id));
  if (!(await confirmBox(`Excluir a pasta “${p.nome}”?` + (ids.length > 1 || docs.length ? ` Isso também apaga ${ids.length - 1} subpasta(s) e ${docs.length} documento(s) dentro dela.` : ''), {ok:'Excluir', danger:true}))) return;
  try { for (const d of docs) if (d.arquivo_path) await API.removeDoc(d.arquivo_path);
    await API.remove('pastas', [['id','eq',p.id]]);
    S.pastas = S.pastas.filter(x => !ids.includes(x.id)); S.docs = S.docs.filter(d => !ids.includes(d.pasta_id));
    toast('Pasta excluída.'); location.hash = p.pai_id ? '#/documentos/' + p.pai_id : '#/documentos'; } catch(e){ fail(friendly(e)); }
}
function modalDoc(d, pid){
  let tipo = d?.tipo || 'link', file = null;
  const m = openModal({title: d ? 'Editar documento' : 'Novo documento', body:`
    <div class="field"><label>Título</label><input class="inp" id="md-t" value="${esc(d?.titulo || '')}" placeholder="Ex.: POP — Admissão de colaborador"></div>
    <div class="field"><label>Descrição (opcional)</label><textarea class="inp" id="md-d" rows="2">${esc(d?.descricao || '')}</textarea></div>
    <div class="grid2">
      <div class="field"><label>Pasta</label><select class="inp" id="md-p">${pastaOptions(d?.pasta_id || pid)}</select></div>
      <div class="field"><label>Versão (opcional)</label><input class="inp" id="md-v" value="${esc(d?.versao || '')}" placeholder="Ex.: v1.2 ou 2026"></div>
    </div>
    <div class="field"><label>Tipo</label><div class="row" id="md-tipo">
      <label class="tog"><input type="radio" name="mdt" value="link" ${tipo === 'link' ? 'checked' : ''}> ${ico('link')} Link (Drive, site…)</label>
      <label class="tog"><input type="radio" name="mdt" value="arquivo" ${tipo === 'arquivo' ? 'checked' : ''}> ${ico('upload')} Enviar arquivo</label></div></div>
    <div class="field" id="md-link"><label>Link</label><input class="inp" id="md-u" value="${esc(d?.url || '')}" placeholder="https://drive.google.com/…"></div>
    <div class="field" id="md-arq"><label>Arquivo (até 25 MB)</label>
      <div class="row wrap"><label class="btn">${ico('upload')} Escolher arquivo<input type="file" id="md-f" hidden></label><span class="small muted" id="md-fn">${d?.arquivo_nome ? 'Atual: ' + esc(d.arquivo_nome) + ' — escolha outro para substituir' : 'Nenhum arquivo escolhido'}</span></div></div>
    <div class="hint">Arquivos pesados (vídeos, fotos em alta, portfólios grandes) ficam melhores no Google Drive — use a opção Link.</div>`,
    foot:`<button class="btn" data-close>Cancelar</button><button class="btn gold" id="md-s">Salvar</button>`});
  const sync = () => { $('#md-link', m.el).hidden = tipo !== 'link'; $('#md-arq', m.el).hidden = tipo !== 'arquivo'; };
  $('#md-tipo', m.el).onchange = e => { tipo = e.target.value; sync(); }; sync();
  $('#md-f', m.el).onchange = e => { file = e.target.files[0]; if (file){ if (file.size > 25*1024*1024){ file = null; return toast('Arquivo maior que 25 MB — use um link do Drive.', true); } $('#md-fn', m.el).textContent = file.name + ' · ' + fmtSize(file.size); if (!$('#md-t', m.el).value) $('#md-t', m.el).value = file.name.replace(/\.\w+$/, ''); } };
  $('#md-s', m.el).onclick = async () => {
    const row = {titulo:$('#md-t', m.el).value.trim(), descricao:$('#md-d', m.el).value.trim(), pasta_id:$('#md-p', m.el).value || null, versao:$('#md-v', m.el).value.trim(), tipo, atualizado_em:nowISO()};
    if (!row.titulo) return toast('Informe o título.', true);
    if (!row.pasta_id) return toast('Escolha uma pasta.', true);
    if (tipo === 'link'){ row.url = $('#md-u', m.el).value.trim(); if (!/^https?:\/\//i.test(row.url)) return toast('Informe um link começando com https://', true); }
    if (tipo === 'arquivo' && !file && !d?.arquivo_path) return toast('Escolha o arquivo.', true);
    const b = $('#md-s', m.el); b.disabled = true; b.textContent = 'Salvando…';
    try {
      if (tipo === 'arquivo' && file){ row.arquivo_path = await API.uploadDoc(`${row.pasta_id}/${Date.now()}-${slug(file.name)}`, file); row.arquivo_nome = file.name; row.tamanho = file.size; }
      if (tipo === 'link'){ row.arquivo_path = null; row.arquivo_nome = null; row.tamanho = null; }
      const old = d?.arquivo_path;
      const r = d ? await API.update('documentos', d.id, row) : await API.insert('documentos', row);
      if (old && old !== r.arquivo_path) API.removeDoc(old);
      S.docs = d ? S.docs.map(x => x.id === r.id ? r : x) : [...S.docs, r];
      m.close(); toast('Documento salvo.'); pageDocs(location.hash.split('/')[2] || r.pasta_id);
    } catch(e){ fail(friendly(e)); b.disabled = false; b.textContent = 'Salvar'; }
  };
}
async function delDoc(d){
  if (!(await confirmBox(`Excluir o documento “${d.titulo}”?`, {ok:'Excluir', danger:true}))) return;
  try { if (d.arquivo_path) await API.removeDoc(d.arquivo_path); await API.remove('documentos', [['id','eq',d.id]]); S.docs = S.docs.filter(x => x.id !== d.id); toast('Documento excluído.'); pageDocs(location.hash.split('/')[2] || null); } catch(e){ fail(friendly(e)); }
}

/* ============================ AGENDA ============================ */
function pascoa(y){ const a = y%19, b = Math.floor(y/100), c = y%100, d = Math.floor(b/4), e = b%4, f = Math.floor((b+8)/25), g = Math.floor((b-f+1)/3), h = (19*a+b-d-g+15)%30, i = Math.floor(c/4), k = c%4, l = (32+2*e+2*i-h-k)%7, m = Math.floor((a+11*h+22*l)/451), mo = Math.floor((h+l-7*m+114)/31), da = ((h+l-7*m+114)%31)+1; return new Date(y, mo-1, da); }
function feriados(y){
  const p = pascoa(y), add = n => dStr(new Date(p.getFullYear(), p.getMonth(), p.getDate() + n));
  const f = (m, d) => `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  return [
    [f(1,1),'Confraternização Universal'], [f(1,25),'Aniversário de São Paulo (capital)'], [add(-48),'Carnaval (ponto facultativo)'], [add(-47),'Carnaval (ponto facultativo)'],
    [add(-2),'Sexta-feira Santa'], [f(4,21),'Tiradentes'], [f(5,1),'Dia do Trabalho'], [add(60),'Corpus Christi (ponto facultativo)'],
    [f(7,9),'Revolução Constitucionalista (SP)'], [f(9,7),'Independência do Brasil'], [f(10,12),'Nossa Senhora Aparecida'], [f(11,2),'Finados'],
    [f(11,15),'Proclamação da República'], [f(11,20),'Dia da Consciência Negra'], [f(12,25),'Natal']
  ].map(([data, titulo]) => ({id:'fer-' + data + titulo, titulo, data, tipo:'Feriado', nacional:true, descricao:'Feriado/data comemorativa gerada automaticamente pelo portal.'}));
}
function eventosDo(from, to){
  const out = S.eventos.filter(e => (e.data_fim || e.data) >= from && e.data <= to);
  for (let y = +from.slice(0,4); y <= +to.slice(0,4); y++) out.push(...feriados(y).filter(e => e.data >= from && e.data <= to));
  return out.sort((a, b) => a.data.localeCompare(b.data) || String(a.hora).localeCompare(String(b.hora)));
}
const proximosEventos = dias => eventosDo(hojeStr(), dStr(new Date(Date.now() + dias*864e5)));

function pageAgenda(){
  if (!S.calMonth){ const d = new Date(); S.calMonth = new Date(d.getFullYear(), d.getMonth(), 1); }
  const g = isGestor(), M = S.calMonth, y = M.getFullYear(), mo = M.getMonth();
  const start = new Date(y, mo, 1 - M.getDay()), cells = [];
  for (let i = 0; i < 42; i++){ const d = new Date(start); d.setDate(start.getDate() + i); cells.push(d); }
  if (cells[35].getMonth() !== mo) cells.length = 35;
  const evs = eventosDo(dStr(cells[0]), dStr(cells[cells.length - 1])), hoje = hojeStr();
  const noDia = s => evs.filter(e => e.data <= s && (e.data_fim || e.data) >= s);
  $('#main').innerHTML = `
  <div class="page-h"><div><h1>Agenda</h1><p>Reuniões, vencimentos, treinamentos e feriados. Feriados nacionais e de SP entram automaticamente.</p></div><span class="grow"></span>
    ${g ? `<button class="btn gold" id="ag-new">${ico('plus')} <span>Novo evento</span></button>` : ''}</div>
  <div class="agenda">
    <div class="card" style="overflow:hidden">
      <div class="cal-h"><button class="icbtn" id="ag-prev">${ico('chev-l')}</button><h2>${(s => s[0].toUpperCase() + s.slice(1))(M.toLocaleDateString('pt-BR', {month:'long'}))} ${y}</h2><button class="icbtn" id="ag-next">${ico('chev-r')}</button><span class="grow"></span><button class="btn sm" id="ag-hoje">Hoje</button></div>
      <div class="cal">${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(w => `<div class="wd">${w}</div>`).join('')}
        ${cells.map(d => { const s = dStr(d), es = noDia(s); return `<div class="d ${d.getMonth() !== mo ? 'out' : ''} ${s === hoje ? 'today' : ''} ${g ? 'can' : ''}" data-day="${s}"><span class="num">${d.getDate()}</span>${es.slice(0,3).map(e => `<button class="e e-${esc(e.tipo)}" data-ev="${esc(e.id)}" title="${esc(e.titulo)}">${e.hora ? esc(e.hora) + ' ' : ''}${esc(e.titulo)}</button>`).join('')}${es.length > 3 ? `<div class="tiny muted">+${es.length - 3}</div>` : ''}</div>`; }).join('')}
      </div>
    </div>
    <div class="card pad"><h3 style="font-size:22px;margin-bottom:8px">Próximos 60 dias</h3>${(() => { const l = proximosEventos(60); return l.length ? l.map(e => `<div data-ev="${esc(e.id)}" style="cursor:pointer">${evHTML(e)}</div>`).join('') : '<div class="muted small">Nada agendado.</div>'; })()}</div>
  </div>`;
  const all = [...S.eventos, ...evs];
  $('#ag-prev').onclick = () => { S.calMonth = new Date(y, mo - 1, 1); pageAgenda(); };
  $('#ag-next').onclick = () => { S.calMonth = new Date(y, mo + 1, 1); pageAgenda(); };
  $('#ag-hoje').onclick = () => { S.calMonth = null; pageAgenda(); };
  if (g) $('#ag-new').onclick = () => modalEvento(null, hoje);
  $('#main').querySelector('.agenda').onclick = e => {
    const ev = e.target.closest('[data-ev]'); if (ev){ e.stopPropagation(); const x = all.find(a => a.id === ev.dataset.ev) || proximosEventos(60).find(a => a.id === ev.dataset.ev); return verEvento(x); }
    const day = e.target.closest('[data-day]'); if (day && g) modalEvento(null, day.dataset.day);
  };
}
function verEvento(e){
  if (!e) return;
  const g = isGestor() && !e.nacional;
  const m = openModal({title:e.titulo, body:`
    <div class="row wrap" style="margin-bottom:12px"><span class="chip e-${esc(e.tipo)}">${esc(e.tipo)}</span><span class="small">${ico('calendar')} ${fmtDay(e.data)}${e.data_fim && e.data_fim !== e.data ? ' até ' + fmtDay(e.data_fim) : ''}${e.hora ? ' · ' + esc(e.hora) : ''}</span></div>

    foot: g ? `<button class="btn danger" id="ve-del">${ico('trash')} Excluir</button><span class="grow"></span><button class="btn" data-close>Fechar</button><button class="btn gold" id="ve-ed">${ico('edit')} Editar</button>` : `<button class="btn" data-close>Fechar</button>`});
  if (g){

  }

    <td>${s.ativo ? '<span class="chip ok">Ativo</span>' : '<span class="chip">Inativo</span>'}</td>
    <td style="white-space:nowrap"><button class="icbtn" data-s="${s.id}" data-sa="up" title="Subir">${ico('up')}</button><button class="icbtn" data-s="${s.id}" data-sa="down" title="Descer">${ico('down')}</button></td>
    <td style="text-align:right"><button class="btn sm" data-s="${s.id}" data-sa="ed">${ico('edit')} Editar</button></td></tr>`).join('')}
  </tbody></table></div>`;
  $('#as-new').onclick = () => modalSistema(null);
  $('#adm').onclick = async e => {
    const b = e.target.closest('[data-s]'); if (!b) return; const s = S.sistemas.find(x => x.id === b.dataset.s);
    if (b.dataset.sa === 'ed') return modalSistema(s);
    const irmaos = S.sistemas.filter(x => x.area_id === s.area_id).sort((a, c) => a.ordem - c.ordem || a.nome.localeCompare(c.nome));
    const i = irmaos.indexOf(s), j = b.dataset.sa === 'up' ? i - 1 : i + 1; if (j < 0 || j >= irmaos.length) return;
    [irmaos[i], irmaos[j]] = [irmaos[j], irmaos[i]];
    try { for (let k = 0; k < irmaos.length; k++) if (irmaos[k].ordem !== k + 1){ const r = await API.update('sistemas', irmaos[k].id, {ordem:k + 1}); S.sistemas = S.sistemas.map(x => x.id === r.id ? r : x); } admSistemas(); } catch(err){ fail(friendly(err)); }
  };
}

function iconPicker(host, cur, custom, onPick){
  let sel = cur, cust = custom, filtro = '';
  const draw = () => {
    host.innerHTML = `
      <div class="pick-head">${medal(sel, cust, 'lg')}<div class="grow"><div style="font-weight:600">${cust ? 'Ícone importado' : esc(ICONS[sel]?.[0] || sel)}</div><div class="tiny muted">${cust ? 'Pintado automaticamente em dourado metálico.' : 'Escolha na galeria ou importe o seu (PNG/SVG, de preferência com fundo transparente).'}</div></div>
        <label class="btn sm">${ico('upload')} Importar<input type="file" accept="image/png,image/svg+xml,image/jpeg,image/webp" hidden data-ip="file"></label>${cust ? `<button class="btn sm ghost" data-ip="rm">Usar galeria</button>` : ''}</div>
      <input class="inp" placeholder="Buscar ícone… (ex.: carro, pasta, estrela)" data-ip="q" value="${esc(filtro)}" style="margin-bottom:8px;height:34px">
      <div class="icon-pick">${GALLERY.filter(k => !filtro || norm(k + ' ' + ICONS[k][0]).includes(norm(filtro))).map(k => `<button type="button" class="${!cust && k === sel ? 'on' : ''}" data-k="${k}" title="${esc(ICONS[k][0])}">${medal(k,'','md')}</button>`).join('')}</div>`;
    const q = host.querySelector('[data-ip=q]'); q.oninput = () => { filtro = q.value; const pos = q.selectionStart; draw(); const n = host.querySelector('[data-ip=q]'); n.focus(); n.setSelectionRange(pos, pos); };
  };
  host.onclick = e => { const b = e.target.closest('[data-k]'); if (b){ sel = b.dataset.k; cust = null; onPick(sel, null); draw(); } if (e.target.closest('[data-ip=rm]')){ cust = null; onPick(sel, null); draw(); } };
  host.onchange = async e => { if (e.target.dataset.ip !== 'file') return; const f = e.target.files[0]; if (!f) return;
    try { cust = await iconFromFile(f); onPick(sel, cust); draw(); } catch(err){ fail(err); } };
  draw();
}

function modalSistema(s){
  const st = {icone: s?.icone || 'grid', custom: s?.icone_custom || null};
  const novoPadrao = dStr(new Date(Date.now() + 14*864e5));
  const m = openModal({wide:true, title: s ? 'Editar sistema' : 'Incluir sistema', body:`
    <div class="grid2">
      <div class="field"><label>Nome</label><input class="inp" id="ms-n" value="${esc(s?.nome || '')}" placeholder="Ex.: Controle de Ponto"></div>
      <div class="field"><label>Área</label><select class="inp" id="ms-a"><option value="">— Sem área —</option>${S.areas.map(a => `<option value="${a.id}" ${a.id === s?.area_id ? 'selected' : ''}>${esc(a.nome)}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label>Link</label><input class="inp" id="ms-u" value="${esc(s?.url || '')}" placeholder="https://…netlify.app/"></div>
    <div class="field"><label>Descrição curta</label><input class="inp" id="ms-d" maxlength="160" value="${esc(s?.descricao || '')}" placeholder="O que o sistema faz, em uma frase."></div>
    <div class="field"><label>Ícone</label><div id="ms-ic"></div></div>
    <div class="field"><label>Quem vê este sistema</label><div class="row wrap" id="ms-vis">${S.areas.map(a => `<label class="tog"><input type="checkbox" value="${a.id}" ${s?.visivel_para?.includes(a.id) ? 'checked' : ''}> ${esc(a.nome)}</label>`).join('')}</div>
      <div class="tiny muted">Nenhuma marcada = todos veem. Administrador e Diretoria sempre veem tudo.</div></div>
    <div class="grid2">
      <div class="field"><label>Selo “Novo” até</label><input class="inp" type="date" id="ms-nv" value="${esc(s ? (s.novo_ate || '') : novoPadrao)}"></div>
      <div class="field"><label>Status</label><label class="check" style="height:40px"><input type="checkbox" id="ms-at" ${!s || s.ativo ? 'checked' : ''}> Ativo (aparece para a equipe)</label></div>
    </div>
    ${!s ? `<label class="check"><input type="checkbox" id="ms-anun" checked> Anunciar no mural (“Novo sistema no portal”)</label>` : ''}`,
    foot:`${s ? `<button class="btn danger" id="ms-del">${ico('trash')} Excluir</button><span class="grow"></span>` : ''}<button class="btn" data-close>Cancelar</button><button class="btn gold" id="ms-s">Salvar</button>`});
  iconPicker($('#ms-ic', m.el), st.icone, st.custom, (k, c) => { st.icone = k; st.custom = c; });
  $('#ms-s', m.el).onclick = async () => {
    const row = {nome:$('#ms-n', m.el).value.trim(), url:$('#ms-u', m.el).value.trim(), descricao:$('#ms-d', m.el).value.trim(), area_id:$('#ms-a', m.el).value || null,
      icone:st.icone, icone_custom:st.custom, visivel_para:$$('#ms-vis input:checked', m.el).map(i => i.value), novo_ate:$('#ms-nv', m.el).value || null, ativo:$('#ms-at', m.el).checked};
    if (!row.nome) return toast('Informe o nome do sistema.', true);
    if (!/^(https?:\/\/|\/)/i.test(row.url)) return toast('O link precisa começar com https:// (ou / para os sistemas do próprio site).', true);
    if (!s) row.ordem = S.sistemas.filter(x => x.area_id === row.area_id).length + 1;
    try {
      const r = s ? await API.update('sistemas', s.id, row) : await API.insert('sistemas', row);
      S.sistemas = s ? S.sistemas.map(x => x.id === r.id ? r : x) : [...S.sistemas, r];
      if (!s && $('#ms-anun', m.el)?.checked) await API.insert('posts', {tipo:'Comunicado', oficial:true, texto:`🚀 Novo sistema no portal: ${r.nome}${area(r.area_id) ? ' (' + area(r.area_id).nome + ')' : ''}\n\n${r.descricao || ''}\n\nAcesse em Sistemas ou direto: ${r.url}`.trim()});
      m.close(); toast('Sistema salvo.'); admSistemas();
    } catch(e){ fail(friendly(e)); }
  };
  $('#ms-del', m.el)?.addEventListener('click', async () => {
    if (!(await confirmBox(`Excluir “${s.nome}” do portal? (O sistema em si continua no ar — só o atalho some. Para esconder sem apagar, desmarque “Ativo”.)`, {ok:'Excluir', danger:true}))) return;
    try { await API.remove('sistemas', [['id','eq',s.id]]); S.sistemas = S.sistemas.filter(x => x.id !== s.id); m.close(); toast('Sistema excluído.'); admSistemas(); } catch(e){ fail(friendly(e)); }
  });
}

function admAreas(){
  const l = [...S.areas].sort((a, b) => a.ordem - b.ordem);
  $('#adm').innerHTML = `
  <div class="row" style="margin-bottom:14px"><p class="muted" style="margin:0">As áreas agrupam os sistemas e as pessoas. Cada uma tem seu ícone dourado.</p><span class="grow"></span><button class="btn gold" id="aa-new">${ico('plus')} Nova área</button></div>
  <div class="sys-grid">${l.map(a => `<div class="card sys" style="cursor:pointer" data-a="${a.id}">${medal(a.icone, a.icone_custom, 'lg')}<div><div class="t">${esc(a.nome)}</div><div class="d">${S.sistemas.filter(s => s.area_id === a.id).length} sistema(s) · ${S.perfis.filter(p => p.area_id === a.id).length} pessoa(s)</div></div><span class="go">${ico('edit')}</span></div>`).join('')}</div>`;
  $('#aa-new').onclick = () => modalArea(null);
  $('#adm').onclick = e => { const c = e.target.closest('[data-a]'); if (c) modalArea(S.areas.find(a => a.id === c.dataset.a)); };
}
function modalArea(a){
  const st = {icone: a?.icone || 'layers', custom: a?.icone_custom || null};
  const m = openModal({wide:true, title: a ? 'Editar área' : 'Nova área', body:`
    <div class="grid2"><div class="field"><label>Nome</label><input class="inp" id="ma-n" value="${esc(a?.nome || '')}" placeholder="Ex.: Jurídico, Qualidade"></div>
    <div class="field"><label>Ordem</label><input class="inp" type="number" id="ma-o" value="${a?.ordem ?? S.areas.length + 1}"></div></div>
    <div class="field"><label>Ícone</label><div id="ma-ic"></div></div>`,
    foot:`${a ? `<button class="btn danger" id="ma-del">${ico('trash')} Excluir</button><span class="grow"></span>` : ''}<button class="btn" data-close>Cancelar</button><button class="btn gold" id="ma-s">Salvar</button>`});
  iconPicker($('#ma-ic', m.el), st.icone, st.custom, (k, c) => { st.icone = k; st.custom = c; });
  $('#ma-s', m.el).onclick = async () => {
    const row = {nome:$('#ma-n', m.el).value.trim(), ordem:+$('#ma-o', m.el).value || 0, icone:st.icone, icone_custom:st.custom};
    if (!row.nome) return toast('Informe o nome da área.', true);
    try { const r = a ? await API.update('areas', a.id, row) : await API.insert('areas', row);
      S.areas = (a ? S.areas.map(x => x.id === r.id ? r : x) : [...S.areas, r]).sort((x, y) => x.ordem - y.ordem); m.close(); toast('Área salva.'); admAreas(); }
    catch(e){ fail(/duplicate|unique/i.test(e.message) ? new Error('Já existe uma área com esse nome.') : friendly(e)); }
  };
  $('#ma-del', m.el)?.addEventListener('click', async () => {
    if (!(await confirmBox(`Excluir a área “${a.nome}”? Os sistemas e pessoas dela ficam “sem área”.`, {ok:'Excluir', danger:true}))) return;
    try { await API.remove('areas', [['id','eq',a.id]]); S.areas = S.areas.filter(x => x.id !== a.id);
      S.sistemas = S.sistemas.map(s => s.area_id === a.id ? {...s, area_id:null} : s); S.perfis = S.perfis.map(p => p.area_id === a.id ? {...p, area_id:null} : p);
      if (API.demo){ for (const s of S.sistemas) if (!s.area_id) await API.update('sistemas', s.id, {area_id:null}); }
      m.close(); toast('Área excluída.'); admAreas(); } catch(e){ fail(friendly(e)); }
  });
}

/* ============================ busca geral ============================ */
function setupSearch(){
  const inp = $('#gsearch'), box = $('#gres');
  let items = [], act = -1;
  const go = it => { box.hidden = true; inp.value = ''; it.go(); };
  const draw = () => {
    const q = norm(inp.value.trim()); if (q.length < 2){ box.hidden = true; return; }
    const has = s => norm(s).includes(q);
    const sis = visibleSistemas().filter(s => has(s.nome + ' ' + s.descricao)).slice(0, 5).map(s => ({g:'Sistemas', h:`${medal(s.icone, s.icone_custom, 'sm')}<div><div style="font-weight:600">${esc(s.nome)}</div><div class="tiny muted">${esc(area(s.area_id)?.nome || '')}</div></div>`, go:() => window.open(safeHref(s.url), '_blank', 'noopener')}));
    const docs = S.docs.filter(d => has(d.titulo + ' ' + d.descricao)).slice(0, 5).map(d => ({g:'Documentos', h:`${medal(docIcon(d),'','sm')}<div><div style="font-weight:600">${esc(d.titulo)}</div><div class="tiny muted">${esc(caminho(d.pasta_id).map(p => p.nome).join(' › '))}</div></div>`, go:() => { location.hash = '#/documentos/' + d.pasta_id; openDoc(d); }}));
    const pas = S.pastas.filter(p => has(p.nome)).slice(0, 3).map(p => ({g:'Pastas', h:`${medal('folder','','sm')}<div><div style="font-weight:600">${esc(p.nome)}</div><div class="tiny muted">${esc(caminho(p.pai_id).map(x => x.nome).join(' › ') || 'Categoria')}</div></div>`, go:() => location.hash = '#/documentos/' + p.id}));
    const pes = S.perfis.filter(p => p.ativo && has(p.nome + ' ' + p.cargo)).slice(0, 4).map(p => ({g:'Pessoas', h:`${avatar(p,'sm')}<div><div style="font-weight:600">${esc(p.nome)}</div><div class="tiny muted">${esc(p.cargo || area(p.area_id)?.nome || '')}</div></div>`, go:() => { S.teamArea = ''; location.hash = '#/equipe'; setTimeout(() => { const i = $('#eq-q'); if (i){ i.value = p.nome; i.dispatchEvent(new Event('input')); } }, 50); }}));
    const posts = S.posts.filter(p => has(p.texto)).slice(0, 4).map(p => ({g:'Publicações', h:`${avatar(perfil(p.autor_id),'sm')}<div style="min-width:0"><div class="small clamp1">${esc(p.texto)}</div><div class="tiny muted">${esc(perfil(p.autor_id).nome)} · ${rel(p.publicar_em)}</div></div>`, go:() => location.hash = '#/inicio/' + p.id}));
    items = [...sis, ...docs, ...pas, ...pes, ...posts]; act = -1;
    let last = '';
    box.innerHTML = items.length ? items.map((it, i) => { const h = it.g !== last ? `<h4>${it.g}</h4>` : ''; last = it.g; return h + `<div class="it" data-i="${i}">${it.h}</div>`; }).join('') : `<div class="empty small">Nada encontrado para “${esc(inp.value)}”.</div>`;
    box.hidden = false;
  };
  inp.oninput = debounce(draw, 120);
  inp.onfocus = draw;
  inp.onkeydown = e => {
    if (box.hidden || !items.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); act = (act + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; $$('.it', box).forEach((x, i) => x.classList.toggle('act', i === act)); $$('.it', box)[act]?.scrollIntoView({block:'nearest'}); }
    if (e.key === 'Enter'){ e.preventDefault(); go(items[Math.max(act, 0)]); }
    if (e.key === 'Escape'){ box.hidden = true; inp.blur(); }
  };
  box.onmousedown = e => { const it = e.target.closest('[data-i]'); if (it){ e.preventDefault(); go(items[+it.dataset.i]); } };
  inp.onblur = () => setTimeout(() => box.hidden = true, 150);
}

/* ============================ modal, menu, confirmação ============================ */
function openModal({title, body, foot, wide}){
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true"><div class="modal-h"><h2>${esc(title)}</h2><button class="icbtn" data-close title="Fechar">${ico('x')}</button></div><div class="modal-b">${body}</div>${foot ? `<div class="modal-f">${foot}</div>` : ''}</div>`;
  document.body.appendChild(ov);
  const close = () => { ov.remove(); document.removeEventListener('keydown', esc_); };
  const esc_ = e => { if (e.key === 'Escape' && document.body.lastElementChild === ov) close(); };
  document.addEventListener('keydown', esc_);
  ov.addEventListener('mousedown', e => { if (e.target === ov) close(); });
  ov.addEventListener('click', e => { if (e.target.closest('[data-close]')) close(); });
  return {el:ov, close};
}
function confirmBox(msg, {ok='Confirmar', danger}={}){
  return new Promise(res => {
    const m = openModal({title:'Confirmar', body:`<p style="margin:4px 0 10px">${esc(msg)}</p>`, foot:`<button class="btn" data-close>Cancelar</button><button class="btn ${danger ? 'dark' : 'gold'}" id="cb-ok">${esc(ok)}</button>`});
    let done = false; const fin = v => { if (done) return; done = true; res(v); };
    $('#cb-ok', m.el).onclick = () => { fin(true); m.close(); };
    new MutationObserver((_, o) => { if (!document.body.contains(m.el)){ o.disconnect(); fin(false); } }).observe(document.body, {childList:true});
    $('#cb-ok', m.el).focus();
  });
}
let POP = null;
function closePop(){ if (POP){ POP.remove(); POP = null; return true; } return false; }
function mkPop(anchor, cls=''){ closePop(); const p = document.createElement('div'); p.className = 'pop ' + cls; document.body.appendChild(p); POP = p; POP._anchor = anchor; return p; }
function place(pop, anchor){
  const r = anchor.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  let left = Math.min(r.right - w, window.innerWidth - w - 12); left = Math.max(12, left);
  let top = r.bottom + 6; if (top + h > window.innerHeight - 12) top = Math.max(12, r.top - h - 6);
  pop.style.left = left + 'px'; pop.style.top = top + 'px';
}
function showMenu(anchor, items){
  if (POP && POP._anchor === anchor) return closePop();
  const p = mkPop(anchor);
  p.innerHTML = items.map((it, i) => `<button data-mi="${i}" class="${it.danger ? 'danger' : ''}">${ico(it.i)} ${esc(it.t)}</button>`).join('');
  place(p, anchor);
  p.onclick = e => { const b = e.target.closest('[data-mi]'); if (b){ closePop(); Promise.resolve(items[+b.dataset.mi].f()).catch(err => fail(friendly(err))); } };
}
document.addEventListener('mousedown', e => { if (POP && !POP.contains(e.target) && !POP._anchor?.contains(e.target)) closePop(); });
window.addEventListener('resize', () => closePop());
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.me) poll(); });

boot();
</script>
