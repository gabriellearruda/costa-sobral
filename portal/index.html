<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal C&amp;S</title>
<meta name="theme-color" content="#0D0D0D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="/app/vendor/supabase.js"></script>
<script src="/app/config.js"></script>
<script src="/portal/_comum/cs-auth.js"></script>
<style>
:root{
  --black:#0D0D0D; --ink:#1B1A17; --gold:#C79A3B; --gold-l:#E4C57E; --gold-d:#8C6424;
  --silver:#C7C7C7; --cream:#F3F0E9; --paper:#FFFDF8; --line:#E3DCCD; --line-2:#EFE9DC;
  --muted:#6E685C; --soft:#9A9384; --ok:#3F7D4E; --warn:#B7791F; --bad:#A33A2E;
  --r:14px; --sh:0 1px 2px rgba(20,16,8,.05),0 6px 18px rgba(20,16,8,.05);
  --gold-grad:linear-gradient(180deg,#FBEFC4 0%,#E2BE6A 32%,#C79A3B 55%,#8C6424 78%,#D9B25C 100%);
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Montserrat',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
#app{min-height:100vh}
body{background:var(--cream);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;line-height:1.15;letter-spacing:.2px}
[hidden]{display:none!important}
.grow{flex:1}
.muted{color:var(--muted)} .small{font-size:12px} .tiny{font-size:11px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.ic.gold{stroke:url(#gm);filter:drop-shadow(0 1px 0 rgba(0,0,0,.35))}
.ic-custom{display:inline-block;flex:none;background:var(--gold-grad);-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;filter:drop-shadow(0 1px 0 rgba(0,0,0,.35))}
.gold-text{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* medalhão dourado */
.medal{--s:44px;width:var(--s);height:var(--s);border-radius:calc(var(--s)*.27);flex:none;display:grid;place-items:center;
  background:radial-gradient(120% 90% at 30% 0%,#2a2620 0%,#121110 55%,#0b0b0b 100%);
  box-shadow:inset 0 0 0 1px rgba(199,154,59,.55),inset 0 1px 0 rgba(255,236,190,.12),0 2px 6px rgba(20,16,8,.18)}
.medal .ic,.medal .ic-custom{width:calc(var(--s)*.52);height:calc(var(--s)*.52)}
.medal.sm{--s:30px} .medal.md{--s:38px} .medal.lg{--s:56px} .medal.xl{--s:72px}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;transition:.15s}
a.btn{text-decoration:none;color:inherit}
.btn:hover{border-color:var(--gold);}
.btn.gold{background:linear-gradient(180deg,#E7C77C,#C79A3B 60%,#AE8430);border-color:#A57C2C;color:#0D0D0D;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.btn.gold:hover{filter:brightness(1.05)}
.btn.dark{background:var(--black);color:#F3E3B5;border-color:#000}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:rgba(199,154,59,.1)}
.btn.danger{color:var(--bad)} .btn.danger:hover{border-color:var(--bad)}
.btn.sm{height:30px;padding:0 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.icbtn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;border:0;background:transparent;cursor:pointer;color:var(--muted)}
.icbtn:hover{background:rgba(199,154,59,.12);color:var(--ink)}
.icbtn.on{color:var(--gold-d);background:rgba(199,154,59,.16)}

/* formulários */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label,.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.2px}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;outline:none;transition:.15s}
.inp:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(199,154,59,.18)}
textarea.inp{resize:vertical;min-height:80px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.check input{accent-color:var(--gold);width:16px;height:16px}
.hint{font-size:12px;color:var(--muted);margin-top:-6px;margin-bottom:12px}

/* cartões e chips */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:99px;font-size:11px;font-weight:600;letter-spacing:.2px;background:#EFE8D8;color:#5B4B2A;white-space:nowrap}
.chip.gold{background:linear-gradient(180deg,#F5E2AE,#E2C27A);color:#3D2D0C}
.chip.dark{background:var(--black);color:#EBD39A}
.chip.ok{background:#E3EFE4;color:#2E5E3A} .chip.warn{background:#FBEBD0;color:#7A4E0F} .chip.bad{background:#F6E0DC;color:#86281D}
.chip.blue{background:#E1E9F2;color:#2A4561} .chip.rose{background:#F7E1E6;color:#7B2E42} .chip.violet{background:#ECE4F3;color:#4E3470} .chip.green{background:#DFEEDF;color:#2D5B33}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.fchip{height:32px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:12px;font-weight:600;color:var(--muted)}
.fchip.on{background:var(--black);color:#EBD39A;border-color:var(--black)}

/* ===== LOGIN ===== */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:
  radial-gradient(900px 500px at 50% -10%,rgba(199,154,59,.22),transparent 60%),
  radial-gradient(600px 400px at 100% 100%,rgba(199,154,59,.08),transparent 60%),#0B0B0B}
.login-card{width:100%;max-width:400px;background:#121110;border:1px solid rgba(199,154,59,.35);border-radius:20px;padding:34px 30px;color:#EDE6D6;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.login-card .inp{background:#0B0B0B;border-color:#3A332536;border:1px solid #3a3328;color:#F3F0E9}
.login-card .field label{color:#B9AE95}
.login-brand{text-align:center;margin-bottom:26px}
.login-brand img{max-width:300px;width:100%;max-height:130px;object-fit:contain}
.wordmark{font-family:var(--serif);font-weight:700;font-size:46px;line-height:1}
.brand-sub{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:#B9AE95;margin-top:6px}
.login-foot{text-align:center;margin-top:18px;font-size:12px;color:#8F8672}
.linkbtn{background:none;border:0;padding:0;color:var(--gold);cursor:pointer;font-weight:600;font-size:12px}
.err{color:#E58C7E;font-size:12px;min-height:18px;margin-bottom:6px}

/* ===== SHELL ===== */
.shell{display:flex;min-height:100vh}
.side{width:256px;flex:none;background:radial-gradient(400px 260px at 20% -5%,rgba(199,154,59,.18),transparent 70%),#0D0D0D;color:#CFC8B8;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40}
.side-brand{padding:22px 22px 18px;border-bottom:1px solid #221f1a;display:flex;align-items:center;gap:12px}
.side-brand img{max-width:210px;width:100%;max-height:86px;object-fit:contain}
.side-brand{justify-content:center}
.side-brand .wordmark{font-size:34px}
.side-brand .brand-sub{letter-spacing:3px;margin-top:2px}
.nav{padding:14px 12px;display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1}
.nav-sec{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#6F6756;padding:14px 12px 6px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;text-decoration:none;font-weight:500;font-size:13.5px;color:#CFC8B8;position:relative}
.nav a:hover{background:rgba(199,154,59,.08);color:#F3E3B5}
.nav a.on{background:linear-gradient(90deg,rgba(199,154,59,.2),rgba(199,154,59,.04));color:#F6E3AE}
.nav a.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--gold-grad)}
.nav .count{margin-left:auto;background:var(--gold);color:#000;font-size:10px;font-weight:700;border-radius:99px;padding:1px 7px}
.side-user{padding:14px 16px;border-top:1px solid #221f1a;display:flex;align-items:center;gap:10px}
.side-user .nm{font-weight:600;color:#EFE6D0;font-size:13px;line-height:1.2}
.side-user .rl{font-size:11px;color:#8F8672}
.side-user .icbtn{color:#8F8672} .side-user .icbtn:hover{color:#F3E3B5;background:rgba(199,154,59,.12)}
.main-wrap{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:12px 28px;background:rgba(243,240,233,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.search{position:relative;flex:1;max-width:520px}
.search input{width:100%;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:0 14px 0 40px;outline:none}
.search input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(199,154,59,.16)}
.search>.ic{position:absolute;left:13px;top:11px;color:var(--soft)}
.sres{position:absolute;top:46px;left:0;right:0;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px rgba(20,16,8,.16);max-height:70vh;overflow:auto;padding:8px;z-index:60}
.sres h4{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--soft);margin:10px 10px 4px;font-family:var(--sans)}
.sres .it{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer}
.sres .it:hover,.sres .it.act{background:rgba(199,154,59,.12)}
.bell{position:relative}
.bell .dot{position:absolute;top:3px;right:2px;min-width:17px;height:17px;border-radius:99px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--cream)}
.hamb{display:none}
main{padding:26px 28px 60px;max-width:1280px;width:100%;margin:0 auto}
.page-h{display:flex;align-items:flex-end;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.page-h h1{font-size:34px}
.page-h p{margin:4px 0 0;color:var(--muted)}
.demo-bar{background:repeating-linear-gradient(135deg,#1a1712 0 12px,#15130f 12px 24px);color:#EBD39A;font-size:12px;text-align:center;padding:6px 12px;border-bottom:1px solid #3a3226}

/* avatares */
.av{--s:40px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:calc(var(--s)*.36);color:#EBD39A;background:radial-gradient(circle at 30% 20%,#2e2a22,#0d0d0d);box-shadow:inset 0 0 0 1.5px rgba(199,154,59,.7);object-fit:cover;overflow:hidden;letter-spacing:.5px}
img.av{box-shadow:0 0 0 1.5px rgba(199,154,59,.7)}
.av.sm{--s:30px} .av.xs{--s:24px} .av.lg{--s:64px} .av.xl{--s:88px}

/* ===== FEED ===== */
.home{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:28px;align-items:start}
.feed-col{max-width:760px;width:100%}
.composer{padding:16px 18px 12px;margin-bottom:16px}
.composer textarea{border:0;outline:none;resize:none;width:100%;min-height:62px;font-size:15px;background:transparent;padding:8px 0}
.cmp-bar{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line-2);padding-top:10px;margin-top:6px;flex-wrap:wrap}
.cmp-bar select{height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;padding:0 8px;font-size:12px;font-weight:600}
.tog{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border-radius:9px;border:1px solid var(--line);font-size:12px;font-weight:600;cursor:pointer;user-select:none;background:#fff}
.tog input{accent-color:var(--gold)}
.tog:has(input:checked){border-color:var(--gold);background:#FBF3DF}
.prev-img{position:relative;display:inline-block;margin:8px 0}
.prev-img img{max-height:220px;max-width:100%;border-radius:12px;display:block}
.prev-img button{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.7);color:#fff;border:0;border-radius:99px;width:28px;height:28px;cursor:pointer;display:grid;place-items:center}
.sched-row{display:flex;align-items:center;gap:10px;padding:8px 0;flex-wrap:wrap}
.sched-row input{height:34px;border:1px solid var(--line);border-radius:9px;padding:0 10px;background:#fff}
.post{padding:16px 18px 10px;margin-bottom:14px;position:relative;transition:box-shadow .2s}
.post.unread{box-shadow:inset 3px 0 0 var(--gold),var(--sh)}
.post.oficial{border-color:#D8BD7C;background:linear-gradient(180deg,#FFFBF0,#FFFDF8 120px)}
.post.sched{border-style:dashed;opacity:.9}
.post-h{display:flex;gap:12px;align-items:flex-start}
.post-h .nm{font-weight:700}
.post-h .meta{font-size:12px;color:var(--muted)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.post-body{margin:10px 0 0 52px;white-space:pre-wrap;word-wrap:break-word;font-size:14.5px;line-height:1.6}
.post-body a{color:var(--gold-d);font-weight:600}
.post-img{margin:12px 0 0 52px}
.post-img img{max-width:100%;max-height:560px;border-radius:14px;display:block;cursor:zoom-in;border:1px solid var(--line-2)}
.post-f{display:flex;align-items:center;gap:4px;margin:10px 0 0 46px;flex-wrap:wrap}
.rx{height:30px;border-radius:99px;border:1px solid transparent;background:transparent;padding:0 9px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
.rx:hover{background:#F4EEDF}
.rx.on{background:#FBF1D9;border-color:#E2C27A;color:#6B4E14}
.rx b{font-size:12px;font-weight:600}
.cm-toggle{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted);background:none;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px}
.cm-toggle:hover{background:#F4EEDF}
.comments{margin:8px 0 4px 52px;border-top:1px solid var(--line-2);padding-top:10px}
.cm{display:flex;gap:10px;margin-bottom:10px}
.cm .bub{background:#F5F0E4;border-radius:4px 14px 14px 14px;padding:8px 12px;flex:1;min-width:0}
.cm .bub b{font-size:12.5px}
.cm .bub p{margin:2px 0 0;white-space:pre-wrap;word-wrap:break-word}
.cm-new{display:flex;gap:8px;align-items:center}
.cm-new input{flex:1;height:36px;border-radius:99px;border:1px solid var(--line);padding:0 14px;outline:none;background:#fff}
.cm-new input:focus{border-color:var(--gold)}
.post-menu{position:absolute;top:10px;right:10px}
.newpill{position:sticky;top:76px;z-index:5;display:flex;justify-content:center;margin-bottom:10px}
.newpill button{box-shadow:0 8px 20px rgba(0,0,0,.2)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .medal{margin:0 auto 12px}
.rail{display:flex;flex-direction:column;gap:16px;position:sticky;top:84px}
.rail .card{padding:16px}
.rail h3{font-size:21px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.ev{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line-2)}
.ev:first-of-type{border-top:0}
.ev .dt{width:44px;flex:none;text-align:center;border-radius:10px;background:var(--black);color:#EBD39A;padding:4px 0;line-height:1.1}
.ev .dt b{display:block;font-family:var(--serif);font-size:20px}
.ev .dt span{font-size:9px;letter-spacing:1.5px;text-transform:uppercase}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qa a{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;text-decoration:none;font-size:11px;font-weight:600;padding:8px 2px;border-radius:10px;line-height:1.2}
.qa a:hover{background:#F4EEDF}
.mini-doc{display:flex;gap:10px;align-items:center;padding:7px 0;cursor:pointer;border-top:1px solid var(--line-2)}
.mini-doc:first-of-type{border-top:0}
.mini-doc:hover .t{color:var(--gold-d)}
.clamp1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== SISTEMAS ===== */
.area-sec{margin-bottom:30px}
.area-h{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.area-h h2{font-size:26px}
.sys-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.sys{display:flex;gap:14px;padding:16px;text-decoration:none;transition:.18s;position:relative;align-items:flex-start}
.sys:hover{transform:translateY(-2px);border-color:#D8BD7C;box-shadow:0 12px 28px rgba(20,16,8,.1)}
.sys .t{font-weight:700;font-size:14.5px;line-height:1.3}
.sys .d{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.45}
.sys .go{position:absolute;right:12px;top:12px;color:var(--soft)}
.sys .novo{position:absolute;right:10px;bottom:10px}

/* ===== DOCUMENTOS ===== */
.docs{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;align-items:start}
.tree{padding:12px;position:sticky;top:84px;max-height:calc(100vh - 110px);overflow:auto}
.tree ul{list-style:none;margin:0;padding:0 0 0 14px}
.tree>ul{padding-left:0}
.tn{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500}
.tn:hover{background:#F4EEDF}
.tn.on{background:#FBF1D9;color:#5B3F0B;font-weight:700}
.tn .car{width:16px;height:16px;display:grid;place-items:center;color:var(--soft);transition:.15s}
.tn .car.open{transform:rotate(90deg)}
.tn .n{margin-left:auto;font-size:10px;color:var(--soft)}
.crumbs{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:6px}
.crumbs a{cursor:pointer;text-decoration:none;font-weight:600}
.crumbs a:hover{color:var(--gold-d)}
.fold-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:22px}
.fold{padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;transition:.15s}
.fold:hover{border-color:#D8BD7C;transform:translateY(-1px)}
.fold .t{font-weight:700;line-height:1.25}
.doc-list .doc{display:flex;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--line-2)}
.doc-list .doc:first-child{border-top:0}
.doc .t{font-weight:600;cursor:pointer}
.doc .t:hover{color:var(--gold-d)}
.doc .acts{display:flex;gap:2px}
.sec-t{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--soft);font-weight:700;margin:4px 0 10px}

/* ===== AGENDA ===== */
.agenda{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.cal-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-2)}
.cal-h h2{font-size:26px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal .wd{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--soft);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line-2)}
.cal .d{min-height:104px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:6px;cursor:default;position:relative}
.cal .d:nth-child(7n){border-right:0}
.cal .d.out{background:#FAF7F0;color:#BDB6A6}
.cal .d.today .num{background:var(--black);color:#EBD39A}
.cal .d.can:hover{background:#FCF7EA;cursor:pointer}
.cal .num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:12px;font-weight:700}
.cal .e{display:block;font-size:11px;font-weight:600;border-radius:6px;padding:2px 6px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;border:0;width:100%;text-align:left}
.e-Feriado{background:#F6E0DC;color:#86281D} .e-Reunião{background:#E1E9F2;color:#2A4561} .e-Vencimento{background:#FBEBD0;color:#7A4E0F}
.e-Treinamento{background:#ECE4F3;color:#4E3470} .e-Outro{background:#EFE8D8;color:#5B4B2A}

/* ===== EQUIPE ===== */
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.person{padding:20px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.person .nm{font-family:var(--serif);font-size:22px;font-weight:700;line-height:1.1;margin-top:6px}
.person .rs{font-size:12.5px;color:var(--muted);margin-top:4px;white-space:pre-wrap}
.person .ct{display:flex;gap:6px;margin-top:8px}

/* ===== ADMIN ===== */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs a{padding:10px 16px;font-weight:600;font-size:13px;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;cursor:pointer}
.tabs a.on{color:var(--ink);border-color:var(--gold)}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--soft);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.pending td{background:#FFF8E6}
.help{background:#1a1712;color:#DCD2BC;border-radius:var(--r);padding:16px 18px;margin-bottom:16px;font-size:13px;line-height:1.6}
.help b{color:#F3E3B5}
.help ol{margin:6px 0 0;padding-left:20px}

/* ícones: seletor */
.icon-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;max-height:236px;overflow:auto;padding:4px;border:1px solid var(--line);border-radius:12px;background:#fff}
.icon-pick button{border:0;background:none;padding:0;cursor:pointer;border-radius:12px;display:grid;place-items:center}
.icon-pick button.on .medal{box-shadow:inset 0 0 0 2px #F0CF7F,0 0 0 3px rgba(199,154,59,.35)}
.icon-pick button:hover .medal{transform:scale(1.06)}
.pick-head{display:flex;align-items:center;gap:12px;margin-bottom:8px}

/* modal, menu, toast */
.ov{position:fixed;inset:0;background:rgba(10,9,7,.55);backdrop-filter:blur(2px);z-index:100;display:grid;place-items:center;padding:16px;animation:fade .15s}
.modal{background:var(--paper);border-radius:18px;width:100%;max-width:560px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .18s}
.modal.wide{max-width:760px}
.modal-h{display:flex;align-items:center;gap:10px;padding:18px 22px 12px}
.modal-h h2{font-size:26px;flex:1}
.modal-b{padding:6px 22px 8px;overflow:auto}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px 18px;border-top:1px solid var(--line-2);flex-wrap:wrap}
@keyframes fade{from{opacity:0}} @keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}
.pop{position:fixed;z-index:120;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px rgba(20,16,8,.2);padding:6px;min-width:190px}
.pop button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:0;background:none;border-radius:8px;cursor:pointer;font-size:13px;text-align:left}
.pop button:hover{background:#F4EEDF}
.pop button.danger{color:var(--bad)}
.bell-pop{width:380px;max-width:calc(100vw - 24px);padding:0;overflow:hidden}
.bell-pop .hd{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line-2)}
.bell-pop .hd h3{font-size:20px;flex:1}
.bell-pop .it{display:flex;gap:10px;padding:10px 14px;cursor:pointer;border-top:1px solid var(--line-2)}
.bell-pop .it:hover{background:#FAF5E9}
.bell-pop .it.un{background:#FFF8E6}
.bell-pop .lst{max-height:420px;overflow:auto}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--black);color:#F3E3B5;padding:10px 18px;border-radius:12px;font-weight:600;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:pop .2s;border:1px solid #3a3226}
.toast.bad{background:#5a1d16;color:#fff}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:150;display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.loading{display:grid;place-items:center;min-height:100vh;background:#0B0B0B;color:#8F8672}
.spin{width:28px;height:28px;border-radius:50%;border:2.5px solid rgba(199,154,59,.25);border-top-color:var(--gold);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== RESPONSIVO ===== */
@media (max-width:1100px){
  .home{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .feed-col{max-width:none}
  .agenda{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:900px){
  .side{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .22s}
  .side.open{transform:none;box-shadow:20px 0 60px rgba(0,0,0,.4)}
  .demo-bar .full{display:none}
  .hamb{display:inline-grid}
  .top{padding:10px 16px}
  main{padding:18px 16px 60px}
  .docs{grid-template-columns:minmax(0,1fr)}
  .tree{display:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:35}
}
@media (max-width:600px){
  .page-h h1{font-size:28px}
  .post-body,.post-img,.comments{margin-left:0}
  .post-f{margin-left:-6px}
  .grid2{grid-template-columns:1fr}
  .cal .d{min-height:62px;padding:3px}
  .cal .e{font-size:0;height:6px;padding:0;border-radius:3px}
  .qa{grid-template-columns:repeat(3,1fr)}
  .doc-list .doc{flex-wrap:wrap}
  .modal-h h2{font-size:22px}
  .top .btn.gold span{display:none}
}
</style>

/* ============================ utilidades ============================ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeHref = u => { try { const x = new URL(u, location.href); return ['http:','https:','mailto:','tel:'].includes(x.protocol) ? x.href : '#'; } catch { return '#'; } };
const linkify = t => esc(t).replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"])/g, m => `<a href="${m}" target="_blank" rel="noopener">${m}</a>`);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2));
const nowISO = () => new Date().toISOString();
const hojeStr = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const dStr = d => new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const fmtD = d => new Date(d).toLocaleDateString('pt-BR');
const fmtDT = d => new Date(d).toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});
const fmtDay = s => parseD(s).toLocaleDateString('pt-BR', {weekday:'short', day:'2-digit', month:'short'});
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function rel(d){
  const s = (Date.now() - new Date(d)) / 1000;
  if (s < 0) return 'agendado · ' + fmtDT(d);
  if (s < 60) return 'agora';
  if (s < 3600) return `há ${Math.floor(s/60)} min`;
  if (s < 86400) return `há ${Math.floor(s/3600)} h`;
  if (s < 604800) { const n = Math.floor(s/86400); return n === 1 ? 'ontem' : `há ${n} dias`; }
  return fmtD(d);
}
const fmtSize = b => !b ? '' : b < 1024*1024 ? Math.round(b/1024) + ' KB' : (b/1024/1024).toFixed(1).replace('.',',') + ' MB';
const slug = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9._-]+/g,'-').replace(/-+/g,'-').slice(-80);
const initials = n => { const w = String(n || '').trim().split(/[\s.]+/).filter(Boolean); return w.length ? ((w[0][0] || '') + (w.length > 1 ? w[w.length - 1][0] : '')).toUpperCase() : '?'; };
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const debounce = (f, ms=200) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; };
function toast(msg, bad){ const t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.textContent = msg; $('#toasts').appendChild(t); setTimeout(() => t.remove(), bad ? 5000 : 2800); }
function fail(e){ console.error(e); toast(e?.message || 'Algo deu errado. Tente novamente.', true); }
const loadImg = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('Não foi possível ler a imagem.')); i.src = src; });

async function compressImage(file, max=1600, q=.85){
  if (!/^image\/(png|jpe?g|webp)$/.test(file.type)) return file;
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImg(url);
    let w = img.naturalWidth, h = img.naturalHeight;
    if (file.size < 450*1024 && Math.max(w,h) <= max) return file;
    const r = Math.min(1, max / Math.max(w, h)); w = Math.round(w*r); h = Math.round(h*r);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,w,h); x.drawImage(img, 0, 0, w, h);
    const blob = await new Promise(ok => c.toBlob(ok, 'image/jpeg', q));
    return new File([blob], file.name.replace(/\.\w+$/, '') + '.jpg', {type:'image/jpeg'});
  } finally { URL.revokeObjectURL(url); }
}

/* Ícone importado → silhueta em PNG transparente (o portal pinta de dourado) */
async function iconFromFile(file){
  if (file.size > 2*1024*1024) throw new Error('Ícone muito grande (máx. 2 MB).');
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImg(url);
    const N = 128, c = document.createElement('canvas'); c.width = c.height = N;
    const x = c.getContext('2d');
    const w = img.naturalWidth || N, h = img.naturalHeight || N, r = Math.min(N/w, N/h) * .92;
    const dx = Math.round((N - w*r)/2), dy = Math.round((N - h*r)/2), dw = Math.round(w*r), dh = Math.round(h*r);
    x.drawImage(img, dx, dy, dw, dh);
    const d = x.getImageData(0, 0, N, N), p = d.data;
    let transp = 0, lumSum = 0, tot = 0;
    for (let yy = dy + 1; yy < dy + dh - 1; yy++) for (let xx = dx + 1; xx < dx + dw - 1; xx++){
      const i = (yy*N + xx)*4; tot++; if (p[i+3] < 240) transp++; lumSum += .299*p[i] + .587*p[i+1] + .114*p[i+2]; }
    const hasAlpha = !/jpe?g/i.test(file.type) && transp > tot*.03, darkBg = lumSum/Math.max(tot,1) < 110;
    for (let i = 0; i < p.length; i += 4){
      const lum = .299*p[i] + .587*p[i+1] + .114*p[i+2];
      let a = hasAlpha ? p[i+3] : (darkBg ? lum : 255 - lum);
      if (!hasAlpha) a = Math.max(0, Math.min(255, (a - 25) * 1.25));
      p[i] = p[i+1] = p[i+2] = 0; p[i+3] = a;
    }
    x.putImageData(d, 0, 0);
    return c.toDataURL('image/png');
  } finally { URL.revokeObjectURL(url); }
}

/* ============================ camada de dados ============================ */
function friendly(e){
  const m = e?.message || String(e);
  if (/Invalid login credentials/i.test(m)) return new Error('E-mail ou senha incorretos.');
  if (/Email not confirmed/i.test(m)) return new Error('E-mail ainda não confirmado. Peça ao administrador para confirmar seu usuário.');
  if (/row-level security|permission denied|violates row-level/i.test(m)) return new Error('Você não tem permissão para esta ação.');
  if (/Failed to fetch|NetworkError/i.test(m)) return new Error('Sem conexão com o servidor. Verifique a internet.');
  if (/exceeded the maximum allowed size|Payload too large/i.test(m)) return new Error('Arquivo maior que o limite permitido.');
  if (/mime type/i.test(m)) return new Error('Tipo de arquivo não permitido.');
  return new Error(m);
}

/* Tabelas do portal no banco único (prefixo portal_) */
const TABELA = {areas:'portal_areas', sistemas:'portal_sistemas', config:'portal_config', posts:'portal_posts', comentarios:'portal_comentarios',
  reacoes:'portal_reacoes', leituras:'portal_leituras', pastas:'portal_pastas', documentos:'portal_documentos', eventos:'portal_eventos', perfis:'portal_perfis'};
function supaBackend(){
  const sb = CSAuth.sb, T = t => TABELA[t] || t;
  const chk = ({data, error}) => { if (error) throw friendly(error); return data; };
  const filt = (q, f=[]) => { for (const [c, op, v] of f) q = q[op](c, v); return q; };
  return {
    demo:false,
    onAuth(cb){ sb.auth.onAuthStateChange((ev, s) => cb(ev, s?.user || null)); },
    async session(){ const {data} = await sb.auth.getSession(); return data.session?.user || null; },
    async signIn(email, password){ chk(await sb.auth.signInWithPassword({email, password})); return (await sb.auth.getUser()).data.user; },
    async signOut(){ await CSAuth.sair(); },
    async resetPw(email){ chk(await sb.auth.resetPasswordForEmail(email, {redirectTo: location.origin + location.pathname})); },
    async setPw(password){ chk(await sb.auth.updateUser({password})); },
    async list(t, {f, order, limit}={}){
      let q = filt(sb.from(T(t)).select('*'), f);
      for (const [c, asc] of (order || [])) q = q.order(c, {ascending: asc});
      if (limit) q = q.limit(limit);
      return chk(await q) || [];
    },
    async count(t, f){ const r = await filt(sb.from(T(t)).select('*', {count:'exact', head:true}), f); if (r.error) throw friendly(r.error); return r.count || 0; },
    async insert(t, row){ return chk(await sb.from(T(t)).insert(row).select().single()); },
    async update(t, id, patch, key='id'){ const d = chk(await sb.from(T(t)).update(patch).eq(key, id).select()); if (!d || !d.length) throw new Error('Você não tem permissão para alterar este item.'); return d[0]; },
    async remove(t, f){ chk(await filt(sb.from(T(t)).delete(), f)); },
    async upsert(t, row){ chk(await sb.from(T(t)).upsert(row)); },
    async uploadMidia(path, file){ chk(await sb.storage.from('portal-midia').upload(path, file, {contentType: file.type, upsert:false})); return sb.storage.from('portal-midia').getPublicUrl(path).data.publicUrl; },
    async uploadDoc(path, file){ chk(await sb.storage.from('portal-docs').upload(path, file, {contentType: file.type || 'application/octet-stream', upsert:false})); return path; },
    async docUrl(path){ return chk(await sb.storage.from('portal-docs').createSignedUrl(path, 3600)).signedUrl; },
    async removeDoc(path){ try { await sb.storage.from('portal-docs').remove([path]); } catch(e){} }
  };
}

/* Modo demonstração: abra o portal com ?demo=1 — dados de exemplo só neste navegador */
function demoBackend(){
  const KEY = 'cs_portal_demo_v1';
  let db = null; try { db = JSON.parse(localStorage.getItem(KEY)); } catch(e){}
  if (!db) db = seedDemo();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e){} };
  const me = () => db.logged ? db.perfis[0] : null;
  const ok = (r, f=[]) => f.every(([c, op, v]) => { const x = r[c];
    return op==='eq' ? x == v : op==='neq' ? x != v : op==='gt' ? x > v : op==='gte' ? x >= v : op==='lt' ? x < v : op==='lte' ? x <= v : op==='in' ? v.includes(x) : true; });
  const fileToURL = f => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f); });
  const defaults = t => { const m = me()?.id, n = nowISO(), b = {id: uid(), criado_em: n};
    if (t==='posts') Object.assign(b, {autor_id:m, publicar_em:n, oficial:false, fixado:false, tipo:'Aviso'});
    if (t==='comentarios') b.autor_id = m; if (t==='reacoes') { b.usuario_id = m; delete b.id; }
    if (t==='documentos') Object.assign(b, {criado_por:m, atualizado_em:n}); if (t==='eventos') b.criado_por = m;
    if (t==='sistemas') Object.assign(b, {ativo:true, ordem:0, visivel_para:[]}); return b; };
  const sleep = () => new Promise(r => setTimeout(r, 60));
  return {
    demo:true,
    onAuth(){},
    async session(){ return me(); },
    async signIn(){ db.logged = true; save(); return me(); },
    async signOut(){ db.logged = false; save(); },
    async resetPw(){}, async setPw(){},
    async list(t, {f, order, limit}={}){
      await sleep();
      let rows = (db[t] || []).filter(r => ok(r, f));
      if (t==='posts') rows = rows.filter(p => p.publicar_em <= nowISO() || p.autor_id === me()?.id || me()?.papel === 'admin');
      for (const [c, asc] of [...(order || [])].reverse()) rows = [...rows].sort((a, b) => (a[c] > b[c] ? 1 : a[c] < b[c] ? -1 : 0) * (asc ? 1 : -1));
      return JSON.parse(JSON.stringify(limit ? rows.slice(0, limit) : rows));
    },
    async count(t, f){ return (await this.list(t, {f})).length; },
    async insert(t, row){ await sleep(); const r = {...defaults(t), ...row}; (db[t] = db[t] || []).push(r); save(); return {...r}; },
    async update(t, id, patch, key='id'){ const r = (db[t]||[]).find(x => x[key] == id); if (!r) throw new Error('Item não encontrado.'); Object.assign(r, patch); save(); return {...r}; },
    async remove(t, f){
      const del = (db[t]||[]).filter(r => ok(r, f)).map(r => r.id);
      db[t] = (db[t]||[]).filter(r => !ok(r, f));
      if (t==='posts'){ db.reacoes = db.reacoes.filter(r => !del.includes(r.post_id)); db.comentarios = db.comentarios.filter(r => !del.includes(r.post_id)); }
      if (t==='pastas'){ const kill = new Set(del); let grew = true; while (grew){ grew = false; for (const p of db.pastas) if (kill.has(p.pai_id) && !kill.has(p.id)) { kill.add(p.id); grew = true; } }
        db.pastas = db.pastas.filter(p => !kill.has(p.id)); db.documentos = db.documentos.filter(d => !kill.has(d.pasta_id)); }
      save();
    },
    async upsert(t, row){ const k = t==='leituras' ? 'usuario_id' : t==='config' ? 'chave' : 'id'; const r = (db[t] = db[t]||[]).find(x => x[k] == row[k]); r ? Object.assign(r, row) : db[t].push(row); save(); },
    async uploadMidia(path, file){ return fileToURL(file); },
    async uploadDoc(path, file){ return fileToURL(file); },
    async docUrl(path){ return path; },
    async removeDoc(){}
  };
}

/* ============================ inicialização ============================ */
async function boot(){
  const demo = new URLSearchParams(location.search).has('demo');
  if (!demo && !window.supabase){ $('#app').innerHTML = `<div class="loading"><div style="text-align:center;padding:20px">Não foi possível carregar o portal. Verifique sua conexão e recarregue a página.</div></div>`; return; }
  if (!demo){
    // Login único da Área Restrita (senha + código do autenticador)
    try { await CSAuth.iniciar({sistema: 'o Portal C&S', papeis: []}); } catch(e){ return; }
  }
  API = demo ? demoBackend() : supaBackend();
  API.onAuth((ev) => { if (ev === 'PASSWORD_RECOVERY') setTimeout(() => modalSenha(true), 300); });
  try { (await API.list('config')).forEach(c => S.config[c.chave] = c.valor); } catch(e){}
  const u = await API.session().catch(() => null);
  if (!u) return renderLogin();
  await enter(u);
}

async function enter(u){
  let me;
  try { me = (await API.list('perfis', {f:[['id','eq',u.id]]}))[0]; } catch(e){ fail(e); return renderLogin(); }
  if (!me || !me.ativo) return renderPending(u, me);
  S.me = me;
  await loadAll();
  renderShell();
  window.onhashchange = route;
  route();
  refreshUnread();
  clearInterval(S.poll); S.poll = setInterval(poll, 60000);
}

async function loadAll(){
  const [perfis, areas, sistemas, pastas, docs, eventos, config, leit] = await Promise.all([
    API.list('perfis', {order:[['nome', true]]}), API.list('areas', {order:[['ordem', true], ['nome', true]]}),
    API.list('sistemas', {order:[['ordem', true], ['nome', true]]}), API.list('pastas', {order:[['ordem', true], ['nome', true]]}),
    API.list('documentos', {order:[['titulo', true]]}), API.list('eventos', {order:[['data', true]]}),
    API.list('config'), API.list('leituras', {f:[['usuario_id','eq',S.me.id]]})
  ]);
  Object.assign(S, {perfis, areas, sistemas, pastas, docs, eventos});
  config.forEach(c => S.config[c.chave] = c.valor);
  S.leitura = leit[0]?.ultimo_visto || S.me.criado_em;
  S.me = perfis.find(p => p.id === S.me.id) || S.me;
}

function toggleSide(open){
  $('#side').classList.toggle('open', open);
  $('.scrim')?.remove();
  if (open){ const s = document.createElement('div'); s.className = 'scrim'; s.onclick = () => toggleSide(false); document.body.appendChild(s); }
}

function route(){
  const parts = location.hash.replace(/^#\/?/, '').split('/');
  const r = parts[0] || 'inicio';
  $$('#nav a').forEach(a => a.classList.toggle('on', a.dataset.r === r));
  toggleSide(false);
  closePop();
  const m = $('#main'); if (!m) return;
  window.scrollTo(0, 0);
  if (r === 'sistemas') return pageSistemas();
  if (r === 'documentos') return pageDocs(parts[1] || null);
  if (r === 'agenda') return pageAgenda();
  if (r === 'equipe') return pageEquipe();
  if (r === 'admin' && isAdmin()) return pageAdmin(parts[1] || S.adminTab);
  return pageInicio(parts[1]);
}
