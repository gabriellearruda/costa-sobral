<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C&S · Controle de Custos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --preto:#0D0D0D; --preto2:#1c1c1c; --ouro:#C79A3B; --ouro-cl:#e4cf9a;
  --creme:#F3F0E9; --prata:#C7C7C7; --cinza:#6b6b6b; --linha:#e5e1d8;
  --verde:#2e7d46; --verde-bg:#e6f2ea; --ambar:#9a6410; --ambar-bg:#faefd8;
  --verm:#b3261e; --branco:#fff; --sombra:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat',system-ui,sans-serif;background:var(--creme);color:#222;font-size:14px;line-height:1.45}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;letter-spacing:.3px}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:14px}
/* topbar */
.top{background:var(--preto);color:#fff;padding:0 20px;display:flex;align-items:center;gap:18px;height:60px;position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:baseline;gap:10px}
.brand .cs{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;color:var(--ouro);line-height:1}
.brand .sub{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--prata)}
.top .mes{margin-left:auto;display:flex;align-items:center;gap:8px}
.top .mes label{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--prata)}
.top .usr{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--prata)}.top .usr a{color:var(--prata);text-decoration:none;border:1px solid #333;border-radius:7px;padding:6px 10px}.top .usr button{background:none;border:1px solid #333;color:#fff;border-radius:7px;padding:6px 10px;cursor:pointer;font:inherit}
.top select{background:var(--preto2);color:#fff;border:1px solid #333;border-radius:7px;padding:7px 10px}
.nav{display:flex;gap:2px;background:var(--preto2);padding:0 12px;position:sticky;top:60px;z-index:49;border-bottom:2px solid var(--ouro);overflow-x:auto;-webkit-overflow-scrolling:touch}
.nav button{white-space:nowrap;flex:0 0 auto}
.nav button{background:none;border:none;color:var(--prata);padding:13px 16px;font-size:13px;font-weight:600;border-bottom:3px solid transparent;letter-spacing:.3px}
.nav button.ativo{color:var(--ouro);border-bottom-color:var(--ouro)}
.nav button:hover{color:#fff}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
.tab{display:none} .tab.ativo{display:block;animation:f .2s}
@keyframes f{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
/* cards */
.card{background:#fff;border:1px solid var(--linha);border-radius:12px;box-shadow:var(--sombra);padding:18px 20px;margin-bottom:18px}
.card h2{font-size:22px;margin-bottom:2px;color:var(--preto)}
.card .cap{font-size:12px;color:var(--cinza);margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--linha);border-left:4px solid var(--ouro);border-radius:11px;padding:15px 17px;box-shadow:var(--sombra)}
.kpi .lab{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--cinza)}
.kpi .val{font-size:25px;font-weight:700;color:var(--preto);margin-top:5px;font-variant-numeric:tabular-nums}
.kpi .delta{font-size:12px;margin-top:3px;font-weight:600}
.kpi.verde{border-left-color:var(--verde)} .kpi.ambar{border-left-color:var(--ambar)}
.up{color:var(--verm)} .down{color:var(--verde)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:860px){.kpis{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
/* bars */
.bar-row{display:grid;grid-template-columns:150px 1fr 90px;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.bar-row .nm{color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{background:#f0ece2;border-radius:6px;height:20px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--ouro),var(--ouro-cl));border-radius:6px}
.bar-row .vl{text-align:right;font-variant-numeric:tabular-nums;color:#444;font-weight:600}
/* table */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 10px;background:var(--preto2);color:#fff;font-weight:600;font-size:11px;letter-spacing:.5px;text-transform:uppercase;position:sticky;top:0}
th:first-child{border-radius:8px 0 0 0} th:last-child{border-radius:0 8px 0 0}
td{padding:8px 10px;border-bottom:1px solid var(--linha);vertical-align:middle}
tr:hover td{background:#faf8f3}
.tbl-wrap{max-height:460px;overflow:auto;border:1px solid var(--linha);border-radius:9px}
.money{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.3px}
.pill.pago{background:var(--verde-bg);color:var(--verde)} .pill.pend{background:var(--ambar-bg);color:var(--ambar);cursor:pointer}
.pill.pend:hover{filter:brightness(.95)}
.mini{font-size:11px;color:var(--cinza)}
/* forms */
.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 14px;align-items:end}
@media(max-width:860px){.form-grid{grid-template-columns:1fr 1fr}}
.fld{display:flex;flex-direction:column;gap:4px}
.fld.wide{grid-column:span 2}
.fld label{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--cinza);font-weight:600}
.fld input,.fld select{border:1px solid var(--linha);border-radius:8px;padding:9px 10px;background:#fff}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--ouro);box-shadow:0 0 0 3px rgba(199,154,59,.15)}
.btn{background:var(--ouro);color:var(--preto);border:none;border-radius:9px;padding:11px 20px;font-weight:700;font-size:13px;letter-spacing:.3px}
.btn:hover{filter:brightness(1.05)} .btn.dark{background:var(--preto);color:var(--ouro)}
.btn.ghost{background:transparent;border:1px solid var(--linha);color:#333;font-weight:600}
.btn.sm{padding:6px 12px;font-size:12px}
.row-actions{display:flex;gap:6px}
.add-colab{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.add-colab input{border:1px solid var(--linha);border-radius:7px;padding:6px 8px;width:105px}
.add-colab input:first-child{width:175px}
.icon-btn{background:none;border:1px solid var(--linha);border-radius:7px;padding:4px 9px;color:var(--cinza);font-size:13px}
.icon-btn:hover{border-color:var(--verm);color:var(--verm)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar input,.toolbar select{border:1px solid var(--linha);border-radius:8px;padding:8px 10px;background:#fff}
.tag{background:var(--creme);border:1px solid var(--linha);border-radius:7px;padding:3px 9px;font-size:11px;font-weight:600;color:#555}
.banner{background:#fff6e5;border:1px solid #f0d99a;color:#7a5a12;border-radius:9px;padding:10px 14px;font-size:12.5px;margin-bottom:16px;display:flex;gap:8px;align-items:center}
.cli-card{border:1px solid var(--linha);border-radius:11px;margin-bottom:10px;overflow:hidden;background:#fff}
.cli-head{display:grid;grid-template-columns:1.5fr repeat(5,1fr) 24px;gap:10px;align-items:center;padding:13px 16px;cursor:pointer}
.cli-head:hover{background:#faf8f3}
.cli-head .pnome{font-weight:700;font-size:15px;color:var(--preto)}
.cli-head .mtxt{text-align:right;font-variant-numeric:tabular-nums}
.cli-head .mtxt small{display:block;font-size:9.5px;color:var(--cinza);text-transform:uppercase;letter-spacing:.3px;font-weight:600}
.cli-head .mtxt{font-size:13px}
.cli-head .tot{font-weight:700;color:var(--ouro)}
.cli-body{display:none;padding:0 16px 16px;border-top:1px solid var(--linha)}
.cli-card.open .cli-body{display:block}
.chev{transition:.2s;color:var(--cinza)} .cli-card.open .chev{transform:rotate(90deg)}
.sub-h{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--cinza);font-weight:700;margin:14px 0 6px}
.donut{display:flex;align-items:center;gap:18px}
.legend{font-size:12px} .legend div{display:flex;align-items:center;gap:7px;margin:4px 0}
.dot{width:11px;height:11px;border-radius:3px;display:inline-block}
.empty{color:var(--cinza);font-size:13px;padding:18px;text-align:center}
/* report / print */
#report{background:#fff}
@media print{
  .top,.nav,.no-print{display:none!important}
  .wrap{max-width:100%;padding:0}
  .tab{display:none!important} #tab-fechamento{display:block!important}
  #report table{page-break-inside:auto} #report tr{page-break-inside:avoid} #report thead{display:table-header-group}
  .card{box-shadow:none;border:none}
  body{background:#fff}
  @page{margin:14mm}
}
.rep-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--ouro);padding-bottom:12px;margin-bottom:18px}
.rep-head .cs{font-family:'Cormorant Garamond',serif;font-size:34px;color:var(--preto);font-weight:700}
.rep-head .cs b{color:var(--ouro)}
.rep-head .meta{text-align:right;font-size:12px;color:var(--cinza)}
.foot{margin-top:20px;font-size:11px;color:var(--cinza);border-top:1px solid var(--linha);padding-top:10px}
/* v2 */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--creme);border:1px solid var(--linha);border-radius:20px;padding:4px 6px 4px 11px;font-size:12px;font-weight:600;color:#333}
.chip button{background:none;border:none;color:var(--cinza);font-size:12px;padding:0 4px;border-radius:50%}
.chip button:hover{color:var(--verm)}
.inline-add{display:flex;gap:6px;align-items:center}
.inline-add input{border:1px solid var(--linha);border-radius:8px;padding:7px 9px;min-width:200px}
.param-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:860px){.param-grid{grid-template-columns:1fr}}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--linha);font-size:13px}
.sw:last-child{border-bottom:none}
.sw .d{font-size:11.5px;color:var(--cinza)}
.toggle{position:relative;width:44px;height:24px;flex:0 0 auto}
.toggle input{opacity:0;width:0;height:0}
.toggle span{position:absolute;inset:0;background:#d9d4c8;border-radius:24px;transition:.2s;cursor:pointer}
.toggle span:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle input:checked+span{background:var(--ouro)}
.toggle input:checked+span:before{transform:translateX(20px)}
.seg{display:inline-flex;border:1px solid var(--linha);border-radius:9px;overflow:hidden}
.seg button{background:#fff;border:none;padding:7px 12px;font-size:12px;font-weight:600;color:#555}
.seg button.on{background:var(--preto);color:var(--ouro)}
.hint{font-size:12px;color:#5c4a1f;background:#fbf6ea;border:1px solid #efe2bf;border-radius:8px;padding:8px 11px;margin-top:12px}
.form-edit{border:2px solid var(--ouro)}
.form-edit h2:after{content:" · editando";font-family:'Montserrat';font-size:12px;color:var(--ouro);letter-spacing:.5px;text-transform:uppercase;font-weight:700}
.link-tag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.5px;background:var(--preto);color:var(--ouro);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--preto);color:#fff;border-left:4px solid var(--ouro);padding:11px 18px;border-radius:9px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.25);opacity:0;transition:.25s;z-index:200;max-width:92vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.busy{position:fixed;inset:0;background:rgba(243,240,233,.55);z-index:150;display:none;align-items:center;justify-content:center}
.busy.on{display:flex}
.busy div{background:#fff;border:1px solid var(--linha);border-radius:10px;padding:12px 18px;font-size:13px;font-weight:600;box-shadow:var(--sombra)}
.compare{font-size:12.5px;color:#444;margin:-6px 0 16px}
.note{font-size:11.5px;color:var(--cinza);margin-top:4px}
.tbl-mini td{padding:6px 8px}
@media(max-width:600px){#usrNome,.top .usr a,.brand .sub,.top .mes label{display:none}.top{gap:10px;padding:0 12px}.kpi .val{font-size:20px}.bar-row{grid-template-columns:105px 1fr 78px}.card{padding:15px 14px}.wrap{padding:16px 12px 50px}}
@media print{.toast,.busy{display:none!important}
  #report .kpis{grid-template-columns:repeat(4,1fr)!important;gap:8px}
  #report .kpi{padding:10px 12px}#report .kpi .val{font-size:19px}
  #report .grid2{grid-template-columns:1fr 1fr!important}
  #report table{font-size:10.5px}#report td,#report th{padding:5px 6px}
  .tbl-wrap{max-height:none!important;overflow:visible!important}}
.brand .cs-escudo{height:34px;width:auto;align-self:center}
</style>
</head>

<script>
/* ======================= CONFIG ======================= */
/* Dados no Supabase (banco único C&S). Login e permissões pelo portal (cs-auth.js). */
const API_URL = 'supabase';

const SEED = {config:{},cadastros:{},clientes:[],colaboradores:[],lancamentos:[],freelances:[],fts:[],baseline:[]};
/* ======================= DATAS / COMPETÊNCIA ======================= */
const pad2=n=>String(n).padStart(2,'0');
const DATE_F=['DataLanc','Vencimento','DataPagamento','DataCobertura','Admissao'];
const DEF_CFG={BASE_COMPETENCIA:'VENCIMENTO',PAINEL_CATEGORIA:'SIM',PAINEL_CLIENTE:'NAO',FECH_CATEGORIA:'NAO',FECH_CLIENTE:'NAO',
  AUTO_CATEGORIA:'DIÁRIAS/EXTRAS',AUTO_TIPO:'Extraordinário',AUTO_EMPRESA:'COSTA & SOBRAL'};
// Converte qualquer forma de data (texto, ISO devolvido pelo Sheets, dd/mm/aaaa) para 'aaaa-mm-dd'
function normD(v){
  if(v==null||v==='') return '';
  const s=String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}T/.test(s)){ const t=new Date(s).getTime(); if(!isNaN(t)) return new Date(t+12*3600e3).toISOString().slice(0,10); }
  let m=s.match(/^(\d{4})-(\d{2})(?:-(\d{2}))?$/); if(m) return m[3]?s:`${m[1]}-${m[2]}-01`;
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if(m) return `${m[3]}-${pad2(m[2])}-${pad2(m[1])}`;
  return s.slice(0,10);
}
const normM=v=>normD(v).slice(0,7);
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;};
function prevMonth(m){let[y,mm]=m.split('-').map(Number);mm--;if(!mm){mm=12;y--;}return `${y}-${pad2(mm)}`;}
function lastDay(m){const[y,mm]=m.split('-').map(Number);return new Date(y,mm,0).getDate();}
function cfg(k){const c=(store.data&&store.data.config)||{};return (c[k]!==undefined&&c[k]!=='')?String(c[k]):DEF_CFG[k];}
const on=k=>/^(SIM|S|TRUE|1)$/i.test(cfg(k));
// Mês (competência) de cada registro — derivado da data, nunca do texto gravado
function mesDe(kind,r){
  if(kind==='lancamento'){
    if(cfg('BASE_COMPETENCIA')==='PAGAMENTO' && r.Status==='Pago' && r.DataPagamento) return r.DataPagamento.slice(0,7);
    return (r.Vencimento||r.DataLanc||r.DataPagamento||'').slice(0,7)||normM(r.Competencia);
  }
  return (r.DataPagamento||r.DataCobertura||'').slice(0,7)||normM(r.Competencia);
}
const isJunk=r=>/^TOTAL\s*[—-]/i.test(String(r.Nome||'')); // linhas de total herdadas da planilha antiga

/* ======================= STORE ======================= */
const LS='cs_custos_v2';
const store={
  data:null, demo:!API_URL,
  async boot(){
    if(this.demo){
      const s=localStorage.getItem(LS);
      this.data=s?JSON.parse(s):JSON.parse(JSON.stringify(SEED));
      this._demoMigrate(); this.normalize(); this._save(); return this.data;
    }
    let r,j;
    try{ r=await fetch(API_URL+'?action=bootstrap&t='+Date.now()); }catch(e){ throw new Error('Sem resposta do servidor. Confira a URL e se a implantação está como "Qualquer pessoa".'); }
    try{ j=await r.json(); }catch(e){ throw new Error('O endereço respondeu, mas não em JSON (geralmente URL errada ou implantação sem acesso público).'); }
    if(j && j.ok===false) throw new Error(j.erro||'Erro no servidor.');
    this.data=j; this.normalize(); return this.data;
  },
  normalize(){
    const d=this.data;
    ['lancamentos','freelances','fts','colaboradores','clientes','baseline'].forEach(c=>{ if(!Array.isArray(d[c])) d[c]=[]; });
    const kinds={lancamentos:'lancamento',freelances:'freelance',fts:'ft'};
    Object.entries(kinds).forEach(([c,k])=>d[c].forEach(r=>{
      DATE_F.forEach(f=>{ if(f in r) r[f]=normD(r[f]); });
      r.Competencia=normM(r.Competencia); r.Valor=+r.Valor||0;
      if(k==='freelance') r.Diarias=+r.Diarias||0;
      r._junk=k!=='lancamento'&&isJunk(r);
      r._mes=mesDe(k,r);
    }));
    d.colaboradores.forEach(r=>{ if('Admissao' in r) r.Admissao=normD(r.Admissao); });
    d.baseline.forEach(r=>{ r.Mes=normM(r.Mes); });
    d.config=d.config||{}; d.cadastros=d.cadastros||{};
    ['TipoCusto','Categoria','Empresa','Status','Setor'].forEach(k=>{ if(!Array.isArray(d.cadastros[k])) d.cadastros[k]=[]; });
    if(!d.cadastros.Status.length) d.cadastros.Status=['Pago','Pendente'];
  },
  _save(){ if(this.demo) try{ localStorage.setItem(LS,JSON.stringify(this.data)); }catch(e){} },
  _coll(e){return{lancamento:'lancamentos',freelance:'freelances',ft:'fts',colaborador:'colaboradores',cliente:'clientes'}[e];},
  _nextId(arr){return arr.reduce((m,r)=>Math.max(m,+r.ID||0),0)+1;},
  _demoMigrate(){
    const d=this.data; d.config=d.config||{};
    if(d.config.MIGRACAO_V2==='OK') return;
    Object.keys(DEF_CFG).forEach(k=>{ if(!(k in d.config)) d.config[k]=DEF_CFG[k]; });
    d.baseline=d.baseline||[];
    if(!d.baseline.some(r=>normM(r.Mes)==='2026-09')) d.baseline.push({Mes:'2026-09',Categoria:'TOTAL',Valor:169089.25});
    d.config.MIGRACAO_V2='OK';
  },
  /* --- Free/FT → lançamento automático (espelho do Apps Script) --- */
  _origem(e,id){return (e==='freelance'?'FREE:':'FT:')+id;},
  _linkFields(e,s){
    const isF=e==='freelance',n=+s.Diarias||1,venc=s.DataPagamento||s.DataCobertura||'';
    return {DataLanc:s.DataCobertura||venc,Fornecedor:isF?'FREELANCE':'FT',
      Descricao:isF?`FREELANCE - ${s.Posto||'GERAL'} · ${s.Nome} (${n} ${n>1?'diárias':'diária'})`:`FT - ${s.Nome} · ${s.Posto||'GERAL'}`,
      TipoCusto:cfg('AUTO_TIPO'),Categoria:cfg('AUTO_CATEGORIA'),Empresa:s.Empresa||cfg('AUTO_EMPRESA'),
      Cliente:s.Posto||'GERAL',Valor:+s.Valor||0,Vencimento:venc,DataPagamento:s.Status==='Pago'?venc:'',
      Status:s.Status||'Pendente',Origem:this._origem(e,s.ID),Competencia:venc.slice(0,7)};
  },
  _syncLink(e,src,criar){
    const L=this.data.lancamentos,org=this._origem(e,src.ID),f=this._linkFields(e,src),ex=L.find(r=>r.Origem===org);
    if(ex){ delete f.DataLanc; Object.assign(ex,f); }
    else if(criar){ f.ID=this._nextId(L); L.push(f); }
  },
  /* --- operações --- */
  async add(entity,data){
    if(this.demo){
      const arr=this.data[this._coll(entity)]; data.ID=this._nextId(arr);
      if(['lancamento','freelance','ft'].includes(entity)) data.Competencia=mesDe(entity,data);
      arr.push(data);
      if(entity==='freelance'||entity==='ft') this._syncLink(entity,data,true);
      this.normalize(); this._save(); return {ID:data.ID};
    }
    return this._post({action:'add',entity,data});
  },
  async update(entity,id,data){
    if(this.demo){
      const o=this.data[this._coll(entity)].find(r=>String(r.ID)===String(id)); if(!o) throw new Error('Registro não encontrado.');
      Object.assign(o,data);
      if(['lancamento','freelance','ft'].includes(entity)) o.Competencia=mesDe(entity,o);
      if(entity==='freelance'||entity==='ft') this._syncLink(entity,o,false);
      this.normalize(); this._save(); return {ID:id};
    }
    return this._post({action:'update',entity,id,data});
  },
  async del(entity,id){
    if(this.demo){
      const c=this._coll(entity); this.data[c]=this.data[c].filter(r=>String(r.ID)!==String(id));
      if(entity==='freelance'||entity==='ft'){const org=this._origem(entity,id);this.data.lancamentos=this.data.lancamentos.filter(r=>r.Origem!==org);}
      this._save(); return true;
    }
    return this._post({action:'delete',entity,id});
  },
  async setConfig(obj){
    if(this.demo){ Object.assign(this.data.config,obj); this.normalize(); this._save(); return; }
    return this._post({action:'setConfig',data:obj});
  },
  async setList(campo,valores){
    if(this.demo){ this.data.cadastros[campo]=valores; this._save(); return; }
    return this._post({action:'setList',campo,valores});
  },
  async setBaseline(mes,valor){
    if(this.demo){ this.data.baseline=this.data.baseline.filter(r=>r.Mes!==mes); if(valor!==null) this.data.baseline.push({Mes:mes,Categoria:'TOTAL',Valor:+valor}); this._save(); return; }
    return this._post({action:'setBaseline',mes,valor});
  },
  async renameCliente(id,nome){
    if(this.demo){
      const c=this.data.clientes.find(x=>String(x.ID)===String(id)); const old=c.Posto; nome=nome.trim().toUpperCase(); c.Posto=nome;
      this.data.colaboradores.forEach(r=>{if(r.Posto===old)r.Posto=nome;}); this.data.lancamentos.forEach(r=>{if(r.Cliente===old)r.Cliente=nome;});
      this.data.freelances.forEach(r=>{if(r.Posto===old)r.Posto=nome;}); this.data.fts.forEach(r=>{if(r.Posto===old)r.Posto=nome;});
      this._save(); return;
    }
    return this._post({action:'renameCliente',id,nome});
  },
  async _post(body){
    const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
    const j=await r.json(); if(!j.ok) throw new Error(j.erro||'Erro'); await this.boot(); return j.result;
  }
};

/* ======================= HELPERS ======================= */
const BRL=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(+v||0);
const BRL0=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}).format(+v||0);
const el=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild;};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const opts=(list,sel)=>list.map(o=>`<option ${o===sel?'selected':''}>${esc(o)}</option>`).join('');
const fmtD=s=>{if(!s)return '—';const p=String(s).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}`:s;};
const fmtDY=s=>{if(!s)return '';const p=String(s).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:s;};
const MESES=['','Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const monthName=m=>{const[y,mm]=String(m||'').split('-');return MESES[+mm]?MESES[+mm]+'/'+y:String(m||'—');};
const uniq=a=>[...new Set(a.filter(Boolean))];
const pctTxt=(a,b)=>b?((a-b)/b*100):null;

/* ======================= APP ======================= */
const app={
  mes:null, cur:'painel', openSet:new Set(), editing:null, editL:null, editF:null, editT:null, filtro:'',
  TABS:[['painel','Painel'],['lancar','Lançamentos'],['clientes','Clientes'],['free','Freelances'],['ft',"FT's"],['fechamento','Fechamento'],['param','Parâmetros']],
  async init(){
    try{ await store.boot(); }catch(e){ return this._fatal(e); }
    if(!store.data || !Array.isArray(store.data.lancamentos)) return this._fatal(new Error('Resposta inesperada da planilha.'));
    try{
      let saved=''; try{ saved=localStorage.getItem('cs_mes')||''; }catch(e){}
      this.mes=/^\d{4}-\d{2}$/.test(saved)?saved:this._hoje().slice(0,7);
      this._nav(); this._mesSel(); this.go('painel');
      if(store.data.migrou) this.toast('Planilha atualizada para a versão 2 (datas e competências corrigidas).',6000);
    }catch(e){ this._fatal(e); }
  },
  _hoje(){ return normD(store.data&&store.data.hoje)||todayISO(); },
  _fatal(e){
    document.getElementById('nav').style.display='none';
    document.querySelector('.wrap').innerHTML=`<div class="card"><h2>Não consegui carregar os dados</h2>
      <div class="cap">${esc(String(e.message||e))}</div>
      <p style="margin:6px 0 10px">Recarregue a página. Se o erro continuar, confira se o seu usuário tem o papel Administrativo ou Diretoria no portal.</p></div>`;
  },
  _nav(){document.getElementById('nav').innerHTML=this.TABS.map(([k,l])=>`<button data-t="${k}" class="${k==='painel'?'ativo':''}" onclick="app.go('${k}')">${l}</button>`).join('');},
  _months(){
    const ms=new Set([this.mes,this._hoje().slice(0,7)]);
    ['lancamentos','freelances','fts'].forEach(c=>store.data[c].forEach(r=>{if(r._mes&&!r._junk)ms.add(r._mes);}));
    store.data.baseline.forEach(r=>r.Mes&&ms.add(r.Mes));
    return [...ms].filter(m=>/^\d{4}-\d{2}$/.test(m)).sort();
  },
  _mesSel(){
    const arr=this._months().slice().reverse();
    document.getElementById('selMes').innerHTML=arr.map(m=>`<option value="${m}" ${m===this.mes?'selected':''}>${monthName(m)}</option>`).join('');
  },
  _banner(){const p=document.getElementById('tab-painel');if(!p)return;p.prepend(el(`<div class="banner">⚙️ <b>Modo demonstração</b> — dados salvos só neste navegador. Cole a URL do Apps Script em <code>API_URL</code> no index.html para ligar à sua planilha.</div>`));},
  setMes(m){this.mes=m;try{localStorage.setItem('cs_mes',m);}catch(e){} this.editL=this.editF=this.editT=null; this.render();},
  go(k){this.cur=k; this.editL=this.editF=this.editT=null; this.editing=null;
    document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('ativo',b.dataset.t===k));
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('ativo',t.id==='tab-'+k));
    this.render(k); window.scrollTo(0,0);},
  render(only){const k=only||this.cur||'painel';
    const fn={painel:this.painel,lancar:this.lancar,clientes:this.clientes,free:this.free,ft:this.ft,fechamento:this.fechamento,param:this.param}[k];
    if(typeof fn==='function') fn.call(this);},
  toast(msg,ms){const t=document.getElementById('toast');t.innerHTML=msg;t.classList.add('show');clearTimeout(this._tt);this._tt=setTimeout(()=>t.classList.remove('show'),ms||3800);},
  async run(fn){ // trava a tela enquanto grava; mostra erro amigável
    if(this._busy) return; this._busy=true; const b=document.getElementById('busy'); b.classList.add('on');
    try{ return await fn(); }catch(e){ alert('Não foi possível salvar: '+(e.message||e)); }
    finally{ this._busy=false; b.classList.remove('on'); }
  },
  _after(mesNovo,label){
    this._mesSel();
    if(mesNovo && mesNovo!==this.mes) this.toast(`${label} em <b>${monthName(mesNovo)}</b> (pelo ${label.includes('Lanç')?'vencimento':'pagamento'}). Troque a competência no topo para ver.`,6500);
    else this.toast(`${label} em <b>${monthName(mesNovo||this.mes)}</b>.`);
  },

  /* ---- agregações ---- */
  _lanc(m){m=m||this.mes;return store.data.lancamentos.filter(r=>r._mes===m);},
  _free(m){m=m||this.mes;return store.data.freelances.filter(r=>r._mes===m&&!r._junk);},
  _ft(m){m=m||this.mes;return store.data.fts.filter(r=>r._mes===m&&!r._junk);},
  _sum(a,k){return a.reduce((s,r)=>s+(+r[k]||0),0);},
  _by(a,k,v){const o={};a.forEach(r=>{const g=r[k]||'—';o[g]=(o[g]||0)+(+r[v]||0);});return o;},
  _hist(m){const b=store.data.baseline.filter(r=>r.Mes===m);return b.length?this._sum(b,'Valor'):null;},
  _tot(m){ // total do mês: total histórico (Parâmetros) tem prioridade; senão soma dos lançamentos
    const h=this._hist(m); return h!=null?h:this._sum(this._lanc(m),'Valor');},
  _cmp(m){m=m||this.mes;const p=prevMonth(m),pv=this._tot(p),cv=this._tot(m);return{p,pv,cv,d:pv?pctTxt(cv,pv):null};},
  _deltaHtml(c){ if(c.d==null) return `<div class="delta mini">sem comparativo</div>`;
    return `<div class="delta ${c.d>0?'up':'down'}">${c.d>0?'▲':'▼'} ${Math.abs(c.d).toFixed(1)}% vs ${monthName(c.p)}</div>`;},
  _folha(posto){const c=store.data.colaboradores.filter(x=>!posto||x.Posto===posto);
    return{sal:this._sum(c,'Salario'),ben:this._sum(c,'VT')+this._sum(c,'VR')+this._sum(c,'VA'),n:c.length};},
  _clientesAtivos(){return store.data.clientes.filter(c=>!/^N/i.test(String(c.Ativo||'SIM')));},
  _postos(){return uniq(this._clientesAtivos().map(c=>c.Posto));},
  _custoCliente(){ const L=this._lanc(),Fr=this._free(),Ft=this._ft(),o={};
    this._clientesAtivos().forEach(c=>{const p=c.Posto;if(p in o)return;const f=this._folha(p);
      o[p]=f.sal+f.ben+this._sum(L.filter(r=>r.Cliente===p&&!r.Origem),'Valor')+this._sum(Fr.filter(r=>r.Posto===p),'Valor')+this._sum(Ft.filter(r=>r.Posto===p),'Valor');});
    const g=this._sum(L.filter(r=>r.Cliente==='GERAL'&&!r.Origem),'Valor'); if(g) o['GERAL (rateio)']=g; return o; },
  _bars(obj){const e=Object.entries(obj).sort((a,b)=>b[1]-a[1]);const mx=Math.max(1,...e.map(x=>x[1]));
    return e.map(([k,v])=>`<div class="bar-row"><span class="nm" title="${esc(k)}">${esc(k)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.max(2,v/mx*100)}%"></div></div><span class="vl">${BRL0(v)}</span></div>`).join('')||'<div class="empty">Sem dados no mês.</div>';},

  /* ---- PAINEL ---- */
  painel(){
    const L=this._lanc(),Fr=this._free(),Ft=this._ft(),h=this._hist(this.mes);
    const soma=this._sum(L,'Valor'),tot=this._tot(this.mes),pago=this._sum(L.filter(r=>r.Status==='Pago'),'Valor'),pend=soma-pago;
    const di=this._sum(Fr,'Diarias'),av=this._sum(Fr,'Valor')+this._sum(Ft,'Valor'),c=this._cmp();
    const venc=L.filter(r=>r.Status==='Pendente').sort((a,b)=>a.Vencimento<b.Vencimento?-1:1).slice(0,8);
    const pct=soma?pago/soma*100:0;
    const meses=this._months().filter(m=>m<=this.mes).slice(-6);
    const evo={}; meses.forEach(m=>evo[monthName(m)]=this._tot(m));
    const evoHtml=meses.map(m=>{const v=this._tot(m),mx=Math.max(1,...meses.map(x=>this._tot(x)));
      return `<div class="bar-row"><span class="nm">${monthName(m)}${this._hist(m)!=null?' <span class="mini">(hist.)</span>':''}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.max(2,v/mx*100)}%;${m===this.mes?'':'opacity:.55'}"></div></div><span class="vl">${BRL0(v)}</span></div>`;}).join('');
    const cards=[];
    cards.push(`<div class="card"><h2>Comparativo mensal</h2><div class="cap">Custo total por competência (últimos meses)</div>${evoHtml}</div>`);
    cards.push(`<div class="card"><h2>Próximos vencimentos</h2><div class="cap">Pendentes de ${monthName(this.mes)}</div>
          ${venc.length?`<table class="tbl-mini"><tbody>${venc.map(r=>`<tr><td>${fmtD(r.Vencimento)}</td><td>${esc(r.Fornecedor)}</td><td class="money">${BRL(r.Valor)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nenhum pendente.</div>'}</div>`);
    if(on('PAINEL_CATEGORIA')) cards.push(`<div class="card"><h2>Por categoria</h2><div class="cap">Distribuição do custo do mês</div>${this._bars(this._by(L,'Categoria','Valor'))}</div>`);
    if(on('PAINEL_CLIENTE')) cards.push(`<div class="card"><h2>Por cliente / posto</h2><div class="cap">Folha cadastrada + variáveis + avulsos (estimativa)</div>${this._bars(this._custoCliente())}</div>`);
    cards.push(`<div class="card"><h2>Pago vs Pendente</h2><div class="cap">Status dos lançamentos do mês</div>${this._donut([['Pago',pago,'#2e7d46'],['Pendente',pend,'#9a6410']])}</div>`);
    document.getElementById('tab-painel').innerHTML=`
      ${h!=null?`<div class="banner">📌 <span><b>${monthName(this.mes)}</b> usa o <b>total histórico</b> de ${BRL(h)} (definido em Parâmetros)${L.length?` — os ${L.length} lançamentos detalhados deste mês somam ${BRL(soma)} e servem só de consulta`:''}.</span></div>`:''}
      <div class="kpis">
        <div class="kpi"><div class="lab">Custo total do mês</div><div class="val">${BRL0(tot)}</div>${this._deltaHtml(c)}</div>
        <div class="kpi verde"><div class="lab">Pago</div><div class="val">${BRL0(pago)}</div><div class="delta mini">${pct.toFixed(0)}% quitado</div></div>
        <div class="kpi ambar"><div class="lab">Pendente</div><div class="val">${BRL0(pend)}</div><div class="delta mini">${L.filter(r=>r.Status==='Pendente').length} lançamentos</div></div>
        <div class="kpi"><div class="lab">Avulsos (Free + FT)</div><div class="val">${BRL0(av)}</div><div class="delta mini">${di} diárias free · ${Ft.length} FT</div></div>
      </div>
      <div class="grid2">${cards.join('')}</div>`;
    if(store.demo) this._banner();
  },
  _donut(parts){
    const tot=parts.reduce((s,p)=>s+p[1],0);
    if(!tot) return '<div class="empty">Sem lançamentos no mês.</div>';
    let a=0;const segs=parts.filter(p=>p[1]>0).map(([n,v,c])=>{const frac=Math.min(v/tot,.9999),x1=Math.cos(2*Math.PI*a-Math.PI/2),y1=Math.sin(2*Math.PI*a-Math.PI/2);a+=frac;const x2=Math.cos(2*Math.PI*a-Math.PI/2),y2=Math.sin(2*Math.PI*a-Math.PI/2);const large=frac>.5?1:0;return `<path d="M ${50+40*x1} ${50+40*y1} A 40 40 0 ${large} 1 ${50+40*x2} ${50+40*y2}" fill="none" stroke="${c}" stroke-width="20"/>`;}).join('');
    return `<div class="donut"><svg viewBox="0 0 100 100" width="130" height="130">${segs}<circle cx="50" cy="50" r="30" fill="#fff"/></svg>
      <div class="legend">${parts.map(([n,v,c])=>`<div><span class="dot" style="background:${c}"></span>${n} — <b>${BRL0(v)}</b> <span class="mini">(${(v/tot*100).toFixed(0)}%)</span></div>`).join('')}</div></div>`;
  },

  /* ---- LANÇAMENTOS ---- */
  _defDate(){const d=this._hoje();return d.slice(0,7)===this.mes?d:`${this.mes}-${pad2(Math.min(+d.slice(8,10),lastDay(this.mes)))}`;},
  lancar(){
    const cd=store.data.cadastros,cl=this._postos();
    const e=this.editL!=null?store.data.lancamentos.find(r=>String(r.ID)===String(this.editL)):null;
    const v=e||{DataLanc:this._hoje(),Vencimento:this._defDate(),Status:'Pendente',Cliente:'GERAL'};
    const f=(this.filtro||'').toLowerCase();
    const all=this._lanc().slice().sort((a,b)=>(b.Vencimento||'').localeCompare(a.Vencimento||'')||(+b.ID-+a.ID));
    const L=f?all.filter(r=>`${r.Fornecedor} ${r.Descricao} ${r.Categoria} ${r.Cliente} ${r.Empresa}`.toLowerCase().includes(f)):all;
    const cliOpts=uniq(['GERAL',...cl,v.Cliente]);
    document.getElementById('tab-lancar').innerHTML=`
      <div class="card ${e?'form-edit':''}" id="formL"><h2>${e?'Lançamento #'+e.ID:'Novo lançamento'}</h2>
        <div class="cap">${e?'Altere os campos e clique em Salvar.':'A competência é definida pelo <b>vencimento do boleto</b>'+(cfg('BASE_COMPETENCIA')==='PAGAMENTO'?' (ou pela data de pagamento, quando pago)':'')+'.'}</div>
        <div class="form-grid">
          <div class="fld"><label>Vencimento *</label><input type="date" id="l_venc" value="${esc(v.Vencimento)}"></div>
          <div class="fld wide"><label>Fornecedor *</label><input id="l_forn" value="${esc(v.Fornecedor||'')}" placeholder="Ex.: SETTE UNIFORMES"></div>
          <div class="fld"><label>Valor (R$) *</label><input type="number" step="0.01" id="l_val" value="${e?(+e.Valor):''}" placeholder="0,00"></div>
          <div class="fld wide"><label>Descrição</label><input id="l_desc" value="${esc(v.Descricao||'')}" placeholder="Ex.: Uniformes STUDIO"></div>
          <div class="fld"><label>Tipo de custo</label><select id="l_tipo">${opts(uniq([...cd.TipoCusto,v.TipoCusto]),v.TipoCusto)}</select></div>
          <div class="fld"><label>Categoria</label><select id="l_cat">${opts(uniq([...cd.Categoria,v.Categoria]),v.Categoria)}</select></div>
          <div class="fld"><label>Empresa</label><select id="l_emp">${opts(uniq([...cd.Empresa,v.Empresa]),v.Empresa)}</select></div>
          <div class="fld"><label>Cliente / Posto</label><select id="l_cli">${opts(cliOpts,v.Cliente)}</select></div>
          <div class="fld"><label>Status</label><select id="l_status">${opts(uniq([...cd.Status,v.Status]),v.Status)}</select></div>
          <div class="fld"><label>Data pagamento</label><input type="date" id="l_pag" value="${esc(v.DataPagamento||'')}"></div>
          <div class="fld"><label>Data do lançamento</label><input type="date" id="l_data" value="${esc(v.DataLanc||'')}"></div>
          <div class="fld"><label>&nbsp;</label>${e?`<div class="row-actions"><button class="btn" onclick="app.saveLanc()">Salvar</button><button class="btn ghost" onclick="app.editL=null;app.lancar()">Cancelar</button></div>`:`<button class="btn" onclick="app.saveLanc()">+ Adicionar</button>`}</div>
        </div>
        ${e?'':`<div class="hint">💡 Boleto do mês que vem? Lance hoje mesmo como <b>Pendente</b> com o vencimento dele — ele aparece só na competência do vencimento.</div>`}
      </div>
      <div class="card"><h2>Lançamentos de ${monthName(this.mes)}</h2><div class="cap">${all.length} registros · ${BRL(this._sum(all,'Valor'))} · clique no status para alternar · ✎ edita</div>
        <div class="toolbar"><input id="l_filtro" placeholder="Buscar fornecedor, descrição, categoria…" value="${esc(this.filtro)}" oninput="app.filtro=this.value;app._refreshLanc()" style="min-width:280px">${f?`<span class="mini">${L.length} encontrados · ${BRL(this._sum(L,'Valor'))}</span>`:''}</div>
        <div class="tbl-wrap"><table><thead><tr><th>Venc.</th><th>Fornecedor</th><th>Descrição</th><th>Categoria</th><th>Cliente</th><th>Empresa</th><th class="money">Valor</th><th>Status</th><th></th></tr></thead>
        <tbody id="l_body">${this._lbody(L)}</tbody></table></div>
      </div>`;
  },
  _lbody(L){return L.map(r=>this._lrow(r)).join('')||'<tr><td colspan="9" class="empty">Nenhum lançamento neste mês.</td></tr>';},
  _refreshLanc(){const f=(this.filtro||'').toLowerCase();const all=this._lanc().slice().sort((a,b)=>(b.Vencimento||'').localeCompare(a.Vencimento||'')||(+b.ID-+a.ID));
    document.getElementById('l_body').innerHTML=this._lbody(f?all.filter(r=>`${r.Fornecedor} ${r.Descricao} ${r.Categoria} ${r.Cliente} ${r.Empresa}`.toLowerCase().includes(f)):all);},
  _src(r){const m=String(r.Origem||'').match(/^(FREE|FT):(\d+)$/);return m?{entity:m[1]==='FREE'?'freelance':'ft',id:+m[2],tag:m[1]}:null;},
  _lrow(r){const s=this._src(r);
    const ed=s?`app.editSrc('${s.entity}',${s.id})`:`app.editLanc(${r.ID})`;
    const rm=s?`app.remove('${s.entity}',${s.id})`:`app.remove('lancamento',${r.ID})`;
    const tg=s?`app.toggle('${s.entity}',${s.id},'${r.Status}')`:`app.toggle('lancamento',${r.ID},'${r.Status}')`;
    return `<tr><td>${fmtD(r.Vencimento)}</td><td>${esc(r.Fornecedor)}${s?`<span class="link-tag" title="Gerado automaticamente pela aba ${s.tag==='FREE'?'Freelances':"FT's"}">${s.tag}</span>`:''}</td><td>${esc(r.Descricao)}</td>
    <td><span class="tag">${esc(r.Categoria)}</span></td><td>${esc(r.Cliente)}</td><td>${esc(r.Empresa)}</td>
    <td class="money">${BRL(r.Valor)}</td>
    <td><span class="pill ${r.Status==='Pago'?'pago':'pend'}" style="cursor:pointer" title="${r.DataPagamento?'Pago em '+fmtDY(r.DataPagamento):''}" onclick="${tg}">${esc(r.Status)}</span></td>
    <td class="row-actions"><button class="icon-btn" title="Editar" onclick="${ed}">✎</button><button class="icon-btn" title="Excluir" onclick="${rm}">✕</button></td></tr>`;},
  editLanc(id){this.editL=id;this.lancar();document.getElementById('formL').scrollIntoView({behavior:'smooth',block:'start'});},
  editSrc(entity,id){this.toast(`Este lançamento vem da aba ${entity==='freelance'?'Freelances':"FT's"} — edite por lá.`);
    this.go(entity==='freelance'?'free':'ft'); if(entity==='freelance')this.editFree(id); else this.editFt(id);},
  async saveLanc(){
    const g=id=>document.getElementById(id).value;
    if(!g('l_forn').trim()||!g('l_val')||!g('l_venc')){alert('Preencha Vencimento, Fornecedor e Valor.');return;}
    const st=g('l_status');let pag=g('l_pag');
    if(st==='Pago'&&!pag) pag=g('l_venc')<=this._hoje()?g('l_venc'):this._hoje();
    if(st!=='Pago') pag='';
    const data={DataLanc:g('l_data')||this._hoje(),Fornecedor:g('l_forn').trim(),Descricao:g('l_desc').trim(),
      TipoCusto:g('l_tipo'),Categoria:g('l_cat'),Empresa:g('l_emp'),Cliente:g('l_cli'),
      Valor:+g('l_val'),Vencimento:g('l_venc'),Status:st,DataPagamento:pag};
    const m=mesDe('lancamento',data),id=this.editL;
    await this.run(async()=>{
      if(id!=null) await store.update('lancamento',id,data); else await store.add('lancamento',data);
      this.editL=null; this.lancar(); this._after(m,id!=null?'Lançamento salvo':'Lançado');
    });
  },
  async toggle(entity,id,st){
    const novo=st==='Pago'?'Pendente':'Pago';
    const data={Status:novo}; if(entity==='lancamento') data.DataPagamento=novo==='Pago'?this._hoje():'';
    if(entity!=='lancamento'){const o=store.data[store._coll(entity)].find(r=>String(r.ID)===String(id));
      if(o&&novo==='Pago'&&!o.DataPagamento) data.DataPagamento=o.DataCobertura&&o.DataCobertura<=this._hoje()?o.DataCobertura:this._hoje();}
    await this.run(async()=>{await store.update(entity,id,data);this._mesSel();this.render(this.cur);});
  },
  async remove(entity,id){
    const msg=(entity==='freelance'||entity==='ft')?'Excluir este registro? O lançamento vinculado (se houver) também será excluído.':'Excluir este registro?';
    if(!confirm(msg))return;
    await this.run(async()=>{await store.del(entity,id);this.editL=this.editF=this.editT=null;this._mesSel();this.render(this.cur);});
  },

  /* ---- CLIENTES ---- */
  _colabRows(colabs){

          <td><input id="ec_cargo" value="${esc(x.Cargo)}" style="width:98%"></td>
          <td><input id="ec_sal" type="number" step="0.01" value="${+x.Salario||0}" style="width:88px"></td>
          <td><input id="ec_vt" type="number" step="0.01" value="${+x.VT||0}" style="width:60px"> <input id="ec_vr" type="number" step="0.01" value="${+x.VR||0}" style="width:60px"> <input id="ec_va" type="number" step="0.01" value="${+x.VA||0}" style="width:60px"></td>
          <td class="row-actions"><button class="btn sm" onclick="app.saveC(${x.ID})">Salvar</button><button class="icon-btn" onclick="app.editing=null;app.clientes()">✕</button></td></tr>`;
      }
      return `<tr><td>${esc(x.Nome)}</td><td>${esc(x.Cargo)}</td><td class="money">${BRL(x.Salario)}</td><td class="money">${BRL((+x.VT||0)+(+x.VR||0)+(+x.VA||0))}</td><td class="row-actions"><button class="icon-btn" title="Editar" onclick="app.editC(${x.ID})">✎</button><button class="icon-btn" title="Excluir" onclick="app.delC(${x.ID})">✕</button></td></tr>`;
    }).join('')||'<tr><td colspan="5" class="empty">Sem colaboradores.</td></tr>';
  },
  clientes(){

      const p=c.Posto,f=this._folha(p);

      const tot=f.sal+f.ben+varv+avul;

          <div class="mtxt"><small>Folha</small>${BRL0(f.sal)}</div>
          <div class="mtxt"><small>Benefícios</small>${BRL0(f.ben)}</div>
          <div class="mtxt"><small>Variáveis</small>${BRL0(varv)}</div>

        </div>
        <div class="cli-body">

          <div class="tbl-wrap" style="max-height:320px"><table><thead><tr><th>Nome</th><th>Cargo</th><th class="money">Salário</th><th class="money">Benefícios (VT/VR/VA)</th><th>Ações</th></tr></thead><tbody>
          ${this._colabRows(colabs)}
          </tbody></table></div>
          <div class="add-colab">
            <input id="nc_nome_${c.ID}" placeholder="Nome"><input id="nc_cargo_${c.ID}" placeholder="Cargo">
            <input id="nc_sal_${c.ID}" type="number" placeholder="Salário"><input id="nc_vt_${c.ID}" type="number" placeholder="VT"><input id="nc_vr_${c.ID}" type="number" placeholder="VR"><input id="nc_va_${c.ID}" type="number" placeholder="VA">
            <button class="btn sm" onclick="app.addColab(${c.ID})">+ colaborador</button>
          </div>
          <div class="sub-h">Custos variáveis alocados neste mês</div>
          ${lc.length?`<table class="tbl-mini"><tbody>${lc.map(r=>`<tr><td>${fmtD(r.Vencimento)}</td><td>${esc(r.Fornecedor)}</td><td>${esc(r.Descricao)}</td><td><span class="tag">${esc(r.Categoria)}</span></td><td class="money">${BRL(r.Valor)}</td></tr>`).join('')}</tbody></table>`:'<div class="mini">Nenhum custo variável alocado a este cliente no mês.</div>'}
        </div></div>`;
    }).join('');
    document.getElementById('tab-clientes').innerHTML=`
      <div class="card"><h2>Adicionar cliente / posto</h2><div class="cap">Renomear, inativar ou excluir clientes: aba <b>Parâmetros</b>. A estimativa soma a folha cadastrada (valores atuais) — referência, não fechamento.</div>
        <div class="toolbar"><input id="c_nome" placeholder="Nome do condomínio / posto"><button class="btn" onclick="app.addCli()">+ Adicionar cliente</button></div>
      </div>
      ${cards||'<div class="empty">Nenhum cliente cadastrado.</div>'}`;
  },
  toggleCli(id){ if(this.openSet.has(id))this.openSet.delete(id); else this.openSet.add(id); this.editing=null; this.clientes(); },
  editC(id){ this.editing=id; this.clientes(); },
  async saveC(id){ const g=i=>document.getElementById(i).value;

    await this.run(async()=>{await store.update('colaborador',id,data);this.editing=null;this.clientes();});},
  async delC(id){ if(!confirm('Excluir este colaborador?'))return; await this.run(async()=>{await store.del('colaborador',id);this.editing=null;this.clientes();}); },
  async addColab(cid){ const g=i=>document.getElementById(i+'_'+cid).value;
    const c=store.data.clientes.find(x=>String(x.ID)===String(cid)); if(!c)return;
    if(!g('nc_nome')){alert('Informe o nome do colaborador.');return;}

  /* ---- FREELANCES ---- */

      <tbody>${F.map(r=>`<tr><td>${esc(r.Nome)} ${this._linked('freelance',r.ID)?'<span title="Lançamento vinculado">🔗</span>':''}</td><td>${fmtD(r.DataCobertura)}</td><td>${+r.Diarias||0}</td><td>${esc(r.Setor)}</td><td>${esc(r.Posto)}</td><td class="money">${BRL(r.Valor)}</td><td><span class="pill ${r.Status==='Pago'?'pago':'pend'}" style="cursor:pointer" onclick="app.toggle('freelance',${r.ID},'${esc(r.Status)}')">${esc(r.Status)}</span></td><td class="row-actions"><button class="icon-btn" title="Editar" onclick="app.editFree(${r.ID})">✎</button><button class="icon-btn" title="Excluir" onclick="app.remove('freelance',${r.ID})">✕</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">Sem freelances no mês.</td></tr>'}

      <div class="card"><h2>Por freelancer</h2><div class="cap">Soma de diárias e valores no mês</div>${all.length?this._porPessoa(all,true):'<div class="empty">—</div>'}</div>

  editFree(id){this.editF=id;this.free();document.getElementById('formF').scrollIntoView({behavior:'smooth',block:'start'});},
  async saveFree(){const g=id=>document.getElementById(id).value;
    if(!g('f_nome').trim()||!g('f_val')){alert('Nome e Valor obrigatórios.');return;}

    const m=mesDe('freelance',data),id=this.editF;
    await this.run(async()=>{ if(id!=null) await store.update('freelance',id,data); else await store.add('freelance',data);
      this.editF=null; this.free(); this._after(m,id!=null?'Freelance salvo':'Freelance lançado'); });},

  editFt(id){this.editT=id;this.ft();document.getElementById('formT').scrollIntoView({behavior:'smooth',block:'start'});},
  async saveFt(){const g=id=>document.getElementById(id).value;

    const data={Nome:g('t_nome').trim(),DataCobertura:g('t_data'),DataPagamento:g('t_pag'),Setor:g('t_setor'),Valor:+g('t_val'),Posto:g('t_posto'),Empresa:g('t_emp'),Status:g('t_status')};

  /* ---- FECHAMENTO ---- */
  fechamento(){
    const L=this._lanc().slice().sort((a,b)=>(a.Vencimento||'').localeCompare(b.Vencimento||'')||(+a.ID-+b.ID));
    const Fr=this._free(),Ft=this._ft(),h=this._hist(this.mes);
    const soma=this._sum(L,'Valor'),tot=this._tot(this.mes),pago=this._sum(L.filter(r=>r.Status==='Pago'),'Valor'),pend=soma-pago;
    const di=this._sum(Fr,'Diarias'),av=this._sum(Fr,'Valor')+this._sum(Ft,'Valor'),c=this._cmp();
    const fdata=new Date().toLocaleDateString('pt-BR');
    const tbl=(obj)=>{const e=Object.entries(obj).sort((a,b)=>b[1]-a[1]);const t=e.reduce((s,x)=>s+x[1],0)||1;
      return e.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="money">${BRL(v)}</td><td class="mini">${(v/t*100).toFixed(1)}%</td></tr>`).join('');};
    const extra=[];
    if(on('FECH_CATEGORIA')) extra.push(`<div><div class="sub-h">Custo por categoria</div><table><thead><tr><th>Categoria</th><th class="money">Valor</th><th>%</th></tr></thead><tbody>${tbl(this._by(L,'Categoria','Valor'))}</tbody></table></div>`);
    if(on('FECH_CLIENTE')) extra.push(`<div><div class="sub-h">Custo por cliente / posto (estimativa)</div><table><thead><tr><th>Cliente</th><th class="money">Valor</th><th>%</th></tr></thead><tbody>${tbl(this._custoCliente())}</tbody></table><div class="mini" style="margin-top:5px">Folha cadastrada + variáveis + avulsos por posto — não equivale ao total do mês.</div></div>`);
    document.getElementById('tab-fechamento').innerHTML=`
      <div class="toolbar no-print">
        <button class="btn dark" onclick="app.exportXLSX()">⬇ Exportar Excel</button>
        <button class="btn" onclick="window.print()">⬇ Exportar PDF (imprimir)</button>
        <span class="mini">Fechamento de <b>${monthName(this.mes)}</b> para a diretoria · quadros extras: <a href="#" onclick="app.go('param');return false">Parâmetros</a></span>
      </div>
      <div class="card" id="report">
        <div class="rep-head"><div><div class="cs"><b>C&S</b> — Costa & Sobral</div><div class="mini">Fechamento de Custos · ${monthName(this.mes)}</div></div>
          <div class="meta">Emitido em ${fdata}<br>Confidencial · Diretoria</div></div>
        <div class="kpis">
          <div class="kpi"><div class="lab">Custo total</div><div class="val">${BRL0(tot)}</div>${this._deltaHtml(c)}</div>
          <div class="kpi verde"><div class="lab">Pago</div><div class="val">${BRL0(pago)}</div><div class="delta mini">${soma?(pago/soma*100).toFixed(0):0}% quitado</div></div>
          <div class="kpi ambar"><div class="lab">Pendente</div><div class="val">${BRL0(pend)}</div><div class="delta mini">${L.filter(r=>r.Status==='Pendente').length} lançamentos</div></div>
          <div class="kpi"><div class="lab">Avulsos (Free+FT)</div><div class="val">${BRL0(av)}</div><div class="delta mini">${di} diárias free · ${Ft.length} FT</div></div>
        </div>
        <div class="compare">Mês anterior (${monthName(c.p)}): <b>${c.pv?BRL(c.pv):'—'}</b>${c.d!=null?` · variação <b>${c.d>0?'+':''}${c.d.toFixed(1)}%</b> (${c.cv-c.pv>0?'+':''}${BRL(c.cv-c.pv)})`:''}${h!=null?` · <i>total de ${monthName(this.mes)} = histórico informado</i>`:''}</div>
        ${extra.length?`<div class="grid2">${extra.join('')}</div>`:''}
        <div class="sub-h">Lista geral de lançamentos (${L.length})</div>
        <table><thead><tr><th>Venc.</th><th>Fornecedor</th><th>Descrição</th><th>Categoria</th><th>Cliente</th><th>Empresa</th><th class="money">Valor</th><th>Status</th></tr></thead>
        <tbody>${L.map(r=>`<tr><td>${fmtD(r.Vencimento)}</td><td>${esc(r.Fornecedor)}</td><td>${esc(r.Descricao)}</td><td>${esc(r.Categoria)}</td><td>${esc(r.Cliente)}</td><td>${esc(r.Empresa)}</td><td class="money">${BRL(r.Valor)}</td><td>${esc(r.Status)}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">Sem lançamentos detalhados.</td></tr>'}
        <tr style="font-weight:700;background:#faf8f3"><td colspan="6">TOTAL DOS LANÇAMENTOS</td><td class="money">${BRL(soma)}</td><td></td></tr></tbody></table>
        ${h!=null&&Math.abs(h-soma)>0.005?`<div class="note">Total do mês considerado no comparativo: ${BRL(h)} (histórico informado em Parâmetros).</div>`:''}
        <div class="foot">C&S · Costa & Sobral — Movendo Confiança, Gerando Valor · Documento gerado pelo Sistema de Controle de Custos.</div>
      </div>`;
  },
  async exportXLSX(){
    try{
      if(!window.XLSX){await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
    }catch(e){alert('Não consegui carregar o gerador de Excel (sem internet?).');return;}
    const L=this._lanc().slice().sort((a,b)=>(a.Vencimento||'').localeCompare(b.Vencimento||'')||(+a.ID-+b.ID)), Fr=this._free(), Ft=this._ft();
    const soma=this._sum(L,'Valor'),tot=this._tot(this.mes),pago=this._sum(L.filter(r=>r.Status==='Pago'),'Valor'),c=this._cmp();
    const wb=XLSX.utils.book_new();
    const resumo=[['C&S — FECHAMENTO DE CUSTOS',monthName(this.mes)],[],
      ['Custo total do mês',tot],['Soma dos lançamentos',soma],['Pago',pago],['Pendente',soma-pago],['% quitado',soma?pago/soma:0],[],
      ['Mês anterior ('+monthName(c.p)+')',c.pv||''],['Variação %',c.d!=null?c.d/100:''],[],
      ['Freelances (R$)',this._sum(Fr,'Valor')],['Freelances (diárias)',this._sum(Fr,'Diarias')],["FTs (R$)",this._sum(Ft,'Valor')],["FTs (registros)",Ft.length]];
    if(on('FECH_CATEGORIA')){resumo.push([],['POR CATEGORIA','Valor']);Object.entries(this._by(L,'Categoria','Valor')).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>resumo.push([k,v]));}
    if(on('FECH_CLIENTE')){resumo.push([],['POR CLIENTE / POSTO (estimativa)','Valor']);Object.entries(this._custoCliente()).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>resumo.push([k,v]));}
    const wsR=XLSX.utils.aoa_to_sheet(resumo); wsR['!cols']=[{wch:40},{wch:18}];
    XLSX.utils.book_append_sheet(wb,wsR,'Resumo');
    const lrows=L.map(r=>({Vencimento:fmtDY(r.Vencimento),Fornecedor:r.Fornecedor,'Descrição':r.Descricao,'Tipo de custo':r.TipoCusto,Categoria:r.Categoria,Empresa:r.Empresa,Cliente:r.Cliente,Valor:+r.Valor||0,Status:r.Status,Pagamento:fmtDY(r.DataPagamento),'Data lanç.':fmtDY(r.DataLanc)}));
    lrows.push({Vencimento:'',Fornecedor:'',['Descrição']:'',['Tipo de custo']:'',Categoria:'',Empresa:'',Cliente:'TOTAL',Valor:soma,Status:'',Pagamento:'',['Data lanç.']:''});
    const wsL=XLSX.utils.json_to_sheet(lrows); wsL['!cols']=[{wch:11},{wch:28},{wch:38},{wch:14},{wch:18},{wch:16},{wch:18},{wch:12},{wch:10},{wch:11},{wch:11}];
    XLSX.utils.book_append_sheet(wb,wsL,'Lançamentos');
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(Fr.map(r=>({Nome:r.Nome,Cobertura:fmtDY(r.DataCobertura),'Diárias':+r.Diarias||0,Setor:r.Setor,Posto:r.Posto,Valor:+r.Valor||0,Pagamento:fmtDY(r.DataPagamento),Status:r.Status}))),'Freelances');
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(Ft.map(r=>({Nome:r.Nome,Cobertura:fmtDY(r.DataCobertura),Pagamento:fmtDY(r.DataPagamento),Setor:r.Setor,Posto:r.Posto,Valor:+r.Valor||0,Status:r.Status}))),'FTs');
    XLSX.writeFile(wb,`Fechamento_Custos_CS_${this.mes}.xlsx`);
  },

  /* ---- PARÂMETROS ---- */
  param(){
    const cd=store.data.cadastros;
    const lista=(campo,titulo,desc)=>`<div class="card"><h2>${titulo}</h2><div class="cap">${desc}</div>
      <div class="chips">${cd[campo].map((x,i)=>`<span class="chip">${esc(x)}<button title="Renomear" onclick="app.pRen('${campo}',${i})">✎</button><button title="Remover" onclick="app.pDel('${campo}',${i})">✕</button></span>`).join('')||'<span class="mini">Lista vazia.</span>'}</div>
      <div class="inline-add"><input id="p_add_${campo}" placeholder="Novo item…" onkeydown="if(event.key==='Enter')app.pAdd('${campo}')"><button class="btn sm" onclick="app.pAdd('${campo}')">+ adicionar</button></div></div>`;
    const sw=(k,t,d)=>`<div class="sw"><div><b>${t}</b><div class="d">${d}</div></div><label class="toggle"><input type="checkbox" ${on(k)?'checked':''} onchange="app.pCfg('${k}',this.checked?'SIM':'NAO')"><span></span></label></div>`;
    const base=cfg('BASE_COMPETENCIA');
    const hist=uniq(store.data.baseline.map(r=>r.Mes)).sort().reverse();
    const cli=store.data.clientes.slice().sort((a,b)=>String(a.Posto).localeCompare(String(b.Posto)));
    const nomes={};cli.forEach(c=>{nomes[c.Posto]=(nomes[c.Posto]||0)+1;});
    const uso=p=>store.data.colaboradores.filter(x=>x.Posto===p).length;
    document.getElementById('tab-param').innerHTML=`
      <div class="param-grid">
        <div class="card"><h2>Exibição</h2><div class="cap">Liga/desliga quadros do Painel, do Fechamento e da exportação</div>
          ${sw('PAINEL_CATEGORIA','Painel · custo por categoria','Barras por categoria no Painel')}
          ${sw('PAINEL_CLIENTE','Painel · custo por cliente','Estimativa por posto (folha cadastrada + variáveis)')}
          ${sw('FECH_CATEGORIA','Fechamento · custo por categoria','Quadro no PDF e aba Resumo do Excel')}
          ${sw('FECH_CLIENTE','Fechamento · custo por cliente','Quadro no PDF e aba Resumo do Excel')}
        </div>
        <div class="card"><h2>Competência</h2><div class="cap">Qual data define o mês de cada lançamento</div>
          <div class="seg"><button class="${base!=='PAGAMENTO'?'on':''}" onclick="app.pCfg('BASE_COMPETENCIA','VENCIMENTO')">Data de vencimento</button><button class="${base==='PAGAMENTO'?'on':''}" onclick="app.pCfg('BASE_COMPETENCIA','PAGAMENTO')">Data de pagamento</button></div>
          <div class="note" style="margin-top:10px">${base==='PAGAMENTO'?'Lançamentos <b>pagos</b> entram no mês do pagamento; pendentes, no mês do vencimento.':'Todo lançamento entra no mês do <b>vencimento</b> — boletos futuros podem ser lançados como Pendente sem afetar o mês atual.'} Freelances e FTs usam sempre a data de pagamento.</div>
          <div class="sub-h" style="margin-top:18px">Freelance / FT → lançamento automático</div>
          <div class="form-grid" style="grid-template-columns:1fr 1fr 1fr">
            <div class="fld"><label>Categoria</label><select onchange="app.pCfg('AUTO_CATEGORIA',this.value)">${opts(uniq([...cd.Categoria,cfg('AUTO_CATEGORIA')]),cfg('AUTO_CATEGORIA'))}</select></div>
            <div class="fld"><label>Tipo de custo</label><select onchange="app.pCfg('AUTO_TIPO',this.value)">${opts(uniq([...cd.TipoCusto,cfg('AUTO_TIPO')]),cfg('AUTO_TIPO'))}</select></div>
            <div class="fld"><label>Empresa padrão</label><select onchange="app.pCfg('AUTO_EMPRESA',this.value)">${opts(uniq([...cd.Empresa,cfg('AUTO_EMPRESA')]),cfg('AUTO_EMPRESA'))}</select></div>
          </div>
        </div>
      </div>
      <div class="card"><h2>Totais históricos</h2><div class="cap">Meses fechados fora do sistema. Quando existe, este total vale para o mês (Painel, Fechamento e comparativo).</div>
        <table class="tbl-mini" style="max-width:560px"><thead><tr><th>Competência</th><th class="money">Total</th><th></th></tr></thead><tbody>
        ${hist.map(m=>`<tr><td>${monthName(m)}</td><td class="money">${BRL(this._hist(m))}</td><td class="row-actions"><button class="icon-btn" title="Alterar" onclick="app.pHist('${m}')">✎</button><button class="icon-btn" title="Remover" onclick="app.pHistDel('${m}')">✕</button></td></tr>`).join('')||'<tr><td colspan="3" class="empty">Nenhum.</td></tr>'}
        </tbody></table>
        <div class="inline-add" style="margin-top:10px"><input type="month" id="p_hm" style="min-width:160px"><input type="number" step="0.01" id="p_hv" placeholder="Total (R$)" style="min-width:150px"><button class="btn sm" onclick="app.pHistAdd()">+ incluir mês</button></div>
      </div>
      <div class="card"><h2>Clientes / postos</h2><div class="cap">Renomear atualiza colaboradores, lançamentos, freelances e FTs. Inativo some das listas (histórico continua).</div>
        <table class="tbl-mini"><thead><tr><th>Posto</th><th>Colaboradores</th><th>Situação</th><th></th></tr></thead><tbody>
        ${cli.map(c=>`<tr><td><b>${esc(c.Posto)}</b>${nomes[c.Posto]>1?' <span class="pill pend" style="cursor:default">duplicado</span>':''}</td><td>${uso(c.Posto)}</td>
          <td><span class="pill ${/^N/i.test(String(c.Ativo||'SIM'))?'pend':'pago'}" style="cursor:pointer" onclick="app.pCliAtivo(${c.ID})">${/^N/i.test(String(c.Ativo||'SIM'))?'Inativo':'Ativo'}</span></td>
          <td class="row-actions"><button class="icon-btn" title="Renomear" onclick="app.pCliRen(${c.ID})">✎</button><button class="icon-btn" title="Excluir" onclick="app.pCliDel(${c.ID})">✕</button></td></tr>`).join('')}
        </tbody></table>
      </div>
      <div class="param-grid">
        ${lista('Categoria','Categorias','Usadas em lançamentos e no fechamento')}
        ${lista('TipoCusto','Tipos de custo','Fixo, variável…')}
        ${lista('Empresa','Empresas','CNPJs / centros de custo')}
        ${lista('Setor','Setores','Usados em Freelances e FTs')}
      </div>
      <div class="note">Remover um item da lista não altera lançamentos antigos — só deixa de aparecer nas opções.</div>`;
  },
  async pCfg(k,v){await this.run(async()=>{await store.setConfig({[k]:v});this.param();this.toast('Parâmetro salvo.');});},
  async _pList(campo,arr){await this.run(async()=>{await store.setList(campo,arr);this.param();});},
  pAdd(campo){const i=document.getElementById('p_add_'+campo),v=i.value.trim();if(!v)return;
    const arr=store.data.cadastros[campo].slice(); if(arr.some(x=>String(x).toUpperCase()===v.toUpperCase())){alert('Já existe.');return;}
    arr.push(campo==='TipoCusto'?v:v.toUpperCase()); this._pList(campo,arr);},
  pDel(campo,i){const arr=store.data.cadastros[campo].slice();if(!confirm(`Remover "${arr[i]}" da lista?`))return;arr.splice(i,1);this._pList(campo,arr);},
  pRen(campo,i){const arr=store.data.cadastros[campo].slice();const n=prompt('Novo nome:',arr[i]);if(!n||!n.trim())return;arr[i]=n.trim();this._pList(campo,arr);},
  pHist(m){const v=prompt(`Total de ${monthName(m)} (R$):`,String(this._hist(m)).replace('.',','));if(v==null)return;
    const n=+String(v).replace(/\./g,'').replace(',','.');if(!isFinite(n)||!n){alert('Valor inválido.');return;}
    this.run(async()=>{await store.setBaseline(m,n);this._mesSel();this.param();});},
  pHistDel(m){if(!confirm(`Remover o total histórico de ${monthName(m)}? O mês passará a usar a soma dos lançamentos.`))return;
    this.run(async()=>{await store.setBaseline(m,null);this._mesSel();this.param();});},
  pHistAdd(){const m=document.getElementById('p_hm').value,v=+document.getElementById('p_hv').value;
    if(!/^\d{4}-\d{2}$/.test(m)||!v){alert('Informe o mês e o total.');return;}
    this.run(async()=>{await store.setBaseline(m,v);this._mesSel();this.param();});},
  pCliRen(id){const c=store.data.clientes.find(x=>String(x.ID)===String(id));const n=prompt('Novo nome do cliente/posto:',c.Posto);
    if(!n||!n.trim()||n.trim().toUpperCase()===c.Posto)return;
    if(!confirm(`Renomear "${c.Posto}" para "${n.trim().toUpperCase()}" em todos os registros?`))return;
    this.run(async()=>{await store.renameCliente(id,n);this.param();});},
  pCliAtivo(id){const c=store.data.clientes.find(x=>String(x.ID)===String(id));const ina=/^N/i.test(String(c.Ativo||'SIM'));
    this.run(async()=>{await store.update('cliente',id,{Ativo:ina?'SIM':'NÃO'});this.param();});},
  pCliDel(id){const c=store.data.clientes.find(x=>String(x.ID)===String(id));
    const dup=store.data.clientes.filter(x=>x.Posto===c.Posto).length>1, n=store.data.colaboradores.filter(x=>x.Posto===c.Posto).length;
    if(!confirm(dup?`Excluir esta linha duplicada de "${c.Posto}"? Os colaboradores continuam no outro cadastro.`:(n?`"${c.Posto}" tem ${n} colaboradores cadastrados. Prefira INATIVAR. Excluir mesmo assim?`:`Excluir "${c.Posto}"?`)))return;
    this.run(async()=>{await store.del('cliente',id);this.param();});}
};
CSAuth.iniciar({sistema:'Custos Gerais', papeis:['administrativo','diretoria']}).then(({sb,usuario})=>{
  CSCustosStore.instalar(store, sb);
  document.getElementById('usrNome').textContent=usuario.nome;
  app.init();
});
</script>
</body>
</html>
